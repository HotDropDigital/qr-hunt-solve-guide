oons\"). Dave points down, then a photo of the plaque spot is shown (an arrow flashes for a split second at a lone tree/bush on the shoreline), followed by an overview shot of the area (Utah Lake / Provo Bay). Last frame: old map of the western US with a red flight line from Salt Lake City south toward the Grand Canyon/Arizona, text \"To be continued...\"", "plaque_question": "What city are you in?", "plaque_answer": "Vineyard", "location_name": "Utah Lake shoreline at Vineyard (Vineyard Beach area, just south of Lindon Marina), Vineyard, Utah", "location_detail": "Vineyard, Utah County, east shore of Utah Lake. Pin shared by a hunter's team: 40°19'22.6\"N 111°45'54.1\"W; a hunter's doc gives about 40.322977, -111.765025 (the same point). Next to a lone shoreline tree, which is what the reel's arrow points at. Plaque: gold-colored metal plate with a QR code and a compass rose over a Utah outline, screwed to a fallen driftwood log by the shoreline (photo). Park in a small parking lot and walk to it (A hunter). Scanning alone doesn't count: the team also needs a selfie with the plaque.", "solve_path": "(1) Watch the kickoff reel. Dave points down to signal that the next image is the clue. That image shows the plaque spot, and an arrow flashes for a split second at a lone tree/bush on the shore road. Teams froze frames and took the arrow as the QR1 spot. (2) The overview shot that follows shows Utah Lake (Provo Bay). It gives the general area, but its focus is too far south: the QR spot is in the background of that shot, near Lindon Marina. (3) Teams matched the frames to satellite imagery. They saw a lake shoreline with a dirt road/levee right at the water, a rail line/road running parallel inland (a hunter later read it as a barrier beside the road), a canal/creek and marsh in between, and mountains behind that matched the Oquirrhs with the Bingham Canyon mine. The lake level was lower than in the satellite photos. Tools tried: a hunter shared the Utah Aqua Spot StoryMap (ArcGIS); a hunter tried the Picarta image geolocator. (4) a hunter noticed that the closing flight map's path ends south of SLC, which fits Utah Lake rather than the Great Salt Lake that early guesses focused on. (5) a hunter (Google Maps cursor on Vineyard Beach beside the Utah Lake Shore Trail) and a hunter each found the spot while a hunter's teammates were already driving there. A hunter posted the pin 40°19'22.6\"N 111°45'54.1\"W at 14:42, and a hunter confirmed \"That's the spot\". (6) At the plaque the question is \"What city are you in?\" and the answer is \"Vineyard\". A hunter posted the plaque photo and the answer. The leaderboard showed 5 teams at 14:43, about 75 minutes after kickoff. A hunter's doc names the first team as LostnConfused. The spoken line \"Livingston and his dragoons\" doesn't feed into the QR1 solve; other channels chased it as a possible hint for QR2 and later QRs, and the chat shows no payoff.", "techniques": ["video-clue", "spoken-hint", "landmark-photo", "satellite-imagery-matching", "geolocation", "google-maps", "street-view"], "red_herrings": ["Great Salt Lake shorelines: 'north east / west of the SLC airport', Syracuse, Willard Bay (A hunter's dad recognised the mountain profile of the second shot), Farmington Bay; Promontory was judged too far north; one frame was read as 'looking south from the GSL'. The plaque was on Utah Lake.", "Small airports as the flight's start/end: Herriman, SLC, Provo, Farmington (street view there did not match); a hunter thought the airport in the video looked tiny and private.", "Provo Bay: the reel's overview shot focuses too far south and a hunter's husband guessed Provo Bay. Same lake, but the spot is in the shot's background near Lindon Marina, in Vineyard.", "Spoken line 'Livingston and his dragoons' (auto-captioned 'dragons'): chased as a hint for later QRs; no link to the QR1 solve appears in the chat."], "hints": ["It's quick but in the reel this arrow flashes telling you exactly where QR1 is. That green area is Utah Lake"], "open_questions": ["Plaque answer conflict: the #qr-1 chat (A hunter) and a hunter's doc give 'Vineyard'. The #qr-8-part-1 record read 'LostnC...fuse...' off a partly hidden hint-email screenshot and took it as the QR1 answer. A hunter's doc names LostnConfused as the first team to find QR1, so the screenshot may show the first-finder team rather than the answer. Not checked against the full email.", "Location name: the #qr-1 record infers 'Vineyard Beach' from a Maps screenshot, and the chat itself only says 'Vineyard'. A hunter's doc says 'just south of Lindon Marina'. The coordinates in both sources agree.", "Flight map direction: the last frame was described as a red line from SLC south toward the Grand Canyon/Arizona (A hunter) and as ending south of SLC (A hunter). A hunter said the flight went east out of downtown SLC and heard 'flying to Juarez, NM'.", "The hint text comes from a hunter's summary doc. It is not clear whether it was an official organizer hint or a hunter's own note.", "The exact verbatim reel caption beyond 'The 2024 QR Treasure Hunt kicks off today ...' is not captured. Neither is the meaning of 'Livingston and his dragoons', if it has one."], "coords": [40.322977, -111.765025], "n_sources": 59, "steps": [{"t": "step", "n": "1", "clue": [], "label": null, "lead": "Watch the kickoff reel.", "text": "Dave points down to signal that the next image is the clue. That image shows the plaque spot, and an arrow flashes for a split second at a lone tree/bush on the shore road. Teams froze frames and took the arrow as the QR1 spot.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": null, "lead": "The overview shot that follows shows Utah Lake (Provo Bay).", "text": "It gives the general area, but its focus is too far south: the QR spot is in the background of that shot, near Lindon Marina.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": null, "lead": "Teams matched the frames to satellite imagery.", "text": "They saw a lake shoreline with a dirt road/levee right at the water, a rail line/road running parallel inland (a hunter later read it as a barrier beside the road), a canal/creek and marsh in between, and mountains behind that matched the Oquirrhs with the Bingham Canyon mine. The lake level was lower than in the satellite photos. Tools tried: a hunter shared the Utah Aqua Spot StoryMap (ArcGIS); a hunter tried the Picarta image geolocator.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": null, "lead": null, "text": "A hunter noticed that the closing flight map's path ends south of SLC, which fits Utah Lake rather than the Great Salt Lake that early guesses focused on.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": null, "lead": null, "text": "A hunter (Google Maps cursor on Vineyard Beach beside the Utah Lake Shore Trail) and a hunter each found the spot while a hunter's teammates were already driving there. A hunter posted the pin 40°19'22.6\"N 111°45'54.1\"W at 14:42, and a hunter confirmed \"That's the spot\".", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": null, "lead": "At the plaque the question is \"What city are you in?\" and the answer is \"Vineyard\".", "text": "A hunter posted the plaque photo and the answer. The leaderboard showed 5 teams at 14:43, about 75 minutes after kickoff. A hunter's doc names the first team as LostnConfused. The spoken line \"Livingston and his dragoons\" doesn't feed into the QR1 solve; other channels chased it as a possible hint for QR2 and later QRs, and the chat shows no payoff.", "bullets": []}], "title": "Kickoff reel geolocation", "media": [{"src": "media/2024-qr1-01.jpg", "section": "clue", "caption": "The kickoff reel on the organizers' Instagram.", "kind": "image"}, {"src": "media/2024-qr1-02.jpg", "section": "solve", "caption": "Reel frame with the arrow that flashes at a lone tree on the shoreline (step 1).", "kind": "image"}, {"src": "media/2024-qr1-03.jpg", "section": "solve", "caption": "Zoomed frame: the arrow points at the lone tree (step 1).", "kind": "image"}, {"src": "media/2024-qr1-04.jpg", "section": "solve", "caption": "The closing flight map, whose path ends south of Salt Lake City (step 4).", "kind": "image"}], "links": [{"url": "https://www.instagram.com/reel/DAtqOL0S6u3/", "label": "The kickoff reel on Instagram (the clue)"}], "wl": [{"match": "Watch the kickoff reel", "url": "https://www.instagram.com/reel/DAtqOL0S6u3/"}]}, {"hunt_year": 2024, "qr_number": 2, "status": "confirmed", "confidence": 0.95, "clue_text": "[Image-only clue, no text. The utahtreasurehunts.com \"Clue Number 2\" page shows a single picture (saved as Z.png by some players and served as 'Z.bin', really a ~2000x1339 JFIF/JPEG, on other devices): the famous photo of Michael Jordan (Bulls #23) in mid-air on his free-throw-line slam dunk, scoreboard clock reading 3:51, a Gatorade sign, an \"Eyewitness News Sports 4,5,6 & 10\" banner, and a crowd in which the score cards that read \"10\" in the original photo have been replaced by the numbers 17, 65, 77, 6, 9, 17, 90, 33, 27 (the 6 and 9 appear sideways; a hunter's solve doc reads the fourth number as 5).]", "plaque_question": "What trail are you on?", "plaque_answer": "Ferguson", "location_name": "Ferguson Canyon Trail (Ferguson Canyon), Cottonwood Heights, Salt Lake County, Utah", "location_detail": "Coordinates: 40.612869, -111.776521 (A hunter's string x 23); a hunter's doc 40.612846, -111.776521; a hunter's pinned 40.6126869, -111.776521. The plaque sits just off the Ferguson Trail; per an OpenStreetMap lookup done by the extractor (not stated in the chat) it is ~0.4 mi (700 m straight line) up from the trail's west end. The hike is short but steep and rocky, about 30 min one way (A hunter), with a massive rock to climb over; it was 'rough' in the dark, and a hunter twisted an ankle coming down. The plaque (brushed-metal plate with the hunt's compass logo and a QR code, four brass screws) is screwed onto a fallen log hidden behind a big boulder/fallen tree to the RIGHT of the trail: 'just past this rock on the right, like 5 feet off the trail'. Photos: [local file] (plaque on the log), IMG_0344-cd79d0b20f0d76ba.jpg (the boulder; plaque just behind), image0-5f28fcb717ccccb3.jpg (log circled in red). The trail was busy at night and the next morning, with many groups following others without knowing where to look.", "solve_path": "1) Identify the photo: Michael Jordan's free-throw-line dunk from the 1988 Slam Dunk Contest (a framed print spotted by a hunter's group reads '1988 Slam Dunk Champion'; earlier chat was unsure between 1987 and 1988). Reverse-image search finds the original.\n2) Compare with the original: the spectators' score cards, all '10' in the original, were edited. Read left to right, the edited numbers are 17, 65, 77, 6, 9, 17, 90, 33, 27 (the 6 and 9 sideways; a hunter's difference map: 10>17, 10>65, 10>77, 10>9?, 10>9, 10>17, 10>90, 10>33, null>27 at the far right). Two 10s near the top / just below the clock were removed without replacement and the top/nosebleed signs are ignored. A hunter's doc lists the fourth number as 5 instead of 6.\n3) Concatenate them in order: 1765776917903327 (A hunter's spoiler string; a hunter's doc: 1765775917903327).\n4) Multiply by the one unchanged number that matters, Jordan's jersey number 23 (A hunter's nudge: 'All you need is the numbers in the pic. The changed ones & one more that wasn't changed'; the hint: 'use Michael Jordan's number for something'): 1765776917903327 x 23 = 40612869111776521 (A hunter: 1765775917903327 x 23 = 40612846111776521).\n5) Utah coordinates start with 40 and -111, so split at the 111: 40.612869, -111.776521 (A hunter: 40.612846, -111.776521; a hunter's pinned typed version 40.6126869, -111.776521 has an extra 6 but still got teams to the spot).\n6) Hike up the Ferguson Canyon Trail in Cottonwood Heights to the coordinates (about 30 min one way, steep and rocky) and find the plaque on a fallen log behind a boulder, ~5 ft right of the trail. The scan asks 'What trail are you on?' and the answer is 'Ferguson'.\nMeta: a hunter/a hunter's team (A team) scanned at ~20:20 MDT on Oct 5 after a brief scan glitch (A hunter DM'd Dave on Instagram and he 'had to fix something'). Scanning starts a 24-hour countdown before the QR3 clue (due 8:17 PM Oct 6). Six teams had scanned by 23:05 Oct 5 and 55 by 00:30 Oct 6. Organizer email: the first team to scan each QR wins $1k if the next scan comes within 48 h, otherwise $2k.", "techniques": ["image-diff", "edited-image", "image-puzzle", "hidden-numbers-in-image", "number-code", "arithmetic", "multiplication-key", "coordinates", "sports-reference", "pop-culture-reference", "book-cipher", "sponsor-reference"], "red_herrings": ["Reading the edited numbers directly as GPS coordinates: Utah needs ~40 / -111, but both strings start with 17 (near Chad).", "Multiplying by 23 without concatenating first, or splitting the numbers before multiplying: 17657769 x 23 = 406128687 (right latitude, but 17903327 x 23 is nonsense); 17 x 657769 = 11182073; 1765775 x 23 = 40612825 and 917903327 x 23 = 21111776521 (or 17903327 x 23 = 411776521) are near misses that only work after fudging digits. Multiplying by 3 and/or 351 (the clock) never reaches 111. A hunter had the right latitude a day early ('so close').", "Guessing the extra unchanged number was 10 or 8; it was Jordan's 23. A hunter also suggested adding the clock time and the banner's 4,5,6 & 10.", "A second 90 (hunters: '17 65 77 6 9 17 90 33 90 27'): not part of the working string.", "File name 'Z' theories: Z = Zahlen/integers, Z as a cipher/book hint, Livingston's 1765 'Z' essays. A hunter noted that 'Z' is just the tail of the base64 image data, which also happened in past hunts.", "William Livingston theory (from 'Livingston and his dragoons' in the QR1 video; 17|65 and 17|90 read as 1765 and his death year 1790): word-counting his Papers, the 1753 'Company of Dragoons' quote (too short for word 90), and his 13 Oct 1778 letter to Washington all gave nonsense. Livingston places (a canyon, a June 2024 concert by the singer Livingston) and 'Lagoon' (a joke) went nowhere. Dropped once organizers confirmed everything is in the picture.", "Book cipher using the numbers as word positions in the NBA.com 1988 dunk page, the hunt kickoff email, or a Flat Bill Podcast transcript from 3:51: gibberish. The Dominguez-Escalante journal from the QR1 video was proposed as the book but not shown to work.", "Sponsor theories: the Flat Bill Podcast video (hat lifts and blinking checked as Morse code) and sponsor websites: nothing found.", "Bible verse 3:51 (from the clock) in a Z book: no fit. Lamentations 3:51 was suggested but not confirmed.", "Letter/symbol decodes: A1Z26 with wrap-around (QMYFIQLGA) and its Atbash; periodic-table symbols; decimal ASCII (65 A, 77 M, 90 Z, 33 ! -> 'AM Z!'); 2-digit hex; CacheSleuth multi-decoder: none worked.", "Appending the digits or '/Livingston' to the site URL: nothing.", "Steganography / file tricks on Z.png / Z.bin: aperisolve, stego tools, a PNG IHDR-chunk idea, 'found zip', rebuilding a file from the numbers, and 1765775617903327 as an aperisolve password: nothing.", "Epoch timestamp (Feb 11 1971), sum (431), product: meaningless.", "Jersey numbers on the 1987/1988 Bulls rosters: no consistent match.", "Jordan -> West Jordan / Jordan River / West Jordan airport: wrong.", "ErinMaxx's big-Discord coordinates (including the 81114158969 -> 41.58969, -111.415869 sum idea): close enough to put people on the same trail but not at the exact spot; many planned to hike 'to the end'."], "hints": ["Official hint (quoted in a hunter's solve doc): 'If you look closely, there are fans holding numbers in the background we may have changed. Make a note of these numbers and then use Michael Jordan's number for something.'", "Organizer reply to a player's DM (screenshot posted by Eclosion in the big Discord, relayed by a hunter): 'Is everything we need to solve QR2 located in the picture?' -> 'Yes'.", "Unofficial nudge from a hunter (first solver): 'All you need is the numbers in the pic. The changed ones & one more that wasn't changed'; the target is coordinates."], "open_questions": ["Fourth edited number: a team's reading and a hunter's working string use 6 (1765776917903327 -> 40.612869); a hunter's doc uses 5 (1765775917903327 -> 40.612846). That changes the latitude by 0.000023° (~2.6 m), so both lead to the plaque.", "Exact latitude: 40.612869 (A hunter's string x 23) vs 40.612846 (A hunter) vs a hunter's pinned 40.6126869 (apparent typo, ~20 m off).", "'gone_phishing': one record calls it QR2's answer in the official hint email's answer list ( screenshot), and a hunter's doc calls it the first team. But a team chat says a hunter/a hunter's team scanned first (~20:20 Oct 5), and the plaque answer elsewhere is 'Ferguson'. Unclear whether gone_phishing is a team name, a hunter's team name, or something else in the hint email.", "Image file name/format: Z.png in one window vs Z.bin (JFIF/JPEG) in another; a hunter says 'Z' is a download artifact, not a hint.", "Photo year: 1987 vs 1988 dunk contest was unsure in chat; the framed print says 1988.", "Place name 'Ferguson Canyon Trail' comes from the plaque answer, a hunter's doc and an extractor's OSM lookup; the team chat itself never named the trail.", "Techniques list includes book-cipher and sponsor-reference from failed approaches (kept per the union rule); the working method used only the edited numbers, multiplication and coordinates."], "coords": [40.612869, -111.776521], "n_sources": 258, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Identify the photo", "lead": null, "text": "Michael Jordan's free-throw-line dunk from the 1988 Slam Dunk Contest (a framed print spotted by a hunter's group reads '1988 Slam Dunk Champion'; earlier chat was unsure between 1987 and 1988). Reverse-image search finds the original.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Compare with the original", "lead": null, "text": "The spectators' score cards, all '10' in the original, were edited. Read left to right, the edited numbers are 17, 65, 77, 6, 9, 17, 90, 33, 27 (the 6 and 9 sideways; a hunter's difference map: 10>17, 10>65, 10>77, 10>9?, 10>9, 10>17, 10>90, 10>33, null>27 at the far right). Two 10s near the top / just below the clock were removed without replacement and the top/nosebleed signs are ignored. A hunter's doc lists the fourth number as 5 instead of 6.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Concatenate them in order", "lead": null, "text": "1765776917903327 (A hunter's spoiler string; a hunter's doc: 1765775917903327).", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": null, "lead": null, "text": "Multiply by the one unchanged number that matters, Jordan's jersey number 23 (A hunter's nudge: 'All you need is the numbers in the pic. The changed ones & one more that wasn't changed'; the hint: 'use Michael Jordan's number for something'): 1765776917903327 x 23 = 40612869111776521 (A hunter: 1765775917903327 x 23 = 40612846111776521).", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": null, "lead": null, "text": "Utah coordinates start with 40 and -111, so split at the 111: 40.612869, -111.776521 (A hunter: 40.612846, -111.776521; a hunter's pinned typed version 40.6126869, -111.776521 has an extra 6 but still got teams to the spot).", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": null, "lead": null, "text": "Hike up the Ferguson Canyon Trail in Cottonwood Heights to the coordinates (about 30 min one way, steep and rocky) and find the plaque on a fallen log behind a boulder, ~5 ft right of the trail. The scan asks 'What trail are you on?' and the answer is 'Ferguson'.", "bullets": []}, {"t": "p", "label": "Meta", "text": "A hunter/a hunter's team (A team) scanned at ~20:20 MDT on Oct 5 after a brief scan glitch (A hunter DM'd Dave on Instagram and he 'had to fix something'). Scanning starts a 24-hour countdown before the QR3 clue (due 8:17 PM Oct 6). Six teams had scanned by 23:05 Oct 5 and 55 by 00:30 Oct 6. Organizer email: the first team to scan each QR wins $1k if the next scan comes within 48 h, otherwise $2k."}], "title": "Edited Michael Jordan dunk photo", "media": [{"src": "media/2024-qr2-01.jpg", "section": "clue", "caption": "The clue image: Jordan's 1988 free-throw-line dunk with edited score cards in the crowd.", "kind": "image"}, {"src": "media/2024-qr2-02.jpg", "section": "clue", "caption": "Clue Number 2 on the hunt site.", "kind": "image"}, {"src": "media/2024-qr2-03.jpg", "section": "solve", "caption": "The edited score cards circled (step 2).", "kind": "image"}, {"src": "media/2024-qr2-04.jpg", "section": "location", "caption": "The plaque on a fallen log behind a boulder, just off the Ferguson Canyon Trail.", "kind": "image"}], "links": [], "wl": [{"match": "the Flat Bill Podcast video", "url": "https://www.youtube.com/watch?v=SvzSF4ECR6c"}, {"match": "Flat Bill Podcast transcript from 3:51", "url": "https://www.youtube.com/watch?v=SvzSF4ECR6c&t=231s"}]}, {"hunt_year": 2024, "qr_number": 3, "status": "confirmed", "confidence": 0.95, "clue_text": "[Video clue; no text version of the clue was posted in chat] Unlisted YouTube video titled \"Inside the Legendary Treasure Hunt: New Clues Unveiled!\" on the Flat Bill Investors channel (about 22:30 long, reachable only after scanning QR2; axe watermark in the lower-left corner): https://youtu.be/4K9HBgiMVd8. Video description as quoted in chat: \"Join Josh and a hunter as they sit down with Utah Treasure Hunts to dive deep into the mystery behind their famous treasure hunt! In this exciting interview, you'll get an exclusive behind-the-scenes look at the inspiration, history, and challenges involved in creating the legendary hunt. You won’t want to miss it, as they may even reveal some new clues along the way! If you're a treasure hunting enthusiast or looking to join the adventure, this video is packed with insights and hints that could bring you closer to discovering the hidden treasure. Ready to start your quest?\"", "plaque_question": "What city are you in?", "plaque_answer": "Layton", "location_name": "Axe N Smash (axe-throwing venue), Layton, Utah", "location_detail": "2146 N Main Street, Layton, Utah (address from a hunter's solve doc only). Per another Discord (relayed by a hunter), the venue opened at 3 PM on Oct 7, 2024 and teams started scanning soon after. Inside, staff have you hit the bullseye with a thrown axe. They teach you how; a hunter said it was \"much harder than I thought\", and a hunter said most people hit the centre within ~15 minutes. Then they show you the plaque: a metal plate with a QR code over a compass rose and a Utah outline, held on a white binder (photo [local file]). Teams also took a selfie. A hunter was \"in and out in 3 minutes including taking selfie\".", "solve_path": "THE CLUE: QR3 was a video, not text. It is an unlisted YouTube re-cut of the Flat Bill Investors podcast interview with the organizers (hosts Josh and a hunter, guests Dave and John). A hunter's dad spotted the link in the hunt site's page code at 16:58 MDT on Oct 6, 2024. It had been uploaded 3 days earlier and had about 10 views. The official release was at about 20:17 MDT on Oct 6 when the countdown ended. The organizers' public version of the interview is different: it has no axe/hatchet drawing in the bottom-left corner.\n\nINTENDED SOLVE (confirmed by organizer John Maxim in an Instagram DM dated Oct 8, 2024 2:27 PM, posted by a hunter, and in a hunter's solve doc):\n1. The video quotes Sherlock Holmes (2009): at 16:09, \"I daresay we have the right man\", and at 16:27, \"Someone with me on whom I can rely\". These point to the scene where Holmes plots four sites tied to the Temple of the Four Orders on a map, and the cross they form gives the final location.\n2. Four places are named in the video: Ellison Park skate park (7:45), Lagoon (11:02), Coleman Knitting Mills in Ogden (19:17) and Clinton City Recreation Center (19:38).\n3. Draw lines Clinton Rec Center–Lagoon and Ellison skate park–Coleman Knitting Mills. They cross in an X (\"X marks the spot\") at Axe N Smash in Layton.\n4. The axe watermark in the bottom-left corner confirms the spot. John said they underestimated the solvers and \"never should've put the axe watermark\": it was added because they feared the puzzle was too hard, and it \"puts you in the parking lot\". The official hint email said: \"We don't think almost anyone solved it the way we intended... The watermark at the bottom left corner gave it away.\"\n5. At the venue, hit the bullseye with an axe throw to be shown the QR plaque. The plaque question is \"What city are you in?\" and the answer is Layton.\n\nHOW TEAMS ACTUALLY SOLVED IT: Most teams went straight from the axe watermark (and, per a hunter, the hosts saying \"Layton\") to axe-throwing venues. A hunter's sheet listed Axe N Smash (South Jordan, American Fork), Heber Hatchets (SLC, Provo), Social Axe (SLC), The Yeetery (Spanish Fork) and Rhyno's (Orem), with no Layton entry. Several teams had thought of axe throwing early but dismissed it as too easy. A tip from another Discord said the Layton branch was being scanned. A hunter phoned the venue and was told \"definitely maybe\", with a challenge to do. A hunter walked in, hit the bullseye and got the plaque. The first teams found it around 15:30–15:38 on Oct 7 (7 teams, about 8 by 16:03), and the first team overall was The Robots. The QR3 completion badge/leaderboard icon was a target/bullseye, which also gave the answer away (A hunter). After the find, a hunter worked out the four-place X, and a hunter linked it to the Sherlock scene. A hunter had quoted that screenplay passage at 15:34 as a \"four points make a location\" idea.\n\nEARLIER WORK BEFORE THE FIND (Oct 6–7): People studied a one-frame black screen at 10:54 (A hunter measured 10:54,08, ~0.01 s) and a one-frame white flash at 16:22–16:23 (16:22,21) where Dave and John vanish. They also looked at bright dots in the background, the audio (spectrum analysis), the captions, the sponsors' social media, the hosts' businesses, and John's Instagram story \"QR Hunt problems @the.cline.fam\". That story showed a partly blacked-out text exchange with Dave Cline (\"I stopped by on Friday... We aren't ready for when they scan it though\"). See the dead ends list.", "techniques": ["video-clue", "movie-quote-reference", "map-overlay", "line-intersection", "place-names-in-video", "watermark-hint", "local-business", "sponsor-location", "badge-icon-leak", "hidden-image-in-video", "frame-glitch", "social-media-hint"], "red_herrings": ["Glitch frames (black screen at 10:54, white flash at 16:22/16:23, axe vanishing at 22:29): John Maxim answered 'No' when asked by DM if they were intentional; a hunter: 'the glitches really were just glitches'.", "Timestamps as coordinates (22:30 -> 2230/2 -> -111.5; 16:23 -> 1623/4 -> 40.575): a hunter admitted the arithmetic had no basis.", "Hatchet + 1054 as an axe-venue address: Social Axe in SLC is at 1154 S, not 1054; a hunter went there first and the staff knew nothing. A team was also sent to Axe N Smash American Fork; the answer was the Layton branch.", "A third flicker at ~11:22-11:24 (A hunter): nobody else could see it; likely a phone glitch or camera cut.", "Video length 22:29 vs 22:30 and flicker at 16:22 vs 16:23: YouTube player rounding, not different cuts.", "Flat Bill Investor logo seeming to appear/disappear (~0:50, ~20:00): it is on screen the whole time, hidden by the background or camera angle.", "Bright dots/noise in the dark background and the black 10:54 frame: compression artifacts; no Braille or Morse found.", "The blur/spots near the intro a hunter flagged: just the moving diamond-pattern background.", "Hidden data in the audio (A hunter's listen, a hunter's sped-up spectrum analysis) or in the auto-generated captions: nothing found.", "The hatchet's different position on the podcast cover image: probably a screenshot from a clip (A hunter).", "The 10:54 hatchet being the Roblox 'Goth Axe': close, but the handle and curve differ.", "Peter Pan ('Peter Pan syndrome' mentioned; Peter Pan movie at 10:54): no link found.", "Sponsor angle (Honeycomb Treasure Hunt, Greater Endodontics Riverton, Bulldog Disposal, MM Subaru, Healing Connections, Magellan HCM, Swords of Secret, Frost Box Rentals, Flat Bill Investor; Tax Hive / Fidelity National Title hats, Quivira Golf Club shirt, Club Paddock hat): nothing found. Bulldog Disposal's only post is from 2020; Healing Connections' 'tree that stands alone' post could not be connected.", "Word at ~0:22 that sounded bleeped: likely a stutter (A hunter).", "A hunter heard 'here's our QR code' ~12:10: the captions there talk about an IOU note in the chest.", "The Silver Hatchet (Arthur Conan Doyle), Doyle's 1923 Utah visit and A Study in Scarlet as the hatchet link.", "A hunter's four-points guess (Beehive/bees house, an axe-throwing spot, an eagle downtown, the SLC temple) and a hunter's triangulation from 3 places/times: right idea, wrong points.", "John's 'Flipping Friday' posts ('888 + 88 + 8 + 8 + 8 = 1000'): belonged to 2023 QR6.", "@theflatbillinvestor following @lostboysmarketing; Josh's unfinished meetjoshz.com/podcast page: rabbit holes with nothing found.", "Josh saying 'I live clear in Layton' and the 21:46 timestamp matching the 2146 N Main address: coincidences, not intended clues (per the solve doc)."], "hints": ["We thought this clue was going to be way tougher than it ended up being. We don't think almost anyone solved it the way we intended but that's part of the fun of the hunt. The watermark at the bottom left corner gave it away."], "open_questions": ["One record (#qr-8-part-1, from the official hint email's answer list, screenshot) gives plaque_answer 'The Robots'. The solve doc gives the question 'What city are you in?' with answer 'Layton' and names The Robots as the first team to find QR3. Which value the hint email's list actually showed is not resolved; 'Layton' was used here.", "The Oct 7 chat says no password or phrase was asked at the venue, but the solve doc lists the plaque question 'What city are you in?'. The question was probably asked after scanning online, but no source says so.", "A hunter said the hosts mention 'Layton' twice and teams used that as a pointer. The solve doc says Josh's 'I live clear in Layton' was a coincidence, not an intended clue.", "John's phrase that the axe 'puts you in the parking lot' is ambiguous: the axe as a shortcut to the venue, or the lines crossing in the venue's parking lot.", "The street address 2146 N Main Street comes only from the solve doc. The chat did not give an address, and nobody checked the exact line intersection with coordinates.", "The city of the Ellison Park skate park is not stated in any source.", "Whether John's Instagram story 'QR Hunt problems @the.cline.fam' (blacked-out text exchange with Dave Cline about being ready 'for the flood') referred to the Axe N Smash host is not confirmed."], "coords": null, "n_sources": 192, "steps": [{"t": "h", "text": "The clue", "sub": ""}, {"t": "p", "label": null, "text": "QR3 was a video, not text. It is an unlisted YouTube re-cut of the Flat Bill Investors podcast interview with the organizers (hosts Josh and a hunter, guests Dave and John). A hunter's dad spotted the link in the hunt site's page code at 16:58 MDT on Oct 6, 2024. It had been uploaded 3 days earlier and had about 10 views. The official release was at about 20:17 MDT on Oct 6 when the countdown ended. The organizers' public version of the interview is different: it has no axe/hatchet drawing in the bottom-left corner."}, {"t": "h", "text": "Intended solve", "sub": "confirmed by organizer John Maxim in an Instagram DM dated Oct 8, 2024 2:27 PM, posted by a hunter, and in a hunter's solve doc"}, {"t": "step", "n": "1", "clue": [], "label": null, "lead": "The video quotes Sherlock Holmes (2009): at 16:09, \"I daresay we have the right man\", and at 16:27, \"Someone with me on whom I can rely\".", "text": "These point to the scene where Holmes plots four sites tied to the Temple of the Four Orders on a map, and the cross they form gives the final location.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": null, "lead": null, "text": "Four places are named in the video: Ellison Park skate park (7:45), Lagoon (11:02), Coleman Knitting Mills in Ogden (19:17) and Clinton City Recreation Center (19:38).", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": null, "lead": "Draw lines Clinton Rec Center–Lagoon and Ellison skate park–Coleman Knitting Mills.", "text": "They cross in an X (\"X marks the spot\") at Axe N Smash in Layton.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": null, "lead": "The axe watermark in the bottom-left corner confirms the spot.", "text": "John said they underestimated the solvers and \"never should've put the axe watermark\": it was added because they feared the puzzle was too hard, and it \"puts you in the parking lot\". The official hint email said: \"We don't think almost anyone solved it the way we intended... The watermark at the bottom left corner gave it away.\"", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": null, "lead": "At the venue, hit the bullseye with an axe throw to be shown the QR plaque.", "text": "The plaque question is \"What city are you in?\" and the answer is Layton.", "bullets": []}, {"t": "h", "text": "How teams actually solved it", "sub": ""}, {"t": "p", "label": null, "text": "Most teams went straight from the axe watermark (and, per a hunter, the hosts saying \"Layton\") to axe-throwing venues. A hunter's sheet listed Axe N Smash (South Jordan, American Fork), Heber Hatchets (SLC, Provo), Social Axe (SLC), The Yeetery (Spanish Fork) and Rhyno's (Orem), with no Layton entry. Several teams had thought of axe throwing early but dismissed it as too easy. A tip from another Discord said the Layton branch was being scanned. A hunter phoned the venue and was told \"definitely maybe\", with a challenge to do. A hunter walked in, hit the bullseye and got the plaque. The first teams found it around 15:30–15:38 on Oct 7 (7 teams, about 8 by 16:03), and the first team overall was The Robots. The QR3 completion badge/leaderboard icon was a target/bullseye, which also gave the answer away (A hunter). After the find, a hunter worked out the four-place X, and a hunter linked it to the Sherlock scene. A hunter had quoted that screenplay passage at 15:34 as a \"four points make a location\" idea."}, {"t": "h", "text": "Earlier work before the find", "sub": "Oct 6–7"}, {"t": "p", "label": null, "text": "People studied a one-frame black screen at 10:54 (A hunter measured 10:54,08, ~0.01 s) and a one-frame white flash at 16:22–16:23 (16:22,21) where Dave and John vanish. They also looked at bright dots in the background, the audio (spectrum analysis), the captions, the sponsors' social media, the hosts' businesses, and John's Instagram story \"QR Hunt problems @the.cline.fam\". That story showed a partly blacked-out text exchange with Dave Cline (\"I stopped by on Friday... We aren't ready for when they scan it though\"). See the dead ends list."}], "title": "Podcast video and four-place map intersection", "media": [{"src": "media/2024-qr3-01.jpg", "section": "clue", "caption": "The video thumbnail, with the axe drawing in the corner circled.", "kind": "image"}, {"src": "media/2024-qr3-02.jpg", "section": "clue", "caption": "The unlisted re-cut of the podcast interview on YouTube.", "kind": "image"}, {"src": "media/2024-qr3-03.jpg", "section": "solve", "caption": "The axe watermark in the bottom-left corner (step 4).", "kind": "image"}], "links": [{"url": "https://youtu.be/4K9HBgiMVd8", "label": "The clue video, an unlisted re-cut of the Flat Bill Investors interview"}], "wl": [{"match": "unlisted YouTube re-cut", "url": "https://youtu.be/4K9HBgiMVd8"}, {"match": "16:09", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=969s"}, {"match": "16:27", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=987s"}, {"match": "7:45", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=465s"}, {"match": "11:02", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=662s"}, {"match": "19:17", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=1157s"}, {"match": "19:38", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=1178s"}, {"match": "10:54", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=654s"}, {"match": "16:22", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=982s"}]}, {"hunt_year": 2024, "qr_number": 4, "status": "confirmed", "confidence": 0.95, "clue_text": "[Image clue: parchment scroll with 22 letter+number codes in two columns of 11]\nLeft column (top to bottom): D8, E4, F11, C2, B21, A5, C14, G15, C79, E3, D1\nRight column (top to bottom): F18, G14, E9, B1, G8, F6, C7, A16, C1, C16, B7", "plaque_question": "What did you cross to scan the QR?", "plaque_answer": "Slackline (written \"slack line\" in the chat)", "location_name": "Hang Time trampoline/adventure park, Orem (plaque at the far end of a slackline), reached via a claw-machine puzzle at El Mexsal restaurant, Provo", "location_detail": "Stop 1: El Mexsal (also written \"El Mexal\" in the chat), a small Mexican restaurant and hunt sponsor in Provo on Freedom Blvd, with a claw machine whose prize eggs/balls hold shredded paper tickets. Stop 2: Hang Time trampoline park in Orem. The QR plaque is at the far end of a slackline, on a small platform (on the platform wall / screwed to a hinged board) in a blue-lit room. The plaque is a metal plate with a dotted-style QR code and a compass rose over a Utah outline. Hours noted that Friday: restaurant closes 9pm, park 11pm. Plaque photos: [local file], [local file]; selfie with the plaque: [local file]; blue-lit room: [local file] The QR opens a utahtreasurehunts.com/current-treasure-hunts/<hunt id>/<qr id> page (the full URL was pinned in the chat).", "solve_path": "1) The clue is 22 codes, each a letter A-G plus a number, in two columns of 11. Every number is 1-21 except C79, and no pair repeats. The letters A-G suggest musical note names, but the numbers are too large to be real chords (B21, C79).\n2) Official hint email (Fri 2024-10-11, about 2:50pm MDT): solving the cipher tells you exactly where to go, and you need \"a little music theory and an old, important document\". Without this hint the clue was effectively unsolvable. The group spent four days on other ideas (see red herrings).\n3) Music theory (A hunter's breakthrough, tabulated by a hunter): count the note names starting from C, the way scales start on middle C: C=1, D=2, E=3, F=4, G=5, A=6, B=7. Each code becomes (section).(position). Read down the left column, then the right: 2.8 3.4 4.11 1.2 7.21 6.5 1.14 5.15 1.79 3.3 2.1 | 4.18 5.14 3.9 7.1 5.8 4.6 1.7 6.16 1.1 1.16 7.7.\n4) The old document is the Bill of Rights, used as an Ottendorf/book cipher. The note value picks the amendment, and the number picks the nth letter of that amendment's text, counting letters only. The US Constitution (7 articles) was tried first and failed. The Utah Constitution and the Articles of Confederation were also set aside.\n5) Worked examples: D8 = 2nd Amendment, 8th letter, G (\"A well reGulated\"). E4 = 3rd Amendment, 4th letter, O. F11 = 4th Amendment, 11th letter, T. C2 = 1st Amendment, 2nd letter, O. B21 = 7th Amendment, 21st letter, E. A5 = 6th Amendment, 5th letter, L. C79 = 1st Amendment, 79th letter, the X in \"exercise\" (the X of MEXSAL). B7 = 7th Amendment, 7th letter, S. The left column spells GOTOELMEXSA and the right column spells LBRINGSOCKS, so the message is \"GO TO EL MEXSAL. BRING SOCKS.\" (A hunter, about 6:26pm MDT Fri 10/11). Another team had finished QR4 within hours of the hint email.\n6) El Mexsal: staff give you claw-machine tokens. The prize capsules hold strips of shredded paper that you tape together into a picture. Some capsules hold an unshredded ticket, e.g. a Healing Connections \"It's your lucky day!\" slip, which only skips the reassembly step. The assembled ticket is a 1-hour pass to Hang Time in Orem. You could instead pay at Hang Time, but organizer John's Instagram video said you need a selfie at every physical location you visit, not just at the plaque.\n7) Hang Time: cross the slackline to the platform at its far end, where the QR is. Scan it and answer the plaque question (\"What did you cross to scan the QR?\") with \"slackline\". The organizer said a teammate may cross for you (A hunter crossed for a hunter). Scanning starts a 2-day countdown to QR5 (A hunter: scanned 7:56pm Fri 10/11, QR5 at 7:56pm Sun 10/13).\n8) Timeline: a big-Discord solver decoded El Mexsal, but a restaurant employee who didn't know about the hunt made them think the decode was wrong, so they posted it as \"wrong\" (about 7:30pm Fri) and later deleted it. That leaked the solution. Teams scanned: 11 by about 8:13pm, 29 by 9:11pm, 44 by 9:41pm, 90 by 11:17pm Fri, and about 173 by 2:22pm Sat. On Saturday the park had a huge line while only about three teams were at the restaurant, so solvers suspected the park location was leaking through selfies.\nPattern: letter+number pairs plus a hint naming a \"document\" = book cipher. A theme (here note names counted from C) supplies the section number, and the number counts letters.", "techniques": ["ottendorf-cipher", "book-cipher", "letter-position", "number-code", "letter-number-pairs", "image-cipher", "music-theory", "music-theory-note-to-number", "historical-document", "bill-of-rights", "sponsor-reference", "sponsor-location", "business-partner-location", "multi-stop-hunt", "multi-stage", "physical-challenge", "selfie-verification"], "red_herrings": ["Reading the codes as real chords or piano notes (C79 vs 88 keys, octave numbers, D8 = D F# A D, C79 = C7 add 9, chord-end letters, sheet-music durations, solfege, music cipher wheel, MIDI/piano-roll plots, a letter-by-number grid read as Morse, numbers mod 7 to note letters plus an ADFGVX 7x7 cipher): numbers too large for chords and no output. The music part only meant counting note names from C.", "'When You Wish Upon a Star' note match (rumor from the big Discord, a hunter's spreadsheet): the left column fits the first phrase if reordered, but the right column is one note off. It could not be reproduced, and people called it 'complicated and forced'. Composer Leigh Harline's Utah ties were also chased.", "Wrong source texts for a book cipher: Sherlock Holmes (His Last Bow, Baskerville), Les Miserables, The Hobbit, Two Towers (two columns = two towers), Scheherazade / One Thousand and One Nights / Poe (from the font), Hunchback of Notre-Dame, Escalante journal, Ready Player One (39 chapters), Space Jam soundtrack (6 songs), The Seven Ages of Man, Taylor Swift's Red, Abbey Road / Beatles albums, Narnia, Harry Potter, Julius Caesar, Marcus Aurelius' Meditations, movie scripts, The Go-Giver / Crucial Conversations (from a sponsor's podcast), Future House Publishing books on the SwordsOfSecret shelf reel, the organizers' Goodreads shelves.", "Wrong historical documents after the hint: US Constitution (7 articles, two signature columns, tried first), Declaration of Independence, Star-Spangled Banner, Magna Carta, Dead Sea Scrolls, Bible, Federalist Papers, Articles of Confederation, Utah constitution/statehood documents, the organizers' first poem.", "Font theory: a font finder said Scheherazade, but the Latin letters match Times New Roman, so it tells nothing. Times New Roman read as Roman numerals or Caesar also gave gibberish.", "Caesar/letter shifts by each number (forward, backward, by column), a multiplicative cipher on A-G, ROT-47, swapping letter and number, Enigma, the prime-number cipher (79 = 22nd prime), hex/colour codes, base64 of the expanded letters or of the image, Roman numerals: all gibberish.", "Periodic table (79 = gold, 7 periods = A-G): the element symbols spell gibberish.", "Coordinates, Google Plus Code, chess/Battleship, plotting the pairs or column differences, letter x number scaled into coordinates (34.66 / 117.8): no valid output. Assuming the plaintext would be coordinates or an address was wrong; it was a plain sentence.", "Reading the output as a URL ('www', '.com', site path): nothing. The '9k=' attachment name is just the browser's default name for a base64 image.", "Image forensics and pareidolia on the scroll (tower under C2, topography, faces, lighthouse, aircraft, 8x8 block, hidden letters in the bottom black strip, Caldwell catalogue/constellations from an Instagram star picture, planetarium): compression noise or unrelated. The Instagram story was only a $50 sharing-giveaway notice.", "Sponsor Instagram posts (the.healing.connections lone tree, plane with no wings, iykyk poll): the sponsor said none were clues for the current hunt.", "The hint email's scroll image ('We've been trying to reach you about your car's extended warranty') is only a meme. The QR4 badge icon (trash can / recycle bin) was read as a dumpster, ball pit or donation-bin clue and dismissed.", "'Bring socks' read literally as a dumpster dive or clothing-donation bin. The socks are for the trampoline park (see open questions).", "Teams following the leak went to a 'Tex-Mex' place. The cipher spells El Mexsal.", "The Healing Connections unshredded slip read as 'book a therapy session to bypass QR4': it only skips the shred reassembly.", "A big-Discord solver had the right decode but believed it was wrong because a restaurant employee knew nothing about the hunt."], "hints": ["Official hint email for QR4 (Fri 2024-10-11, about 2:50pm MDT): 'When you solve the cipher for QR4, you will know exactly where you need to go. To break the code, you will need a little music theory and an old, important document.' (The Google Doc summary quotes the last words as 'an old, historic document'.) The email's image is a meme scroll: 'WE'VE BEEN TRYING TO REACH YOU ABOUT YOUR CAR'S EXTENDED WARRANTY'.", "UNOFFICIAL (John's Instagram story, Sat 2024-10-12 about 11:08am, not tagged as an official clue): 'I don't have my kids today and im getting hungry. I'm thinking about grabbing lunch somewhere, maybe some Mexican food.' A nudge toward El Mexsal ([local file]).", "UNOFFICIAL: in an Instagram DM, someone asked John (@onthejohn) whether the 4th clue can be solved by itself. He replied only with a zipper-mouth emoji."], "open_questions": ["'whenpigsfly': the #qr-8-part-1 record lists it as the QR4 answer from the official hint email's answer list ( screenshot). A hunter's Google Doc gives it as 'First team: whenpigsfly', and the chat records give the plaque answer as 'slack line' / 'Slackline'. Whether whenpigsfly is a team name or a QR4 answer is unresolved.", "Plaque question wording: the Google Doc gives 'What did you cross to scan the QR?'. The chat only paraphrased it as asking what you had to cross.", "Socks: the Google Doc says bringing socks to El Mexsal got you two claw-machine tokens. The chat says staff approached solvers, no socks were needed at the restaurant, the socks were for the trampoline park, and you kept getting tokens until you won.", "Hint wording: 'old, important document' (email quote in chat) vs 'old, historic document' (Google Doc).", "Spelling: El Mexsal (cipher plaintext and most messages) vs El Mexal (one window).", "Plaque mounting: 'screwed to a hinged board' in a blue-lit room (chat) vs 'on the platform wall' (Google Doc). These may describe the same setup.", "The full plaque URL was pinned in the chat but isn't recorded here. The restaurant's street address isn't given beyond Freedom Blvd, Provo.", "IMG_2476-f163d0cf6cd97799.png was attached in one window alongside the scroll image. It's unclear whether it is the clue itself. Chords_to_numbers2-8ab72c43c0055d8e.png is a working chart, not the clue.", "The scroll art reuses the 2023 QR4 Monte Cristo scroll with a changed left edge and a different font (matched to Scheherazade / Times New Roman). Whether those changes meant anything was never established; the solve doesn't use them.", "The Bill of Rights is a 10-amendment document, but the cipher only uses amendments 1-7 (A-G). Nobody stated why the Bill of Rights rather than the 7-article Constitution; one solver connected the trash-can badge to Schoolhouse Rock's 'I'm Just a Bill'."], "coords": null, "n_sources": 538, "steps": [{"t": "step", "n": "1", "clue": [], "label": null, "lead": "The clue is 22 codes, each a letter A-G plus a number, in two columns of 11.", "text": "Every number is 1-21 except C79, and no pair repeats. The letters A-G suggest musical note names, but the numbers are too large to be real chords (B21, C79).", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": null, "lead": null, "text": "Official hint email (Fri 2024-10-11, about 2:50pm MDT): solving the cipher tells you exactly where to go, and you need \"a little music theory and an old, important document\". Without this hint the clue was effectively unsolvable. The group spent four days on other ideas (see red herrings).", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": null, "lead": null, "text": "Music theory (A hunter's breakthrough, tabulated by a hunter): count the note names starting from C, the way scales start on middle C: C=1, D=2, E=3, F=4, G=5, A=6, B=7. Each code becomes (section).(position). Read down the left column, then the right: 2.8 3.4 4.11 1.2 7.21 6.5 1.14 5.15 1.79 3.3 2.1 | 4.18 5.14 3.9 7.1 5.8 4.6 1.7 6.16 1.1 1.16 7.7.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": null, "lead": "The old document is the Bill of Rights, used as an Ottendorf/book cipher.", "text": "The note value picks the amendment, and the number picks the nth letter of that amendment's text, counting letters only. The US Constitution (7 articles) was tried first and failed. The Utah Constitution and the Articles of Confederation were also set aside.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Worked examples", "lead": null, "text": "D8 = 2nd Amendment, 8th letter, G (\"A well reGulated\"). E4 = 3rd Amendment, 4th letter, O. F11 = 4th Amendment, 11th letter, T. C2 = 1st Amendment, 2nd letter, O. B21 = 7th Amendment, 21st letter, E. A5 = 6th Amendment, 5th letter, L. C79 = 1st Amendment, 79th letter, the X in \"exercise\" (the X of MEXSAL). B7 = 7th Amendment, 7th letter, S. The left column spells GOTOELMEXSA and the right column spells LBRINGSOCKS, so the message is \"GO TO EL MEXSAL. BRING SOCKS.\" (A hunter, about 6:26pm MDT Fri 10/11). Another team had finished QR4 within hours of the hint email.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "El Mexsal", "lead": null, "text": "Staff give you claw-machine tokens. The prize capsules hold strips of shredded paper that you tape together into a picture. Some capsules hold an unshredded ticket, e.g. a Healing Connections \"It's your lucky day!\" slip, which only skips the reassembly step. The assembled ticket is a 1-hour pass to Hang Time in Orem. You could instead pay at Hang Time, but organizer John's Instagram video said you need a selfie at every physical location you visit, not just at the plaque.", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": "Hang Time", "lead": null, "text": "Cross the slackline to the platform at its far end, where the QR is. Scan it and answer the plaque question (\"What did you cross to scan the QR?\") with \"slackline\". The organizer said a teammate may cross for you (A hunter crossed for a hunter). Scanning starts a 2-day countdown to QR5 (A hunter: scanned 7:56pm Fri 10/11, QR5 at 7:56pm Sun 10/13).", "bullets": []}, {"t": "step", "n": "8", "clue": [], "label": "Timeline", "lead": null, "text": "A big-Discord solver decoded El Mexsal, but a restaurant employee who didn't know about the hunt made them think the decode was wrong, so they posted it as \"wrong\" (about 7:30pm Fri) and later deleted it. That leaked the solution. Teams scanned: 11 by about 8:13pm, 29 by 9:11pm, 44 by 9:41pm, 90 by 11:17pm Fri, and about 173 by 2:22pm Sat. On Saturday the park had a huge line while only about three teams were at the restaurant, so solvers suspected the park location was leaking through selfies.", "bullets": []}, {"t": "p", "label": "Pattern", "text": "Letter+number pairs plus a hint naming a \"document\" = book cipher. A theme (here note names counted from C) supplies the section number, and the number counts letters."}], "title": "Scroll of letter-number codes", "media": [{"src": "media/2024-qr4-01.jpg", "section": "clue", "caption": "The scroll clue: 22 letter-and-number codes in two columns.", "kind": "image"}, {"src": "media/2024-qr4-02.jpg", "section": "hint", "caption": "Organizer John's Instagram story on Sat Oct 12, an unofficial nudge toward Mexican food.", "kind": "image"}, {"src": "media/2024-qr4-03.jpg", "section": "location", "caption": "The plaque on the platform at the far end of the slackline, Hang Time.", "kind": "image"}, {"src": "media/2024-qr4-04.jpg", "section": "location", "caption": "The blue-lit room at Hang Time where the slackline is.", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2024, "qr_number": 5, "status": "confirmed", "confidence": 0.9, "clue_text": "[Image clue: a large crossword grid with scattered, out-of-order clue numbers; the answer-list header is misspelled \"ACCROSS\" in the original; 59 down has no clue text.]\n\nACCROSS\n1 Starts with a \"t\" and ends with an \"inkering\"\n5 A tire-some 365 days\n8 F off off\n11 That point in a conversation or relationship where you wonder why it didn't end ten minutes ago\n13 A place with grass, and sometimes benches. I guess sometimes no grass too.\n14 I said so\n16 Where it begins\n17 A person you used to think was \"the one\"----but now the instagram algorithm tells you is a narcissist\n20 Wasn't on your shirt until after you just ate lunch\n21 To discover something you were looking for\n24 Blood and strawberries\n25 Spike from Tom & Jerry\n28 Game: murdered with a candlestick in the library\n29a Treasure synonym. Starts with a B\n30 \"Sweet dreams are ____ this.\" (2 words)\n33 Baldwin who did voice work in Thomas the Tank Engine\n34 What you did after you told yourself you'd only have one bite, then suddenly the whole carton was empty\n35 Has only 3 vowels and is entirely written in cursive\n37 \"I really really really wanna ___-a-zig ah\"\n38 What you do to time when you're stuck in a meeting that could've been an email.\n40 In a realm where shadows linger I dwell. I'm a measure of life where sickness may swell. What am I?\n43 The Hitchhikers Guide to the Galaxy recommends a towel for this type of travel\n47 \"With Or ___ You.\" U2\n48 The only reason you pretend to like celery sticks on game day or at parties\n50 Thomas Harvey stole his brain\n56 When this Jason sings, he weirdly makes even the sunniest day seem a bit too optimistic\n57 What one does to the first letter of every bad decision in a text message\n58 \"___ for You\" Olivia Rodrigo\n60 They never say die\n65 How the first clue to this hunt was released on Instagram\n66 made popular by gen z in the game Among Us\n67 Some Russian guy somewhere is upset this is what everyone calls a video blog\n68 Tim Curry made the best clown\n70 What you need when you're famous and do something dumb\n72 You do this with the check engine light\n73 Excruciating\n\nDOWN\n2 May the force be ___ you\n3 They stop the way or stack for play\n4 He's got a lot of ground to cover, literally and musically\n6 The small setting for every Hallmark Christmas movie\n7 What you dreaded being picked in gym class\n9 Who can make my day seem bright? ___ you\n10 Drummer muppet\n12 It has its own bell\n15 ____ end of the world, and I feel fine (2 words)\n18 Whose Dallas Mavericks are they? Well 27% of them are his anyway\n19 Always Ignored in indexing and alphabetizing. You may not know this if you never used a card\n22 The way you'll die if you aren't kind to others\n23 What your clothes could be if you actually stuck to that diet\n26 A place you can dive for food, drugs, antiques, or to discover if your neighbor is a serial killer\n27 Intensely painful\n29d Seasoned Treasure Hunters may mistakenly see one of these as a llama\n31 Longing loving eye contact with Medusa\n32 Quick pick up game of soccer in England\n36 Jackson who played both pro football and baseball, and was the best in Tecmo Bowl\n39 No tengo cerebro, pero soy amigo de uno. A la gente le gusta golpearme obstinadamente contra cosas como las pistas dificiles de una búsqueda del tesoro. Respuesta en Inglés\n41 Home to the Outlets at Traverse Mountain where they backed out of letting us do our escape room last minute\n42 Joe: A Real American Hero\n44 A teenagers worst enemy in the mirror\n45 One who burps\n46 If you don't hum the Top Gun Anthem when you see one of these you're missing out. It's awesome\n49 There is no try\n51 A secret or disguised way of writing. I mean, unless you're a seasoned Treasure Hunter then its not very secret, is it?\n52 What you get to do with the chest if you win this whole thing\n53 Song by Bruno Mars most played on socials during a hunt\n54 Love of money is the root\n55 He has 12 movies and never runs on a Friday while chasing his victims\n59 (no clue text)\n61 The way the hose gets when the water is on and no water is coming out and your mind is out of the gutter\n62 Devises that discover the metal treasure in your yard, or at least, rust.\n63 The age Jennifer Grey was when she played a 17yr old that nobody put's in a corner. If your source gives you an age that doesnt fit, add 1.\n64 John Maxim and David Cline's relationship\n69 A fake one with gray and beige that colorblind people think the rest of you made up to make fun of them\n71 Orange veggie\n74 The way you'll have to go with every obstacle when going on a bear hunt\n75 Carrot\n\nBONUS\n76 down: This was an error we didn't notice until right before you guys got to this clue and is therefore unimportant, not part of the puzzle, and should be ignored, but for good measure its the abbreviation for \"lieutenant\"", "plaque_question": "What is the nearest restaurant to the dumpster?", "plaque_answer": "Harajuku (Harajuku Grill & Sushi)", "location_name": "Big red Bulldog dumpster in the field behind Harajuku Grill & Sushi, Harrisville (north Ogden area)", "location_detail": "539 N Harrisville Rd, Harrisville, UT 84404. Approximate coordinates 41.2682953, -111.9768871 (A hunter). The dumpster stands alone in the vacant, weedy field north of/behind the restaurant and is reached by a small dirt road. It has an unlocked side door, so no ladder is needed. The QR is inside on the back wall opposite the door, on the side nearest the dirt road. Tall grass and weeds make it hard to see, especially in the dark. Solve route: start on the G of BULLDOG over Ogden's Liberty Park, then go 6 squares/blocks left and 25 up to the X.", "solve_path": "1) The clue is one crossword image, about 28x30, with 75 entries numbered in shuffled order. The header is misspelled \"ACCROSS\", 59 down has no clue text, and a BONUS line says 76 down (\"lt\") is an error to ignore. The image was an inline base64 data URI with no file name, and steganography checks (Aperi Solve) found nothing. John confirmed \"ACCROSS\" is a typo, and his Instagram story said QR5 has misspellings but none are intentional or part of the clue. Many entries are reciprocal pairs (73A 'Excruciating' <-> 27D 'Intensely painful'; 71D 'Orange veggie' <-> 75D 'Carrot'), which suggests the clue numbers carry the message.\n2) Fill the grid. Answers in clue-number order: 1 TINKERING, 2 WITH, 3 BLOCKS, 4 MILES, 5 GOODYEAR, 6 TOWN, 7 LAST, 8 OF ('F off off' = 'off' with the F removed), 9 ONLY, 10 ANIMAL, 11 OVER, 12 LIBERTY, 13 PARK, 14 BECAUSE, 15 IT'S THE, 16 START, 17 EX, 18 MARKS, 19 THE, 20 SPOT, 21 FIND, 22 ALONE, 23 BIG, 24 RED, 25 BULLDOG, 26 DUMPSTER, 27 EXCRUCIATING, 28 CLUE, 29A BOUNTY (not 'booty', which is too short) / 29D BEAR, 30 MADE OF, 31 STONE, 32 FOOTY, 33 ALEC, 34 ATE, 35 ARABIC, 36 BO, 37 ZIG, 38 KILL, 39 SKULL, 40 MORBIDITY, 41 LEHI, 42 GI, 43 INTERGALACTIC (not 'interstellar'), 44 ACNE, 45 BELCHER, 46 AIRPLANE, 47 WITHOUT, 48 WINGS, 49 DO, 50 EINSTEIN, 51 CIPHER, 52 KEEP, 53 TREASURE, 54 EVIL, 55 JASON, 56 MRAZ, 57 CAPITALIZES, 58 ENOUGH, 59 FIFTY-NINE (blank clue, so the answer is its own number), 60 GOONIES, 61 KINKY, 62 DETECTORS, 63 TWENTY-SEVEN, 64 BROMANCE, 65 REEL, 66 SUS, 67 VLOG, 68 IT, 69 GREIGE, 70 PR, 71 CARROT, 72 IGNORE, 73 INTENSELY PAINFUL, 74 THROUGH, 75 ORANGE VEGGIE, 76 LT.\n3) Answers 72-75 read 'Ignore intensely painful through orange veggie'. That means ignore everything from EXCRUCIATING (27) through CARROT (71). Many of the ignored answers are in-jokes about the organizers or the hunt (BROMANCE, REEL, LEHI). That leaves answers 1-26: 'Tinkering with blocks / Miles Goodyear town / last of only animal over Liberty Park because it's the start / Ex marks the spot / find alone (a lone) big red bulldog dumpster'.\n4) 'Tinkering with blocks' = treat the crossword squares as city blocks. The official hint said: 'What if each block on the puzzle represented a city block?'\n5) 'Miles Goodyear town' = Ogden. Miles Goodyear built Fort Buenaventura there.\n6) 'Last of only animal' = the G at the end of BULLDOG. Once the ignored span is removed (which drops BEAR, 29D), BULLDOG is the only animal left in the grid.\n7) 'Over Liberty Park because it's the start' = place BULLDOG's G square over Ogden's Liberty Park (not the one in Salt Lake City) as the starting point.\n8) 'Ex marks the spot' = the X square in the grid. A hunter counted squares instead of overlaying: from the G, go 6 squares left and 25 up, one square per city block. Others overlaid a transparent copy of the crossword on Google Maps or Google Earth, and many had trouble with scaling. A hunter scaled the grid by stretching it to the height of the park. A hunter called it 'a simple overlay' after being '50 spreadsheets deep' and made a recreation (IMG_2681) that shows BULLDOG along the bottom edge near 20th St and 'E X' at the top edge beside Harajuku Grill & Sushi.\n9) 'Find a lone big red bulldog dumpster': Bulldog is a dumpster brand/sponsor whose roll-off bins are red. The plaque was on a big red Bulldog dumpster standing alone in a weedy field behind Harajuku Grill & Sushi, 539 N Harrisville Rd, Harrisville. The QR was inside the unlocked dumpster, on the back wall opposite the side door. Plaque question: nearest restaurant to the dumpster. Answer: Harajuku. A hunter found the plaque on the evening of 2024-10-16, and members said another Discord had leaked the solve in a voice chat with 100+ people.", "techniques": ["crossword", "number-code", "decoy-text-to-ignore", "hidden-message", "wordplay", "city-blocks", "grid-counting", "map-overlay", "local-history", "sponsor-reference", "organizer-references", "coordinates"], "red_herrings": ["Lehi + GI (answers 41-42) read as Granite Peaks Gastroenterology on Club House Dr by Thanksgiving Point, Lehi. Its dumpster is a brown ACE bin behind red gates, and both answers fall in the ignored span.", "Mining the ignored filler answers (an 'Einstein cipher', 'footy Alec ate Arabic Bo zig', 59/27 read as the address 5900 S 2700 W, bear = 29 and ate = 34 as numbers).", "Wrong grid guesses: INTERSTELLAR (43A), BOOTY (29A), 'pinky' (39D), 'Jiffy Time'/'Jiffy Size' (59D).", "Liberty Park in Salt Lake City (Tracy Aviary, Guam kingfisher, eagle fountain statue, Hogle Zoo): searched, nothing. The clue means Ogden's Liberty Park.", "Kingfisher Wetland Trail Loop / Fort Buenaventura / Miles Goodyear Park / disc golf area, Ogden: walked at night and by day, split up at every X on the map, nothing found. The fort was crowded with other hunters.", "A line from Fort Buenaventura to SLC's Liberty Park, an X at 40.92288, -111.91913, and lines among Tinker Toys (Rock Canyon, Provo), the fort, Liberty Park and 'the Y': no usable crossing.", "Ogden street-grid/president-streets theory: a hunter's X on Washington Blvd near Five Guys (blue dumpster) and the green-waste/glass drop-off at Monroe Blvd / 800 E (blue bin, city property).", "'Building 40' (building + fort + Y = forty) with eagle = animal over liberty: 40 Eaglegate Dr, Eagle Gate apt #40 in SLC, Eagles clubs, Eagle Mountain/Eagle Lake golf, BYU building 40 (doesn't exist), and 40 N / 40 S Freedom Blvd in Provo by Bulldog Stadium (only Waste Management/Ace dumpsters).", "Latitude-line theories: 40 29 34 N through Thanksgiving Point/Cornbelly's (no red dumpster) and 40.8 N / dEXter St (industrial parks, nothing).", "Ogden FrontRunner station, railroad-crossing X's, Coleman Knitting Mills, Lindquist Field/Raptors, Ogden Trolley overlay, Red Apple Financial ('find a loan'), Origin Alley, the Peery's Egyptian/'Ogden Theater' reading, Cinema 502 escape-room idea: none produced the plaque.", "Miles Goodyear Cabin grounds (a red dumpster and junk, nothing inside), Wonderful World of Trains, Bricks & Minifigs/40th St path, FedEx sites in Eagle Mountain and Orem.", "'Tinkering with blocks' as Roblox (a private/zero-visit LEGO game), Tinker Toys climbing area, Lincoln Logs/Lincoln Ave, Legos, Ogden's Christmas village. The intended meaning was crossword squares = city blocks.", "Hidden file or steganography in the clue image: it was just base64 image data.", "Four-city X (Ogden, Provo, Eagle Mountain, Park City) pointing about 6k ft up Dry Creek Trail. Lines between a hunter's 'forts' crossing in Millcreek. A candidate spot that was 'just a bunch of houses'.", "Old Ephraim the bear / the town of Ephraim (out of bounds). Driving past John's flip properties. Thinking the target might be a bulldog picture."], "hints": ["This crossword challenge is one of our all-time favorites. What if each block on the puzzle represented a city block?", "John's Instagram story (shared by a hunter): 'Everyone knows he's colorblind... but they didn't know he can't spell. There are no intentional misspellings in QR 5... but there are misspellings, It's not part of the clue.'"], "open_questions": ["One record (from #qr-8-part-1, the official hint email) gives the plaque answer as '[Image of a Duck]'. The Google Doc lists '[Image of a Duck]' as the first team, and the plaque answer as Harajuku. The duck is probably the first-finding team's name/avatar, but this is unresolved.", "City: the address is 539 N Harrisville Rd, Harrisville, but other records just say 'Ogden'. A hunter's overlay image puts 'E X' near N 400 E / Wall Ave by Petco Grooming, central Ogden, next to Harajuku. These descriptions of the area don't fully agree.", "Which X square marks the spot: the Google Doc says 'look under EX' (17A), while the 10-16 record says the X in EXCRUCIATING. Both may be the same shared square, but that wasn't checked.", "Scaling: the official method is one square = one city block (6 left, 25 up). A hunter instead stretched the grid to the height of the park. Whether that gives the same spot isn't stated.", "Who scanned first: a hunter found it on the evening of 2024-10-16 with other hunters present, and the solve was reportedly leaked earlier in another Discord. The first team per the doc is '[Image of a Duck]'. The exact first-scan time isn't recorded, and neither is whether the prize dropped to $2K (A hunter asked).", "The plaque question wording ('What is the nearest restaurant to the dumpster?') comes only from the Google Doc. A hunter just said the answer was the restaurant.", "BONUS line spelling: one transcription has 'abbreviation', another 'abreviation' (John said there are unintentional misspellings). Line 19D may be cut off in one image.", "Whether this crossword was originally written for QR3 or as a late replacement for the cancelled Traverse Mountain escape room is speculation (hunters)."], "coords": [41.2682953, -111.9768871], "n_sources": 554, "steps": [{"t": "step", "n": "1", "clue": [], "label": null, "lead": "The clue is one crossword image, about 28x30, with 75 entries numbered in shuffled order.", "text": "The header is misspelled \"ACCROSS\", 59 down has no clue text, and a BONUS line says 76 down (\"lt\") is an error to ignore. The image was an inline base64 data URI with no file name, and steganography checks (Aperi Solve) found nothing. John confirmed \"ACCROSS\" is a typo, and his Instagram story said QR5 has misspellings but none are intentional or part of the clue. Many entries are reciprocal pairs (73A 'Excruciating' <-> 27D 'Intensely painful'; 71D 'Orange veggie' <-> 75D 'Carrot'), which suggests the clue numbers carry the message.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": null, "lead": "Fill the grid.", "text": "Answers in clue-number order: 1 TINKERING, 2 WITH, 3 BLOCKS, 4 MILES, 5 GOODYEAR, 6 TOWN, 7 LAST, 8 OF ('F off off' = 'off' with the F removed), 9 ONLY, 10 ANIMAL, 11 OVER, 12 LIBERTY, 13 PARK, 14 BECAUSE, 15 IT'S THE, 16 START, 17 EX, 18 MARKS, 19 THE, 20 SPOT, 21 FIND, 22 ALONE, 23 BIG, 24 RED, 25 BULLDOG, 26 DUMPSTER, 27 EXCRUCIATING, 28 CLUE, 29A BOUNTY (not 'booty', which is too short) / 29D BEAR, 30 MADE OF, 31 STONE, 32 FOOTY, 33 ALEC, 34 ATE, 35 ARABIC, 36 BO, 37 ZIG, 38 KILL, 39 SKULL, 40 MORBIDITY, 41 LEHI, 42 GI, 43 INTERGALACTIC (not 'interstellar'), 44 ACNE, 45 BELCHER, 46 AIRPLANE, 47 WITHOUT, 48 WINGS, 49 DO, 50 EINSTEIN, 51 CIPHER, 52 KEEP, 53 TREASURE, 54 EVIL, 55 JASON, 56 MRAZ, 57 CAPITALIZES, 58 ENOUGH, 59 FIFTY-NINE (blank clue, so the answer is its own number), 60 GOONIES, 61 KINKY, 62 DETECTORS, 63 TWENTY-SEVEN, 64 BROMANCE, 65 REEL, 66 SUS, 67 VLOG, 68 IT, 69 GREIGE, 70 PR, 71 CARROT, 72 IGNORE, 73 INTENSELY PAINFUL, 74 THROUGH, 75 ORANGE VEGGIE, 76 LT.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": null, "lead": "Answers 72-75 read 'Ignore intensely painful through orange veggie'.", "text": "That means ignore everything from EXCRUCIATING (27) through CARROT (71). Many of the ignored answers are in-jokes about the organizers or the hunt (BROMANCE, REEL, LEHI). That leaves answers 1-26: 'Tinkering with blocks / Miles Goodyear town / last of only animal over Liberty Park because it's the start / Ex marks the spot / find alone (a lone) big red bulldog dumpster'.", "bullets": []}, {"t": "step", "n": "4", "clue": ["Tinkering with blocks"], "label": null, "lead": "Treat the crossword squares as city blocks.", "text": "The official hint said: 'What if each block on the puzzle represented a city block?'", "bullets": []}, {"t": "step", "n": "5", "clue": ["Miles Goodyear town"], "label": null, "lead": "Ogden.", "text": "Miles Goodyear built Fort Buenaventura there.", "bullets": []}, {"t": "step", "n": "6", "clue": ["Last of only animal"], "label": null, "lead": "The G at the end of BULLDOG.", "text": "Once the ignored span is removed (which drops BEAR, 29D), BULLDOG is the only animal left in the grid.", "bullets": []}, {"t": "step", "n": "7", "clue": ["Over Liberty Park because it's the start"], "label": null, "lead": null, "text": "Place BULLDOG's G square over Ogden's Liberty Park (not the one in Salt Lake City) as the starting point.", "bullets": []}, {"t": "step", "n": "8", "clue": ["Ex marks the spot"], "label": null, "lead": "The X square in the grid.", "text": "A hunter counted squares instead of overlaying: from the G, go 6 squares left and 25 up, one square per city block. Others overlaid a transparent copy of the crossword on Google Maps or Google Earth, and many had trouble with scaling. A hunter scaled the grid by stretching it to the height of the park. A hunter called it 'a simple overlay' after being '50 spreadsheets deep' and made a recreation (IMG_2681) that shows BULLDOG along the bottom edge near 20th St and 'E X' at the top edge beside Harajuku Grill & Sushi.", "bullets": []}, {"t": "step", "n": "9", "clue": ["Find a lone big red bulldog dumpster"], "label": null, "lead": "Bulldog is a dumpster brand/sponsor whose roll-off bins are red.", "text": "The plaque was on a big red Bulldog dumpster standing alone in a weedy field behind Harajuku Grill & Sushi, 539 N Harrisville Rd, Harrisville. The QR was inside the unlocked dumpster, on the back wall opposite the side door. Plaque question: nearest restaurant to the dumpster. Answer: Harajuku. A hunter found the plaque on the evening of 2024-10-16, and members said another Discord had leaked the solve in a voice chat with 100+ people.", "bullets": []}], "title": "Crossword with hidden instructions", "media": [{"src": "media/2024-qr5-01.jpg", "section": "clue", "caption": "The crossword clue.", "kind": "image"}, {"src": "media/2024-qr5-02.jpg", "section": "solve", "caption": "A solved overlay of the answers, with BULLDOG along the bottom and the X near the top (steps 3 to 8).", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2024, "qr_number": 6, "status": "confirmed", "confidence": 0.92, "clue_text": "Congratulations on successfully completing the Murder at King's Corner Challenge. To find the next QR code, you only need two words. \"About-Rhenium.\"", "plaque_question": "What city are you in?", "plaque_answer": "Draper", "location_name": "Old railway tracks by the railway bridge over 1300 East at Highland Drive, Draper (off the Porter Rockwell Trail)", "location_detail": "Draper, UT. Finder's coords are 40.503116, -111.853641 (alt pin 40°30'11.3\"N 111°51'13.1\"W), confirmed as exact in chat. The plaque is on the old railway tracks about 100 paces southwest of the end of the bridge where the railway crosses 1300 E, next to the 1300 E / Highland Dr intersection. It is fixed to a railroad tie, at ground level, partly hidden under a bush. It is a short walk from a parking lot and not stroller-friendly. Earlier stages: Salt Lake County Animal Services, 511 W 3900 S, Salt Lake City, UT 84123 (Suba Bleu card on the adoption cork board), and the online games.", "solve_path": "QR6 had three stages.\n\nStage 6a, browser shooter: the 'QRSlayer' game by PaceS on itch.io (https://paces.itch.io/jump?secret=cRrDrFM1MAHSsGym8c1N1t3c1Q) is a wave-survival shooter. Past games are also in the UTH website arcade. Beating wave 12 reveals the next location. Tips players shared:\n- Hold the mouse button instead of clicking.\n- Run circles around the edge of the map. Surviving the timer matters more than kills.\n- Pick up health between waves.\n- Wait in the corners so enemies bunch up, then fire toward the middle.\n- One player survived by getting stuck in a wall glitch on the left side.\n\nStage 6b, Salt Lake County Animal Services (511 W 3900 S, SLC): the location posted after the shooter. John said in an Instagram story that the QR plaque is not at the shelter, so don't camp out there. On 2024-10-17, starting around 10:00, Dave and John let people in 10 at a time. On the shelter's adoptable-dog cork board was a 'For Adoption' card for 'Suba Bleu' (Mark Miller Subaru, $5,000 starburst) with a small QR note taped to it. A hunter's doc calls it an unofficial QR. It linked to the 360° virtual-tour game 'Murder at King's Corner: The Wimmer Case' (https://seamlessstudios360.com/ClientTours/MurderAtKingsCorner/index.htm). In the game, players collect evidence by solving ciphers and finding items in the rooms of the 601 (Wimmer) house, then fill in a logic grid. To make the accusation, go outside, click the '601' on the roof above the porch, then click 'review the evidence'. Wrong guesses return '-SCORE- You need to revisit the evidence' and guesses are unlimited. A hunter got it by brute force. The accepted accusation was: Charles / ...urry / Star Wars / salad / paddle / 10-11 / flask. One record also lists the letter sequence C B G E C F A. Side solve: the 'mwoet' cipher is a columnar transposition with key ABCDEFG, reading 'Mr West Went Into The Basement Between Eight PM and Nine PM'. The success screen gives the clue above.\n\nStage 6c, 'About-Rhenium':\n- The 10-18 hint email said the two words have nothing to do with the numbers at the bottom of the About page.\n- On 2024-10-22, an Instagram story (the.cline.fam / @onthejohn) said the information is on the About page of utahtreasurehunts.com, but not in those numbers.\n- 'About' = the About page, which has an embedded 'Utah Treasure Hunts About Us' YouTube video.\n- 'Rhenium' = element 75, so go 75 seconds (1:15) into that video.\n- At that point Dave and John stand by old railroad tracks next to concrete barriers or a wall, with a half-covered mountain horizon behind them. Dave points and says '100 paces that way'.\n- a hunter identified the spot as the old train tracks in Draper off the Porter Rockwell Trail, at the railway bridge over 1300 E by Highland Dr.\n- From the bridge, walk along the tracks about 100 paces southwest/west. The plaque is fixed to a railroad tie at ground level, partly under brush, and very hard to see. A hunter was 'basically standing on it' before someone pointed it out.\n- This is the reused 2021 Junior Hunt spot. That hunt's Harry Potter book cipher read 'Drive wanted thirteen E and Highland Drive, from the bridge walk one hundred steps west along the old railway tracks'.\n\nPlaque question: 'What city are you in?' Answer: Draper. First team: Bencati.", "techniques": ["video-game", "online-game", "multi-stage", "sponsor-reference", "logic-grid", "brute-force", "cipher", "book-cipher", "vigenere", "wordplay", "periodic-table", "atomic-number", "video-timestamp", "landmark-photo", "paces", "reused-location", "local-history", "number-code", "coordinates", "url-guessing", "website-source", "anagram", "morse-code"], "red_herrings": ["Camping at the animal shelter overnight: John said the QR is not at the shelter; the first teams, who arrived around 4 pm, were turned away.", "Going ahead to Mark Miller Subaru or the Suba Bleu blue-dog hunt map locations: guessed as a crossover. Other guesses were that the blue dogs would be needed in later selfies or that a selfie would be checked at the shelter. None of this was used in the solve.", "Murder game: 'a-a-a-a-a-a-a' as the accusation was wrong. 'Rifle left at 11' looked like a contradiction but meant the rifle person left the house at 11. Mr. A hunter can't be the BTTF fan because Bertha likes BTTF. A hunter's 'Professor Plum in the Library with the Rope' was a joke.", "Murder-game ciphers still unsolved when the accusation was accepted: the house reward cipher 'Xmdflr'o uqmp zo wz flv pinxi...', and 'Quintet 1979: Somewhere the game has begun'. 'The house is the key' and 610 vs 601 were raised as keys.", "Numbers at the bottom of the About page (100 50 25 12 6 3 2 1): tried as halving and as rhenium's half-life, mapped to elements (Fm Sn Mn Mg C Li He H) with weight arithmetic, and summed/subtracted down to 1 = hydrogen. Official hints said they are unrelated.", "Kennecott/Bingham Canyon visitor center (rhenium is a copper/molybdenum byproduct): closed and gated on one visit; on another, staff knew nothing. A hunter found nothing at the trailhead sign south of it. Copperton Park: nothing found. Staff's 'Geneva Rocks' remark was offhand.", "Coordinates 41.2, -112.0 (half-life 4.12 -> 41.2; 187-75 = 112) leading to Skydive Ogden: searched at night, nothing found, and staff said they were not involved.", "601 E 300 S minus 75 = 526 E 300 S (Junior League of SLC): a hunter checked and found nothing.", "T-rHen = train = Trolley Square, and 75/2 = 37 = Rubidium = deep red = trolley: a hunter meant these as jokes. A hunter checked Trolley Square anyway and nothing stood out.", "URL guesses: 'about-rhenium' appended to utahtreasurehunts.com, sponsor sites and the murder-gam
