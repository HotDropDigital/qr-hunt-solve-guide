e URL; /abbout-rhennium (based on the 'abbandoned' misspelling); /electrons; /xe4f145d56s2; the reversed text. Nothing worked. Sponsor About pages also turned up nothing.", "Electron configuration Xe 4f14 5d5 6s2 as a cipher or URL; 'About minus Rhenium' by letter-number subtraction (gave negatives); a Caesar shift of FmSnMnMgCLiHeH: no result.", "Anagrams of ABOUTRHENIUM (Bruno Mathieu, harmonium tube, an 8+4 split); Latin re / Rhine = 'near a river'; ABBA 1975; Mark Miller Subaru's 1975 history page; rhenium in dentistry; uranium-238's 7 decays matching the 7 answers: raised but not used in the solve.", "Morse code reading of 'About-Rhenium' (gave 'putt Utah...' with no complete message); Morse in the kitchen song or moon-landing audio; names of the dogs on the shelter cork board.", "Man's image in the game source, reverse-searched to manorpa.com: a stock/template image.", "Hill Aerospace Museum: closed; the museum said on Reddit it wasn't involved.", "Weir Minerals, 3459 S 700 W, West Valley (700 linked to 'about').", "Instagram post #75 instead of 75 seconds into the video.", "Frostbox Rentals pixel/dot cipher (overlays, Morse, Galactic Alphabet, QR quadrants): organizers said it's for a future challenge, not QR6.", "Aperisolve 'common password: rhenium' on the Dave & John photo, which led to Mueller Park / Heughs Canyon guesses: it's a log of other users' inputs, and John said 'That is not real'.", "Murder-house easter eggs (orange-text meme link, @onTheJohn toilet link, moon-landing poster, BTTF poster dates, gas can, John's story timer 17:36, p.Lead CSS class): not connected to the solve.", "A Riverton address that a hunter thought looked more promising than the tracks: wrong.", "Assuming the 2021 Junior Hunt spot couldn't be reused: the organizers had replaced the old code on day one."], "hints": ["Hint for QR #6 (email, 2024-10-18 ~18:03): \"Anybody else get stuck in the Serpent Realm? To complete this part you need to find a corpse (Someone you may recognize) From this spot, look between the windows and move the cursor until you see the hand point. From there the rest of the spots are where you think they should be. When you get into the room with the corpse, click anywhere on the panel on the left side. If you've completed the King's Corner challenge, the two words don't have anything to do with the numbers at the bottom of the About page on our website. Depending on how quickly someone solves this one, us or a sponsor will probably release a clue on their socials in the next few days.\"", "Instagram (the.cline.fam / @onthejohn, 2024-10-22): \"The information you need to locate QR6 is on the About Page of our website but has nothing to do with the numbers at the bottom.\"", "Instagram PSA: \"The post by @frostboxrentals last night is part of a future challenge and has nothing to do with finding QR6. That clue is here -->\"", "John Maxim Instagram story (IMG_1879): 'Careful out there, empty dumpsters can be really slippery when wet.' / 'I know plucky just gave you the qr because they hate fun, but you'll still need a selfy, and maybe sooner than you think.' / 'Also, the correct answer for (3 letters) Always ignored in indexing and alphabetizing... \"the\". I should know, I'm a bulldog.'", "John's video: the QR code is not at the shelter, so don't camp out there.", "John (onthejohn) by DM: \"figuring out what it's referring to will move you to the next thing\".", "Mark Miller Subaru story: 'Could there be a crossover???' about the Suba Bleu blue dog hunt; Subaru said to pick up a blue dog at either of its locations (IMG_1888).", "Murder-game gloves clue: 'Pro tip: you usually need keys to open locked doors. Bonus insight: some doors are better left closed.'", "Instagram post from sponsor the.healing.connections showing a map rectangle from North Ogden to Provo, labeled 'This is an official 2024 QR hunt clue' (read as whole-hunt boundaries)."], "open_questions": ["Distance from the bridge differs between sources: '100 paces southwest' (A hunter doc), 'about 100 ft west' (finder chat), 'about 75 yards from the bridge' (A hunter). The video says '100 paces that way'.", "Coordinates differ: finder's 40.503116, -111.853641 (confirmed exact in chat) vs a hunter's earlier guess 40.50354927539355, -111.85303372488387 ('Is that the bridge?').", "Clue punctuation: most sources quote \"About-Rhenium.\" but one quotes \"About. Rhenium.\" a hunter's doc calls it a final image clue.", "One record (from #qr-8-part-1) listed 'Bencati' as the QR6 plaque answer from the hint-email answer list. A hunter's doc names Bencati as the first team to find it and gives the plaque answer as 'Draper' (Q: What city are you in?). It's unclear whether the hint-email list shows answers or finders.", "The 3-letter answer 'THE' from John's bulldog hint: the sources don't say which question it answered.", "Whether the shelter's Suba Bleu card QR was the official route to the murder game: a hunter's doc calls it unofficial, and one chat says teams 'received a link' when admitted. Earlier selfie steps (dumpster selfie, El Mexsal restaurant selfie) are mentioned, but their role isn't explained.", "The plaintext of the 'house is the key' Vigenère cipher and the 'Quintet 1979' clue were never posted.", "Last name in the accusation is quoted only as '...urry'/'urry'; the full name isn't given. One record adds a letter sequence C B G E C F A without explaining it."], "coords": [40.503116, -111.853641], "n_sources": 200, "steps": [{"t": "p", "label": null, "text": "QR6 had three stages."}, {"t": "step", "n": "6a", "clue": [], "label": "Browser shooter", "lead": null, "text": "The 'QRSlayer' game by PaceS on itch.io (https://paces.itch.io/jump?secret=cRrDrFM1MAHSsGym8c1N1t3c1Q) is a wave-survival shooter. Past games are also in the UTH website arcade. Beating wave 12 reveals the next location. Tips players shared:", "bullets": ["Hold the mouse button instead of clicking.", "Run circles around the edge of the map. Surviving the timer matters more than kills.", "Pick up health between waves.", "Wait in the corners so enemies bunch up, then fire toward the middle.", "One player survived by getting stuck in a wall glitch on the left side."]}, {"t": "step", "n": "6b", "clue": [], "label": "Salt Lake County Animal Services (511 W 3900 S, SLC)", "lead": null, "text": "The location posted after the shooter. John said in an Instagram story that the QR plaque is not at the shelter, so don't camp out there. On 2024-10-17, starting around 10:00, Dave and John let people in 10 at a time. On the shelter's adoptable-dog cork board was a 'For Adoption' card for 'Suba Bleu' (Mark Miller Subaru, $5,000 starburst) with a small QR note taped to it. A hunter's doc calls it an unofficial QR. It linked to the 360° virtual-tour game 'Murder at King's Corner: The Wimmer Case' (https://seamlessstudios360.com/ClientTours/MurderAtKingsCorner/index.htm). In the game, players collect evidence by solving ciphers and finding items in the rooms of the 601 (Wimmer) house, then fill in a logic grid. To make the accusation, go outside, click the '601' on the roof above the porch, then click 'review the evidence'. Wrong guesses return '-SCORE- You need to revisit the evidence' and guesses are unlimited. A hunter got it by brute force. The accepted accusation was: Charles / ...urry / Star Wars / salad / paddle / 10-11 / flask. One record also lists the letter sequence C B G E C F A. Side solve: the 'mwoet' cipher is a columnar transposition with key ABCDEFG, reading 'Mr West Went Into The Basement Between Eight PM and Nine PM'. The success screen gives the clue above.", "bullets": []}, {"t": "step", "n": "6c", "clue": ["About-Rhenium"], "label": null, "lead": null, "text": "", "bullets": ["The 10-18 hint email said the two words have nothing to do with the numbers at the bottom of the About page.", "On 2024-10-22, an Instagram story (the.cline.fam / @onthejohn) said the information is on the About page of utahtreasurehunts.com, but not in those numbers.", "'About' = the About page, which has an embedded 'Utah Treasure Hunts About Us' YouTube video.", "'Rhenium' = element 75, so go 75 seconds (1:15) into that video.", "At that point Dave and John stand by old railroad tracks next to concrete barriers or a wall, with a half-covered mountain horizon behind them. Dave points and says '100 paces that way'.", "A hunter identified the spot as the old train tracks in Draper off the Porter Rockwell Trail, at the railway bridge over 1300 E by Highland Dr.", "From the bridge, walk along the tracks about 100 paces southwest/west. The plaque is fixed to a railroad tie at ground level, partly under brush, and very hard to see. A hunter was 'basically standing on it' before someone pointed it out.", "This is the reused 2021 Junior Hunt spot. That hunt's Harry Potter book cipher read 'Drive wanted thirteen E and Highland Drive, from the bridge walk one hundred steps west along the old railway tracks'."]}, {"t": "p", "label": "Plaque question", "text": "'What city are you in?' Answer: Draper. First team: Bencati."}], "title": "Shooter game, murder mystery and a two-word clue", "media": [{"src": "media/2024-qr6-01.jpg", "section": "solve", "caption": "The success screen of the Murder at King's Corner game, which gives the 'About-Rhenium' clue (stage 6b).", "kind": "image"}, {"src": "media/2024-qr6-02.jpg", "section": "solve", "caption": "One of the cipher screens inside the murder game (stage 6b).", "kind": "image"}, {"src": "media/2024-qr6-03.jpg", "section": "hint", "caption": "Organizers' Instagram story, Oct 22: the answer is on the About page, not in its numbers.", "kind": "image"}, {"src": "media/2024-qr6-04.jpg", "section": "hint", "caption": "Organizers' PSA: the Frost Box post is for a future challenge, not QR6.", "kind": "image"}], "links": [{"url": "https://www.youtube.com/watch?v=R7rDr3jbE3M&t=75s", "label": "Utah Treasure Hunts About Us video, at 75 seconds (stage 6c)"}, {"url": "https://paces.itch.io/jump?secret=cRrDrFM1MAHSsGym8c1N1t3c1Q", "label": "QRSlayer, the browser shooter (stage 6a)"}, {"url": "https://seamlessstudios360.com/ClientTours/MurderAtKingsCorner/index.htm", "label": "Murder at King's Corner, the 360° tour game (stage 6b)"}], "wl": [{"match": "'Utah Treasure Hunts About Us' YouTube video", "url": "https://www.youtube.com/watch?v=R7rDr3jbE3M"}, {"match": "75 seconds (1:15)", "url": "https://www.youtube.com/watch?v=R7rDr3jbE3M&t=75s"}]}, {"hunt_year": 2024, "qr_number": 7, "status": "confirmed", "confidence": 0.9, "clue_text": "To find the next QR code, you only need two words. \"About-Rhenium.\"", "plaque_question": "What was the door code to enter the escape room?", "plaque_answer": "203467", "location_name": "Escape room in a shop at Trolley Square, Salt Lake City", "location_detail": "Trolley Square, Salt Lake City, south side on E 600 S near 600 E. Street level, under or just west of the sky bridge, near Weller Book Works (A hunter's map). Go in the south doors, turn left and go down a couple of stairs, where the old mail place was. Door descriptions: a red-framed wood-panel door with windows and a compass logo (chat); an out-of-the-way shop with the Utah Treasure Hunt logo on the door (A hunter's doc). Clue cards are taped to the door's window panes. Entry keypad code 203467. Three rooms. The QR is in the safe (code 52783) in the third room, past the crawl-through cupboard. There is a whiteboard for finder signatures. Trolley Square hours: 10-8 daily, 12-5 Sunday.", "solve_path": "0) Clue: QR6's success screen said: To find the next QR code, you only need two words. \"About-Rhenium.\" Rhenium is element Re (no. 75). Ideas raised in chat: adding 'about-rhenium' to the hunt URL, which returned 'invalid or locked clue', and the fact that Bingham Canyon mine produces rhenium. No record explains how these two words lead to the next step. 1) Roblox stage: the next step was a Roblox obby, 'Treasure-Hunt' (https://www.roblox.com/games/9222077337/Treasure-Hunt; speedrun at https://www.youtube.com/watch?v=jsfYbvE2FlQ). It has spam-jump walls, swinging platforms and discs, a slack line, rings, iceboxes, a pink-and-white maze and a 'collaboration area' where players jump on each other's heads. Teams had to submit a Roblox selfie with the billboard at the top. Zoom out from the final area to read it: it shows the Trolley Square water tower and says 'Go here to find the escape room. Use the clues on the windows to find the door code. Good luck!' Official hint: offer a niece or nephew $20 to pass Roblox for you. 2) Location: Trolley Square, Salt Lake City. On the south side along E 600 S, under or just west of the sky bridge, go in the south doors, turn left and go down a couple of stairs. The room is where the old mail place was, the same entry door as last year. A hunter found it first. 3) Door code 203467: six laminated photo cards in the window panes each have one digit edited out and circled. Find each scene around Trolley Square to read the missing digit. Trusses = 2 (A hunter's doc says the first digit is from the phone number on the water-tower staircase sign or the website), red trolley no. 43 = 0, Cutler Mfg Co. Rochester NY patent plate (SEPT. 11TH 1883) = 3, black-and-white Utah Light & Railway trolley = 4, 'They Shaped Utah' Silvestre de Escalante = 6, UL&T Co caboose = 7. A hunter entered 203467 and got in. Tap or press the keypad screen hard to wake it. Just inside, a Blokus board spells 'SEVEN DIGIT CODE BUTNO BLOKUS'. 4) Room 1: a dartboard says 'You'll need at least one bright idea'. Shine a phone flashlight on the light sensor at its center to unlock the door. 5) Room 2: eight musician photos, each tinted red, blue, yellow or green. The 8th (Cher) appears when the heavy chain touches a metal plate in a cabinet; the official hint says to use the heavy chain. Put the names in alphabetical order (Beatles G, Beyonce R, Bono B, Cher G, Drake B, Madonna Y, Shakira R, Usher Y) and press GRBGBYRY on the four color buttons. A cupboard or crawl space opens. 6) Room 3: the computer asks 'Name our sponsor'. Its wallpaper has the Magellan HCM logo (little mountains); a hunter matched it by checking the sponsor list. The password is 'Magellan'. Black lights then show a wall drawing of the whole hunt with 'HERE 527_ _', and two lamps (one a lampshade) show 8 and 3. A hunter said a black light was available so they didn't need the computer. Safe code 52783 (press C first to clear). The QR plaque is in the safe/metal box. Finders sign the whiteboard. 7) After scanning: plaque question 'What was the door code to enter the escape room?', answer 203467. Clue 8 then says to email the hunt selfies (12 in total) to [email removed], and the final challenge comes 48 hours after the photos are submitted. First team: Bencati.", "techniques": ["wordplay", "periodic-table", "url-path", "online-game", "roblox", "billboard", "selfie", "landmark-photo", "local-history", "edited-image", "number-code", "door-code", "escape-room", "alphabetical-order", "color-code", "sponsor-reference", "black-light", "hidden-numbers", "on-site-puzzle"], "red_herrings": ["Adding 'about-rhenium' to the end of the hunt website URL returned 'invalid or locked clue' (A hunter).", "Thanksgiving Point was suggested for the billboard location; Marsh was already at Trolley Square and found it there.", "Door-code digits: a hunter read one digit as 5, then corrected it to 0. A hunter suggested the last digit was 4 and then said 'Move the 4'.", "Keypad lock seemed dead; it only needed hard presses or a few taps on the screen.", "Room 2 photo order by birth year (A hunter,) failed; the answer was alphabetical.", "A hunter's Room 2 guess 'ggybryrb'.", "Room 2: using only living artists (only Paul and Ringo of the Beatles) was tried and failed.", "Room 2: sum of birth years = 19605, pixel ideas, birth month, best-selling-artist metrics like first year active, first charted record and units sold.", "Bob Marley photo outside the room; the code used 8 photos.", "A hunter called the sponsor a 'red herring' when asked who it was.", "A hunter remembered the Room 3 safe code as 53027 or 53207; it was 52783.", "The safe was found standing open and reported broken; a hunter found someone had left it open, closed it and checked the code.", "A Roblox chat claimed teams were disqualified; John's Instagram story said 'No ones been disqualified'.", "Per a hunter's doc, the escape room held many deliberate red herrings besides the dartboard, pictures, chain, computer and lamps."], "hints": ["We love hearing the stories of treasure hunters offering $20 to the first niece or nephew who can pass Roblox for them. To the teams onto the escape room, you need to use the heavy chain for something."], "open_questions": ["How the verbatim clue 'About-Rhenium' (QR6 success screen) leads to the Roblox game is not explained in any record. A hunter's doc gives the clue only as a description of the Roblox obby and billboard.", "Plaque answer conflict: a hunter's doc gives Q 'What was the door code to enter the escape room?' and A 203467. The hint-email answer list gives 'Bencati' (described as the same answer as QR6), while the doc names Bencati as the first team. One #qr-7 record lists 'Magellan', which the doc says is the Room 3 computer password.", "Door description differs: compass logo on a red wood-panel door (chat) vs Utah Treasure Hunt logo on the shop door (doc).", "Source of the first door digit (2): the chat's trusses/wheel card vs the doc's phone number on the water-tower staircase sign or website. Which digit came from which card is pieced together from a hunter's running combo and Marsh's '7' after the caboose photo.", "Room 3 path: a hunter said a black light was available so the computer step wasn't needed. A hunter's team reported a black-light trigger that seemed not to work and got help from two hunters (code not posted).", "Safe condition: a hunter's team said the safe was broken and organizer John was fixing it. A hunter later found it worked after closing it.", "The heavy chain's role (it makes the 8th photo, Cher, appear) comes only from a hunter's doc and the hint. The chat found Cher at without describing how.", "Marsh said you can scan once the game's timer has run down; which timer this means is not explained.", "In record 3, the plaque question is noted as 'possibly whether the billboard was Trolley Square' (ambiguous). This conflicts with the doc's door-code question."], "coords": null, "n_sources": 104, "steps": [{"t": "step", "n": "0", "clue": [], "label": "Clue", "lead": null, "text": "QR6's success screen said: To find the next QR code, you only need two words. \"About-Rhenium.\" Rhenium is element Re (no. 75). Ideas raised in chat: adding 'about-rhenium' to the hunt URL, which returned 'invalid or locked clue', and the fact that Bingham Canyon mine produces rhenium. No record explains how these two words lead to the next step.", "bullets": []}, {"t": "step", "n": "1", "clue": [], "label": "Roblox stage", "lead": null, "text": "The next step was a Roblox obby, 'Treasure-Hunt' (https://www.roblox.com/games/9222077337/Treasure-Hunt; speedrun at https://www.youtube.com/watch?v=jsfYbvE2FlQ). It has spam-jump walls, swinging platforms and discs, a slack line, rings, iceboxes, a pink-and-white maze and a 'collaboration area' where players jump on each other's heads. Teams had to submit a Roblox selfie with the billboard at the top. Zoom out from the final area to read it: it shows the Trolley Square water tower and says 'Go here to find the escape room. Use the clues on the windows to find the door code. Good luck!' Official hint: offer a niece or nephew $20 to pass Roblox for you.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Location", "lead": null, "text": "Trolley Square, Salt Lake City. On the south side along E 600 S, under or just west of the sky bridge, go in the south doors, turn left and go down a couple of stairs. The room is where the old mail place was, the same entry door as last year. A hunter found it first.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Door code 203467", "lead": null, "text": "Six laminated photo cards in the window panes each have one digit edited out and circled. Find each scene around Trolley Square to read the missing digit. Trusses = 2 (A hunter's doc says the first digit is from the phone number on the water-tower staircase sign or the website), red trolley no. 43 = 0, Cutler Mfg Co. Rochester NY patent plate (SEPT. 11TH 1883) = 3, black-and-white Utah Light & Railway trolley = 4, 'They Shaped Utah' Silvestre de Escalante = 6, UL&T Co caboose = 7. A hunter entered 203467 and got in. Tap or press the keypad screen hard to wake it. Just inside, a Blokus board spells 'SEVEN DIGIT CODE BUTNO BLOKUS'.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Room 1", "lead": null, "text": "A dartboard says 'You'll need at least one bright idea'. Shine a phone flashlight on the light sensor at its center to unlock the door.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Room 2", "lead": null, "text": "Eight musician photos, each tinted red, blue, yellow or green. The 8th (Cher) appears when the heavy chain touches a metal plate in a cabinet; the official hint says to use the heavy chain. Put the names in alphabetical order (Beatles G, Beyonce R, Bono B, Cher G, Drake B, Madonna Y, Shakira R, Usher Y) and press GRBGBYRY on the four color buttons. A cupboard or crawl space opens.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Room 3", "lead": null, "text": "The computer asks 'Name our sponsor'. Its wallpaper has the Magellan HCM logo (little mountains); a hunter matched it by checking the sponsor list. The password is 'Magellan'. Black lights then show a wall drawing of the whole hunt with 'HERE 527_ _', and two lamps (one a lampshade) show 8 and 3. A hunter said a black light was available so they didn't need the computer. Safe code 52783 (press C first to clear). The QR plaque is in the safe/metal box. Finders sign the whiteboard.", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": "After scanning", "lead": null, "text": "Plaque question 'What was the door code to enter the escape room?', answer 203467. Clue 8 then says to email the hunt selfies (12 in total) to [email removed], and the final challenge comes 48 hours after the photos are submitted. First team: Bencati.", "bullets": []}], "title": "Roblox level and escape room", "media": [{"src": "media/2024-qr7-01.jpg", "section": "solve", "caption": "Photo cards taped in the door's window panes. Each has one digit edited out (step 3).", "kind": "image"}, {"src": "media/2024-qr7-02.jpg", "section": "solve", "caption": "More of the door's photo cards, including red trolley no. 43 (step 3).", "kind": "image"}, {"src": "media/2024-qr7-03.jpg", "section": "solve", "caption": "The Silvestre de Escalante and caboose cards (step 3).", "kind": "image"}, {"src": "media/2024-qr7-04.jpg", "section": "solve", "caption": "The Cutler patent plate at Trolley Square, dated SEPT. 11TH 1883 (step 3).", "kind": "image"}], "links": [{"url": "https://www.roblox.com/games/9222077337/Treasure-Hunt", "label": "The Treasure-Hunt Roblox obby (step 1)"}, {"url": "https://www.youtube.com/watch?v=jsfYbvE2FlQ", "label": "A speedrun of the obby"}], "wl": []}, {"hunt_year": 2024, "qr_number": 8, "status": "confirmed", "confidence": 0.9, "clue_text": "Email from Utah Treasure Hunts (Fri, Oct 25, 2024, 4:53 PM): \"Congratulations on reaching the final challenge of the 2024 QR Hunt! So many unique adventures! This year we have worked hard to ensure the hunt was as awesome and epic as possible. We hope you have enjoyed it. These final challenges have a reputation of being difficult so be patient with yourselves. The clue for the final challenge is the image attached below. Good luck!\" Attachment hidden.jpg (1667x2500): a wanted poster of Indiana Jones (Harrison Ford) reading \"WANTED / DANGEROUS FUGITIVE / DEAD OR ALIVE / $ 10,000\". [Paired with sponsor Frost Box's Instagram post https://www.instagram.com/p/DBadSuUuC5i/ (\"For all those looking for your next treasure hunt clue, here it is!\"), six 1080x1080 images, later supplied in higher resolution.]", "plaque_question": null, "plaque_answer": "Call 4336200473", "location_name": "No plaque: the final answer was a phone number to call (433-620-0473)", "location_detail": "Online/phone-only finale. The hidden link sat in the hunt website's front-end code, on the leaderboard row of the fake team \"Henry Walton Jones\". The decoded message was \"Call 4336200473\". Winners: Qrusaders and The WitchyBitches (prize split).", "solve_path": "QR8 was the final challenge of the 2024 QR hunt. Teams got it by email after the QR7 escape room and the selfie submission (A hunter received it at 4:57 PM on Oct 25, 2024). The answer is a phone number, not a plaque. Accepted solution (A hunter's solve-summary doc, with details from a team chat):\n1) Name: the Halloween hint asks for \"Indiana Jones real name in the movies\", which is Henry Walton Jones (Jr.). A fake team with that name was added to the hunt website's leaderboard/teams page. To find it with Ctrl+F you have to load all 200 rows first.\n2) Hidden link: inspect that row. The site's JS bundle (main.a638a582ad46de4c.js) applies a CSS class named \"https://imgur.com/gallery/rhenium-forever-MrxjQSv\" only when teamName === \"Henry Walton Jones\". A hunter pointed out that searching \"rhenium\" in the inspector (the keyword from an earlier \"About-Rhenium\" clue) finds it right away. The imgur image is a long line of colored boxes.\n3) Key source: \"Mathematics is the only true universal language\" is a line from the film Contact (1997). The Contact book and movie were props in the QR7 escape room. In Contact, the alien message pages are decoded by stacking them in three dimensions (A hunter's clip: YouTube v=yCkD5GOjvx8, about 1:00).\n4) Frost Box overlay: each of the six Frost Box images has hidden edits (colored pixel blocks, a small QR code) and a small corner symbol, green on three images and red on the other three. In the team's words, red/green works like old red/green 3D. Arrange the six images as a cube. Then overlay each green-corner image (symbol top-left) with each red-corner image (flipped, symbol bottom-right). Each of the 9 overlays lines up exactly one pair of colored boxes, which shows what symbol or value that color stands for.\n5) Decode: substitute those values into the imgur line of boxes. It spells \"Call 4336200473\".\n6) Outcome: two teams, Qrusaders and The WitchyBitches, called and split the prize. A hunter relayed from John's live with the winners that one team called first at 2:52 but misdialed, then noticed and called again, which made it a tie (\"a 5000$ misdial\").\nThe poster image itself held decoys (see the dead ends list). A team missed step 1 because the teams page had not fully loaded when a hunter ran Ctrl+F. Per a hunter, they would otherwise have won by hours.", "techniques": ["website-source-inspection", "leaderboard", "hidden-link", "website-search", "name-puzzle", "movie-reference", "pop-culture", "callback-to-earlier-clue", "sponsor-reference", "image-overlay", "anaglyph-3d", "edited-image", "color-code", "color-values", "hidden-pixels", "steganography", "image-metadata", "email-inspection", "book-cipher", "qr-reconstruction", "final-challenge", "phone-number"], "red_herrings": ["Base64/cipher text at the end of the poster JPG decodes to 'This is not a clue.' (a 2022-style hiding place).", "A diagonal line of 14 green pixels (hex 47A942, 6C6517, 637F2B, 73711A, 4E6F16, 6F8242, 51702C, 636C29, 7A8E49, 3F8636, 39AB53, 768834, 6E912B, 6F962B) encodes 'ThisIsNotAClue' in its red values (a 2021-style hiding place). JPG compression keeps it from decoding cleanly. Ideas the team tried on it: green-channel book cipher on The Fugitive / The Power and the Glory; green-value sum 1849 tied to the State of Deseret / gold rush (A hunter); extending the line to (0,1967)-(532,2499), with 1967 read as the Fort Utah release year (A hunter); green shades as an ordering key; building a QR code from the pixels (dropped).", "Image dimensions as coordinates: 1667x2500 = 4167500, or minus the $10,000 bounty = 4157500, both north of Brigham City and out of bounds. First-pixel RGB 111/130/66 as a longitude (41.57500, -111.13066) was also out of bounds.", "Image metadata showed nothing beyond file permissions (A hunter).", "Gmail email source: 0.jfif is the same poster without the green pixels, at smaller size (compression drops 1x1 pixels, a hunter). cleardot.gif is Gmail's tracking pixel. The extra 'c' in the Patreon URL is a normal referral path. A hunter's name came from a forward.", "Trevanion cipher on the email text: produced nothing (A hunter).", "Faint letters above WANTED and a spot top-right of the D (several members; a hunter desaturated non-green colors): no result recorded.", "Cross of Coronado (Indy found looters digging it up in Utah in 1912, per the fandom wiki): a hunter asked whether to go there; not tested.", "Other Harrison Ford / pop-culture leads: Clear and Present Danger (escape room), The Fugitive, The Last Crusade, the Polybius cipher from the latest Indiana Jones film, 'Good luck' as Liam Neeson in Taken 3, the same Indy face in a murder-mystery puzzle.", "The $10k reward linked to the 2021 Heughs Canyon poem hunt (14 colors / 14 lines): led nowhere.", "Overlaying the Frost Box pixel blocks on the Frost Box QR codes (29x29) to make a new scannable code, or matching the poster's green RGB values to the Frost Box green blocks (A hunter)."], "hints": ["We are just barely beginning to email the first few teams the final challenge so we won't reveal much yet. But at some point you will need to look closely at Frost Boxes Most Recent Post.", "We hope everyone had a great Halloween! ... What was Indiana Jones real name in the movies? Remember that mathematics is the only true universal language. For those asking for higher resolution Frost Box Images, click here."], "open_questions": ["Call timing: a hunter's account says one winning team called at 2:52, two minutes before the other, misdialed and called back, which produced the tie. The solve doc says both teams called in the same minute. The date of the calls and whether 2:52 was am or pm are not stated.", "Green-pixel position: the team chat puts the 14 green pixels in the bottom-left corner, (261,2228)-(274,2241). The solve doc describes the line as 'under the D of DANGEROUS'. Unreconciled.", "End-of-file text: the solve doc calls it Base64. A team chat says a hunter 'brute-forced the cipher'. Same output either way ('this is not a clue').", "Number of leaderboard rows to load: the solve doc says 200. A hunter's '1000 teams' was a joke, so the real count is unconfirmed.", "Which earlier 2024 clue was 'About-Rhenium' (the 'rhenium' keyword callback) is not identified.", "The exact color-to-digit mapping from the 9 Frost Box overlays, and which image pairs line up, are not recorded.", "A hunter's 'staff of Ra' photo on the leaderboard: what it was and whether it was part of the path is not stated.", "One of the 7 input records (origin 'QR8 (A team) #general 2024-06-15') holds a Spanish poem ('Si sufres dolor que se cura con oro...'). Its QR number came only from the server name, and it is dated months before the fall 2024 QR hunt. It does not match this email/poster clue, so it was left out of the merge. It may belong to a different hunt (e.g. the 2024 poem hunt) and needs reassigning."], "coords": null, "n_sources": 68, "steps": [{"t": "p", "label": null, "text": "QR8 was the final challenge of the 2024 QR hunt. Teams got it by email after the QR7 escape room and the selfie submission (A hunter received it at 4:57 PM on Oct 25, 2024). The answer is a phone number, not a plaque."}, {"t": "h", "text": "Accepted solution", "sub": "A hunter's solve-summary doc, with details from a team chat"}, {"t": "step", "n": "1", "clue": [], "label": "Name", "lead": null, "text": "The Halloween hint asks for \"Indiana Jones real name in the movies\", which is Henry Walton Jones (Jr.). A fake team with that name was added to the hunt website's leaderboard/teams page. To find it with Ctrl+F you have to load all 200 rows first.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Hidden link", "lead": null, "text": "Inspect that row. The site's JS bundle (main.a638a582ad46de4c.js) applies a CSS class named \"https://imgur.com/gallery/rhenium-forever-MrxjQSv\" only when teamName === \"Henry Walton Jones\". A hunter pointed out that searching \"rhenium\" in the inspector (the keyword from an earlier \"About-Rhenium\" clue) finds it right away. The imgur image is a long line of colored boxes.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Key source", "lead": null, "text": "\"Mathematics is the only true universal language\" is a line from the film Contact (1997). The Contact book and movie were props in the QR7 escape room. In Contact, the alien message pages are decoded by stacking them in three dimensions (A hunter's clip: YouTube v=yCkD5GOjvx8, about 1:00).", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Frost Box overlay", "lead": null, "text": "Each of the six Frost Box images has hidden edits (colored pixel blocks, a small QR code) and a small corner symbol, green on three images and red on the other three. In the team's words, red/green works like old red/green 3D. Arrange the six images as a cube. Then overlay each green-corner image (symbol top-left) with each red-corner image (flipped, symbol bottom-right). Each of the 9 overlays lines up exactly one pair of colored boxes, which shows what symbol or value that color stands for.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Decode", "lead": null, "text": "Substitute those values into the imgur line of boxes. It spells \"Call 4336200473\".", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Outcome", "lead": null, "text": "Two teams, Qrusaders and The WitchyBitches, called and split the prize. A hunter relayed from John's live with the winners that one team called first at 2:52 but misdialed, then noticed and called again, which made it a tie (\"a 5000$ misdial\").", "bullets": []}, {"t": "p", "label": null, "text": "The poster image itself held decoys (see the dead ends list). A team missed step 1 because the teams page had not fully loaded when a hunter ran Ctrl+F. Per a hunter, they would otherwise have won by hours."}], "title": "Final: website source, 3D image and a phone call", "media": [{"src": "media/2024-qr8-01.jpg", "section": "clue", "caption": "The WANTED poster emailed as the final clue.", "kind": "image"}, {"src": "media/2024-qr8-02.jpg", "section": "solve", "caption": "The site's JavaScript: a CSS class holding the imgur URL, applied only for the team 'Henry Walton Jones' (step 2).", "kind": "image"}], "links": [{"url": "https://www.instagram.com/p/DBadSuUuC5i/", "label": "Frost Box's Instagram post with the six images (step 4)"}, {"url": "https://imgur.com/gallery/rhenium-forever-MrxjQSv", "label": "The imgur line of colored boxes (step 2)"}, {"url": "https://www.youtube.com/watch?v=yCkD5GOjvx8&t=60s", "label": "The Contact (1997) scene where the message pages are stacked in 3D (step 3)"}], "wl": [{"match": "YouTube v=yCkD5GOjvx8, about 1:00", "url": "https://www.youtube.com/watch?v=yCkD5GOjvx8&t=60s"}]}], "playbook": "<p>Distilled from every solved checkpoint in the knowledge base: 2021 QR4, 2022 QR2/QR4 (recollections only), 2023 QR1–8, and 2024 QR1–8. There are no 2025 records. 2021 and 2022 are thin, so most patterns below come from 2023 and 2024.<\/p>\n<hr>\n<h2 id=\"1-recurring-clue-formats\">1. Recurring clue formats<\/h2>\n<table><thead><tr><th>Format<\/th><th>Examples<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td><strong>Video / Street View geolocation<\/strong><\/td><td>2023 QR1, 2024 QR1<\/td><td><\/td><\/tr><tr><td><strong>Video with signal hidden in small details<\/strong><\/td><td>2023 QR2 (Morse lantern, braille in photos), 2024 QR3 (axe watermark, four place names, Sherlock quotes)<\/td><td>Most of the video's runtime is filler. The signal sits in a corner or a frame.<\/td><\/tr><tr><td><strong>Image with edited or hidden content<\/strong><\/td><td>2024 QR2 (Jordan photo, score cards changed), 2022 QR4 (billboard overlay), 2024 QR8 (Frost Box images overlaid as red/green 3D), 2024 QR7 (photo cards with a digit removed)<\/td><td>Compare against the original image. Overlay pairs of images.<\/td><\/tr><tr><td><strong>Letter/number codes → digits → coordinates<\/strong><\/td><td>2021 QR4, 2023 QR4, 2024 QR2<\/td><td>See §2.<\/td><\/tr><tr><td><strong>Book / Ottendorf cipher<\/strong><\/td><td>2023 QR1/QR8 (Art of War, chapter.paragraph.word), 2023 QR4 (Monte Cristo <em>movie script<\/em>, word offsets), 2024 QR4 (Bill of Rights, amendment + letter position), 2021 Junior Hunt (Harry Potter, reused in 2024 QR6)<\/td><td>Identifying the source text is the hard part. The hint comes from shape (2023 QR4 King shape), a hint email (2024 QR4 \"old, important document\"), or a prop from an earlier QR (2023 QR8: Art of War on the QR7 escape-room table).<\/td><\/tr><tr><td><strong>Classical cipher chains<\/strong><\/td><td>2023 QR6 (A1Z26 → Caesar +3 → reverse → Instagram → Atbash → Vigenère)<\/td><td>Layers stack. Each layer's output has to be readable before you move on.<\/td><\/tr><tr><td><strong>Crossword with an embedded instruction<\/strong><\/td><td>2024 QR5<\/td><td>The answers form a sentence. Some answers say what to ignore (2024 QR5: \"Ignore intensely painful through orange veggie\"). Color coding and clue numbers matter. The grid itself becomes a map overlay.<\/td><\/tr><tr><td><strong>Online game<\/strong><\/td><td>2023 QR3 (Roblox obby), 2023 QR5 (TreasureGuns), 2024 QR6 (QRSlayer on itch.io + 360° murder-mystery tour), 2024 QR7 (Roblox, billboard at the end)<\/td><td>The end screen gives a place or a passphrase. Persistence beats cleverness here. 2024 QR7's official hint: pay a niece or nephew $20. Past games live in the UTH site arcade. The 2023 solve doc notes the game link may be reused.<\/td><\/tr><tr><td><strong>Website source / site pages<\/strong><\/td><td>2023 QR8 (hidden <code>var riddle<\/code> + <code>console.log(url/clueAnswer + riddleAnswer)<\/code>), 2024 QR3 (video link in page code before release), 2024 QR6 (About page video at 75 s = rhenium), 2024 QR8 (CSS class holding an imgur URL, applied only for team \"Henry Walton Jones\")<\/td><td>Inspect the clue page, the leaderboard and the JS bundle. Load <em>all<\/em> leaderboard rows before Ctrl+F (2024 QR8).<\/td><\/tr><tr><td><strong>Organizers' social media<\/strong><\/td><td>2023 QR6 (32nd posts on Dave's and John's Instagram, edited captions), 2023 QR7 (John's eclipse story)<\/td><td>Old posts can be edited mid-hunt to plant clues.<\/td><\/tr><tr><td><strong>Riddle/poem directions<\/strong><\/td><td>2023 QR7 (street-grid walking poem), 2023 QR8 step 3 (one digit per riddle line)<\/td><td>Each line maps to one step or one digit. Some lines are declared filler (\"This line means zip\").<\/td><\/tr><tr><td><strong>Sponsor reference / sponsor webpage<\/strong><\/td><td>2022 QR2, 2023 QR2, 2024 QR5 (Bulldog dumpster), 2024 QR7 (password \"Magellan\")<\/td><td>See §3.<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"2-how-locations-are-encoded\">2. How locations are encoded<\/h2>\n<ul><li><strong>Concatenated digits split as decimal degrees.<\/strong> Utah coordinates start <code>40<\/code>/<code>41<\/code> and <code>-111<\/code>/<code>-112<\/code>. Solvers in 2024 QR2 found the split point by looking for <code>111<\/code>. Examples: 2021 QR4 (40613527 / 111785286), 2023 QR4 (41069472111889351), 2024 QR2 (1765776917903327 × 23 = 40612869111776521).<\/li><li><strong>Digits come from arithmetic between two sources<\/strong>: a multiplier taken from the image (Jordan's 23, 2024 QR2).<\/li><li><strong>Number words / homophones<\/strong>: \"Won\" = 1, \"For\" = 4, \"To\" = 2, \"Oh\" = 0 (2023 QR4).<\/li><li><strong>Plaintext place names or instructions<\/strong>: \"drycreeksixkfeetbehindthepost\" (2023 QR6), \"GO TO EL MEXSAL. BRING SOCKS.\" (2024 QR4), in-game \"go to Crazy Corn Maze\" (2023 QR3).<\/li><li><strong>Map geometry<\/strong>: line intersection of four named places (2024 QR3, from the Sherlock Holmes four-sites scene), crossword squares = city blocks overlaid on Ogden (2024 QR5), street-grid walking directions (2023 QR7), paces from a landmark (2024 QR6 \"100 paces that way\").<\/li><li><strong>Elevation or description<\/strong>: \"six k feet behind the post\" (2023 QR6).<\/li><li><strong>Geolocation of an image<\/strong> (QR1 tradition): 2023 QR1, 2024 QR1.<\/li><li><strong>Phone numbers instead of places<\/strong> (finales): last digits of photo-sphere latitudes → (385) 645-5725, then riddle digits → 801-784-3986 (2023 QR8). \"Call 4336200473\" (2024 QR8).<\/li><\/ul>\n<h2 id=\"3-where-plaques-end-up\">3. Where plaques end up<\/h2>\n<p><strong>Trails (hike required)<\/strong>: Ferguson Canyon (2021 QR4, 2024 QR2: same canyon reused), Adams Canyon, Layton (2023 QR4, on a fallen tree off a side path), Dry Creek, Alpine (2023 QR6, on a tree up a dirt hill). Plaques sit <strong>just off the trail<\/strong>: on fallen logs, behind boulders, on trees, about 5 ft off the path.<\/p>\n<p><strong>Open land / shoreline / roadside<\/strong>: Antelope Island causeway lot rocks (2023 QR1), Utah Lake shore at Vineyard (2024 QR1), Tintic Railroad Tunnel (2023 QR2), old rail tracks in Draper (2024 QR6, on a tie at ground level, partly under brush).<\/p>\n<p><strong>Businesses, usually sponsors or partners<\/strong>: Crazy Corn Maze (2023 QR3), Bloom Studios room 113 (2023 QR5), a Gateway pop-up escape room (2023 QR7), Axe N Smash Layton (2024 QR3), El Mexsal → Hang Time (2024 QR4), a Bulldog-brand dumpster behind Harajuku (2024 QR5), SL County Animal Services as a waypoint (2024 QR6), a Trolley Square escape room (2024 QR7).<\/p>\n<p>Patterns:<\/p>\n<ul><li><strong>Sponsors are built into the solve<\/strong>, not just credited: the sponsor's product (Bulldog dumpster, 2024 QR5), the sponsor as a password (2024 QR7), sponsor cards (2024 QR6 Suba Bleu / Mark Miller Subaru), sponsor images (2024 QR8 Frost Box).<\/li><li><strong>Business stops often require an action<\/strong>: a secret phrase at the desk (2023 QR5 \"stone bear\"), a physical challenge (axe bullseye 2024 QR3, slackline 2024 QR4), an on-site escape room (2023 QR7, 2024 QR7), claw-machine tokens (2024 QR4), downloading a file to USB (2023 QR5).<\/li><li><strong>Business hours matter<\/strong>: 2023 QR3 (plaque moved outside after weather).<\/li><li><strong>Locations get reused<\/strong>: Ferguson Canyon (2021 QR4 → 2024 QR2), the Draper tracks (2021 Junior → 2024 QR6), Trolley Square's \"same entry door as last year\" (2024 QR7), the Blokus prop \"SEVEN DIGIT CODE BUT NO BLOKUS\" (2023 QR7 and 2024 QR7). Assuming an old spot couldn't be reused was listed as a red herring in 2024 QR6.<\/li><li><strong>Geographic range seen<\/strong>: Harrisville/Ogden (2024 QR5) south to Elberta/Eureka (2023 QR2), with Antelope Island and Utah Lake at the edges. Spots north of Brigham City and Ephraim came up as out of bounds (2024 QR8, 2024 QR5).<\/li><li><strong>Not every QR has a plaque<\/strong>: 2023 QR5 (QR recovered from a .bin file), 2023 QR8 and 2024 QR8 (phone calls).<\/li><\/ul>\n<h2 id=\"4-plaque-questions-vs-the-solve\">4. Plaque questions vs. the solve<\/h2>\n<table><thead><tr><th>Question type<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td>\"What city are you in?\"<\/td><td>2023 QR1 Syracuse, 2024 QR1 Vineyard, 2024 QR3 Layton, 2024 QR6 Draper<\/td><\/tr><tr><td>Trail name<\/td><td>2023 QR4 \"Adam's Canyon Trail\", 2024 QR2 \"Ferguson\"<\/td><\/tr><tr><td>Something visible on site<\/td><td>2023 QR2 body of water to the NE (Utah Lake), 2024 QR4 \"What did you cross?\" (slackline), 2024 QR5 nearest restaurant (Harajuku)<\/td><\/tr><tr><td><strong>Callback to the solve path<\/strong> (proves you solved it rather than followed a leak)<\/td><td>2023 QR3 encoding in the <em>previous QR's<\/em> video (braille), 2023 QR6 what Dave's wife stands next to in the oars reel (crib), 2023 QR7 smallest of the four books used (Steppenwolf), 2024 QR7 escape-room door code (203467)<\/td><\/tr><\/tbody><\/table>\n<p>Notes: capitalization mattered (2023 QR7). Common alternate spellings were accepted (2023 QR4 apostrophe). Several stops required selfies at every physical location, not just the plaque (2024 QR4, 2023 QR7). Keep notes on every intermediate answer, since a later plaque may ask for one.<\/p>\n<h2 id=\"5-common-red-herrings\">5. Common red herrings<\/h2>\n<p><strong>Decoys planted by the organizers<\/strong><\/p>\n<ul><li>Self-labelled taunts: base64 \"This is not a clue.\" and green pixels spelling \"ThisIsNotAClue\" (2024 QR8).<\/li><li>Whole blocks of content to ignore: the big billboard's letters (2022 QR4), the crossword span 27–71 (2024 QR5), the About-page numbers (2024 QR6, which the official hints said were unrelated), unused board games (2023 QR7), \"This line means zip\" (2023 QR7), the many props in escape rooms (2024 QR7).<\/li><li>Timed social-media decoys: two 30-second Instagram stories on drop day (2023 QR6).<\/li><\/ul>\n<p><strong>Theme pulling you to the wrong medium or text<\/strong><\/p>\n<ul><li>The obvious source text is often the wrong edition: novel vs. <em>movie script<\/em> (2023 QR4), Constitution vs. Bill of Rights (2024 QR4). Spoken content (Livingston line in 2024 QR1) was chased with no payoff.<\/li><li>Treating musical notation literally as chords (2024 QR4) when it only meant \"count note names from C\".<\/li><\/ul>\n<p><strong>Video and file artifacts<\/strong><\/p>\n<ul><li>Glitch frames, compression noise, audio spectra and captions (2024 QR3): the organizers said \"No\" when asked if the glitches were intentional.<\/li><li>File names and base64 tails (\"Z\", \"9k=\") (2024 QR2, 2024 QR4). Typos are not clues (2024 QR5 \"ACCROSS\", stated by John).<\/li><li>Steganography tools on clue images found nothing in 2024 QR2, QR5 and QR8. Aperisolve's \"common password\" list is other users' inputs (2024 QR6).<\/li><\/ul>\n<p><strong>Word association to places<\/strong><\/p>\n<ul><li>2023 QR7 accumulated dozens of wrong SLC/Ogden/Daybreak sites from loose readings. Same-name ambiguity: Liberty Park SLC vs. Ogden (2024 QR5), Jordan → West Jordan (2024 QR2).<\/li><li>Organizers sometimes publicly rule places out: \"the plaque is not at the shelter\" (2024 QR6).<\/li><\/ul>\n<p><strong>Human noise<\/strong><\/p>\n<ul><li>Business staff may not know about the hunt (2024 QR4 El Mexsal employee caused a correct solver to post it as \"wrong\"; 2024 QR3 staff said \"definitely maybe\").<\/li><li>Leaks and trolls: the keypad photo from a kicked member (2023 QR7), leaked solves via a big Discord voice chat (2024 QR5).<\/li><\/ul>\n<p><strong>Finale-specific<\/strong><\/p>\n<ul><li>Over-reading riddle lines: merging two lines into one digit, or treating the name line as a digit (2023 QR8 \"Harry Houdini\"). Brute-force dialing 400+ numbers never hit (2023 QR8). Skip patterns containing 911.<\/li><\/ul>\n<h2 id=\"6-difficulty-across-a-hunt\">6. Difficulty across a hunt<\/h2>\n<ul><li><strong>QR1 is the easiest and is traditionally Street View geolocation.<\/strong> 2024 QR1 was found about 75 minutes after kickoff.<\/li><li><strong>Early to middle QRs (2–4)<\/strong> move to coordinate ciphers, image puzzles and video puzzles. Some become unsolvable without the <strong>weekly/Friday hint email<\/strong> (2024 QR4: no progress in four days before the hint). The hint usually names the missing ingredient (\"music theory and an old, important document\", \"each block = city block\").<\/li><li><strong>Middle to late QRs (5–7)<\/strong> are multi-stage: game → business → escape room → safe. Several on-site sub-codes. Physical tasks.<\/li><li><strong>Final (QR8) is an emailed clue after selfie submission<\/strong>, described by the organizers as \"notorious for being difficult\" (2023 QR8) or having \"a reputation of being difficult\" (2024 QR8). There is no plaque, the answer is a phone number, it has several steps, and it <strong>reuses props and keywords from earlier QRs<\/strong>: Art of War from the QR7 room (2023 QR8), Contact from the QR7 room plus the \"rhenium\" keyword from QR6/7 (2024 QR8). The same seven-triplet image appears in both the 2023 QR1 and 2023 QR8 records.<\/li><li><strong>Timing mechanics<\/strong>: scanning starts a cooldown before the next clue (24 h in 2024 QR2, 48 h in 2024 QR4). First-scan prizes ($1k/$2k). The final arrives about 48 h after selfies.<\/li><li>Solvers from 2023 QR6 and 2024 QR3 found they could shortcut the intended path (Vigenère brute force, the axe watermark plus the bullseye badge icon). The badge icon gave away 2024 QR3 (a target).<\/li><\/ul>\n<h2 id=\"7-organizer-fingerprints\">7. Organizer fingerprints<\/h2>\n<ul><li>Pop culture and their own favorites: Sherlock Holmes 2009 (2024 QR3), Indiana Jones / Contact (2024 QR8), Monte Cristo (2023 QR4), Almost Famous (2023 QR8).<\/li><li>Personal references: Dave's and John's Instagram (2023 QR6), a sticker of Dave's face on the door (2023 QR7), crossword answers BROMANCE / REEL / LEHI (2024 QR5).<\/li><li>Callbacks to past hunts: \"bear made of stone\" (2023 QR5), reused locations, \"rhenium\" carried across 2024 QR6 → QR7 → QR8.<\/li><li>Puns that are literal instructions: \"Ex marks the spot\", \"as the crow flies\", \"Insta thirty-second\", \"two dashes\" = hyphens.<\/li><li>Verify-as-you-go design: the murder game allows unlimited guesses (2024 QR6).<\/li><\/ul>\n<h2 id=\"8-step-by-step-solving-checklist\">8. Step-by-step solving checklist<\/h2>\n<ol><li><strong>Collect every surface<\/strong>: clue page text, page source/JS, image files (full resolution), video + description + title, email body and source, the leaderboard, and organizers' and sponsors' Instagram.<\/li><li><strong>If it's QR1<\/strong>, start with Street View. Match vegetation, road markings and mountains.<\/li><li><strong>Separate signal from flavor.<\/strong> Look for taunts (\"This is not a clue\") and declared-filler lines, and for small anomalies: watermarks, edited numbers, corner symbols, edited captions.<\/li><li><strong>Find the number source(s)<\/strong> and test arithmetic between them (concatenate, multiply). Check whether the results are clean single digits or A1Z26 letters.<\/li><li><strong>Test the coordinate split<\/strong>: does a digit string contain <code>40<\/code>/<code>41<\/code> … <code>111<\/code>/<code>112<\/code>? Plot it. Also try reading the result as a plaintext place name or a phone number.<\/li><li><strong>For a book cipher, identify the exact text<\/strong>: look at shape, theme, hint wording and props from earlier QRs. Try movie scripts and sub-documents (amendments, chapters), not just the obvious book.<\/li><li><strong>For layered ciphers<\/strong>, verify that each layer produces readable text before moving on (2023 QR6).<\/li><li><strong>For crosswords<\/strong>, solve fully, read the answers in clue-number order as a sentence, look for \"ignore X through Y\" instructions, use the colors, and consider the grid as a map overlay.<\/li><li><strong>For games<\/strong>, just finish them. Read the end screen and zoom out for billboards (2024 QR7).<\/li><li><strong>Check the website<\/strong>: hidden variables, CSS classes with URLs, conditional logic on team names, and the About page.<\/li><li><strong>Read the weekly hint email word by word<\/strong> when it arrives. It usually names the missing piece.<\/li><li><strong>Before driving<\/strong>: check business hours, whether the clue has a secret phrase, required selfies, and whether you need a USB drive, flashlight or socks.<\/li><li><strong>On site<\/strong>: plaques sit just off trails (logs, trees, rocks, ground-level ties) or inside venues (back rooms, safes, dumpsters). Expect on-site codes. Bring notes of every intermediate answer for callback plaque questions.<\/li><li><strong>For the final<\/strong>: expect several steps and a phone number. Reread earlier QRs' props and keywords. Treat each riddle line as one digit and don't merge lines. Load all leaderboard rows before searching.<\/li><li><strong>Discount<\/strong> staff denials, leaks, glitch frames, typos and file names, unless something independent confirms them.<\/li><\/ol>", "locked": {"years": [2026], "url": "https://cpjykitpufxfdiioelwo.supabase.co", "key": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwanlraXRwdWZ4ZmRpaW9lbHdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM0NjgyNDMsImV4cCI6MjA1OTA0NDI0M30.hGNQDAFRKMQazcoxetZFJby31uh2VIlaZw6C8dT9R1g"}}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
let SOLVES = DATA.solves;
const LOCK = DATA.locked || {years: []}, UNLOCKED = new Set();
const YEARS = [...new Set([...SOLVES.map(s => s.hunt_year), ...LOCK.years])].sort();
const isLocked = y => LOCK.years.includes(y) && !UNLOCKED.has(y);
const $ = id => document.getElementById(id);
const title = s => s.title || s.location_name || 'Untitled checkpoint';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// escaped text with clickable links and the quoted clue fragments ('...' = ...) picked out
let WL = [];  // write-up links of the record on screen: [{match, url, used}]
function addLinks(h){
  if (!WL.length) return h;
  let depth = 0;
  return h.split(/(<[^>]+>)/).map(part => {
    if (part.startsWith('<')){ if (/^<a\b/.test(part)) depth++; else if (part === '</a>') depth--; return part; }
    if (depth) return part;
    for (const w of WL){
      if (w.used) continue;
      const m = esc(w.match), i = part.indexOf(m);
      if (i < 0) continue;
      w.used = true;
      part = part.slice(0, i) + `<a href="${esc(w.url)}" target="_blank" rel="noopener">${m}</a>` + part.slice(i + m.length);
    }
    return part;
  }).join('');
}
const rich = s => addLinks(esc(s)
  .replace(/(https?:\/\/[^\s<)]*[^\s<).,;:'"])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])'([^'<>]{3,90})'(?=\s*(?:=|:\s))/g, '$1<q class="cl">$2</q>'));
const key = s => `${s.hunt_year}/qr${s.qr_number}`;
const byYear = y => SOLVES.filter(s => s.hunt_year === y);
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
const li = xs => xs.length ? '<ul class="plain">' + xs.map(x => `<li>${rich(x)}</li>`).join('') + '</ul>' : '<p class="empty">none recorded</p>';
const chips = xs => (xs || []).length ? `<div class="chips">${xs.map(t => `<a class="chip" href="#technique/${encodeURIComponent(t)}">${esc(t)}</a>`).join('')}</div>` : '<span class="empty">none</span>';

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('playbook')) return {page:'playbook', anchor:h.split('/')[1] || null};
  if (h.startsWith('technique/')) return {page:'technique', tech:h.slice(10)};
  const m = h.match(/^(\d{4})(?:\/qr(\d+))?$/);
  if (m) return {page:'year', year:+m[1], qr:m[2] ? +m[2] : null};
  return {page:'home'};
}
function yearsNav(cur){
  $('years').innerHTML = YEARS.map(y => `<a href="#${y}" class="${cur===y?'on':''}">${y}${isLocked(y) ? ' <span class="lock" aria-label="locked">&#128274;</span>' : ''}</a>`).join('')
    + `<a href="#playbook" class="${cur==='playbook'?'on':''}">Playbook</a>`;
}
function qrPills(year, qr){
  return `<span class="crumb">${year} hunt</span><a href="#${year}" class="${qr?'':'on'}">Overview</a>` +
    byYear(year).map(s => `<a href="#${key(s)}" class="${s.qr_number===qr?'on':''}" title="${esc(title(s))}">QR${s.qr_number}</a>`).join('');
}
const playbookToc = () => [...DATA.playbook.matchAll(/<h2 id="([^"]+)">(.*?)<\/h2>/g)]
  .map(m => `<a href="#playbook/${m[1]}">${m[2].replace(/<[^>]+>/g, '')}</a>`).join('');

// --- pictures, audio and links
const fig = m => m.kind === 'audio'
  ? `<figure><audio controls preload="none" src="${esc(m.src)}"></audio><figcaption>${esc(m.caption)}</figcaption></figure>`
  : `<figure><a class="img" href="${esc(m.src)}" target="_blank" rel="noopener" title="Open full size"><img loading="lazy" src="${esc(m.src)}" alt="${esc(m.caption)}"></a><figcaption>${esc(m.caption)}</figcaption></figure>`;
const figs = xs => xs.length ? `<div class="figs${xs.length === 1 ? ' one' : ''}">${xs.map(fig).join('')}</div>` : '';
// "(step 6)", "(steps 5 and 6)", "(stage 6b)" -> the step a picture belongs to
const stepOf = m => { const x = m.caption.match(/\((?:steps?|stage)\s+(\d+[a-z]?)/i); return x ? x[1] : null; };
const ytId = u => { const x = u.match(/(?:youtu\.be\/|[?&]v=)([\w-]{11})/); return x ? x[1] : null; };
const linkHtml = l => {
  const id = ytId(l.url), dom = (l.url.match(/^https?:\/\/(?:www\.)?([^/]+)/) || [])[1] || '';
  return id ? `<div class="video"><a class="frame yt" href="${esc(l.url)}" data-yt="${id}" target="_blank" rel="noopener" aria-label="Play: ${esc(l.label)}"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt=""><span class="play"></span></a><p><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a> <span class="dom">youtube.com</span></p></div>`
    : `<a class="lnk" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}<span class="dom">${esc(dom)}</span></a>`;
};

// --- the step-by-step solve path
function stepHtml(s, pics){
  const clue = s.clue.length ? `<blockquote class="cq"><small>From the clue</small>${s.clue.map(c => `<span>${esc(c)}</span>`).join('')}</blockquote>` : '';
  const head = s.label ? `<b>${esc(s.label)}:</b> ` : s.lead ? `<b>${rich(s.lead)}</b> ` : '';
  const para = head || s.text ? `<p>${head}${rich(s.text)}</p>` : '';
  return `<li class="step"><span class="n">${esc(s.n)}</span><div class="body">${clue}${para}${s.bullets.length ? li(s.bullets) : ''}${figs(pics || [])}</div></li>`;
}
function pathHtml(blocks, pics){
  pics = pics || {};
  let out = '', run = [];
  const flush = () => { if (run.length){ out += `<ol class="steps">${run.join('')}</ol>`; run = []; } };
  for (const b of blocks){
    if (b.t === 'step'){ run.push(stepHtml(b, pics[b.n])); delete pics[b.n]; continue; }
    flush();
    if (b.t === 'h') out += `<h3 class="sec">${esc(b.text)}${b.sub ? `<span>${esc(b.sub)}</span>` : ''}</h3>`;
    else if (b.t === 'p') out += `<p class="note">${b.label ? `<b>${esc(b.label)}:</b> ` : ''}${rich(b.text)}</p>`;
    else if (b.t === 'ul') out += li(b.items);
  }
  flush();
  return out || '<p class="empty">No solve path recorded.</p>';
}

function solveView(s){
  WL = (s.wl || []).map(w => ({...w, used: false}));
  try { return solveBody(s); } finally { WL = []; }
}
function solveBody(s){
  const ys = byYear(s.hunt_year), i = ys.findIndex(x => x.qr_number === s.qr_number), prev = ys[i-1], next = ys[i+1];
  const conf = s.confidence != null ? `<span>${Math.round(s.confidence * 100)}% confidence</span>` : '';
  const map = s.coords ? `<a href="https://www.google.com/maps?q=${s.coords[0]},${s.coords[1]}" target="_blank" rel="noopener">Open in Google Maps</a>` : '';
  const pager = (x, cls, word) => x ? `<a href="#${key(x)}" class="${cls}"><small>${word}</small>QR${x.qr_number} · ${esc(title(x))}</a>` : '<span></span>';
  const steps = s.steps.filter(b => b.t === 'step').length;
  const media = s.media || [], links = s.links || [], of = sec => media.filter(m => m.section === sec);
  const stepNos = new Set(s.steps.filter(b => b.t === 'step').map(b => b.n)), pics = {}, loose = [];
  for (const m of of('solve')){ const n = stepOf(m); if (n && stepNos.has(n)) (pics[n] = pics[n] || []).push(m); else loose.push(m); }
  return `<p class="eyebrow">${s.hunt_year} hunt · QR${s.qr_number}</p>
  <h1>${esc(title(s))}</h1>
  <p class="meta"><span class="status ${esc(s.status)}">${esc(s.status)}</span>${conf}<span>${plural(s.n_sources, 'source message')}</span>${map}</p>
  <section><h2>The clue</h2><pre class="clue">${esc(s.clue_text || '(clue text not recorded)')}</pre>${figs(of('clue'))}</section>
  ${links.length ? `<section><h2>Videos and links</h2><div class="links">${links.map(linkHtml).join('')}</div></section>` : ''}
  <section><h2>The answer</h2><dl class="glance">
    <dt>Location</dt><dd>${esc(s.location_name || 'not recorded')}</dd>
    <dt>Plaque question</dt><dd>${esc(s.plaque_question || 'not recorded')}</dd>
    <dt>Plaque answer</dt><dd>${esc(s.plaque_answer || 'not recorded')}</dd>
    <dt>Techniques</dt><dd>${chips(s.techniques)}</dd></dl></section>
  <section><h2>How it was solved${steps ? `, in ${plural(steps, 'step')}` : ''}</h2>${pathHtml(s.steps, pics)}${loose.length ? `<h3 class="sec">More pictures from the solve</h3>${figs(loose)}` : ''}
    <details><summary>Read the write-up as one text</summary><div class="raw">${rich(s.solve_path || '')}</div></details></section>
  <section><h2>Finding the plaque</h2><p>${rich(s.location_detail || 'No location detail recorded.')}</p>${map ? `<p>${map}</p>` : ''}${figs(of('location'))}</section>
  <section><h2>Hints</h2>${(s.hints || []).length || !of('hint').length ? li(s.hints || []) : ''}${figs(of('hint'))}</section>
  <section><details><summary>Dead ends and red herrings <span class="count">${(s.red_herrings || []).length}</span></summary>${li(s.red_herrings || [])}</details>
  <details><summary>Open questions <span class="count">${(s.open_questions || []).length}</span></summary>${li(s.open_questions || [])}</details></section>
  <nav class="pager">${pager(prev, 'prev', 'Previous')}${pager(next, 'next', 'Next')}</nav>
  <p class="hint"><kbd>←</kbd> <kbd>→</kbd> move between checkpoints</p>`;
}
function homeView(){
  const techs = {};
  SOLVES.forEach(s => (s.techniques || []).forEach(t => techs[t] = (techs[t] || 0) + 1));
  const top = Object.entries(techs).sort((a, b) => b[1] - a[1]).slice(0, 40);
  return `<p class="eyebrow">Utah Treasure Hunts · QR code hunt</p><h1>Every past checkpoint, solved step by step</h1>
  <p class="intro">Pick a year, then a checkpoint. Each page shows the clue as posted, the solve as a numbered path with the clue line each step interprets, where the plaque was, the clue images, videos and photos from the solve, the official hints, and the dead ends that cost time. The <a href="#playbook">playbook</a> distils the organizers' habits.</p>
  <section><h2>Years</h2><div class="cards">${YEARS.map(y => { const n = byYear(y); return isLocked(y) ? `<a class="card" href="#${y}"><span class="big">${y} &#128274;</span><span class="tech">Season in progress · password needed</span></a>` : `<a class="card" href="#${y}"><span class="big">${y}</span><span class="tech">${plural(n.length, 'checkpoint')} · ${n.filter(s => s.status === 'confirmed').length} confirmed</span></a>`; }).join('')}</div></section>
  <section><h2>Techniques</h2><div class="chips">${top.map(([t, n]) => `<a class="chip" href="#technique/${encodeURIComponent(t)}">${esc(t)} <small>${n}</small></a>`).join('')}</div></section>`;
}
function yearView(y){
  const ys = byYear(y);
  return `<p class="eyebrow">${y} hunt</p><h1>${plural(ys.length, 'checkpoint')} on record</h1>
  <section><div class="cards">${ys.map(s => `<a class="card" href="#${key(s)}"><b>QR${s.qr_number}</b> <span class="status ${esc(s.status)}">${esc(s.status)}</span><span class="where">${esc(title(s))}</span><span class="tech">${esc((s.techniques || []).slice(0, 5).join(' · '))}</span></a>`).join('')}</div></section>`;
}
const snip = s => {
  const st = (s.steps || []).find(b => b.t === 'step');
  const t = st ? [st.label ? st.label + ':' : '', st.lead || '', st.text || ''].join(' ').trim() : (s.solve_path || '');
  return t.length > 220 ? t.slice(0, 220) + '…' : t;
};
const rows = xs => xs.length ? `<ul class="rows">${xs.map(s => `<li><a class="t" href="#${key(s)}"><b>${s.hunt_year} QR${s.qr_number}</b> · ${esc(title(s))}</a><p>${esc(snip(s))}</p></li>`).join('')}</ul>` : '<p class="empty">Nothing matches.</p>';
function techniqueView(t){
  const xs = SOLVES.filter(s => (s.techniques || []).includes(t));
  return `<p class="eyebrow">Technique</p><h1>${esc(t)}</h1><p class="meta">${plural(xs.length, 'checkpoint')}</p><section>${rows(xs)}</section>`;
}
function searchView(q){
  const xs = SOLVES.filter(s => JSON.stringify(s).toLowerCase().includes(q));
  return `<p class="eyebrow">Search</p><h1>${esc(q)}</h1><p class="meta">${plural(xs.length, 'match', 'matches')}</p><section>${rows(xs)}</section>`;
}
function lockView(y){
  return `<p class="eyebrow">${y} hunt</p><h1>This season is still running</h1>
  <p class="intro">The ${y} solves stay locked while teams are still hunting. Enter the password to view them.</p>
  <form id="unlock" class="unlock" autocomplete="off"><input id="pw" type="password" placeholder="Password" aria-label="Password" required>
  <button type="submit">Unlock</button></form><p id="unlockMsg" class="hint" role="status"></p>`;
}
async function unlock(pw, quiet){
  const msg = t => { const el = $('unlockMsg'); if (el) el.textContent = t; };
  msg('Checking…');
  let res;
  try {
    const r = await fetch(`${LOCK.url}/rest/v1/rpc/qr_guide_unlock`, {method: 'POST',
      headers: {'Content-Type': 'application/json', apikey: LOCK.key, Authorization: `Bearer ${LOCK.key}`},
      body: JSON.stringify({pw})});
    res = await r.json();
  } catch (e) { msg('Could not reach the server. Try again in a moment.'); return false; }
  if (!res || res.error || !res.payload){
    if (!quiet) msg(res && res.error === 'too_many_attempts' ? `Too many wrong tries. Wait ${res.retry_minutes} minutes and try again.`
      : res && res.error === 'wrong_password' ? 'That password is not right.' : 'Nothing to unlock yet.');
    try { sessionStorage.removeItem('qrGuidePw'); } catch (e) {}
    return false;
  }
  const media = res.media || {};
  for (const s of res.payload.solves) for (const m of s.media || []) if (m.src.startsWith('locked/')) m.src = media[m.src.slice(7)] || '';
  SOLVES = SOLVES.concat(res.payload.solves).sort((a, b) => a.hunt_year - b.hunt_year || a.qr_number - b.qr_number);
  if (res.payload.playbook) DATA.playbook = res.payload.playbook;
  LOCK.years.forEach(y => UNLOCKED.add(y));
  try { sessionStorage.setItem('qrGuidePw', pw); } catch (e) {}
  render();
  return true;
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'unlock') return;
  e.preventDefault();
  unlock($('pw').value);
});
function playbookView(){
  return `<div class="play"><p class="eyebrow">Playbook</p><h1>How the organizers build clues</h1>${DATA.playbook}</div>`;
}
function render(){
  const r = route(), view = $('view');
  $('q').value = '';
  if (r.page === 'playbook'){
    yearsNav('playbook'); $('sub').innerHTML = playbookToc(); view.innerHTML = playbookView();
    const el = r.anchor && document.getElementById(r.anchor);
    if (el){ el.scrollIntoView(); return; }
  } else if (r.page === 'technique'){ yearsNav(null); $('sub').innerHTML = ''; view.innerHTML = techniqueView(r.tech); }
  else if (r.page === 'year' && isLocked(r.year)){ yearsNav(r.year); $('sub').innerHTML = ''; view.innerHTML = lockView(r.year); }
  else if (r.page === 'year'){
    const s = r.qr ? byYear(r.year).find(x => x.qr_number === r.qr) : null;
    yearsNav(r.year); $('sub').innerHTML = qrPills(r.year, r.qr); view.innerHTML = s ? solveView(s) : yearView(r.year);
  } else { yearsNav(null); $('sub').innerHTML = ''; view.innerHTML = homeView(); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
$('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q){ render(); return; }
  yearsNav(null); $('sub').innerHTML = ''; $('view').innerHTML = searchView(q);
});
document.addEventListener('click', e => {
  const a = e.target.closest('a.yt');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  a.outerHTML = `<div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/${a.dataset.yt}?autoplay=1" title="${a.getAttribute('aria-label')}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  const r = route();
  if (r.page !== 'year' || !r.qr) return;
  const ys = byYear(r.year), i = ys.findIndex(s => s.qr_number === r.qr);
  if (e.key === 'ArrowLeft' && i > 0) location.hash = key(ys[i - 1]);
  if (e.key === 'ArrowRight' && i < ys.length - 1) location.hash = key(ys[i + 1]);
});
render();
if (LOCK.years.length){ let pw = null; try { pw = sessionStorage.getItem('qrGuidePw'); } catch (e) {} if (pw) unlock(pw, true); }
</script>
</body>
</html>
