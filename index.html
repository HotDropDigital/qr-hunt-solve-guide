 (onthejohn / the.cline.fam) won. A hunter was 2nd at about 3 pm, and a Discord server team (hunters) was 3rd. John and Dave said the winners came 'up from behind' while they waited for a Discord server team to call.", "The winning team planned to hike to the treasure chest with the organizers the next day."], "hints": ["Hint for QR #8 (email screenshot): \"There is no secret or concealed information you need to find hidden within the image we emailed you in order to decipher the numbers. The email everyone is sent with the final clue has a hint within the text. Just like in years past, the final challenge has multiple steps. The solution lies at the end.\"", "Organizer statement (quoted by a hunter): \"The solve will lead you to the exact coordinates. There will be no guessing.\""], "open_questions": ["The final-clue release date conflicts: some sources say 2023-10-16 (by email about 48 h after the QR7 selfies; also posted in #official-clues), but one says the email came about 17:43 on 2023-10-20. The team was already discussing the triples on 10-18.", "The Art of War decode: the 2024 recollection of the Notion write-up says the plaintext includes the word 'website', but a hunter's 2023-10-21 decode of the seven triples is 'formation that provided protect(ion) on all sides' (seven words, no 'website'), giving PHALANX. The final step-2 URL (presumably site URL + / + phalanx + piano per the code pattern) is not recorded verbatim.", "Step 2: the Hobbiton latitude in the sheet (-37.8595858, image5) ends in 8, but digit 5 of 385-645-5725 is 4. No source explains this. Coordinates for the other photos are not fully recorded.", "Step 3 digit mapping conflicts: one source says the 'muscles and drinks' digit was 8, not the expected 6. The team's later decode has drinks/muscles = 6 as the last digit and 'what repeats again' = 8. A hunter also said the '986' part was unexplained.", "The meaning of the 'season' (=4) and 'make a wish' (=3) digits in the final decode is not explained.", "The verbatim voicemail wording and line breaks are uncertain: the original had no pauses, and a hunter's typed version groups the lines differently.", "Physical endpoint: a hunter says the organizers gave the winners the treasure-chest coordinates and the last QR code was in the chest; says the first caller gets GPS coordinates accurate to 3 feet. The chest location is not recorded. It is also unclear whether 'Harry Houdini' was the exact name/answer to give on the call.", "A hunter's account calls the latitude-derived first number 'Dave's'; the current record has the first number (385-645-5725) playing the recorded riddle and the second (801-784-3986) as the Google Voice line forwarding to Dave.", "A hunter's three images (scroll word-offset list, Egyptian-tomb digit cipher, parchment hiking poem) were called 'earlier clue images for this QR'. It is not established whether they belong to QR8 or to earlier QRs/the escape room."], "coords": null, "n_sources": 172, "steps": [{"t": "p", "label": "Overview", "text": "QR8 was the 2023 final, a three-step chain that ends in a phone call. The final clue came by email. The official hint says the image holds no hidden data, the email text holds the hint, and the challenge has several steps."}, {"t": "step", "n": "1", "clue": ["10.21.3 / 3.17.5 / 4.2.19 / 10.24.18 / 13.21.9 / 12.14.14 / 10.2.9"], "label": null, "lead": "A book cipher, read as chapter.paragraph (numbered verse/point).word in Sun Tzu's The Art of War.", "text": "What points to the book: the numbers are too large for page.line.word, the picture shows a war-type game, and the shape of the number grid fits it. The Art of War was also one of the books lying on the table in the QR7 escape room (it played no part in that solve).", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Decoded words", "lead": null, "text": "'formation that provided protect(ion) on all sides' (10.21.3 = chapter X, paragraph 21, word 3 = 'formation'). Googling the phrase gives PHALANX, the Greek battle formation at Thermopylae. That is the clue answer.", "bullets": []}, {"t": "step", "n": "3", "clue": ["inspect things carefully"], "label": null, "lead": "Inspect the clue-8 page source.", "text": "Right-click and Inspect the line 'Send your selfies to ... for review': a hidden div holds var riddle = 'What has keys but can't open locks?' (answer: PIANO) and console.log(url/clueAnswer + riddleAnswer). So the next page is the site URL + / + the clue answer + 'piano' (the exact URL was not recorded).", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Photo page", "lead": null, "text": "The step-2 page shows 10 photos of 10 locations. Match each photo to its Google Maps photo-sphere dot and note its latitude/longitude. In the HTML the <img> classes image1–image10 are displayed in the order 3,2,5,4,1,6,10,9,8,7. Sorted by class number they are: 1 Zanzibar Port, 2 Crystal Rapids (36.1352288), 3 Parque de la Fortuna (10.4716805), 4 Argentina/Paraguay/Brazil border (-25.59…), 5 Hobbiton/Green Dragon (-37.8595858), 6 Torch Tower, 7 Mont St Michel, 8 Haystack Rock, 9 Slag Bank, 10 Sydney Harbour.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Latitudes = phone number", "lead": null, "text": "Take the last digit of each latitude in class order to get (385) 645-5725. The organizers had said 'The solve will lead you to the exact coordinates. There will be no guessing.' Calling the number plays a voicemail with the step-3 riddle.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Riddle digits", "lead": null, "text": "Each line of the step-3 riddle gives one digit. Stop = 8 (octagon), Don't divide by me = 0, Romans/binary = 1, Each day of the week = 7, I'm the winning ball = 8 (8-ball), season = 4, wish/don't fall = 3, tic-tac-toe or baseball = 9, what repeats again = 8, drinks and muscles = 6 (six-pack). That gives 801-784-3986.", "bullets": []}, {"t": "step", "n": "7", "clue": ["He's under the name Harry Houdini"], "label": null, "lead": "Not a digit; it gives the name for the call.", "text": "The 801-784-3986 Google Voice line asks for a name and forwards to organizer Dave.", "bullets": []}, {"t": "step", "n": "8", "clue": [], "label": "Finale", "lead": null, "text": "The organizers gave the winners the treasure chest coordinates, and the last QR code was in the chest.", "bullets": []}], "title": "Final: book cipher, hidden riddle and a phone call", "media": [{"src": "media/2023-qr8-01.jpg", "section": "clue", "caption": "The final clue image emailed to teams: chapter.paragraph.word triples (step 1).", "kind": "image"}, {"src": "media/2023-qr8-02.jpg", "section": "solve", "caption": "The voicemail riddle typed out. Each line gives one digit of the phone number (step 6).", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2024, "qr_number": 1, "status": "confirmed", "confidence": 0.92, "clue_text": "Video clue, not text: an Instagram reel (https://www.instagram.com/reel/DAtqOL0S6u3/ by the.cline.fam and onthejohn; caption: \"The 2024 QR Treasure Hunt kicks off today ...\"), also emailed to teams, released about 13:26 MDT on 2024-10-04. Spoken line as auto-captioned: \"It's looking good too. It's Livingston and his dragons.\" (A hunter: definitely \"Livingston and his dragoons\"). Dave points down, then a photo of the plaque spot is shown (an arrow flashes for a split second at a lone tree/bush on the shoreline), followed by an overview shot of the area (Utah Lake / Provo Bay). Last frame: old map of the western US with a red flight line from Salt Lake City south toward the Grand Canyon/Arizona, text \"To be continued...\"", "plaque_question": "What city are you in?", "plaque_answer": "Vineyard", "location_name": "Utah Lake shoreline at Vineyard (Vineyard Beach area, just south of Lindon Marina), Vineyard, Utah", "location_detail": "Vineyard, Utah County, east shore of Utah Lake. Pin shared by a hunter's team: 40°19'22.6\"N 111°45'54.1\"W; a hunter's doc gives about 40.322977, -111.765025 (the same point). Next to a lone shoreline tree, which is what the reel's arrow points at. A Discord server chat describes the arrow frame as the edge of a gravel/dirt path next to a bush, between a dry brown field and a green field or pond/wetland (A hunter). Plaque: gold-colored metal plate with a QR code and a compass rose over a Utah outline, screwed to a fallen driftwood log by the shoreline (photo). Park in a small parking lot and walk to it (A hunter). Scanning alone doesn't count: the team also needs a selfie with the plaque. A hunter solvers advised bringing bug spray (A hunter).", "solve_path": "1) Kickoff reel: Watch the reel and step through it frame by frame (pause or screen-record it), because the key frame is on screen for only a split second. Dave points down to signal that the next image is the clue. That image shows the plaque spot, and a drawn 3D arrow flashes at a lone tree/bush on the shore road, at the edge of a gravel/dirt path next to the bush, between a dry brown field and a green field or pond. The arrow marks the plaque spot.\n2) Landscape: the frames show a lake shoreline with a dirt road/levee right at the water, a long straight feature running parallel to it inland, a canal/creek and marsh in between, and mountains behind that match the Oquirrhs with the Bingham Canyon mine.\n3) Overview shot: the shot that follows shows Utah Lake (Provo Bay). It gives the general area, but its focus is too far south: the QR spot is in the background of that shot, near Lindon Marina. The first image alone is enough to find the exact place, and both images lead to the same location.\n4) Flight map: the reel ends on an old map of the western US with a red flight line from Salt Lake City. Its path ends south of SLC, which fits Utah Lake rather than the Great Salt Lake.\n5) Satellite match: on Google Maps satellite view, match the frames' field and path pattern, including its zig-zag lines, and the shoreline features from step 2 along the Utah Lake shore near Lindon Marina. The lake level in the reel is lower than in the satellite photos, and the Google imagery is a few years old, so colors and the site look different now. The match is Vineyard Beach beside the Utah Lake Shore Trail, just south of Lindon Marina, at 40°19'22.6\"N 111°45'54.1\"W (about 40.322977, -111.765025).\n6) Plaque: park in a small parking lot and walk to the lone shoreline tree the arrow points at; the plaque is screwed to a fallen driftwood log by the shore. The plaque question is \"What city are you in?\" and the answer is \"Vineyard\".", "techniques": ["video-clue", "spoken-hint", "landmark-photo", "video-frame-analysis", "satellite-imagery-matching", "geolocation", "google-maps", "street-view"], "red_herrings": ["Great Salt Lake shorelines: 'north east / west of the SLC airport', Syracuse, Willard Bay (A hunter's dad recognised the mountain profile of the second shot), Farmington Bay; Promontory was judged too far north; one frame was read as 'looking south from the GSL'. The plaque was on Utah Lake.", "Small airports as the flight's start/end: Herriman, SLC, Provo, Farmington (street view there did not match); a hunter thought the airport in the video looked tiny and private.", "Provo Bay: the reel's overview shot focuses too far south and a hunter's husband guessed Provo Bay. Same lake, but the spot is in the shot's background near Lindon Marina, in Vineyard.", "Spoken line 'Livingston and his dragoons' (auto-captioned 'dragons'): chased as a hint for later QRs; no link to the QR1 solve appears in the chat.", "Two places: a a Discord server participant felt the plane-view screens came from two different places (A hunter); another answered that both images lead to the same location (A hunter).", "Satellite colors: the site's colors in Google satellite view differ from the video because the imagery is years old (A hunter)."], "missteps": ["The long straight feature running parallel to the shore inland was first read as a railroad track; a hunter later read it as a side barrier protecting runners from the road. The chat did not settle which."], "hunt_notes": ["In the #qr-1 chat, teams froze frames of the reel and took the arrow as the QR1 spot. In a Discord server channel, solvers screen-recorded the reel to step through it frame by frame (A hunter) and described the arrow with an image (A hunter).", "From the reel's plane footage, one a Discord server solver said they \"figured out which airport and the general area\" (A hunter).", "While matching the frames to satellite imagery, a hunter shared the Utah Aqua Spot StoryMap (ArcGIS) and a hunter tried the Picarta image geolocator.", "A hunter noticed that the closing flight map's path ends south of SLC.", "A hunter (Google Maps cursor on Vineyard Beach beside the Utah Lake Shore Trail) and a hunter each found the spot while a hunter's teammates were already driving there. A hunter posted the pin 40°19'22.6\"N 111°45'54.1\"W at 14:42, and a hunter confirmed \"That's the spot\".", "A hunter posted the plaque photo and the answer. The leaderboard showed 5 teams at 14:43, about 75 minutes after kickoff."], "hints": ["It's quick but in the reel this arrow flashes telling you exactly where QR1 is. That green area is Utah Lake"], "open_questions": ["Plaque answer conflict: the #qr-1 chat (A hunter) and a hunter's doc give 'Vineyard'. The #qr-8-part-1 record read 'LostnC...fuse...' off a partly hidden hint-email screenshot and took it as the QR1 answer. A hunter's doc names a hunter as the first team to find QR1, so the screenshot may show the first-finder team rather than the answer. Not checked against the full email.", "Location name: the #qr-1 record infers 'Vineyard Beach' from a Maps screenshot, and the chat itself only says 'Vineyard'. A hunter's doc says 'just south of Lindon Marina'. The coordinates in both sources agree.", "Flight map direction: the last frame was described as a red line from SLC south toward the Grand Canyon/Arizona (A hunter) and as ending south of SLC (A hunter). A hunter said the flight went east out of downtown SLC and heard 'flying to Juarez, NM'.", "The hint text comes from a hunter's summary doc. It is not clear whether it was an official organizer hint or a hunter's own note.", "The exact verbatim reel caption beyond 'The 2024 QR Treasure Hunt kicks off today ...' is not captured. Neither is the meaning of 'Livingston and his dragoons', if it has one.", "Release time: the current record says about 13:26 MDT; a Discord server record says the email went out around 1:32pm. These may be the reel and the email at slightly different times.", "Drive distance: a a Discord server solver said the site is about an hour's drive from Utah County (A hunter), but the plaque is in Vineyard, which is in Utah County. Their starting point isn't known.", "Airport: a Discord server chat links the plane to 'FLT Academy' and Woods Cross (A hunter). The #qr-1 chat guessed other airports (Herriman, SLC, Provo, Farmington), and the closing map shows a line starting at SLC. The departure airport isn't confirmed.", "Who told the hunter solvers to 'look for the arrow in the video' (A hunter), an organizer or another solver, isn't recorded.", "Message numbers marked 'a hunter mNN' come from a Discord server #qr1-planes-and-catfish channel and are a separate numbering from the unmarked mNN in the #qr-1 chat."], "coords": [40.322977, -111.765025], "n_sources": 82, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Kickoff reel", "lead": null, "text": "Watch the reel and step through it frame by frame (pause or screen-record it), because the key frame is on screen for only a split second. Dave points down to signal that the next image is the clue. That image shows the plaque spot, and a drawn 3D arrow flashes at a lone tree/bush on the shore road, at the edge of a gravel/dirt path next to the bush, between a dry brown field and a green field or pond. The arrow marks the plaque spot.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Landscape", "lead": null, "text": "The frames show a lake shoreline with a dirt road/levee right at the water, a long straight feature running parallel to it inland, a canal/creek and marsh in between, and mountains behind that match the Oquirrhs with the Bingham Canyon mine.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Overview shot", "lead": null, "text": "The shot that follows shows Utah Lake (Provo Bay). It gives the general area, but its focus is too far south: the QR spot is in the background of that shot, near Lindon Marina. The first image alone is enough to find the exact place, and both images lead to the same location.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Flight map", "lead": null, "text": "The reel ends on an old map of the western US with a red flight line from Salt Lake City. Its path ends south of SLC, which fits Utah Lake rather than the Great Salt Lake.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Satellite match", "lead": null, "text": "On Google Maps satellite view, match the frames' field and path pattern, including its zig-zag lines, and the shoreline features from step 2 along the Utah Lake shore near Lindon Marina. The lake level in the reel is lower than in the satellite photos, and the Google imagery is a few years old, so colors and the site look different now. The match is Vineyard Beach beside the Utah Lake Shore Trail, just south of Lindon Marina, at 40°19'22.6\"N 111°45'54.1\"W (about 40.322977, -111.765025).", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Plaque", "lead": null, "text": "Park in a small parking lot and walk to the lone shoreline tree the arrow points at; the plaque is screwed to a fallen driftwood log by the shore. The plaque question is \"What city are you in?\" and the answer is \"Vineyard\".", "bullets": []}], "title": "Kickoff reel geolocation", "media": [{"src": "media/2024-qr1-01.jpg", "section": "clue", "caption": "The kickoff reel on the organizers' Instagram.", "kind": "image"}, {"src": "media/2024-qr1-02.jpg", "section": "solve", "caption": "Reel frame with the arrow that flashes at a lone tree on the shoreline (step 1).", "kind": "image"}, {"src": "media/2024-qr1-03.jpg", "section": "solve", "caption": "Zoomed frame: the arrow points at the lone tree (step 1).", "kind": "image"}, {"src": "media/2024-qr1-04.jpg", "section": "solve", "caption": "The closing flight map, whose path ends south of Salt Lake City (step 4).", "kind": "image"}], "links": [{"url": "https://www.instagram.com/reel/DAtqOL0S6u3/", "label": "The kickoff reel on Instagram (the clue)"}], "wl": [{"match": "Watch the reel", "url": "https://www.instagram.com/reel/DAtqOL0S6u3/"}]}, {"hunt_year": 2024, "qr_number": 2, "status": "confirmed", "confidence": 0.95, "clue_text": "[Image-only clue, no text. The utahtreasurehunts.com \"Clue Number 2\" page shows a single picture (saved as Z.png by some players and served as 'Z.bin', really a ~2000x1339 JFIF/JPEG, on other devices): the famous photo of Michael Jordan (Bulls #23) in mid-air on his free-throw-line slam dunk, scoreboard clock reading 3:51, a Gatorade sign, an \"Eyewitness News Sports 4,5,6 & 10\" banner, and a crowd in which the score cards that read \"10\" in the original photo have been replaced by the numbers 17, 65, 77, 6, 9, 17, 90, 33, 27 (the 6 and 9 appear sideways; a hunter's solve doc reads the fourth number as 5).]", "plaque_question": "What trail are you on?", "plaque_answer": "Ferguson", "location_name": "Ferguson Canyon Trail (Ferguson Canyon), Cottonwood Heights, Salt Lake County, Utah", "location_detail": "Coordinates: 40.612869, -111.776521 (A hunter's string x 23); a hunter's doc 40.612846, -111.776521; a hunter's pinned 40.6126869, -111.776521. The plaque sits just off the Ferguson Trail; per an OpenStreetMap lookup done by the extractor (not stated in the chat) it is ~0.4 mi (700 m straight line) up from the trail's west end. A a Discord server player put it at about 0.9 mi from the trailhead, and a hunter said 'if you have gone more than a mile up you have gone to far'. It is below the waterfall; going as far as the waterfall is too far (A hunter). The hike is short but steep and rocky, uphill the whole way, about 30 min one way (A hunter), with a massive rock to climb over. Reported times range from about 23 minutes round trip to over an hour plus about 20 minutes of searching; a hunter said to expect about an hour, bring water and watch for rattlesnakes (mice and possibly cougars were also mentioned). It was 'rough' in the dark and the trail is hard to follow at night; a hunter twisted an ankle coming down. Phone service is spotty. The spot has a view of the city. The plaque (brushed-metal plate with the hunt's compass logo and a QR code, four brass screws) is screwed onto a fallen log hidden behind a big boulder/fallen tree to the RIGHT of the trail: 'just past this rock on the right, like 5 feet off the trail'. A hunter says a plaque from the first QR hunt was on this same trail, a little closer to the trailhead. Photos: [local file] (plaque on the log), IMG_0344-cd79d0b20f0d76ba.jpg (the boulder; plaque just behind), image0-5f28fcb717ccccb3.jpg (log circled in red). The trail was busy at night and the next morning, with many groups following others without knowing where to look. Parking: the lot overflowed, and cars parked in the neighborhood got warning tickets.", "solve_path": "1) Identify the photo: Michael Jordan's free-throw-line dunk from the 1988 Slam Dunk Contest. A reverse-image search finds the original.\n2) Compare with the original: the spectators' score cards, all '10' in the original, were edited. Read left to right, the edited numbers are 17, 65, 77, 6, 9, 17, 90, 33, 27 (the 6 and 9 are sideways; the 27 is at the far right where the original has no card). Two 10s near the top, just below the clock, were removed without replacement, and the top/nosebleed signs are not part of it.\n3) Concatenate the numbers in order: 1765776917903327.\n4) Multiply by the one unchanged number that matters, Jordan's jersey number 23 (the official hint says to 'use Michael Jordan's number for something'): 1765776917903327 × 23 = 40612869111776521.\n5) Utah coordinates start with 40 and -111, so split at the 111: 40.612869, -111.776521. Add the minus sign to the longitude and type both into Google Maps with a comma between them.\n6) Hike up the Ferguson Canyon Trail in Cottonwood Heights to the coordinates (about 30 min one way, steep and rocky) and find the plaque on a fallen log behind a boulder, ~5 ft right of the trail. The scan asks 'What trail are you on?' and the answer is 'Ferguson'.", "techniques": ["image-diff", "edited-image", "image-puzzle", "hidden-numbers-in-image", "number-code", "arithmetic", "multiplication-key", "coordinates", "sports-reference", "pop-culture-reference", "book-cipher", "sponsor-reference", "landmark-photo", "wordplay"], "red_herrings": ["Reading the edited numbers directly as GPS coordinates: Utah needs ~40 / -111, but both strings start with 17 (near Chad).", "Multiplying by 23 without concatenating first, or splitting the numbers before multiplying: 17657769 x 23 = 406128687 (right latitude, but 17903327 x 23 is nonsense); 17 x 657769 = 11182073; 1765775 x 23 = 40612825 and 917903327 x 23 = 21111776521 (or 17903327 x 23 = 411776521) are near misses that only work after fudging digits. Multiplying by 3 and/or 351 (the clock) never reaches 111. A hunter had the right latitude a day early ('so close').", "A hunter's 'swap out a 4 for a -1' / 'drop 21' shortcut (also used by a hunter as 'swap the 4 for a 1'): it landed on the right spot, but Erin later said it was not the intended method. A hunter's guess that dropping the 21 comes from ASCII 21 = 'negative acknowledge' (the minus in -111) was not confirmed.", "Guessing the extra unchanged number was 10 or 8; it was Jordan's 23. A hunter also suggested adding the clock time and the banner's 4,5,6 & 10. Reading a red '8' in the picture as a number.", "Adding 23 to the numbers before the sideways one (hunters): a hunter said 'Close', but the hint pointed to multiplication.", "Matrix multiplication (A hunter); Base64 tricks (A hunter de Galløws), described as overthinking it.", "Matching Jordan's points per game to game numbers in a ~90-game NBA season (A hunter): told to 'stick with what's in the pic'.", "A second 90 (hunters: '17 65 77 6 9 17 90 33 90 27'): not part of the working string.", "File name 'Z' theories: Z = Zahlen/integers, Z as a cipher/book hint, Livingston's 1765 'Z' essays. A hunter noted that 'Z' is just the tail of the base64 image data, which also happened in past hunts.", "William Livingston theory (from 'Livingston and his dragoons' in the QR1 video; 17|65 and 17|90 read as 1765 and his death year 1790): word-counting his Papers, the 1753 'Company of Dragoons' quote (too short for word 90), and his 13 Oct 1778 letter to Washington all gave nonsense. Livingston places (a canyon, a June 2024 concert by the singer Livingston) and 'Lagoon' (a joke) went nowhere. Dropped once organizers confirmed everything is in the picture.", "Book cipher using the numbers as word positions in the NBA.com 1988 dunk page, the hunt kickoff email, or a Flat Bill Podcast transcript from 3:51: gibberish. The Dominguez-Escalante journal from the QR1 video was proposed as the book but not shown to work.", "Sponsor theories: the Flat Bill Podcast video (hat lifts and blinking checked as Morse code) and sponsor websites: nothing found.", "Bible verse 3:51 (from the clock) in a Z book: no fit. Lamentations 3:51 was suggested but not confirmed.", "Letter/symbol decodes: A1Z26 with wrap-around (QMYFIQLGA) and its Atbash; periodic-table symbols; decimal ASCII (65 A, 77 M, 90 Z, 33 ! -> 'AM Z!'); 2-digit hex; CacheSleuth multi-decoder: none worked.", "Appending the digits or '/Livingston' to the site URL: nothing.", "Steganography / file tricks on Z.png / Z.bin: aperisolve, stego tools, a PNG IHDR-chunk idea, 'found zip', rebuilding a file from the numbers, and 1765775617903327 as an aperisolve password: nothing.", "Epoch timestamp (Feb 11 1971), sum (431), product: meaningless.", "Jersey numbers on the 1987/1988 Bulls rosters: no consistent match.", "Jordan -> West Jordan / Jordan River / West Jordan airport: wrong.", "A hunter's big-Discord coordinates (including the 81114158969 -> 41.58969, -111.415869 sum idea): close enough to put people on the same trail but not at the exact spot; many planned to hike 'to the end'.", "Wrong landing spots from bad math: Stairs Gulch (A hunter, before they 'finally got my solve right'), Strawberry Lake (A hunter; a hunter said no), Mt. Green (A hunter), the trailhead only (A hunter), Siberia/China (A hunter, missing the minus sign on longitude). Hobble Creek was asked about but never confirmed.", "Going up to the waterfall: a hunter went that far and a hunter said it was too far.", "A hunter's 40.4263719, -111.8886056 was only a coordinate-format example (random, not QR2); a hunter said it points to Thanksgiving Point.", "A hunter's GPS app changed the coordinates when entered (decimal vs. DMS format problem)."], "missteps": ["Chat was unsure whether the photo was from the 1987 or the 1988 contest until a hunter's group spotted a framed print reading '1988 Slam Dunk Champion'.", "A hunter's solve doc read the fourth number as 5 instead of 6: 1765775917903327 × 23 = 40612846111776521 → 40.612846, -111.776521, about 2.6 m from the 6 reading, so it still led to the plaque.", "A hunter's pinned typed coordinates, 40.6126869, -111.776521, have an extra 6 but still got teams to the spot.", "In a Discord server, players counted '8 fairly clear numbers... plus Jordan's number' (A hunter: '8 numbers total') and warned not to use marks that only might be numbers, such as a red '8'."], "hunt_notes": ["A Discord server channel for this QR was titled 'Air Jordan's'.", "A hunter's team, with a hunter, scanned at ~20:20 MDT on Oct 5 after a brief scan glitch (A hunter DM'd Dave on Instagram and he 'had to fix something'). Scanning starts a 24-hour countdown before the QR3 clue (due 8:17 PM Oct 6). Six teams had scanned by 23:05 Oct 5 and 55 by 00:30 Oct 6. A hunter's team, hunters and others found and photographed it the night of Oct 5/6.", "Organizer email: the first team to scan each QR wins $1k if the next scan comes within 48 h, otherwise $2k."], "hints": ["Official hint (quoted in a hunter's solve doc): 'If you look closely, there are fans holding numbers in the background we may have changed. Make a note of these numbers and then use Michael Jordan's number for something.'", "Organizer reply to a player's DM (screenshot posted by Eclosion in the big Discord, relayed by a hunter): 'Is everything we need to solve QR2 located in the picture?' -> 'Yes'.", "Unofficial nudge from a hunter (first solver): 'All you need is the numbers in the pic. The changed ones & one more that wasn't changed'; the target is coordinates.", "A hunter (A Discord server Discord, called an organizer in one record): 'Give * a try' (i.e. multiplication).", "A hunter: hikers should bring water, watch for rattlesnakes, expect about an hour, and 'if you have gone more than a mile up you have gone to far'.", "A hunter: the lat/long must fall within 39-41 and 110-112.", "A Discord server players: a hunter said only one type of math operation is needed; a hunter was told 'you're getting warmer' for multiplying the first group by 23; a hunter: 'Play with the numbers and you'll get it eventually'."], "open_questions": ["Fourth edited number: a Discord server reading and a hunter's working string use 6 (1765776917903327 -> 40.612869); a hunter's doc uses 5 (1765775917903327 -> 40.612846). That changes the latitude by 0.000023° (~2.6 m), so both lead to the plaque. A hunter (A Discord server) also asked about a 5 instead of a 6 and said it puts the point slightly further up the trail.", "Exact latitude: 40.612869 (A hunter's string x 23) vs 40.612846 (A hunter) vs a hunter's pinned 40.6126869 (apparent typo, ~20 m off).", "Number count: the current record lists nine edited numbers (including 27); a Discord server players said '8 numbers total' / '8 fairly clear numbers... plus Jordan's number'.", "Distance up the trail: the extractor's OSM lookup gives ~0.4 mi (700 m straight line) from the west end; a a Discord server player said about 0.9 mi from the trailhead; a hunter said more than a mile is too far.", "'gone_phishing': one record calls it QR2's answer in the official hint email's answer list ( screenshot), and a hunter's doc calls it the first team. But a Discord server chat says a hunter/a hunter's team scanned first (~20:20 Oct 5), and the plaque answer elsewhere is 'Ferguson'. Unclear whether gone_phishing is a team name, a hunter's team name, or something else in the hint email.", "Image file name/format: Z.png in one window vs Z.bin (JFIF/JPEG) in another; a hunter says 'Z' is a download artifact, not a hint.", "Photo year: 1987 vs 1988 dunk contest was unsure in chat; the framed print says 1988.", "Place name 'Ferguson Canyon Trail' comes from the plaque answer, a hunter's doc and an extractor's OSM lookup; the team chat itself never named the trail. In a Discord server, a hunter mentioned hiking Ferguson every year.", "A a Discord server message said 'I cant believe it was at Thanksgiving point again'; this does not match the Ferguson location, and the context is not given (A hunter's format-example coordinates pointed to Thanksgiving Point).", "Erin's 'correct solve where you're not dropping anything' was shared privately and not posted in a Discord server; presumably the concatenate-then-x23 method, but not stated there.", "How the numbers were put in order (A hunter's question in a Discord server) was not answered in that window.", "Techniques list includes book-cipher, sponsor-reference, landmark-photo and wordplay from failed approaches or partial extractions (kept per the union rule); the working method used only the edited numbers, multiplication and coordinates."], "coords": [40.612869, -111.776521], "n_sources": 352, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Identify the photo", "lead": null, "text": "Michael Jordan's free-throw-line dunk from the 1988 Slam Dunk Contest. A reverse-image search finds the original.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Compare with the original", "lead": null, "text": "The spectators' score cards, all '10' in the original, were edited. Read left to right, the edited numbers are 17, 65, 77, 6, 9, 17, 90, 33, 27 (the 6 and 9 are sideways; the 27 is at the far right where the original has no card). Two 10s near the top, just below the clock, were removed without replacement, and the top/nosebleed signs are not part of it.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Concatenate the numbers in order", "lead": null, "text": "1765776917903327.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": null, "lead": null, "text": "Multiply by the one unchanged number that matters, Jordan's jersey number 23 (the official hint says to 'use Michael Jordan's number for something'): 1765776917903327 × 23 = 40612869111776521.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": null, "lead": "Utah coordinates start with 40 and -111, so split at the 111: 40.612869, -111.776521.", "text": "Add the minus sign to the longitude and type both into Google Maps with a comma between them.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": null, "lead": null, "text": "Hike up the Ferguson Canyon Trail in Cottonwood Heights to the coordinates (about 30 min one way, steep and rocky) and find the plaque on a fallen log behind a boulder, ~5 ft right of the trail. The scan asks 'What trail are you on?' and the answer is 'Ferguson'.", "bullets": []}], "title": "Edited Michael Jordan dunk photo", "media": [{"src": "media/2024-qr2-01.jpg", "section": "clue", "caption": "The clue image: Jordan's 1988 free-throw-line dunk with edited score cards in the crowd.", "kind": "image"}, {"src": "media/2024-qr2-02.jpg", "section": "clue", "caption": "Clue Number 2 on the hunt site.", "kind": "image"}, {"src": "media/2024-qr2-03.jpg", "section": "solve", "caption": "The edited score cards circled (step 2).", "kind": "image"}, {"src": "media/2024-qr2-04.jpg", "section": "location", "caption": "The plaque on a fallen log behind a boulder, just off the Ferguson Canyon Trail.", "kind": "image"}], "links": [], "wl": [{"match": "the Flat Bill Podcast video", "url": "https://www.youtube.com/watch?v=SvzSF4ECR6c"}, {"match": "Flat Bill Podcast transcript from 3:51", "url": "https://www.youtube.com/watch?v=SvzSF4ECR6c&t=231s"}]}, {"hunt_year": 2024, "qr_number": 3, "status": "confirmed", "confidence": 0.95, "clue_text": "[Video clue; no text version of the clue was posted in chat] Unlisted YouTube video titled \"Inside the Legendary Treasure Hunt: New Clues Unveiled!\" on the Flat Bill Investors channel (about 22:30 long, reachable only after scanning QR2; axe watermark in the lower-left corner): https://youtu.be/4K9HBgiMVd8. Video description as quoted in chat: \"Join two hunters as they sit down with Utah Treasure Hunts to dive deep into the mystery behind their famous treasure hunt! In this exciting interview, you'll get an exclusive behind-the-scenes look at the inspiration, history, and challenges involved in creating the legendary hunt. You won’t want to miss it, as they may even reveal some new clues along the way! If you're a treasure hunting enthusiast or looking to join the adventure, this video is packed with insights and hints that could bring you closer to discovering the hidden treasure. Ready to start your quest?\"", "plaque_question": "What city are you in?", "plaque_answer": "Layton", "location_name": "Axe N Smash (axe-throwing venue), Layton, Utah", "location_detail": "2146 N Main Street, Layton, Utah (address from a hunter's solve doc only). Per another Discord (relayed by a hunter), the venue opened at 3 PM on Oct 7, 2024 and teams started scanning soon after. Inside, staff have you hit the bullseye with a thrown axe. They teach you how; a hunter said it was \"much harder than I thought\", and a hunter said most people hit the centre within ~15 minutes. A Discord server players reported hitting it on the first try or in 4 throws, and a hunter's nephew was paid to throw for other teams. The venue has 10–12 lanes and is kid-friendly (A Discord server chat). Then staff show you the plaque: a metal plate with a QR code over a compass rose and a Utah outline, held on a white binder (photo [local file]). Teams also took a selfie. A hunter was \"in and out in 3 minutes including taking selfie\". A Discord server moderator deleted the first QR3 channel because people were naming the venue and city.", "solve_path": "1) The clue: QR3 is a video, not text. It is an unlisted YouTube re-cut of the Flat Bill Investors podcast interview with the organizers Dave and John, about 22:30 long. This re-cut has an axe/hatchet drawing in the bottom-left corner; the organizers' public version of the interview does not. The clues are two movie quotes, four places named in the conversation, and the corner axe.\n2) 'I daresay we have the right man' / 'Someone with me on whom I can rely' = quotes from Sherlock Holmes (2009), at 16:09 and 16:27 in the video. They point to the scene where Holmes plots four sites tied to the Temple of the Four Orders on a map, and the cross they form gives the final location. So the task is to find four places in the video and connect them in a cross.\n3) Four places: the video names Ellison Park skate park (7:45), Lagoon (11:02), Coleman Knitting Mills in Ogden (19:17) and Clinton City Recreation Center (19:38).\n4) Axe watermark: the axe drawing in the bottom-left corner of the re-cut tells you what kind of place to look for, an axe-throwing venue. The organizers added it because they feared the puzzle was too hard; the official hint email says \"The watermark at the bottom left corner gave it away.\"\n5) Draw the X: on a map, draw a line from Clinton City Recreation Center to Lagoon and another from the Ellison Park skate park to Coleman Knitting Mills. They cross in an X (\"X marks the spot\") at an axe-throwing venue: Axe N Smash, 2146 N Main Street, Layton.\n6) Plaque: at Axe N Smash, staff have you hit the bullseye with a thrown axe (they teach you how) and then show you the QR plaque. The plaque question is \"What city are you in?\" and the answer is Layton.", "techniques": ["video-clue", "movie-quote-reference", "map-overlay", "line-intersection", "place-names-in-video", "watermark-hint", "local-business", "sponsor-location", "badge-icon-leak", "hidden-image-in-video", "frame-glitch", "social-media-hint", "repetition", "brute-force", "activity-challenge"], "red_herrings": ["Glitch frames (black screen at 10:54, white flash at 16:22/16:23, axe vanishing at 22:29): John Maxim answered 'No' when asked by DM if they were intentional; a hunter: 'the glitches really were just glitches'.", "Timestamps as coordinates (22:30 -> 2230/2 -> -111.5; 16:23 -> 1623/4 -> 40.575): a hunter admitted the arithmetic had no basis.", "Hatchet + 1054 as an axe-venue address: Social Axe in SLC is at 1154 S, not 1054; a hunter went there first and the staff knew nothing. A team was also sent to Axe N Smash American Fork; the answer was the Layton branch.", "A third flicker at ~11:22-11:24 (A hunter): nobody else could see it; likely a phone glitch or camera cut.", "Video length 22:29 vs 22:30 and flicker at 16:22 vs 16:23: YouTube player rounding, not different cuts.", "Flat Bill Investor logo seeming to appear/disappear (~0:50, ~20:00): it is on screen the whole time, hidden by the background or camera angle.", "Bright dots/noise in the dark background and the black 10:54 frame: compression artifacts; no Braille or Morse found.", "The blur/spots near the intro a hunter flagged: just the moving diamond-pattern background.", "Hidden data in the audio (A hunter's listen, a hunter's sped-up spectrum analysis) or in the auto-generated captions: nothing found.", "The hatchet's different position on the podcast cover image: probably a screenshot from a clip (A hunter).", "The 10:54 hatchet being the Roblox 'Goth Axe': close, but the handle and curve differ.", "Peter Pan ('Peter Pan syndrome' mentioned; Peter Pan movie at 10:54): no link found.", "Sponsor angle (A team, Greater Endodontics Riverton, Bulldog Disposal, MM Subaru, Healing Connections, Magellan HCM, Swords of Secret, Frost Box Rentals, Flat Bill Investor; Tax Hive / Fidelity National Title hats, Quivira Golf Club shirt, Club Paddock hat): nothing found. Bulldog Disposal's only post is from 2020; Healing Connections' 'tree that stands alone' post could not be connected.", "Word at ~0:22 that sounded bleeped: likely a stutter (A hunter).", "A hunter heard 'here's our QR code' ~12:10: the captions there talk about an IOU note in the chest.", "The Silver Hatchet (Arthur Conan Doyle), Doyle's 1923 Utah visit and A Study in Scarlet as the hatchet link.", "A hunter's four-points guess (Beehive/bees house, an axe-throwing spot, an eagle downtown, the SLC temple) and a hunter's triangulation from 3 places/times: right idea, wrong points.", "John's 'Flipping Friday' posts ('888 + 88 + 8 + 8 + 8 = 1000'): belonged to 2023 QR6.", "@theflatbillinvestor following @lostboysmarketing; a hunter's unfinished meetjoshz.com/podcast page: rabbit holes with nothing found.", "A hunter saying 'I live clear in Layton' and the 21:46 timestamp matching the 2146 N Main address: coincidences, not intended clues (per the solve doc).", "A hunter (A Discord server): using the address as a video timestamp; a hunter noted the address is longer than the video, even with a colon added.", "A hunter: pulling alpha channels and checking what another video mentioned at certain timestamps.", "A hunter: checking the closest place to every city mentioned in the video (described as part of how a hunter got to the site).", "Axe N Smash American Fork: a hunter went there with no luck.", "Axe N Smash South Jordan: a hunter drove there and was told the plaque wasn't there.", "Thanksgiving Point (Lehi): a hunter's guess, nobody confirmed it.", "A hunter's 'Spanish Fork / Hats / Battlestar Galactica' and asking whether the clue was 'the hats': role unclear, possibly a joke."], "missteps": ["Most teams did not draw the X: they went straight from the axe watermark to axe-throwing venues. Several teams had thought of axe throwing early but dismissed it as too easy.", "A hunter's sheet of axe-throwing venues listed Axe N Smash (South Jordan, American Fork), Heber Hatchets (SLC, Provo), Social Axe (SLC), The Yeetery (Spanish Fork) and Rhyno's (Orem), with no Layton entry.", "Some teams drove to candidate axe-throwing places one after another; two hunters said they solved QR3 only by brute force and did not know the intended method at the time.", "The QR3 completion badge/leaderboard icon was a target/bullseye, which also gave the answer away (A hunter). One a Discord server player said the badge \"limits it to the 60 places in utah it could be\".", "Before the find, a hunter timed the one-frame glitches: the black screen at 10:54,08 (about 0.01 s) and the white flash at 16:22,21, where Dave and John vanish.", "Before the find, people also studied John's Instagram story \"QR Hunt problems @the.cline.fam\", which showed a partly blacked-out text exchange with Dave Cline (\"I stopped by on Friday... We aren't ready for when they scan it though\")."], "hunt_notes": ["A hunter's dad spotted the video link in the hunt site's page code at 16:58 MDT on Oct 6, 2024. It had been uploaded 3 days earlier and had about 10 views. The official release was at about 20:17 MDT on Oct 6, when the countdown ended.", "A tip from another Discord said the Layton branch was being scanned. A hunter phoned the venue and was told \"definitely maybe\", with a challenge to do. A hunter walked in, hit the bullseye and got the plaque. The first teams found it around 15:30-15:38 on Oct 7 (7 teams, about 8 by 16:03).", "After the find, a hunter worked out the four-place X and a hunter linked it to the Sherlock scene. A hunter had quoted that screenplay passage at 15:34 as a \"four points make a location\" idea.", "Organizer John Maxim confirmed the intended method (Sherlock quotes, four places, X) in an Instagram DM dated Oct 8, 2024 2:27 PM, posted by a hunter; a hunter's solve doc gives the same method. John said they underestimated the solvers and \"never should've put the axe watermark\".", "In a Discord server, a hunter said the place type is mentioned several times in the video and there is only one such place in that area.", "In a Discord server, a hunter called the corner mark \"a huge identifier\", and a hunter said the video narrows it to one location, \"not as precise as a GPS location, but enough that a Google search will tell you the address\".", "A hunter later pieced parts of the solve together from the icon, the badge and something in the video; a hunter called it \"a very solid, precise solve\" and shared it by DM."], "hints": ["We thought this clue was going to be way tougher than it ended up being. We don't think almost anyone solved it the way we intended but that's part of the fun of the hunt. The watermark at the bottom left corner gave it away."], "open_questions": ["One record (#qr-8-part-1, from the official hint email's answer list, screenshot) gives plaque_answer 'a team'. The solve doc gives the question 'What city are you in?' with answer 'Layton' and names a team as the first team to find QR3. Which value the hint email's list actually showed is not resolved; 'Layton' was used here.", "The Oct 7 chat says no password or phrase was asked at the venue, but the solve doc lists the plaque question 'What city are you in?'. The question was probably asked after scanning online, but no source says so. A hunter (A Discord server) said the question asked after scanning 'tied back' to the place type, without quoting it.", "A hunter said the hosts mention 'Layton' twice and teams used that as a pointer, and a Discord server players also cited the repeated Layton/rec-center mentions. The solve doc says a hunter's 'I live clear in Layton' was a coincidence, not an intended clue.", "John's phrase that the axe 'puts you in the parking lot' is ambiguous: the axe as a shortcut to the venue, or the lines crossing in the venue's parking lot.", "The street address 2146 N Main Street comes only from the solve doc. The chat did not give an address, and nobody checked the exact line intersection with coordinates.", "The city of the Ellison Park skate park is not stated in any source.", "Whether John's Instagram story 'QR Hunt problems @the.cline.fam' (blacked-out text exchange with Dave Cline about being ready 'for the flood') referred to the Axe N Smash host is not confirmed.", "A a Discord server record (#qr4-scroll, 2024-10-09) labelled 2024 QR3 describes a different solve: red pixels in a clue image read as ASCII via the red RGB channel, giving a number of steps and a direction from the Spiral Jetty. This contradicts the video/Layton record and may belong to another QR (it came from the QR4 channel); it was not merged.", "A a Discord server record (#qr3-chop-some-wood) gives the venue area as 'Utah County / Salt Lake area', which disagrees with Layton (Davis County); the venue was scrubbed from that chat.", "One a Discord server record describes the corner mark as an account handle that stayed in the corner; other sources describe it as an axe/hatchet watermark. Whether these are the same mark is not stated."], "coords": null, "n_sources": 238, "steps": [{"t": "step", "n": "1", "clue": [], "label": "The clue", "lead": null, "text": "QR3 is a video, not text. It is an unlisted YouTube re-cut of the Flat Bill Investors podcast interview with the organizers Dave and John, about 22:30 long. This re-cut has an axe/hatchet drawing in the bottom-left corner; the organizers' public version of the interview does not. The clues are two movie quotes, four places named in the conversation, and the corner axe.", "bullets": []}, {"t": "step", "n": "2", "clue": ["I daresay we have the right man", "Someone with me on whom I can rely"], "label": null, "lead": "Quotes from Sherlock Holmes (2009), at 16:09 and 16:27 in the video.", "text": "They point to the scene where Holmes plots four sites tied to the Temple of the Four Orders on a map, and the cross they form gives the final location. So the task is to find four places in the video and connect them in a cross.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Four places", "lead": null, "text": "The video names Ellison Park skate park (7:45), Lagoon (11:02), Coleman Knitting Mills in Ogden (19:17) and Clinton City Recreation Center (19:38).", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Axe watermark", "lead": null, "text": "The axe drawing in the bottom-left corner of the re-cut tells you what kind of place to look for, an axe-throwing venue. The organizers added it because they feared the puzzle was too hard; the official hint email says \"The watermark at the bottom left corner gave it away.\"", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Draw the X", "lead": null, "text": "On a map, draw a line from Clinton City Recreation Center to Lagoon and another from the Ellison Park skate park to Coleman Knitting Mills. They cross in an X (\"X marks the spot\") at an axe-throwing venue: Axe N Smash, 2146 N Main Street, Layton.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Plaque", "lead": null, "text": "At Axe N Smash, staff have you hit the bullseye with a thrown axe (they teach you how) and then show you the QR plaque. The plaque question is \"What city are you in?\" and the answer is Layton.", "bullets": []}], "title": "Podcast video and four-place map intersection", "media": [{"src": "media/2024-qr3-01.jpg", "section": "clue", "caption": "The video thumbnail, with the axe drawing in the corner circled.", "kind": "image"}, {"src": "media/2024-qr3-02.jpg", "section": "clue", "caption": "The unlisted re-cut of the podcast interview on YouTube.", "kind": "image"}, {"src": "media/2024-qr3-03.jpg", "section": "solve", "caption": "The axe watermark in the bottom-left corner (step 4).", "kind": "image"}], "links": [{"url": "https://youtu.be/4K9HBgiMVd8", "label": "The clue video, an unlisted re-cut of the Flat Bill Investors interview"}], "wl": [{"match": "unlisted YouTube re-cut", "url": "https://youtu.be/4K9HBgiMVd8"}, {"match": "16:09", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=969s"}, {"match": "16:27", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=987s"}, {"match": "7:45", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=465s"}, {"match": "11:02", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=662s"}, {"match": "19:17", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=1157s"}, {"match": "19:38", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=1178s"}, {"match": "10:54", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=654s"}, {"match": "16:22", "url": "https://www.youtube.com/watch?v=4K9HBgiMVd8&t=982s"}]}, {"hunt_year": 2024, "qr_number": 4, "status": "confirmed", "confidence": 0.95, "clue_text": "[Image clue: parchment scroll with 22 letter+number codes in two columns of 11]\nLeft column (top to bottom): D8, E4, F11, C2, B21, A5, C14, G15, C79, E3, D1\nRight column (top to bottom): F18, G14, E9, B1, G8, F6, C7, A16, C1, C16, B7", "plaque_question": "What did you cross to scan the QR?", "plaque_answer": "Slackline (written \"slack line\" in the chat)", "location_name": "Hang Time trampoline/adventure park, Orem (plaque at the far end of a slackline), reached via a claw-machine puzzle at El Mexsal restaurant, Provo", "location_detail": "Stop 1: El Mexsal (also written \"El Mexal\" in the chat), a small Mexican restaurant and hunt sponsor in Provo on Freedom Blvd, with a claw machine whose prize eggs/balls hold shredded paper tickets. Hunters describe the menu as pupusas, quesadillas, nachos and tacos (Salvadoran/Mexican); it opens 11 AM, closes about 9 PM and is closed Sundays. Stop 2: Hang Time trampoline park in Orem (described in the chat as a children's venue / ninja-obstacle course near stop 1, reached from a southbound freeway exit; about 1-1.5 h drive from SLC/Midvale). The QR plaque is at the far end of a slackline, on a small platform (on the platform wall / screwed to a hinged board) in a blue-lit room. The plaque sits under a hinged particleboard flap; a photo of the 'bear of stone' rock formation (from a past Poem hunt at Heughs Canyon) is glued to the flap ([local file]). The plaque is a metal plate with a dotted-style QR code and a compass rose over a Utah outline. Hours noted that Friday: restaurant closes 9pm, park 11pm. Plaque photos: [local file], [local file]; selfie with the plaque: [local file]; blue-lit room: [local file] The QR opens a utahtreasurehunts.com/current-treasure-hunts/<hunt id>/<qr id> page (the full URL was pinned in the chat). Waits at the slackline were reported up to 2 hours.", "solve_path": "1) The clue: 22 codes, each a letter A-G plus a number, in two columns of 11. Every number is 1-21 except C79, and no pair repeats. The letters A-G are musical note names, but the numbers are too large to be real chords (B21, C79): it is a two-step cipher, not a one-step one.\n2) Official hint: the hint email says that solving the cipher tells you exactly where to go, and that you need \"a little music theory and an old, important document\". The parchment-scroll image itself (old paper = old document) was meant to point to a historic document, as organizer Dave said afterward.\n3) Music theory: number the note names starting from C, the way scales start on middle C: C=1, D=2, E=3, F=4, G=5, A=6, B=7. Each code becomes (section).(position). Read down the left column, then the right: 2.8 3.4 4.11 1.2 7.21 6.5 1.14 5.15 1.79 3.3 2.1 | 4.18 5.14 3.9 7.1 5.8 4.6 1.7 6.16 1.1 1.16 7.7.\n4) The old document: the Bill of Rights, used as an Ottendorf/book cipher. Letter+number pairs plus a hint naming a document point to a book cipher; here the note value picks the amendment, and the number picks the nth letter of that amendment's text, counting letters only (not words). Use the current version of the text, not the original.\n5) Worked examples: D8 = 2nd Amendment, 8th letter, G (\"A well reGulated\"). E4 = 3rd Amendment, 4th letter, O. F11 = 4th Amendment, 11th letter, T. C2 = 1st Amendment, 2nd letter, O. B21 = 7th Amendment, 21st letter, E. A5 = 6th Amendment, 5th letter, L. C79 = 1st Amendment, 79th letter, the X in \"exercise\" (the X of MEXSAL). B7 = 7th Amendment, 7th letter, S. The left column spells GOTOELMEXSA and the right column spells LBRINGSOCKS, so the message is \"GO TO EL MEXSAL. BRING SOCKS.\"\n6) El Mexsal: a small Mexican restaurant and hunt sponsor on Freedom Blvd in Provo. Staff give you claw-machine tokens. The prize capsules hold strips of shredded paper that you tape together into a picture; some capsules hold an unshredded ticket, e.g. a Healing Connections \"It's your lucky day!\" slip, which only skips the reassembly step. The assembled ticket is a 1-hour pass to Hang Time, a trampoline park in Orem, and the socks are for the trampoline park. You could instead pay at Hang Time, but organizer John's Instagram video said you need a selfie at every physical location you visit, not just at the plaque.\n7) Plaque: at Hang Time, cross the slackline in the blue-lit room to the small platform at its far end, where the QR is, under a hinged flap (the photo glued to the flap is not needed). People crossed walking on it, crawling on their belly or hanging underneath; the organizer said a teammate may cross for you, and a failed attempt sends you to the back of the line. The plaque question is \"What did you cross to scan the QR?\" and the answer is \"slackline\".", "techniques": ["ottendorf-cipher", "book-cipher", "letter-position", "number-code", "letter-number-pairs", "image-cipher", "music-theory", "music-theory-note-to-number", "historical-document", "bill-of-rights", "sponsor-reference", "sponsor-location", "business-partner-location", "multi-stop-hunt", "multi-stage", "multi-step-cipher", "physical-challenge", "selfie-verification", "official-hint"], "red_herrings": ["Reading the codes as real chords or piano notes (C79 vs 88 keys, octave numbers, D8 = D F# A D, C79 = C7 add 9, chord-end letters, sheet-music durations, solfege, music cipher wheel, MIDI/piano-roll plots, a letter-by-number grid read as Morse, numbers mod 7 to note letters plus an ADFGVX 7x7 cipher): numbers too large for chords and no output. The music part only meant counting note names from C. Also tried: notes as 3-bit binary (C=000 to 111); scale degrees (A hunter: 'scale yes, degrees no'); D=1 numbering (A hunter); a hunter's piano-roll grid ('it was not a hedgehog', [local file]); making a song from the notes.", "A hunter said C=1 numbering was incorrect; C=1 is the scheme that decodes.", "'When You Wish Upon a Star' note match (rumor from the big Discord, a hunter's spreadsheet): the left column fits the first phrase if reordered, but the right column is one note off. It could not be reproduced, and people called it 'complicated and forced'. Composer Leigh Harline's Utah ties were also chased.", "Wrong source texts for a book cipher: Sherlock Holmes (His Last Bow, Baskerville), Les Miserables, The Hobbit, Two Towers (two columns = two towers), Scheherazade / One Thousand and One Nights / Poe (from the font), Hunchback of Notre-Dame, Escalante journal, Ready Player One (39 chapters), Space Jam soundtrack (6 songs), The Seven Ages of Man, Taylor Swift's Red, Abbey Road / Beatles albums, Narnia, Harry Potter, Julius Caesar, Marcus Aurelius' Meditations, movie scripts, The Go-Giver / Crucial Conversations (from a sponsor's podcast), Future House Publishing books on the SwordsOfSecret shelf reel, the organizers' Goodreads shelves. Also: songs/lyrics in general (A hunter), Schoolhouse Rock Preamble sheet music, a piece with 'II' in the name, Da Vinci Code / Fibonacci.", "Wrong historical documents after the hint: US Constitution (7 articles, two signature columns, tried first; a hunter's Saul Goodman 'We the People' GIF also pointed there), Declaration of Independence (A hunter switched to it from the right guess; a hunter doubted it on word count), Star-Spangled Banner, Magna Carta, Dead Sea Scrolls, Bible, Federalist Papers, Articles of Confederation, Utah constitution/statehood documents, the organizers' first poem, documents from old hunts (because of the recycle-bin badge), Documents of the Second Vatican Council, Treaty of Versailles / Armistice (from the 11s), '11 states at the time'.", "Bill of Rights decoded by words, or with the wrong numbering, gave gibberish for some (hunters); it must be counted by letters with C=1.", "Font theory: a font finder said Scheherazade, but the Latin letters match Times New Roman, so it tells nothing. Times New Roman read as Roman numerals or Caesar also gave gibberish.", "Caesar/letter shifts by each number (forward, backward, by column), a multiplicative cipher on A-G, ROT-47, swapping letter and number, Enigma, the prime-number cipher (79 = 22nd prime), hex/colour codes, base64 of the expanded letters or of the image, Roman numerals: all gibberish.", "Periodic table (79 = gold, 7 periods = A-G): the element symbols spell gibberish.", "Coordinates, Google Plus Code, chess/Battleship, plotting the pairs or column differences, letter x number scaled into coordinates (34.66 / 117.8): no valid output. Assuming the plaintext would be coordinates or an address was wrong; it was a plain sentence. A hunter's and a hunter's coordinate results were called 'super random' and probably wrong.", "Reading the output as a URL ('www', '.com', site path): nothing. The '9k=' attachment name is just the browser's default name for a base64 image.", "Image forensics and pareidolia on the scroll (tower under C2, topography, faces, lighthouse, aircraft, 8x8 block, hidden letters in the bottom black strip, Caldwell catalogue/constellations from an Instagram star picture, planetarium): compression noise or unrelated. The Instagram story was only a $50 sharing-giveaway notice.", "Sponsor Instagram posts (the.healing.connections lone tree, plane with no wings, iykyk poll): the sponsor said none were clues for the current hunt. The wingless-airplane image was a Back to the Future reference to a previous hunt.", "The hint email's scroll image ('We've been trying to reach you about your car's extended warranty') is only a meme (A hunter: a joke, not part of the hint). The QR4 badge icon (trash can / recycle bin) was read as a dumpster, ball pit or donation-bin clue and dismissed.", "'Bring socks' read literally as a dumpster dive or clothing-donation bin. The socks are for the trampoline park (see open questions).", "Location guesses from the socks hint: Kangaroo Zoo (Pleasant Grove, North Salt Lake, Lindon; a moderator's made-up example named Kangaroo Zoo Lindon and a hunter said Phase 1 has nothing to do with it), Airborne Lindon, Skyzone ('Not skyzone'), Thanksgiving Point (A hunter: not the location), Costco hot dog (joke).", "Teams following the leak went to a 'Tex-Mex' place. The cipher spells El Mexsal.", "The Healing Connections unshredded slip read as 'book a therapy session to bypass QR4': it only skips the shred reassembly.", "A big-Discord solver had the right decode but believed it was wrong because a restaurant employee knew nothing about the hunt (A hunter also went to the right place in the afternoon and employees said it was wrong).", "The 'bear of stone' photo on the QR flap (an inside joke from a past Poem hunt at Heughs Canyon): Dave Cline said hunters don't need it; some thought it was a QR5 point."], "missteps": ["Without the hint the clue went unsolved: the group spent four days on other ideas (see red herrings), and most players only identified the document after the hint email.", "Several solvers had trouble with online decoders such as boxentriq; a hunter said counting by hand worked better."], "hunt_notes": ["A hunter made the note-numbering breakthrough and a hunter tabulated the values. Chat nudges for that step: a hunter \"Scale, yes, degrees, no. Keep it simple.\" then \"C major\"; a hunter said the notes wrap around starting at C instead of A; another solver wrote \"Nashville really knows how to count\" (Nashville Number System). A hunter had called it a \"2 step cypher not a one step\".", "Chat nudges for the document: a hunter said to use the current version of the document, not the original; a hunter noted the original has no two columns, so the column layout depends on the transcription.", "A hunter posted the full decode at about 6:26pm MDT Fri 10/11. Another team had finished QR4 within hours of the hint email.", "A big-Discord solver posted the El Mexsal decode as \"wrong\" (about 7:30pm Fri) and later deleted it; that post leaked the solution. The hunter leaderboard went from 1 team to 9+ between 19:41 and 20:09, with a team second.", "Teams scanned: 11 by about 8:13pm, 29 by 9:11pm, 44 by 9:41pm, 90 by 11:17pm Fri, and about 173 by 2:22pm Sat. On Saturday the park had a huge line while only about three teams were at the restaurant, so solvers suspected the park location was leaking through selfies.", "The claw machine was reported broken on 10-12 and then fixed; hunters ate at El Mexsal and talked with John. The recycle-bin badge was said to \"make sense once you get to the location\" (A hunter suggested shredded paper).", "At the slackline, a hunter crossed for a hunter, and Dave and John on site said a kid could do it. Rope burns and bruises were common, so hunters advised wearing pants.", "Scanning starts a 2-day countdown to QR5 that runs from your own scan (A hunter: scanned 7:56pm Fri 10/11, QR5 at 7:56pm Sun 10/13)."], "hints": ["Official hint email for QR4 (Fri 2024-10-11, about 2:50pm MDT): 'When you solve the cipher for QR4, you will know exactly where you need to go. To break the code, you will need a little music theory and an old, important document.' (The Google Doc summary quotes the last words as 'an old, historic document'.) The email's image is a meme scroll: 'WE'VE BEEN TRYING TO REACH YOU ABOUT YOUR CAR'S EXTENDED WARRANTY'.", "UNOFFICIAL (John's Instagram story, Sat 2024-10-12 about 11:08am, not tagged as an official clue): 'I don't have my kids today and im getting hungry. I'm thinking about grabbing lunch somewhere, maybe some Mexican food.' A nudge toward El Mexsal ([local file]).", "UNOFFICIAL: in an Instagram DM, someone asked John (@onthejohn) whether the 4th clue can be solved by itself. He replied only with a zipper-mouth emoji.", "UNOFFICIAL (Discord solvers): a hunter said 'bring socks' is 'something you will end up reading' and the decode starts 'Go to...'; a hunter said the second part 'will seem random but it's important'; a hunter said John 'must be adding amendments to his rules'."], "open_questions": ["'whenpigsfly': the #qr-8-part-1 record lists it as the QR4 answer from the official hint email's answer list ( screenshot). A hunter's Google Doc gives it as 'First team: whenpigsfly', and the chat records give the plaque answer as 'slack line' / 'Slackline'. A a hunter window says 'a team/hfh' was first on the leaderboard. Whether whenpigsfly is a team name or a QR4 answer is unresolved.", "Plaque question wording: the Google Doc gives 'What did you cross to scan the QR?'. The chat only paraphrased it as asking what you had to cross.", "Socks: the Google Doc says bringing socks to El Mexsal got you two claw-machine tokens. The chat says staff approached solvers, no socks were needed at the restaurant, the socks were for the trampoline park, and you kept getting tokens until you won. A hunter said used socks were fine.", "Hint wording: 'old, important document' (email quote in chat) vs 'old, historic document' (Google Doc).", "Spelling: El Mexsal (cipher plaintext and most messages) vs El Mexal (one window).", "Plaque mounting: 'screwed to a hinged board' in a blue-lit room (chat) vs 'on the platform wall' (Google Doc) vs 'under a hinged particleboard flap in a dark room' (A hunter). These may describe the same setup.", "The full plaque URL was pinned in the chat but isn't recorded here. The restaurant's street address isn't given beyond Freedom Blvd, Provo.", "IMG_2476-f163d0cf6cd97799.png was attached in one window alongside the scroll image. It's unclear whether it is the clue itself. Chords_to_numbers2-8ab72c43c0055d8e.png is a working chart, not the clue. image0-207dda77556c4228.jpg is described as a screenshot listing the codes.", "The scroll art reuses the 2023 QR4 Monte Cristo scroll with a changed left edge and a different font (matched to Scheherazade / Times New Roman). Whether those changes meant anything was never established; the solve doesn't use them. A hunter noted the same scroll was used earlier for things that were not historic documents.", "The Bill of Rights is a 10-amendment document, but the cipher only uses amendments 1-7 (A-G). Nobody stated why the Bill of Rights rather than the 7-article Constitution; one solver connected the trash-can badge to Schoolhouse Rock's 'I'm Just a Bill'.", "One a hunter window says the right document but 'the part prior' to the part that 'actually made sense' was needed. How that maps to the Bill of Rights / Constitution wasn't explained.", "One a hunter record names an indoor business in Lindon (from a moderator's joke Kangaroo Zoo example and an 'Airborne Lindon' guess); the confirmed location is Hang Time, Orem.", "A hunter said the location was reachable at night, while other messages say Phase 1 had closed for the night and late hunters could not scan.", "'You need a code' (A hunter) / 'Phase 2 gives a code' (A hunter 10-12): what code this refers to isn't stated.", "A hunter said the organizers quoted a line from National Treasure and then removed the post; whether it relates to this clue is not established."], "coords": null, "n_sources": 729, "steps": [{"t": "step", "n": "1", "clue": [], "label": "The clue", "lead": null, "text": "22 codes, each a letter A-G plus a number, in two columns of 11. Every number is 1-21 except C79, and no pair repeats. The letters A-G are musical note names, but the numbers are too large to be real chords (B21, C79): it is a two-step cipher, not a one-step one.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Official hint", "lead": null, "text": "The hint email says that solving the cipher tells you exactly where to go, and that you need \"a little music theory and an old, important document\". The parchment-scroll image itself (old paper = old document) was meant to point to a historic document, as organizer Dave said afterward.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Music theory", "lead": null, "text": "Number the note names starting from C, the way scales start on middle C: C=1, D=2, E=3, F=4, G=5, A=6, B=7. Each code becomes (section).(position). Read down the left column, then the right: 2.8 3.4 4.11 1.2 7.21 6.5 1.14 5.15 1.79 3.3 2.1 | 4.18 5.14 3.9 7.1 5.8 4.6 1.7 6.16 1.1 1.16 7.7.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "The old document", "lead": null, "text": "The Bill of Rights, used as an Ottendorf/book cipher. Letter+number pairs plus a hint naming a document point to a book cipher; here the note value picks the amendment, and the number picks the nth letter of that amendment's text, counting letters only (not words). Use the current version of the text, not the original.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Worked examples", "lead": null, "text": "D8 = 2nd Amendment, 8th letter, G (\"A well reGulated\"). E4 = 3rd Amendment, 4th letter, O. F11 = 4th Amendment, 11th letter, T. C2 = 1st Amendment, 2nd letter, O. B21 = 7th Amendment, 21st letter, E. A5 = 6th Amendment, 5th letter, L. C79 = 1st Amendment, 79th letter, the X in \"exercise\" (the X of MEXSAL). B7 = 7th Amendment, 7th letter, S. The left column spells GOTOELMEXSA and the right column spells LBRINGSOCKS, so the message is \"GO TO EL MEXSAL. BRING SOCKS.\"", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "El Mexsal", "lead": null, "text": "A small Mexican restaurant and hunt sponsor on Freedom Blvd in Provo. Staff give you claw-machine tokens. The prize capsules hold strips of shredded paper that you tape together into a picture; some capsules hold an unshredded ticket, e.g. a Healing Connections \"It's your lucky day!\" slip, which only skips the reassembly step. The assembled ticket is a 1-hour pass to Hang Time, a trampoline park in Orem, and the socks are for the trampoline park. You could instead pay at Hang Time, but organizer John's Instagram video said you need a selfie at every physical location you visit, not just at the plaque.", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": "Plaque", "lead": null, "text": "At Hang Time, cross the slackline in the blue-lit room to the small platform at its far end, where the QR is, under a hinged flap (the photo glued to the flap is not needed). People crossed walking on it, crawling on their belly or hanging underneath; the organizer said a teammate may cross for you, and a failed attempt sends you to the back of the line. The plaque question is \"What did you cross to scan the QR?\" and the answer is \"slackline\".", "bullets": []}], "title": "Scroll of letter-number codes", "media": [{"src": "media/2024-qr4-01.jpg", "section": "clue", "caption": "The scroll clue: 22 letter-and-number codes in two columns.", "kind": "image"}, {"src": "media/2024-qr4-02.jpg", "section": "hint", "caption": "Organizer John's Instagram story on Sat Oct 12, an unofficial nudge toward Mexican food.", "kind": "image"}, {"src": "media/2024-qr4-03.jpg", "section": "location", "caption": "The plaque on the platform at the far end of the slackline, Hang Time.", "kind": "image"}, {"src": "media/2024-qr4-04.jpg", "section": "location", "caption": "The blue-lit room at Hang Time where the slackline is.", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2024, "qr_number": 5, "status": "confirmed", "confidence": 0.9, "clue_text": "[Image clue: a large crossword grid with scattered, out-of-order clue numbers; the answer-list header is misspelled \"ACCROSS\" in the original; 59 down has no clue text.]\n\nACCROSS\n1 Starts with a \"t\" and ends with an \"inkering\"\n5 A tire-some 365 days\n8 F off off\n11 That point in a conversation or relationship where you wonder why it didn't end ten minutes ago\n13 A place with grass, and sometimes benches. I guess sometimes no grass too.\n14 I said so\n16 Where it begins\n17 A person you used to think was \"the one\"----but now the instagram algorithm tells you is a narcissist\n20 Wasn't on your shirt until after you just ate lunch\n21 To discover something you were looking for\n24 Blood and strawberries\n25 Spike from Tom & Jerry\n28 Game: murdered with a candlestick in the library\n29a Treasure synonym. Starts with a B\n30 \"Sweet dreams are ____ this.\" (2 words)\n33 Baldwin who did voice work in Thomas the Tank Engine\n34 What you did after you told yourself you'd only have one bite, then suddenly the whole carton was empty\n35 Has only 3 vowels and is entirely written in cursive\n37 \"I really really really wanna ___-a-zig ah\"\n38 What you do to time when you're stuck in a meeting that could've been an email.\n40 In a realm where shadows linger I dwell. I'm a measure of life where sickness may swell. What am I?\n43 The Hitchhikers Guide to the Galaxy recommends a towel for this type of travel\n47 \"With Or ___ You.\" U2\n48 The only reason you pretend to like celery sticks on game day or at parties\n50 Thomas Harvey stole his brain\n56 When this Jason sings, he weirdly makes even the sunniest day seem a bit too optimistic\n57 What one does to the first letter of every bad decision in a text message\n58 \"___ for You\" Olivia Rodrigo\n60 They never say die\n65 How the first clue to this hunt was released on Instagram\n66 made popular by gen z in the game Among Us\n67 Some Russian guy somewhere is upset this is what everyone calls a video blog\n68 Tim Curry made the best clown\n70 What you need when you're famous and do something dumb\n72 You do this with the check engine light\n73 Excruciating\n\nDOWN\n2 May the force be ___ you\n3 They stop the way or stack for play\n4 He's got a lot of ground to cover, literally and musically\n6 The small setting for every Hallmark Christmas movie\n7 What you dreaded being picked in gym class\n9 Who can make my day seem bright? ___ you\n10 Drummer muppet\n12 It has its own bell\n15 ____ end of the world, and I feel fine (2 words)\n18 Whose Dallas Mavericks are they? Well 27% of them are his anyway\n19 Always Ignored in indexing and alphabetizing. You may not know this if you never used a card\n22 The way you'll die if you aren't kind to others\n23 What your clothes could be if you actually stuck to that diet\n26 A place you can dive for food, drugs, antiques, or to discover if your neighbor is a serial killer\n27 Intensely painful\n29d Seasoned Treasure Hunters may mistakenly see one of these as a llama\n31 Longing loving eye contact with Medusa\n32 Quick pick up game of soccer in England\n36 Jackson who played both pro football and baseball, and was the best in Tecmo Bowl\n39 No tengo cerebro, pero soy amigo de uno. A la gente le gusta golpearme obstinadamente contra cosas como las pistas dificiles de una búsqueda del tesoro. Respuesta en Inglés\n41 Home to the Outlets at Traverse Mountain where they backed out of letting us do our escape room last minute\n42 Joe: A Real American Hero\n44 A teenagers worst enemy in the mirror\n45 One who burps\n46 If you don't hum the Top Gun Anthem when you see one of these you're missing out. It's awesome\n49 There is no try\n51 A secret or disguised way of writing. I mean, unless you're a seasoned Treasure Hunter then its not very secret, is it?\n52 What you get to do with the chest if you win this whole thing\n53 Song by Bruno Mars most played on socials during a hunt\n54 Love of money is the root\n55 He has 12 movies and never runs on a Friday while chasing his victims\n59 (no clue text)\n61 The way the hose gets when the water is on and no water is coming out and your mind is out of the gutter\n62 Devises that discover the metal treasure in your yard, or at least, rust.\n63 The age Jennifer Grey was when she played a 17yr old that nobody put's in a corner. If your source gives you an age that doesnt fit, add 1.\n64 John Maxim and David Cline's relationship\n69 A fake one with gray and beige that colorblind people think the rest of you made up to make fun of them\n71 Orange veggie\n74 The way you'll have to go with every obstacle when going on a bear hunt\n75 Carrot\n\nBONUS\n76 down: This was an error we didn't notice until right before you guys got to this clue and is therefore unimportant, not part of the puzzle, and should be ignored, but for good measure its the abbreviation for \"lieutenant\"", "plaque_question": "What is the nearest restaurant to the dumpster?", "plaque_answer": "Harajuku (Harajuku Grill & Sushi)", "location_name": "Big red Bulldog dumpster in the field behind Harajuku Grill & Sushi, Harrisville (north Ogden area)", "location_detail": "539 N Harrisville Rd, Harrisville, UT 84404. Approximate coordinates 41.2682953, -111.9768871 (A hunter). The dumpster stands alone in the vacant, weedy field north of/behind the restaurant and is reached by a small dirt road. It has an unlocked side door, so no ladder is needed. The QR is inside on the back wall opposite the door, on the side nearest the dirt road. Tall grass and weeds make it hard to see, especially in the dark. Solve route: start on the G of BULLDOG over Ogden's Liberty Park, then go 6 squares/blocks left and 25 up to the X. On site you only scan the code; there is no activity. Video of the site: https://youtu.be/TIfAkOBMf5A.", "solve_path": "1) Crossword: the clue is one crossword image, about 28x30, with 75 entries numbered in shuffled order. The header is misspelled \"ACCROSS\" (a typo; the organizers said QR5's misspellings are not intentional or part of the clue), 59 down has no clue text, and a BONUS line says 76 down (\"lt\") is an error to ignore. Many entries are reciprocal pairs (73A 'Excruciating' <-> 27D 'Intensely painful'; 71D 'Orange veggie' <-> 75D 'Carrot'), which suggests the clue numbers carry the message.\n2) Fill the grid. Answers in clue-number order: 1 TINKERING, 2 WITH, 3 BLOCKS, 4 MILES, 5 GOODYEAR, 6 TOWN, 7 LAST, 8 OF ('F off off' = 'off' with the F removed), 9 ONLY, 10 ANIMAL, 11 OVER, 12 LIBERTY, 13 PARK, 14 BECAUSE, 15 IT'S THE, 16 START, 17 EX, 18 MARKS, 19 THE, 20 SPOT, 21 FIND, 22 ALONE, 23 BIG, 24 RED, 25 BULLDOG, 26 DUMPSTER, 27 EXCRUCIATING, 28 CLUE, 29A BOUNTY / 29D BEAR, 30 MADE OF, 31 STONE, 32 FOOTY, 33 ALEC, 34 ATE, 35 ARABIC, 36 BO, 37 ZIG, 38 KILL, 39 SKULL, 40 MORBIDITY, 41 LEHI, 42 GI, 43 INTERGALACTIC, 44 ACNE, 45 BELCHER, 46 AIRPLANE, 47 WITHOUT, 48 WINGS, 49 DO, 50 EINSTEIN, 51 CIPHER, 52 KEEP, 53 TREASURE, 54 EVIL, 55 JASON, 56 MRAZ, 57 CAPITALIZES, 58 ENOUGH, 59 FIFTY-NINE (blank clue, so the answer is its own number), 60 GOONIES, 61 KINKY, 62 DETECTORS, 63 TWENTY-SEVEN, 64 BROMANCE, 65 REEL, 66 SUS, 67 VLOG, 68 IT, 69 GREIGE, 70 PR, 71 CARROT, 72 IGNORE, 73 INTENSELY PAINFUL, 74 THROUGH, 75 ORANGE VEGGI
