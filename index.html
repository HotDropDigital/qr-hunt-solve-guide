E, 76 LT (the BONUS error).\n3) 'Ignore intensely painful through orange veggie' = ignore every answer from 27 (EXCRUCIATING) through 71 (CARROT). Answers 72-75 spell this line, and its two named entries are clue texts from the reciprocal pairs: 'Intensely painful' is the clue of 27 and 'Orange veggie' is the clue of 71. Many of the ignored answers are in-jokes about the organizers or the hunt (BROMANCE, REEL, LEHI). That leaves answers 1-26: 'Tinkering with blocks / Miles Goodyear town / last of only animal over Liberty Park because it's the start / Ex marks the spot / find alone (a lone) big red bulldog dumpster'.\n4) 'Tinkering with blocks' = treat the crossword squares as city blocks. The official hint: 'What if each block on the puzzle represented a city block?'\n5) 'Miles Goodyear town' = Ogden. Miles Goodyear built Fort Buenaventura there.\n6) 'Last of only animal' = the G at the end of BULLDOG. Once the ignored span is removed (which drops BEAR, 29D), BULLDOG is the only animal left in the grid.\n7) 'Over Liberty Park because it's the start' = place BULLDOG's G square over Ogden's Liberty Park (not the one in Salt Lake City) as the starting point. The park is only the start; the plaque is not there.\n8) 'Ex marks the spot' = the X square in the grid. From the G, go 6 squares left and 25 up, one square per city block, or overlay a transparent copy of the crossword on Google Maps or Google Earth at that scale. Laid out this way, BULLDOG runs along the bottom edge near 20th St and 'E X' sits at the top edge beside Harajuku Grill & Sushi.\n9) 'Find alone big red bulldog dumpster' = find a lone big red Bulldog dumpster. Bulldog is a dumpster brand/sponsor whose roll-off bins are red. At the X, a big red Bulldog dumpster stands alone in a weedy field behind Harajuku Grill & Sushi, 539 N Harrisville Rd, Harrisville. The QR is inside the unlocked dumpster, on the back wall opposite the side door. Plaque question: 'What is the nearest restaurant to the dumpster?' Answer: Harajuku.", "techniques": ["crossword", "number-code", "decoy-text-to-ignore", "hidden-message", "wordplay", "city-blocks", "grid-counting", "map-overlay", "local-history", "sponsor-reference", "organizer-references", "coordinates"], "red_herrings": ["Lehi + GI (answers 41-42) read as Granite Peaks Gastroenterology on Club House Dr by Thanksgiving Point, Lehi. Its dumpster is a brown ACE bin behind red gates, and both answers fall in the ignored span.", "Mining the ignored filler answers (an 'Einstein cipher', 'footy Alec ate Arabic Bo zig', 59/27 read as the address 5900 S 2700 W, bear = 29 and ate = 34 as numbers).", "Wrong grid guesses: INTERSTELLAR (43A), BOOTY (29A), 'pinky' (39D), 'Jiffy Time'/'Jiffy Size' (59D).", "Liberty Park in Salt Lake City (Tracy Aviary, Guam kingfisher, eagle fountain statue, Hogle Zoo): searched, nothing. The clue means Ogden's Liberty Park.", "Kingfisher Wetland Trail Loop / Fort Buenaventura / Miles Goodyear Park / disc golf area, Ogden: walked at night and by day, split up at every X on the map, nothing found. The fort was crowded with other hunters.", "A line from Fort Buenaventura to SLC's Liberty Park, an X at 40.92288, -111.91913, and lines among Tinker Toys (Rock Canyon, Provo), the fort, Liberty Park and 'the Y': no usable crossing.", "Ogden street-grid/president-streets theory: a hunter's X on Washington Blvd near Five Guys (blue dumpster) and the green-waste/glass drop-off at Monroe Blvd / 800 E (blue bin, city property).", "'Building 40' (building + fort + Y = forty) with eagle = animal over liberty: 40 Eaglegate Dr, Eagle Gate apt #40 in SLC, Eagles clubs, Eagle Mountain/Eagle Lake golf, BYU building 40 (doesn't exist), and 40 N / 40 S Freedom Blvd in Provo by Bulldog Stadium (only Waste Management/Ace dumpsters).", "Latitude-line theories: 40 29 34 N through Thanksgiving Point/Cornbelly's (no red dumpster) and 40.8 N / dEXter St (industrial parks, nothing).", "Ogden FrontRunner station, railroad-crossing X's, Coleman Knitting Mills, Lindquist Field/Raptors, Ogden Trolley overlay, Red Apple Financial ('find a loan'), Origin Alley, the Peery's Egyptian/'Ogden Theater' reading, Cinema 502 escape-room idea: none produced the plaque.", "Miles Goodyear Cabin grounds (a red dumpster and junk, nothing inside), Wonderful World of Trains, Bricks & Minifigs/40th St path, FedEx sites in Eagle Mountain and Orem.", "'Tinkering with blocks' as Roblox (a private/zero-visit LEGO game), Tinker Toys climbing area, Lincoln Logs/Lincoln Ave, Legos, Ogden's Christmas village. The intended meaning was crossword squares = city blocks.", "Hidden file or steganography in the clue image: it was just base64 image data.", "Four-city X (Ogden, Provo, Eagle Mountain, Park City) pointing about 6k ft up Dry Creek Trail. Lines between a hunter's 'forts' crossing in Millcreek. A candidate spot that was 'just a bunch of houses'.", "Old Ephraim the bear / the town of Ephraim (out of bounds). Driving past John's flip properties. Thinking the target might be a bulldog picture.", "A hunter's four-place X mapping: 'Miles Goodyear town' = Ogden, 'last of only' = Y (Provo / the Y on the mountain), 'animal over Liberty' = eagle = Eagle Mountain, 'tinkering with blocks' unresolved (city blocks or downtown SLC). Where the lines cross was meant to be the dumpster. The accepted reading is the G of BULLDOG over Ogden's Liberty Park.", "A red Bulldog dumpster on the street about 4 blocks from SLC's Liberty Park toward State Street (A hunter): checked in person, including underneath, no QR. A hunter said it was too easy to find just by driving around.", "Other companies' red dumpsters: a hunter's team found 9, silentraider found 3 near Liberty Park.", "A hunter phoned a far-off business to ask about a red Bulldog dumpster and was told no.", "A hunter's 'Al / Exmarks the spot' reading: Exmark is a lawnmower brand, so a hunter checked Al's the Chainsaw King, an Exmark dealer (photo IMG_9491). No dumpster. A hunter said the clue word is 'marks', not 'Exmark'.", "A hunter: 'last of only' = Y + 'animal over Liberty' = eagle, pointing to Ogden Young Eagles at an airport hangar. Not checked.", "The X-shaped YMCA near Liberty Park in Ogden (A hunter). Shared, not checked.", "The eagle statue on State Street / the condor statue at SLC's Liberty Park, because the statue forms an X. Raised, no one reported checking it.", "Staring at the black/white blocks to look for an afterimage illusion; folding the crossword like a MAD Fold-in (A hunter, not tried).", "Coordinates guesses: 41°13'58.6\"N 111°59'17.0\"W in Ogden (A hunter; hunters checked, nothing) and 41°15'27.2\"N 111°56'21.0\"W (A hunter; checked, nothing). 22.4439° N, 74.2203° W (A hunter) was a troll pointing to the Bahamas.", "A cross-shaped building next to E 900 in an aerial image (A hunter), posted as an 'X'; no reply.", "'Ex(xon) marks the spot': checking Exxon stations in Ogden (A hunter), from an unverified second-hand tip.", "'clocks' / 'wake up at 4:39' from a line-35 cipher (A hunter): a joke.", "Picking a Liberty Park: a hunter listed three and guessed the one in Eden; a hunter asked about downtown. The intended one is in Ogden.", "A hunter heard there was an activity to do at the QR5 site. two hunters said you just scan the code."], "missteps": ["Many solvers who overlaid a transparent copy of the crossword on Google Maps or Google Earth had trouble with the scaling.", "A hunter was '50 spreadsheets deep' before calling the solve 'a simple overlay'."], "hunt_notes": ["Solvers in a Discord server channel thought the numbering was out of order on purpose. A hunter asked whether to put the lines in order 1-75, and a a hunter replied 'That is a great place to start!'", "A hunter counted squares from the G (6 left, 25 up) instead of overlaying. A hunter made a recreation of the overlay (IMG_2681).", "Many teams scanned on the evening of 2024-10-16: the scan count reached 141-157 and the site was 'packed'. A hunter scanned early on 2024-10-17 with no one else there."], "hints": ["This crossword challenge is one of our all-time favorites. What if each block on the puzzle represented a city block?", "John's Instagram story (shared by a hunter): 'Everyone knows he's colorblind... but they didn't know he can't spell. There are no intentional misspellings in QR 5... but there are misspellings, It's not part of the clue.'", "Organizer (John) in a Discord server: the dumpster is outside, not inside.", "Organizer (John): it was placed so you can't find it just by driving around.", "Unofficial, from a hunter: 'remember what you did two years ago with the billboard!'", "Unofficial, from a hunter: 'You do something with the puzzle and a map'", "Unofficial, from a hunter: 'Try the park' (Liberty Park, 'but which one')", "Unofficial, from a hunter: 'Read the lines again it's not at the park'"], "open_questions": ["One record (from #qr-8-part-1, the official hint email) gives the plaque answer as '[Image of a Duck]'. The Google Doc lists '[Image of a Duck]' as the first team, and the plaque answer as Harajuku. The duck is probably the first-finding team's name/avatar, but this is unresolved. A a Discord server record says '[Image of a Duck]' appeared on the leaderboard with a 5th badge around 2 PM on 2024-10-16, and a hunter confirmed it is a real team.", "City: the address is 539 N Harrisville Rd, Harrisville, but other records just say 'Ogden'. A hunter's overlay image puts 'E X' near N 400 E / Wall Ave by Petco Grooming, central Ogden, next to Harajuku. These descriptions of the area don't fully agree.", "Which X square marks the spot: the Google Doc says 'look under EX' (17A), while the 10-16 record says the X in EXCRUCIATING. Both may be the same shared square, but that wasn't checked.", "Scaling: the official method is one square = one city block (6 left, 25 up). A hunter instead stretched the grid to the height of the park. Whether that gives the same spot isn't stated.", "Who scanned first: a hunter found it on the evening of 2024-10-16 with other hunters present, and the solve was reportedly leaked earlier in another Discord. The first team per the doc is '[Image of a Duck]'. The exact first-scan time isn't recorded, and neither is whether the prize dropped to $2K (A hunter asked). A a Discord server record puts the Duck team's 5th badge at around 2 PM on 2024-10-16, based on leaderboard screenshots rather than a scan log.", "The plaque question wording ('What is the nearest restaurant to the dumpster?') comes only from the Google Doc. A hunter just said the answer was the restaurant.", "BONUS line spelling: one transcription has 'abbreviation', another 'abreviation' (John said there are unintentional misspellings). Line 19D may be cut off in one image.", "Whether this crossword was originally written for QR3 or as a late replacement for the cancelled Traverse Mountain escape room is speculation (hunters).", "John said the dumpster is 'outside, not inside', while the current record puts the QR inside the dumpster on the back wall. He probably meant outdoors rather than inside a building, but that isn't stated.", "One chat says the next stage after scanning was a game ('practice my crafting recipes', possibly Minecraft). Another says there is nothing to do except scan the code. That could mean nothing on site with an online follow-up, but that isn't confirmed.", "A a Discord server record mentions 'last 4 numbers' in connection with the hidden message, with no context."], "coords": [41.2682953, -111.9768871], "n_sources": 616, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Crossword", "lead": null, "text": "The clue is one crossword image, about 28x30, with 75 entries numbered in shuffled order. The header is misspelled \"ACCROSS\" (a typo; the organizers said QR5's misspellings are not intentional or part of the clue), 59 down has no clue text, and a BONUS line says 76 down (\"lt\") is an error to ignore. Many entries are reciprocal pairs (73A 'Excruciating' <-> 27D 'Intensely painful'; 71D 'Orange veggie' <-> 75D 'Carrot'), which suggests the clue numbers carry the message.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": null, "lead": "Fill the grid.", "text": "Answers in clue-number order: 1 TINKERING, 2 WITH, 3 BLOCKS, 4 MILES, 5 GOODYEAR, 6 TOWN, 7 LAST, 8 OF ('F off off' = 'off' with the F removed), 9 ONLY, 10 ANIMAL, 11 OVER, 12 LIBERTY, 13 PARK, 14 BECAUSE, 15 IT'S THE, 16 START, 17 EX, 18 MARKS, 19 THE, 20 SPOT, 21 FIND, 22 ALONE, 23 BIG, 24 RED, 25 BULLDOG, 26 DUMPSTER, 27 EXCRUCIATING, 28 CLUE, 29A BOUNTY / 29D BEAR, 30 MADE OF, 31 STONE, 32 FOOTY, 33 ALEC, 34 ATE, 35 ARABIC, 36 BO, 37 ZIG, 38 KILL, 39 SKULL, 40 MORBIDITY, 41 LEHI, 42 GI, 43 INTERGALACTIC, 44 ACNE, 45 BELCHER, 46 AIRPLANE, 47 WITHOUT, 48 WINGS, 49 DO, 50 EINSTEIN, 51 CIPHER, 52 KEEP, 53 TREASURE, 54 EVIL, 55 JASON, 56 MRAZ, 57 CAPITALIZES, 58 ENOUGH, 59 FIFTY-NINE (blank clue, so the answer is its own number), 60 GOONIES, 61 KINKY, 62 DETECTORS, 63 TWENTY-SEVEN, 64 BROMANCE, 65 REEL, 66 SUS, 67 VLOG, 68 IT, 69 GREIGE, 70 PR, 71 CARROT, 72 IGNORE, 73 INTENSELY PAINFUL, 74 THROUGH, 75 ORANGE VEGGIE, 76 LT (the BONUS error).", "bullets": []}, {"t": "step", "n": "3", "clue": ["Ignore intensely painful through orange veggie"], "label": null, "lead": "Ignore every answer from 27 (EXCRUCIATING) through 71 (CARROT).", "text": "Answers 72-75 spell this line, and its two named entries are clue texts from the reciprocal pairs: 'Intensely painful' is the clue of 27 and 'Orange veggie' is the clue of 71. Many of the ignored answers are in-jokes about the organizers or the hunt (BROMANCE, REEL, LEHI). That leaves answers 1-26: 'Tinkering with blocks / Miles Goodyear town / last of only animal over Liberty Park because it's the start / Ex marks the spot / find alone (a lone) big red bulldog dumpster'.", "bullets": []}, {"t": "step", "n": "4", "clue": ["Tinkering with blocks"], "label": null, "lead": "Treat the crossword squares as city blocks.", "text": "The official hint: 'What if each block on the puzzle represented a city block?'", "bullets": []}, {"t": "step", "n": "5", "clue": ["Miles Goodyear town"], "label": null, "lead": "Ogden.", "text": "Miles Goodyear built Fort Buenaventura there.", "bullets": []}, {"t": "step", "n": "6", "clue": ["Last of only animal"], "label": null, "lead": "The G at the end of BULLDOG.", "text": "Once the ignored span is removed (which drops BEAR, 29D), BULLDOG is the only animal left in the grid.", "bullets": []}, {"t": "step", "n": "7", "clue": ["Over Liberty Park because it's the start"], "label": null, "lead": "Place BULLDOG's G square over Ogden's Liberty Park (not the one in Salt Lake City) as the starting point.", "text": "The park is only the start; the plaque is not there.", "bullets": []}, {"t": "step", "n": "8", "clue": ["Ex marks the spot"], "label": null, "lead": "The X square in the grid.", "text": "From the G, go 6 squares left and 25 up, one square per city block, or overlay a transparent copy of the crossword on Google Maps or Google Earth at that scale. Laid out this way, BULLDOG runs along the bottom edge near 20th St and 'E X' sits at the top edge beside Harajuku Grill & Sushi.", "bullets": []}, {"t": "step", "n": "9", "clue": ["Find alone big red bulldog dumpster"], "label": null, "lead": "Find a lone big red Bulldog dumpster.", "text": "Bulldog is a dumpster brand/sponsor whose roll-off bins are red. At the X, a big red Bulldog dumpster stands alone in a weedy field behind Harajuku Grill & Sushi, 539 N Harrisville Rd, Harrisville. The QR is inside the unlocked dumpster, on the back wall opposite the side door. Plaque question: 'What is the nearest restaurant to the dumpster?' Answer: Harajuku.", "bullets": []}], "title": "Crossword with hidden instructions", "media": [{"src": "media/2024-qr5-01.jpg", "section": "clue", "caption": "The crossword clue.", "kind": "image"}, {"src": "media/2024-qr5-02.jpg", "section": "solve", "caption": "A solved overlay of the answers, with BULLDOG along the bottom and the X near the top (steps 3 to 8).", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2024, "qr_number": 6, "status": "confirmed", "confidence": 0.92, "clue_text": "Congratulations on successfully completing the Murder at King's Corner Challenge. To find the next QR code, you only need two words. \"About-Rhenium.\"", "plaque_question": "What city are you in?", "plaque_answer": "Draper", "location_name": "Old railway tracks by the railway bridge over 1300 East at Highland Drive, Draper (off the Porter Rockwell Trail)", "location_detail": "Draper, UT. Finder's coords are 40.503116, -111.853641 (alt pin 40°30'11.3\"N 111°51'13.1\"W), confirmed as exact in chat. The plaque is on the old railway tracks about 100 paces southwest of the end of the bridge where the railway crosses 1300 E, next to the 1300 E / Highland Dr intersection. It is fixed to a railroad tie, at ground level, partly hidden under a bush, and hard to find in the dark. It is a short walk from a parking lot and not stroller-friendly. Earlier stages: Salt Lake County Animal Services, 511 W 3900 S, Salt Lake City, UT 84123 (Suba Bleu card on the adoption cork board; it opens at about 10 AM, closes at 6 PM and has a big parking lot that police patrol; hunters brought donations such as pet food, bleach and peanut butter), and the online games.", "solve_path": "QR6 has three stages: a browser shooter (6a), the animal shelter and the Murder at King's Corner game (6b), and the 'About-Rhenium' clue that leads to the plaque (6c).\n1) Stage 6a, browser shooter: the 'QRSlayer' game by PaceS on itch.io (https://paces.itch.io/jump?secret=cRrDrFM1MAHSsGym8c1N1t3c1Q) is a top-down wave-survival shooter that needs a PC. Past games are also in the UTH website arcade. The controls screen reads 'WASD to Move', 'Mouse to aim. Mouse Left Click to shoot', '…survive the timer to proceed to the next wave'.\n2) Waves: survive each wave's countdown timer. Beating wave 12 shows 'Well Done Agent.... Nice Work getting past…' and reveals the next location; you don't need to keep playing after that. Tips: hold the mouse button instead of clicking; run circles around the edge of the map, because surviving the timer matters more than kills; pick up health between waves; wait in the corners so enemies bunch up, then fire toward the middle.\n3) Stage 6b, animal shelter: the location revealed after the shooter is Salt Lake County Animal Services, 511 W 3900 S, Salt Lake City. The organizers said the QR plaque is not at the shelter. Visitors were told to take a selfie there; once you have the next part there is nothing else to do on site.\n4) Suba Bleu card: on the shelter's adoptable-dog cork board is a 'For Adoption' card for 'Suba Bleu' (Mark Miller Subaru, $5,000 starburst) with a small QR note taped to it. It links to the 360° virtual-tour game 'Murder at King's Corner: The Wimmer Case' (https://seamlessstudios360.com/ClientTours/MurderAtKingsCorner/index.htm).\n5) Murder game: collect evidence by solving ciphers and finding items in the rooms of the 601 (Wimmer) house, then fill in a logic grid. Items include Marty's nail clippers, which go back to the Back to the Future poster; the clue '\"X marks the spot,\" Indy declared'; Doc's/DeLorean clock code; a 'What is a House but its History' clue; a dino clue; tweezers; and keys. There are also X clues; one gives 'hoc loco', Latin for 'right at this point'.\n6) Ciphers: the book (Robert Louis Stevenson), mirror, dart board, T-Rex, BTTF clock and house ciphers, plus a 7th. The clock cipher is a pattern of two symbol types, the mirror cipher is the same pattern mirrored, and the book cipher alternates them; the clock cipher has to be decoded with a cipher tool. Each cipher gives more clues about the ones found in the house. The 'mwoet' cipher is a columnar transposition with key ABCDEFG, reading 'Mr West Went Into The Basement Between Eight PM and Nine PM'.\n7) Serpent Realm: the Bruce Lee poster leads to a red basement, the 'Red Serpent Realm'. Memorize the arrows in the basement before entering. Inside, click the barely visible floor squares in a set order that changes each time; a wrong click sends you back to the poster. Past it are a boiler/water-heater room and a secret walkway. In the water-heater room, click the black wall section on the left, where the cursor does not turn into a finger. The 10-18 hint email covers this part and says to 'click anywhere on the panel on the left side' in the room with the corpse.\n8) Closet clue: the clue between the skull and the book is up on a shelf in the closet, and it plays a jump-scare sound.\n9) Accusation: you can only go back outside after finding all the other evidence. Go outside, click the '601' on the roof above the porch, then click 'review the evidence', and seat the people around the table. Wrong guesses return '-SCORE- You need to revisit the evidence', and guesses are unlimited. The accepted accusation is Charles / ...urry / Star Wars / salad / paddle / 10-11 / flask. The success screen says 'To find the next QR code, you only need two words. \"About-Rhenium.\"' Hunters were told to take a selfie when they finished the game.\n10) Stage 6c, 'About-Rhenium': the two words from the success screen. The official hints say the information is on the About page of utahtreasurehunts.com but has nothing to do with the numbers at the bottom of that page.\n11) 'About' = the About page of utahtreasurehunts.com. That page has an embedded 'Utah Treasure Hunts About Us' YouTube video.\n12) 'Rhenium' = element 75, so go 75 seconds (1:15) into that video.\n13) Video frame: at that point Dave and John stand by old railroad tracks next to concrete barriers or a wall, with a half-covered mountain horizon behind them. Dave points and says '100 paces that way'.\n14) Place: the frame matches the old train tracks in Draper off the Porter Rockwell Trail, at the railway bridge over 1300 E by Highland Dr. This is the reused 2021 Junior Hunt spot; that hunt's Harry Potter book cipher read 'Drive wanted thirteen E and Highland Drive, from the bridge walk one hundred steps west along the old railway tracks'.\n15) Plaque: from the bridge, walk along the tracks about 100 paces southwest/west. The plaque is fixed to a railroad tie at ground level, partly under brush, and very hard to see. The question is 'What city are you in?' and the answer is Draper.", "techniques": ["video-game", "online-game", "web-puzzle", "multi-stage", "sponsor-reference", "logic-grid", "logic-puzzle", "brute-force", "cipher", "book-cipher", "vigenere", "wordplay", "latin-translation", "periodic-table", "atomic-number", "website-inspection", "video-timestamp", "landmark-photo", "paces", "reused-location", "local-history", "number-code", "coordinates", "url-guessing", "website-source", "anagram", "morse-code"], "red_herrings": ["Camping at the animal shelter overnight: John said the QR is not at the shelter; the first teams, who arrived around 4 pm, were turned away.", "Going ahead to Mark Miller Subaru or the Suba Bleu blue-dog hunt map locations: guessed as a crossover. Other guesses were that the blue dogs would be needed in later selfies or that a selfie would be checked at the shelter. None of this was used in the solve.", "Murder game: 'a-a-a-a-a-a-a' as the accusation was wrong. 'Rifle left at 11' looked like a contradiction but meant the rifle person left the house at 11. Mr. A hunter can't be the BTTF fan because Bertha likes BTTF. A hunter's 'Professor Plum in the Library with the Rope' was a joke.", "Murder-game ciphers still unsolved when the accusation was accepted: the house reward cipher 'Xmdflr'o uqmp zo wz flv pinxi...', and 'Quintet 1979: Somewhere the game has begun'. 'The house is the key' and 610 vs 601 were raised as keys.", "Murder game: clicking spots in the water-heater/boiler room sends players back to the Bruce Lee poster. Some players thought the stuck doors might never open.", "A hunter told players to turn their volume up for the closet clue. This was a prank, because that clue plays a jump-scare sound and no audio is needed.", "Numbers at the bottom of the About page (100 50 25 12 6 3 2 1): tried as halving and as rhenium's half-life, mapped to elements (Fm Sn Mn Mg C Li He H) with weight arithmetic, and summed/subtracted down to 1 = hydrogen. Official hints said they are unrelated.", "Kennecott/Bingham Canyon visitor center (rhenium is a copper/molybdenum byproduct): closed and gated on one visit; on another, staff knew nothing. A hunter found nothing at the trailhead sign south of it. Copperton Park: nothing found. Staff's 'Geneva Rocks' remark was offhand.", "Coordinates 41.2, -112.0 (half-life 4.12 -> 41.2; 187-75 = 112) leading to Skydive Ogden: searched at night, nothing found, and staff said they were not involved.", "601 E 300 S minus 75 = 526 E 300 S (Junior League of SLC): a hunter checked and found nothing.", "T-rHen = train = Trolley Square, and 75/2 = 37 = Rubidium = deep red = trolley: a hunter meant these as jokes. A hunter checked Trolley Square anyway and nothing stood out.", "Trax station in Murray: a team checked it and found nothing; XG replied 'it's not tracks'.", "Salt flats (XG answered 'No'), the Planetarium, and Thanksgiving Point (also joked about by a hunter as 'hoc loco' = 'right at this point'): guesses with no confirmation.", "A meetup spot David mentioned from the trail: suggested, not confirmed.", "Herriman: a hunter drove there to check spots, and a hunter had already searched the area without finding it.", "URL guesses: 'about-rhenium' appended to utahtreasurehunts.com, sponsor sites and the murder-game URL; /abbout-rhennium (based on the 'abbandoned' misspelling); /electrons; /xe4f145d56s2; the reversed text. Nothing worked. Sponsor About pages also turned up nothing.", "Wayback Machine check of the About page: it showed no changes for a year.", "Base64 approach (raised by a hunter) and the Utah Treasure Hunt logo opened as vector paths (A hunter, 'IYKYK'): not tied to the solve.", "Electron configuration Xe 4f14 5d5 6s2 as a cipher or URL; 'About minus Rhenium' by letter-number subtraction (gave negatives); a Caesar shift of FmSnMnMgCLiHeH: no result.", "Anagrams of ABOUTRHENIUM (Bruno Mathieu, harmonium tube, an 8+4 split); Latin re / Rhine = 'near a river'; ABBA 1975; Mark Miller Subaru's 1975 history page; rhenium in dentistry; uranium-238's 7 decays matching the 7 answers: raised but not used in the solve.", "Morse code reading of 'About-Rhenium' (gave 'putt Utah...' with no complete message); Morse in the kitchen song or moon-landing audio; names of the dogs on the shelter cork board.", "Man's image in the game source, reverse-searched to manorpa.com: a stock/template image.", "Hill Aerospace Museum: closed; the museum said on Reddit it wasn't involved.", "Weir Minerals, 3459 S 700 W, West Valley (700 linked to 'about').", "Instagram post #75 instead of 75 seconds into the video.", "Frostbox Rentals pixel/dot cipher (overlays, Morse, Galactic Alphabet, QR quadrants, 'icebox'/'tetris' block shapes; some thought the target was a Frostbox truck): organizers said it's for a future challenge, not QR6. It sent a hunter's team down a rabbit hole even though they already had the answer.", "Aperisolve 'common password: rhenium' on the Dave & John photo, which led to Mueller Park / Heughs Canyon guesses: it's a log of other users' inputs, and John said 'That is not real'.", "Murder-house easter eggs (orange-text meme link, @onTheJohn toilet link, moon-landing poster, BTTF poster dates, gas can, John's story timer 17:36, p.Lead CSS class): not connected to the solve.", "A Riverton address that a hunter thought looked more promising than the tracks: wrong.", "Assuming the 2021 Junior Hunt spot couldn't be reused: the organizers had replaced the old code on day one.", "A hunter guessed the shooter would lead to the same Roblox world as the previous year's hunt, but twice as long.", "The first-scan badge (a slack-rope walker) was read as belonging to QR5, and one theory was that badges had been shuffled to stop brute-forcing.", "The 'QR7 Super Real and Super Official Hint' image posted by a hunter is a parody poem ('If 75 pounds of treasure you seek... And go to the escape room'), not a real clue. Jokes about kissing 'the bear made out of stone' or bringing an Alpine horn are not real instructions either."], "missteps": ["One player survived the shooter by getting stuck in a wall glitch on the left side of the map.", "A hunter got the murder-game accusation by brute force, since wrong guesses are unlimited.", "Several players said they had the Draper location days earlier and dismissed it.", "A hunter was 'basically standing on' the plaque before someone pointed it out. A hunter was at the location the night before and missed the plaque."], "hunt_notes": ["In a Discord server Discord, the murder game was discussed in #qr6a-johns-dead, and the shooter, shelter and About-page steps in #qr6b-periodic-mental-break-downs.", "For the shooter, some players mapped WASD to a controller with JoyToKey or used an auto clicker.", "Players described the shelter as a place that was closed for the night and asked each other not to post its name.", "On 2024-10-17, starting around 10:00, Dave and John let people into the shelter 10 at a time. One player said the visit takes 'like 30 seconds' if there's no line.", "A teammate of a hunter who finished the murder game was told 'Goonies' is the key.", "After the first scans, a hunter confirmed 'It is indeed on the about page' and said 'the tech illiterate can still have a chance', and a hunter said 'Spend some time on the about page'.", "A hunter identified the video spot as the old train tracks in Draper.", "Solver comments after the find: 'Use the hints and references', 'don't over look the qr code pictures', 'It's actually very straight forward', 'x marks the spot', 'It lines up perfectly when you figure it out'. A hunter: 'I think everyone collectively was looking too deep at first.'", "A team was the first team; the first scan was around 09:23 on 2024-10-22 (silentraider said 9:30). 12 teams had scanned by 13:03 and 29 by 13:08. Scanning QR6 starts a 24-hour timer before the QR7 clue unlocks."], "hints": ["Hint for QR #6 (email, 2024-10-18 ~18:03): \"Anybody else get stuck in the Serpent Realm? To complete this part you need to find a corpse (Someone you may recognize) From this spot, look between the windows and move the cursor until you see the hand point. From there the rest of the spots are where you think they should be. When you get into the room with the corpse, click anywhere on the panel on the left side. If you've completed the King's Corner challenge, the two words don't have anything to do with the numbers at the bottom of the About page on our website. Depending on how quickly someone solves this one, us or a sponsor will probably release a clue on their socials in the next few days.\"", "Instagram (the.cline.fam / @onthejohn, 2024-10-22): \"The information you need to locate QR6 is on the About Page of our website but has nothing to do with the numbers at the bottom.\"", "Instagram PSA: \"The post by @frostboxrentals last night is part of a future challenge and has nothing to do with finding QR6. That clue is here -->\"", "John Maxim Instagram story (IMG_1879): 'Careful out there, empty dumpsters can be really slippery when wet.' / 'I know plucky just gave you the qr because they hate fun, but you'll still need a selfy, and maybe sooner than you think.' / 'Also, the correct answer for (3 letters) Always ignored in indexing and alphabetizing... \"the\". I should know, I'm a bulldog.'", "John's video: the QR code is not at the shelter, so don't camp out there.", "John (onthejohn) by DM: \"figuring out what it's referring to will move you to the next thing\".", "Mark Miller Subaru story: 'Could there be a crossover???' about the Suba Bleu blue dog hunt; Subaru said to pick up a blue dog at either of its locations (IMG_1888).", "Murder-game gloves clue: 'Pro tip: you usually need keys to open locked doors. Bonus insight: some doors are better left closed.'", "Instagram post from sponsor the.healing.connections showing a map rectangle from North Ogden to Provo, labeled 'This is an official 2024 QR hunt clue' (read as whole-hunt boundaries)."], "open_questions": ["Distance from the bridge differs between sources: '100 paces southwest' (A hunter doc), 'about 100 ft west' (finder chat), 'about 75 yards from the bridge' (A hunter). The video says '100 paces that way'.", "Coordinates differ: finder's 40.503116, -111.853641 (confirmed exact in chat) vs a hunter's earlier guess 40.50354927539355, -111.85303372488387 ('Is that the bridge?').", "Clue punctuation: most sources quote \"About-Rhenium.\" but one quotes \"About. Rhenium.\" a hunter's doc calls it a final image clue.", "One record (from #qr-8-part-1) listed 'a team' as the QR6 plaque answer from the hint-email answer list. A hunter's doc names a team as the first team to find it and gives the plaque answer as 'Draper' (Q: What city are you in?). It's unclear whether the hint-email list shows answers or finders.", "The 3-letter answer 'THE' from John's bulldog hint: the sources don't say which question it answered.", "Whether the shelter's Suba Bleu card QR was the official route to the murder game: a hunter's doc calls it unofficial, and one chat says teams 'received a link' when admitted. Earlier selfie steps (dumpster selfie, El Mexsal restaurant selfie) are mentioned, but their role isn't explained.", "The plaintext of the 'house is the key' Vigenère cipher and the 'Quintet 1979' clue were never posted.", "Last name in the accusation is quoted only as '...urry'/'urry'; the full name isn't given. One record adds a letter sequence C B G E C F A without explaining it.", "Stage order: the #qr6a-johns-dead record says players reached the closed physical location 'after surviving 12 waves of a second game', which would put the murder game first. The current record and the #qr6b chats put the shooter first, then the shelter, then the murder game.", "QR at the shelter stage: two hunters said the QR code was outside the closed building and you don't have to go inside. The current record says the QR note was taped to the Suba Bleu card on the cork board inside the shelter.", "Cipher count in the murder game: a hunter said 4 ciphers in one chat; another chat lists book, mirror, dart board, T-Rex, BTTF clock and house ciphers plus a 7th found by a hunter.", "Nail clippers: one player said they are on the window sill just before the room with the book; another said they are next to a poster on the same floor you return them to.", "The roles of the 'Goonies' key and the 'hoc loco' X clue in the murder game are not explained.", "XG replied 'it's not tracks' to the Murray Trax guess, but the plaque is on old railroad tracks. The chat doesn't say whether XG meant Trax/light-rail tracks only.", "A solver said 'If you scared of heights goodluck', but the current record puts the plaque at ground level on a railroad tie. The chat doesn't say what the comment referred to (possibly the railway bridge).", "One solver said there is a way to get a more exact spot than the general area, and those who skipped it ended up hiking. The method isn't stated; '100 paces' from the video is one possibility the sources don't confirm.", "Number of X clues in the murder game: three are mentioned, and some players talked about needing a 4th."], "coords": [40.503116, -111.853641], "n_sources": 340, "steps": [{"t": "p", "label": null, "text": "QR6 has three stages: a browser shooter (6a), the animal shelter and the Murder at King's Corner game (6b), and the 'About-Rhenium' clue that leads to the plaque (6c)."}, {"t": "step", "n": "1", "clue": [], "label": "Stage 6a, browser shooter", "lead": null, "text": "The 'QRSlayer' game by PaceS on itch.io (https://paces.itch.io/jump?secret=cRrDrFM1MAHSsGym8c1N1t3c1Q) is a top-down wave-survival shooter that needs a PC. Past games are also in the UTH website arcade. The controls screen reads 'WASD to Move', 'Mouse to aim. Mouse Left Click to shoot', '…survive the timer to proceed to the next wave'.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Waves", "lead": null, "text": "Survive each wave's countdown timer. Beating wave 12 shows 'Well Done Agent.... Nice Work getting past…' and reveals the next location; you don't need to keep playing after that. Tips: hold the mouse button instead of clicking; run circles around the edge of the map, because surviving the timer matters more than kills; pick up health between waves; wait in the corners so enemies bunch up, then fire toward the middle.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Stage 6b, animal shelter", "lead": null, "text": "The location revealed after the shooter is Salt Lake County Animal Services, 511 W 3900 S, Salt Lake City. The organizers said the QR plaque is not at the shelter. Visitors were told to take a selfie there; once you have the next part there is nothing else to do on site.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Suba Bleu card", "lead": null, "text": "On the shelter's adoptable-dog cork board is a 'For Adoption' card for 'Suba Bleu' (Mark Miller Subaru, $5,000 starburst) with a small QR note taped to it. It links to the 360° virtual-tour game 'Murder at King's Corner: The Wimmer Case' (https://seamlessstudios360.com/ClientTours/MurderAtKingsCorner/index.htm).", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Murder game", "lead": null, "text": "Collect evidence by solving ciphers and finding items in the rooms of the 601 (Wimmer) house, then fill in a logic grid. Items include Marty's nail clippers, which go back to the Back to the Future poster; the clue '\"X marks the spot,\" Indy declared'; Doc's/DeLorean clock code; a 'What is a House but its History' clue; a dino clue; tweezers; and keys. There are also X clues; one gives 'hoc loco', Latin for 'right at this point'.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Ciphers", "lead": null, "text": "The book (Robert Louis Stevenson), mirror, dart board, T-Rex, BTTF clock and house ciphers, plus a 7th. The clock cipher is a pattern of two symbol types, the mirror cipher is the same pattern mirrored, and the book cipher alternates them; the clock cipher has to be decoded with a cipher tool. Each cipher gives more clues about the ones found in the house. The 'mwoet' cipher is a columnar transposition with key ABCDEFG, reading 'Mr West Went Into The Basement Between Eight PM and Nine PM'.", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": "Serpent Realm", "lead": null, "text": "The Bruce Lee poster leads to a red basement, the 'Red Serpent Realm'. Memorize the arrows in the basement before entering. Inside, click the barely visible floor squares in a set order that changes each time; a wrong click sends you back to the poster. Past it are a boiler/water-heater room and a secret walkway. In the water-heater room, click the black wall section on the left, where the cursor does not turn into a finger. The 10-18 hint email covers this part and says to 'click anywhere on the panel on the left side' in the room with the corpse.", "bullets": []}, {"t": "step", "n": "8", "clue": [], "label": "Closet clue", "lead": null, "text": "The clue between the skull and the book is up on a shelf in the closet, and it plays a jump-scare sound.", "bullets": []}, {"t": "step", "n": "9", "clue": [], "label": "Accusation", "lead": null, "text": "You can only go back outside after finding all the other evidence. Go outside, click the '601' on the roof above the porch, then click 'review the evidence', and seat the people around the table. Wrong guesses return '-SCORE- You need to revisit the evidence', and guesses are unlimited. The accepted accusation is Charles / ...urry / Star Wars / salad / paddle / 10-11 / flask. The success screen says 'To find the next QR code, you only need two words. \"About-Rhenium.\"' Hunters were told to take a selfie when they finished the game.", "bullets": []}, {"t": "step", "n": "10", "clue": [], "label": "Stage 6c, 'About-Rhenium'", "lead": null, "text": "The two words from the success screen. The official hints say the information is on the About page of utahtreasurehunts.com but has nothing to do with the numbers at the bottom of that page.", "bullets": []}, {"t": "step", "n": "11", "clue": ["About"], "label": null, "lead": "The About page of utahtreasurehunts.com.", "text": "That page has an embedded 'Utah Treasure Hunts About Us' YouTube video.", "bullets": []}, {"t": "step", "n": "12", "clue": ["Rhenium"], "label": null, "lead": null, "text": "Element 75, so go 75 seconds (1:15) into that video.", "bullets": []}, {"t": "step", "n": "13", "clue": [], "label": "Video frame", "lead": null, "text": "At that point Dave and John stand by old railroad tracks next to concrete barriers or a wall, with a half-covered mountain horizon behind them. Dave points and says '100 paces that way'.", "bullets": []}, {"t": "step", "n": "14", "clue": [], "label": "Place", "lead": null, "text": "The frame matches the old train tracks in Draper off the Porter Rockwell Trail, at the railway bridge over 1300 E by Highland Dr. This is the reused 2021 Junior Hunt spot; that hunt's Harry Potter book cipher read 'Drive wanted thirteen E and Highland Drive, from the bridge walk one hundred steps west along the old railway tracks'.", "bullets": []}, {"t": "step", "n": "15", "clue": [], "label": "Plaque", "lead": null, "text": "From the bridge, walk along the tracks about 100 paces southwest/west. The plaque is fixed to a railroad tie at ground level, partly under brush, and very hard to see. The question is 'What city are you in?' and the answer is Draper.", "bullets": []}], "title": "Shooter game, murder mystery and a two-word clue", "media": [{"src": "media/2024-qr6-01.jpg", "section": "solve", "caption": "The success screen of the Murder at King's Corner game, which gives the 'About-Rhenium' clue (step 9).", "kind": "image"}, {"src": "media/2024-qr6-02.jpg", "section": "solve", "caption": "One of the cipher screens inside the murder game (step 6).", "kind": "image"}, {"src": "media/2024-qr6-03.jpg", "section": "hint", "caption": "Organizers' Instagram story, Oct 22: the answer is on the About page, not in its numbers.", "kind": "image"}, {"src": "media/2024-qr6-04.jpg", "section": "hint", "caption": "Organizers' PSA: the Frost Box post is for a future challenge, not QR6.", "kind": "image"}], "links": [{"url": "https://www.youtube.com/watch?v=R7rDr3jbE3M&t=75s", "label": "Utah Treasure Hunts About Us video, at 75 seconds (stage 6c)"}, {"url": "https://paces.itch.io/jump?secret=cRrDrFM1MAHSsGym8c1N1t3c1Q", "label": "QRSlayer, the browser shooter (stage 6a)"}, {"url": "https://seamlessstudios360.com/ClientTours/MurderAtKingsCorner/index.htm", "label": "Murder at King's Corner, the 360° tour game (stage 6b)"}], "wl": [{"match": "'Utah Treasure Hunts About Us' YouTube video", "url": "https://www.youtube.com/watch?v=R7rDr3jbE3M"}, {"match": "75 seconds (1:15)", "url": "https://www.youtube.com/watch?v=R7rDr3jbE3M&t=75s"}]}, {"hunt_year": 2024, "qr_number": 7, "status": "confirmed", "confidence": 0.9, "clue_text": "To find the next QR code, you only need two words. \"About-Rhenium.\"", "plaque_question": "What was the door code to enter the escape room?", "plaque_answer": "203467", "location_name": "Escape room in a shop at Trolley Square, Salt Lake City", "location_detail": "Trolley Square, Salt Lake City, south side on E 600 S near 600 E. Street level, under or just west of the sky bridge, near Weller Book Works (A hunter's map). Go in the south doors, turn left and go down a couple of stairs, where the old mail place was. Door descriptions: a red-framed wood-panel door with windows and a compass logo (chat); an out-of-the-way shop with the Utah Treasure Hunt logo on the door (A hunter's doc). Clue cards are taped to the door's window panes. Entry keypad code 203467. Three rooms. The QR is in the safe (code 52783) in the third room, past the crawl-through cupboard. The third room has a whiteboard where finders sign 'I was here', plus a separate spot labeled for selfies. Trolley Square hours: 10-8 daily, 12-5 Sunday. On 2024-10-23 the escape room was open until about 10 PM, with organizer John on site.", "solve_path": "1) Roblox stage: the next stage after QR6 is a Roblox obby, 'Treasure-Hunt' (https://www.roblox.com/games/9222077337/Treasure-Hunt; speedrun at https://www.youtube.com/watch?v=jsfYbvE2FlQ). (The clue text recorded for QR7, 'About-Rhenium', is QR6's success screen; rhenium is element Re, no. 75.) The obby has spam-jump walls, swinging platforms and discs, a slack line, rings, iceboxes, a pink-and-white maze and a 'collaboration area' where players jump on each other's heads; John said teams would need more than one person for this challenge. Teams had to submit a Roblox selfie with the billboard at the top. Zoom out from the final area to read it: it shows the Trolley Square water tower and says 'Go here to find the escape room. Use the clues on the windows to find the door code. Good luck!'\n2) Location: Trolley Square, Salt Lake City. On the south side along E 600 S, under or just west of the sky bridge, go in the south doors, turn left and go down a couple of stairs. The room is where the old mail place was, behind the same entry door as last year.\n3) Door code 203467: the 'clues on the windows' are six laminated photo cards in the window panes of the escape-room door, each with one digit edited out and circled. Find each scene around Trolley Square to read the missing digit: trusses = 2, red trolley no. 43 = 0, Cutler Mfg Co. Rochester NY patent plate (SEPT. 11TH 1883) = 3, black-and-white Utah Light & Railway trolley = 4, 'They Shaped Utah' Silvestre de Escalante = 6, UL&T Co caboose = 7. Tap or press the keypad screen hard to wake it. Just inside, a Blokus board spells 'SEVEN DIGIT CODE BUTNO BLOKUS'.\n4) Room 1: a dartboard says 'You'll need at least one bright idea'. Shine a phone flashlight on the light sensor at its center to unlock the door.\n5) Room 2: eight musician photos, each tinted red, blue, yellow or green. The 8th (Cher) appears when the heavy chain touches a metal plate in a cabinet; the official hint says to use the heavy chain. Put the names in alphabetical order (Beatles G, Beyonce R, Bono B, Cher G, Drake B, Madonna Y, Shakira R, Usher Y) and press GRBGBYRY on the four color buttons. A cupboard or crawl space opens.\n6) Room 3: the computer asks 'Name our sponsor'. Its wallpaper has the Magellan HCM logo (little mountains), which matches the sponsor list, so the password is 'Magellan'. Black lights then show a wall drawing of the whole hunt with 'HERE 527_ _', and two lamps (one a lampshade) show 8 and 3. Safe code 52783 (press C first to clear).\n7) Plaque: the QR plaque is in the safe/metal box in Room 3. The question is 'What was the door code to enter the escape room?' and the answer is 203467.", "techniques": ["wordplay", "periodic-table", "url-path", "online-game", "roblox", "billboard", "selfie", "landmark-photo", "local-history", "edited-image", "number-code", "door-code", "escape-room", "alphabetical-order", "color-code", "sponsor-reference", "black-light", "hidden-numbers", "on-site-puzzle"], "red_herrings": ["Adding 'about-rhenium' to the end of the hunt website URL returned 'invalid or locked clue' (A hunter).", "Thanksgiving Point was suggested for the billboard location; Marsh was already at Trolley Square and found it there.", "Door-code digits: a hunter read one digit as 5, then corrected it to 0. A hunter suggested the last digit was 4 and then said 'Move the 4'.", "Keypad lock seemed dead; it only needed hard presses or a few taps on the screen.", "Room 2 photo order by birth year (A hunter,) failed; the answer was alphabetical.", "A hunter's Room 2 guess 'ggybryrb'.", "Room 2: using only living artists (only Paul and Ringo of the Beatles) was tried and failed.", "Room 2: sum of birth years = 19605, pixel ideas, birth month, best-selling-artist metrics like first year active, first charted record and units sold.", "Bob Marley photo outside the room; the code used 8 photos.", "A hunter called the sponsor a 'red herring' when asked who it was.", "A hunter remembered the Room 3 safe code as 53027 or 53207; it was 52783.", "The safe was found standing open and reported broken; a hunter found someone had left it open, closed it and checked the code.", "A Roblox chat claimed teams were disqualified; John's Instagram story said 'No ones been disqualified'.", "Per a hunter's doc, the escape room held many deliberate red herrings besides the dartboard, pictures, chain, computer and lamps.", "Cave exploring / tight passage (A hunter, #rowbutts): a guess based on 'tight spaces? disabled?' wording, not confirmed.", "Cooking for Gordon Ramsay (A hunter, #rowbutts): a joke, set aside after the Instagram note that more than one person is needed.", "Minecraft speedrun / Fortnite / Black Ops 6 / GTA V (#rowbutts): joke guesses.", "A hunter asked if the windows with the door code were somewhere in Roblox; a hunter said no, they are at the escape room (#qr8)."], "missteps": ["Chat connected 'About-Rhenium' to the Bingham Canyon mine, which produces rhenium.", "Players discussed whether their copy of the Roblox obby had collision on; with collision on you can use glitches."], "hunt_notes": ["QR7 was the next clue after a break; the screenshot shows only the 2024 QR hunt countdown page.", "A hunter matched the Room 3 wallpaper logo against the sponsor list, and entered 203467 at the door and got in.", "The organizers did not need whiteboard photos for verification.", "After scanning, the QR8 clue said to email the hunt selfies (12 in total) to [email removed], and the final challenge would come 48 hours after the photos were submitted.", "First team: a team. A hunter said the new badge icon looked like an escape room, and a hunter confirmed that someone found 7."], "hints": ["We love hearing the stories of treasure hunters offering $20 to the first niece or nephew who can pass Roblox for them. To the teams onto the escape room, you need to use the heavy chain for something.", "John's Instagram: you will need more than one person from your team to complete the next challenge", "John's Instagram warning: teams that act before their countdown ends will be disqualified"], "open_questions": ["How the verbatim clue 'About-Rhenium' (QR6 success screen) leads to the Roblox game is not explained in any record. A hunter's doc gives the clue only as a description of the Roblox obby and billboard.", "Plaque answer conflict: a hunter's doc gives Q 'What was the door code to enter the escape room?' and A 203467. The hint-email answer list gives 'a team' (described as the same answer as QR6), while the doc names a team as the first team. One #qr-7 record lists 'Magellan', which the doc says is the Room 3 computer password.", "Door description differs: compass logo on a red wood-panel door (chat) vs Utah Treasure Hunt logo on the shop door (doc).", "Source of the first door digit (2): the chat's trusses/wheel card vs the doc's phone number on the water-tower staircase sign or website. Which digit came from which card is pieced together from a hunter's running combo and Marsh's '7' after the caboose photo.", "Room 3 path: a hunter said a black light was available so the computer step wasn't needed. A hunter's team reported a black-light trigger that seemed not to work and got help from two hunters (code not posted).", "Safe condition: a hunter's team said the safe was broken and organizer John was fixing it. A hunter later found it worked after closing it.", "The heavy chain's role (it makes the 8th photo, Cher, appear) comes only from a hunter's doc and the hint. The chat found Cher at without describing how.", "Marsh said you can scan once the game's timer has run down; which timer this means is not explained. The #rowbutts record says each team had its own countdown timer and John warned that going to the QR before it ran out meant disqualification; whether this is the same timer is not stated.", "In record 3, the plaque question is noted as 'possibly whether the billboard was Trolley Square' (ambiguous). This conflicts with the doc's door-code question.", "Who found it first: the current record says 'a hunter found it first' (location step) and names a team as the first team. The #rowbutts record has a hunter reporting around 14:26 on 2024-10-23 that team a team scanned it. Whether a hunter is on a team is not stated.", "Disqualification: a Roblox chat claim was answered by John's 'No ones been disqualified', while the #rowbutts record quotes John warning that teams acting before their countdown ends will be disqualified. The two are not tied to the same moment.", "48-hour wait: the current record says the final challenge comes 48 hours after the selfies are emailed. The #qr8 record describes a 48-hour freeze-out after QR7 without saying when it starts.", "The #qr8 record calls the location a 'sponsor escape room (name not given in chat)'. The current record places it in a shop at Trolley Square; the sponsor tied to it (Magellan HCM is the Room 3 password) is not stated as the room's owner."], "coords": null, "n_sources": 133, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Roblox stage", "lead": null, "text": "The next stage after QR6 is a Roblox obby, 'Treasure-Hunt' (https://www.roblox.com/games/9222077337/Treasure-Hunt; speedrun at https://www.youtube.com/watch?v=jsfYbvE2FlQ). (The clue text recorded for QR7, 'About-Rhenium', is QR6's success screen; rhenium is element Re, no. 75.) The obby has spam-jump walls, swinging platforms and discs, a slack line, rings, iceboxes, a pink-and-white maze and a 'collaboration area' where players jump on each other's heads; John said teams would need more than one person for this challenge. Teams had to submit a Roblox selfie with the billboard at the top. Zoom out from the final area to read it: it shows the Trolley Square water tower and says 'Go here to find the escape room. Use the clues on the windows to find the door code. Good luck!'", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Location", "lead": null, "text": "Trolley Square, Salt Lake City. On the south side along E 600 S, under or just west of the sky bridge, go in the south doors, turn left and go down a couple of stairs. The room is where the old mail place was, behind the same entry door as last year.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Door code 203467", "lead": null, "text": "The 'clues on the windows' are six laminated photo cards in the window panes of the escape-room door, each with one digit edited out and circled. Find each scene around Trolley Square to read the missing digit: trusses = 2, red trolley no. 43 = 0, Cutler Mfg Co. Rochester NY patent plate (SEPT. 11TH 1883) = 3, black-and-white Utah Light & Railway trolley = 4, 'They Shaped Utah' Silvestre de Escalante = 6, UL&T Co caboose = 7. Tap or press the keypad screen hard to wake it. Just inside, a Blokus board spells 'SEVEN DIGIT CODE BUTNO BLOKUS'.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Room 1", "lead": null, "text": "A dartboard says 'You'll need at least one bright idea'. Shine a phone flashlight on the light sensor at its center to unlock the door.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Room 2", "lead": null, "text": "Eight musician photos, each tinted red, blue, yellow or green. The 8th (Cher) appears when the heavy chain touches a metal plate in a cabinet; the official hint says to use the heavy chain. Put the names in alphabetical order (Beatles G, Beyonce R, Bono B, Cher G, Drake B, Madonna Y, Shakira R, Usher Y) and press GRBGBYRY on the four color buttons. A cupboard or crawl space opens.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Room 3", "lead": null, "text": "The computer asks 'Name our sponsor'. Its wallpaper has the Magellan HCM logo (little mountains), which matches the sponsor list, so the password is 'Magellan'. Black lights then show a wall drawing of the whole hunt with 'HERE 527_ _', and two lamps (one a lampshade) show 8 and 3. Safe code 52783 (press C first to clear).", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": "Plaque", "lead": null, "text": "The QR plaque is in the safe/metal box in Room 3. The question is 'What was the door code to enter the escape room?' and the answer is 203467.", "bullets": []}], "title": "Roblox level and escape room", "media": [{"src": "media/2024-qr7-01.jpg", "section": "solve", "caption": "Photo cards taped in the door's window panes. Each has one digit edited out (step 3).", "kind": "image"}, {"src": "media/2024-qr7-02.jpg", "section": "solve", "caption": "More of the door's photo cards, including red trolley no. 43 (step 3).", "kind": "image"}, {"src": "media/2024-qr7-03.jpg", "section": "solve", "caption": "The Silvestre de Escalante and caboose cards (step 3).", "kind": "image"}, {"src": "media/2024-qr7-04.jpg", "section": "solve", "caption": "The Cutler patent plate at Trolley Square, dated SEPT. 11TH 1883 (step 3).", "kind": "image"}], "links": [{"url": "https://www.roblox.com/games/9222077337/Treasure-Hunt", "label": "The Treasure-Hunt Roblox obby (step 1)"}, {"url": "https://www.youtube.com/watch?v=jsfYbvE2FlQ", "label": "A speedrun of the obby"}], "wl": []}, {"hunt_year": 2024, "qr_number": 8, "status": "confirmed", "confidence": 0.9, "clue_text": "Email from Utah Treasure Hunts (Fri, Oct 25, 2024, 4:53 PM): \"Congratulations on reaching the final challenge of the 2024 QR Hunt! So many unique adventures! This year we have worked hard to ensure the hunt was as awesome and epic as possible. We hope you have enjoyed it. These final challenges have a reputation of being difficult so be patient with yourselves. The clue for the final challenge is the image attached below. Good luck!\" Attachment hidden.jpg (1667x2500): a wanted poster of Indiana Jones (Harrison Ford) reading \"WANTED / DANGEROUS FUGITIVE / DEAD OR ALIVE / $ 10,000\". [Paired with sponsor Frost Box's Instagram post https://www.instagram.com/p/DBadSuUuC5i/ (\"For all those looking for your next treasure hunt clue, here it is!\"), six 1080x1080 images, later supplied in higher resolution.]", "plaque_question": null, "plaque_answer": "Call 4336200473", "location_name": "No plaque: the final answer was a phone number to call (433-620-0473)", "location_detail": "Online/phone-only finale. The hidden link sat in the hunt website's front-end code, on the leaderboard row of the fake team \"Henry Walton Jones\". The decoded message was \"Call 4336200473\". Winners: a team and a team (prize split). Dave (organizer) answered the calls, per a hunter chat.", "solve_path": "QR8 is the final challenge of the 2024 QR hunt, sent by email after the QR7 escape room and the selfie submission. The answer is a phone number to call, not a plaque.\n1) Name: the poster shows Indiana Jones, and the Halloween hint asks \"What was Indiana Jones real name in the movies?\" The answer is Henry Walton Jones (Jr.). A fake team with that name was added to the hunt website's leaderboard/teams page. To find it with Ctrl+F you have to load all 200 rows first. Indy's name is the only thing used from the poster.\n2) Hidden link: inspect that row. The site's JS bundle (main.a638a582ad46de4c.js) applies a CSS class named \"https://imgur.com/gallery/rhenium-forever-MrxjQSv\" only when teamName === \"Henry Walton Jones\". The imgur image is a long line of colored boxes whose colors match the Frost Box colors.\n3) Key source: the Halloween hint's \"Mathematics is the only true universal language\" is a line from the film Contact (1997). The Contact book and movie were props in the QR7 escape room. In Contact, the alien message pages are decoded by stacking them in three dimensions (the scene: YouTube v=yCkD5GOjvx8, about 1:00). The Frost Box images are the decoder.\n4) Frost Box overlay: the first hint says to look closely at Frost Box's most recent post (https://www.instagram.com/p/DBadSuUuC5i/, six images; the Halloween hint links higher-resolution copies). Each of the six images has hidden edits (colored pixel blocks, a small QR code) and a small corner symbol, green on three images and red on the other three. Lowering brightness and raising contrast on the high-res images shows the corner symbol is the Contact symbol. The red and green work like old red/green 3D. Arrange the six images as a cube. Then overlay each green-corner image (symbol top-left) with each red-corner image (flipped, symbol bottom-right). Each of the 9 overlays lines up exactly one pair of colored boxes, which shows what symbol or value that color stands for. This can be done as 9 overlays in an image editor or as a physical cube (paper, or laser-printed transparencies and tape).\n5) Decode: substitute those values into the imgur line of boxes. The colored boxes form Contact-primer-style equations (true/false, '=') and read as 7-segment digits. The output starts 'CA11' = 'CALL' and spells \"Call 4336200473\".\n6) Answer: call 433-620-0473. There is no plaque or scan; the call is the final answer.", "techniques": ["website-source-inspection", "leaderboard", "hidden-link", "website-search", "name-puzzle", "movie-reference", "pop-culture", "callback-to-earlier-clue", "sponsor-reference", "image-overlay", "anaglyph-3d", "edited-image", "color-code", "color-values", "hidden-pixels", "steganography", "image-metadata", "email-inspection", "book-cipher", "qr-reconstruction", "final-challenge", "phone-number", "image-enhancement", "3d-folding", "7-segment-display"], "red_herrings": ["Base64/cipher text at the end of the poster JPG decodes to 'This is not a clue.' (a 2022-style hiding place).", "A diagonal line of 14 green pixels (hex 47A942, 6C6517, 637F2B, 73711A, 4E6F16, 6F8242, 51702C, 636C29, 7A8E49, 3F8636, 39AB53, 768834, 6E912B, 6F962B) encodes 'ThisIsNotAClue' in its red values (a 2021-style hiding place). JPG compression keeps it from decoding cleanly. Ideas the team tried on it: green-channel book cipher on The Fugitive / The Power and the Glory; green-value sum 1849 tied to the State of Deseret / gold rush (A hunter); extending the line to (0,1967)-(532,2499), with 1967 read as the Fort Utah release year (A hunter); green shades as an ordering key; building a QR code from the pixels (dropped).", "Image dimensions as coordinates: 1667x2500 = 4167500, or minus the $10,000 bounty = 4157500, both north of Brigham City and out of bounds. First-pixel RGB 111/130/66 as a longitude (41.57500, -111.13066) was also out of bounds.", "Image metadata showed nothing beyond file permissions (A hunter).", "Gmail email source: 0.jfif is the same poster without the green pixels, at smaller size (compression drops 1x1 pixels, a hunter). cleardot.gif is Gmail's tracking pixel. The extra 'c' in the Patreon URL is a normal referral path. A hunter's name came from a forward.", "Trevanion cipher on the email text: produced nothing (A hunter).", "Faint letters above WANTED and a spot top-right of the D (several members; a hunter desaturated non-green colors): no result recorded.", "Cross of Coronado (Indy found looters digging it up in Utah in 1912, per the fandom wiki): a hunter asked whether to go there; not tested.", "Other Harrison Ford / pop-culture leads: Clear and Present Danger (escape room), The Fugitive, The Last Crusade, the Polybius cipher from the latest Indiana Jones film, 'Good luck' as Liam Neeson in Taken 3, the same Indy face in a murder-mystery puzzle.", "The $10k reward linked to the 2021 Heughs Canyon poem hunt (14 colors / 14 lines): led nowhere.", "Overlaying the Frost Box pixel blocks on the Frost Box QR codes (29x29) to make a new scannable code, or matching the poster's green RGB values to the Frost Box green blocks (A hunter).", "Asterisks next to WANTED on the original poster, later scrubbed off: nothing came of them. A hunter's team 'ripped that image to shreds and found nothing'.", "'henry walton jones' in the site code went nowhere inside the code itself; there was no base64 to decode there (A hunter).", "First 26 prime numbers from Contact used to make the phone number: a hunter de Galløws suggested it, then retracted it; their team had tested it and got nothing.", "Pigpen cipher on the box shapes: corrected to 7-segment digits; a hunter' team tried pigpen and got nothing meaningful.", "A hunter decoded 'msgjon' + letters, which wasn't it.", "Dodecahedron on the QR7 badge → Platonic solids → cube/primes line of thought.", "A hunter found a different phone number, not the winning one.", "zsteg on a picture showed b2/b7p LSB 'prime' patterns (AIX core file fulldump); nothing came of it in that chat window."], "missteps": ["A Discord server missed step 1 because the teams page had not fully loaded when a hunter ran Ctrl+F. A hunter said they would otherwise have won by hours.", "A hunter pointed out that searching \"rhenium\" in the inspector (the keyword from the earlier \"About-Rhenium\" clue) finds the hidden imgur link right away, without the team name."], "hunt_notes": ["A hunter received the final-challenge email at 4:57 PM on Oct 25, 2024.", "A hunter posted the Contact clip, and a hunter shared a 'decoding 3 Dimensional Mathematics' video. A hunter (A hunter) called the Frost Box images 'basically a decoder' and said Indy's name (Henry) was the only thing used from the poster.", "A hunter's team matched the imgur colors to the Frost Box colors, and a hunter's teammate did the 9 overlays in Photoshop. Other teams built physical cubes: paper cubes, and a hunter's cube of laser-printed transparencies and tape.", "John did a live with the winners, which a hunter relayed ('a 5000$ misdial')."], "hints": ["We are just barely beginning to email the first few teams the final challenge so we won't reveal much yet. But at some point you will need to look closely at Frost Boxes Most Recent Post.", "We hope everyone had a great Halloween! ... What was Indiana Jones real name in the movies? Remember that mathematics is the only true universal language. For those asking for higher resolution Frost Box Images, click here."], "open_questions": ["Call timing: a hunter's account says one winning team called at 2:52, two minutes before the other, misdialed and called back, which produced the tie. The solve doc says both teams called in the same minute, and a hunter chat says the same and that timestamps settled the winner. The date of the calls and whether 2:52 was am or pm are not stated.", "Green-pixel position: the team chat puts the 14 green pixels in the bottom-left corner, (261,2228)-(274,2241). The solve doc describes the line as 'under the D of DANGEROUS'. Unreconciled.", "End-of-file text: the solve doc calls it Base64. A team chat says a hunter 'brute-forced the cipher'. Same output either way ('this is not a clue').", "Number of leaderboard rows to load: the solve doc says 200. A hunter's '1000 teams' was a joke, so the real count is unconfirmed.", "Which earlier 2024 clue was 'About-Rhenium' (the 'rhenium' keyword callback) is not identified.", "The exact color-to-digit mapping from the 9 Frost Box overlays, and which image pairs line up, are not recorded. A hunter asked whether more than one cube orientation works; no answer recorded.", "A hunter's 'staff of Ra' photo on the leaderboard: what it was and whether it was part of the path is not stated.", "One of the 7 input records (origin 'QR8 (A Discord server) #general 2024-06-15') holds a Spanish poem ('Si sufres dolor que se cura con oro...'). Its QR number came only from the server name, and it is dated months before the fall 2024 QR hunt. It does not match this email/poster clue, so it was left out of the merge. It may belong to a different hunt (e.g. the 2024 poem hunt) and needs reassigning.", "Phone number: the current record has 433-620-0473 ('Call 4336200473'). A a hunter recap says a hunter's team decoded 'CA11443' and called a 443 area-code number (full number not posted). Another a hunter account calls it an out-of-state number. 433 vs 443 is unreconciled.", "Corner markers: the current record says green on three images and red on three. A a hunter account says every Frost Box picture had a faint green corner marker. Unreconciled.", "What to say on the call: the current answer is just calling the number. One a hunter account says the solver asked for 'Henry'. A hunter said 'the answer was yes. not sure he said it but you know'. Whether a spoken answer was required is not confirmed.", "Winners: a hunter said their team won. The current record names a team and a team. A hunter's team name is not stated.", "'rhenium forever' location: the current record puts it in the hunt website's JS bundle. The hunter recap says it was in 'the site code', and someone there connected 'breadcrumbs' text in the Frostbox site code to the movie reference. Which site held which text is not reconciled.", "A a Discord server #rowbutts record (2024-10-23) labelled QR8 describes a Roblox obby with sponsor levels and a final-area billboard leading to an escape room (open 10am-10pm, leave by 10:30; whiteboard wall; players scanned the QR there). It also has John's IG notes ('Escape room is open until 10...', 'No ones been disqualified...'). It is dated two days before the QR8 email and matches the QR7 escape room step, so it was not merged here. It may belong to QR7 and needs reassigning."], "coords": null, "n_sources": 148, "steps": [{"t": "p", "label": null, "text": "QR8 is the final challenge of the 2024 QR hunt, sent by email after the QR7 escape room and the selfie submission. The answer is a phone number to call, not a plaque."}, {"t": "step", "n": "1", "clue": [], "label": "Name", "lead": null, "text": "The poster shows Indiana Jones, and the Halloween hint asks \"What was Indiana Jones real name in the movies?\" The answer is Henry Walton Jones (Jr.). A fake team with that name was added to the hunt website's leaderboard/teams page. To find it with Ctrl+F you have to load all 200 rows first. Indy's name is the only thing used from the poster.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Hidden link", "lead": null, "text": "Inspect that row. The site's JS bundle (main.a638a582ad46de4c.js) applies a CSS class named \"https://imgur.com/gallery/rhenium-forever-MrxjQSv\" only when teamName === \"Henry Walton Jones\". The imgur image is a long line of colored boxes whose colors match the Frost Box colors.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Key source", "lead": null, "text": "The Halloween hint's \"Mathematics is the only true universal language\" is a line from the film Contact (1997). The Contact book and movie were props in the QR7 escape room. In Contact, the alien message pages are decoded by stacking them in three dimensions (the scene: YouTube v=yCkD5GOjvx8, about 1:00). The Frost Box images are the decoder.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Frost Box overlay", "lead": null, "text": "The first hint says to look closely at Frost Box's most recent post (https://www.instagram.com/p/DBadSuUuC5i/, six images; the Halloween hint links higher-resolution copies). Each of the six images has hidden edits (colored pixel blocks, a small QR code) and a small corner symbol, green on three images and red on the other three. Lowering brightness and raising contrast on the high-res images shows the corner symbol is the Contact symbol. The red and green work like old red/green 3D. Arrange the six images as a cube. Then overlay each green-corner image (symbol top-left) with each red-corner image (flipped, symbol bottom-right). Each of the 9 overlays lines up exactly one pair of colored boxes, which shows what symbol or value that color stands for. This can be done as 9 overlays in an image editor or as a physical cube (paper, or laser-printed transparencies and tape).", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Decode", "lead": null, "text": "Substitute those values into the imgur line of boxes. The colored boxes form Contact-primer-style equations (true/false, '=') and read as 7-segment digits. The output starts 'CA11' = 'CALL' and spells \"Call 4336200473\".", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Answer", "lead": null, "text": "Call 433-620-0473. There is no plaque or scan; the call is the final answer.", "bullets": []}], "title": "Final: website source, 3D image and a phone call", "media": [{"src": "media/2024-qr8-01.jpg", "section": "clue", "caption": "The WANTED poster emailed as the final clue.", "kind": "image"}, {"src": "media/2024-qr8-02.jpg", "section": "solve", "caption": "The site's JavaScript: a CSS class holding the imgur URL, applied only for the team 'Henry Walton Jones' (step 2).", "kind": "image"}], "links": [{"url": "https://www.instagram.com/p/DBadSuUuC5i/", "label": "Frost Box's Instagram post with the six images (step 4)"}, {"url": "https://imgur.com/gallery/rhenium-forever-MrxjQSv", "label": "The imgur line of colored boxes (step 2)"}, {"url": "https://www.youtube.com/watch?v=yCkD5GOjvx8&t=60s", "label": "The Contact (1997) scene where the message pages are stacked in 3D (step 3)"}], "wl": [{"match": "YouTube v=yCkD5GOjvx8, about 1:00", "url": "https://www.youtube.com/watch?v=yCkD5GOjvx8&t=60s"}]}], "playbook": "<p>Distilled from every solved checkpoint in the knowledge base: 2021 QR4, 2022 QR2/QR4 (recollections only), 2023 QR1–8, and 2024 QR1–8. There are no 2025 records. 2021 and 2022 are thin, so most patterns below come from 2023 and 2024.<\/p>\n<hr>\n<h2 id=\"1-recurring-clue-formats\">1. Recurring clue formats<\/h2>\n<div class=\"tbl\"><table><thead><tr><th>Format<\/th><th>Examples<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td><strong>Video / Street View geolocation<\/strong><\/td><td>2023 QR1, 2024 QR1<\/td><td><\/td><\/tr><tr><td><strong>Video with signal hidden in small details<\/strong><\/td><td>2023 QR2 (Morse lantern, braille in photos), 2024 QR3 (axe watermark, four place names, Sherlock quotes)<\/td><td>Most of the video's runtime is filler. The signal sits in a corner or a frame.<\/td><\/tr><tr><td><strong>Image with edited or hidden content<\/strong><\/td><td>2024 QR2 (Jordan photo, score cards changed), 2022 QR4 (billboard overlay), 2024 QR8 (Frost Box images overlaid as red/green 3D), 2024 QR7 (photo cards with a digit removed)<\/td><td>Compare against the original image. Overlay pairs of images.<\/td><\/tr><tr><td><strong>Letter/number codes → digits → coordinates<\/strong><\/td><td>2021 QR4, 2023 QR4, 2024 QR2<\/td><td>See §2.<\/td><\/tr><tr><td><strong>Book / Ottendorf cipher<\/strong><\/td><td>2023 QR1/QR8 (Art of War, chapter.paragraph.word), 2023 QR4 (Monte Cristo <em>movie script<\/em>, word offsets), 2024 QR4 (Bill of Rights, amendment + letter position), 2021 Junior Hunt (Harry Potter, reused in 2024 QR6)<\/td><td>Identifying the source text is the hard part. The hint comes from shape (2023 QR4 King shape), a hint email (2024 QR4 \"old, important document\"), or a prop from an earlier QR (2023 QR8: Art of War on the QR7 escape-room table).<\/td><\/tr><tr><td><strong>Classical cipher chains<\/strong><\/td><td>2023 QR6 (A1Z26 → Caesar +3 → reverse → Instagram → Atbash → Vigenère)<\/td><td>Layers stack. Each layer's output has to be readable before you move on.<\/td><\/tr><tr><td><strong>Crossword with an embedded instruction<\/strong><\/td><td>2024 QR5<\/td><td>The answers form a sentence. Some answers say what to ignore (2024 QR5: \"Ignore intensely painful through orange veggie\"). Color coding and clue numbers matter. The grid itself becomes a map overlay.<\/td><\/tr><tr><td><strong>Online game<\/strong><\/td><td>2023 QR3 (Roblox obby), 2023 QR5 (TreasureGuns), 2024 QR6 (QRSlayer on itch.io + 360° murder-mystery tour), 2024 QR7 (Roblox, billboard at the end)<\/td><td>The end screen gives a place or a passphrase. Persistence beats cleverness here. 2024 QR7's official hint: pay a niece or nephew $20. Past games live in the UTH site arcade. The 2023 solve doc notes the game link may be reused.<\/td><\/tr><tr><td><strong>Website source / site pages<\/strong><\/td><td>2023 QR8 (hidden <code>var riddle<\/code> + <code>console.log(url/clueAnswer + riddleAnswer)<\/code>), 2024 QR3 (video link in page code before release), 2024 QR6 (About page video at 75 s = rhenium), 2024 QR8 (CSS class holding an imgur URL, applied only for team \"Henry Walton Jones\")<\/td><td>Inspect the clue page, the leaderboard and the JS bundle. Load <em>all<\/em> leaderboard rows before Ctrl+F (2024 QR8).<\/td><\/tr><tr><td><strong>Organizers' social media<\/strong><\/td><td>2023 QR6 (32nd posts on Dave's and John's Instagram, edited captions), 2023 QR7 (John's eclipse story)<\/td><td>Old posts can be edited mid-hunt to plant clues.<\/td><\/tr><tr><td><strong>Riddle/poem directions<\/strong><\/td><td>2023 QR7 (street-grid walking poem), 2023 QR8 step 3 (one digit per riddle line)<\/td><td>Each line maps to one step or one digit. Some lines are declared filler (\"This line means zip\").<\/td><\/tr><tr><td><strong>Sponsor reference / sponsor webpage<\/strong><\/td><td>2022 QR2, 2023 QR2, 2024 QR5 (Bulldog dumpster), 2024 QR7 (password \"Magellan\")<\/td><td>See §3.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"2-how-locations-are-encoded\">2. How locations are encoded<\/h2>\n<ul><li><strong>Concatenated digits split as decimal degrees.<\/strong> Utah coordinates start <code>40<\/code>/<code>41<\/code> and <code>-111<\/code>/<code>-112<\/code>. Solvers in 2024 QR2 found the split point by looking for <code>111<\/code>. Examples: 2021 QR4 (40613527 / 111785286), 2023 QR4 (41069472111889351), 2024 QR2 (1765776917903327 × 23 = 40612869111776521).<\/li><li><strong>Digits come from arithmetic between two sources<\/strong>: a multiplier taken from the image (Jordan's 23, 2024 QR2).<\/li><li><strong>Number words / homophones<\/strong>: \"Won\" = 1, \"For\" = 4, \"To\" = 2, \"Oh\" = 0 (2023 QR4).<\/li><li><strong>Plaintext place names or instructions<\/strong>: \"drycreeksixkfeetbehindthepost\" (2023 QR6), \"GO TO EL MEXSAL. BRING SOCKS.\" (2024 QR4), in-game \"go to Crazy Corn Maze\" (2023 QR3).<\/li><li><strong>Map geometry<\/strong>: line intersection of four named places (2024 QR3, from the Sherlock Holmes four-sites scene), crossword squares = city blocks overlaid on Ogden (2024 QR5), street-grid walking directions (2023 QR7), paces from a landmark (2024 QR6 \"100 paces that way\").<\/li><li><strong>Elevation or description<\/strong>: \"six k feet behind the post\" (2023 QR6).<\/li><li><strong>Geolocation of an image<\/strong> (QR1 tradition): 2023 QR1, 2024 QR1.<\/li><li><strong>Phone numbers instead of places<\/strong> (finales): last digits of photo-sphere latitudes → (385) 645-5725, then riddle digits → 801-784-3986 (2023 QR8). \"Call 4336200473\" (2024 QR8).<\/li><\/ul>\n<h2 id=\"3-where-plaques-end-up\">3. Where plaques end up<\/h2>\n<p><strong>Trails (hike required)<\/strong>: Ferguson Canyon (2021 QR4, 2024 QR2: same canyon reused), Adams Canyon, Layton (2023 QR4, on a fallen tree off a side path), Dry Creek, Alpine (2023 QR6, on a tree up a dirt hill). Plaques sit <strong>just off the trail<\/strong>: on fallen logs, behind boulders, on trees, about 5 ft off the path.<\/p>\n<p><strong>Open land / shoreline / roadside<\/strong>: Antelope Island causeway lot rocks (2023 QR1), Utah Lake shore at Vineyard (2024 QR1), Tintic Railroad Tunnel (2023 QR2), old rail tracks in Draper (2024 QR6, on a tie at ground
