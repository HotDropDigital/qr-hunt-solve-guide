team posted a finder photo on Instagram captioned 'buzzing off to #3 now!'. A hunter said its red graffiti looked like the Tintic Railroad Tunnel, a hunter compared its rocks with the ones at 0:22 of the video, and a hunter then said they 'got it' and that many people had been on the right track with the place."], "hints": [], "open_questions": ["Clue text is not verbatim. The only version is a description of the video from a hunter's doc. The video URL and any title or caption text were not captured.", "Sponsor link not established: a hunter (A Discord server #qr-2, 2024-10-05) recalled QR2 as a 'sponsor video', but the full-solve doc does not mention a sponsor or say which one it was.", "The sources describe the location differently: a hunter's doc says 'outside Elberta' and a Discord server window says 'near Eureka' / US-6. Exact coordinates were not recorded.", "No official hints were quoted in any source. A hunter's braille hint ('A language you'd have to be blind to miss') was a player hint, not an official one.", "In a Discord server #2023-qr2, a hunter noted that the finder photo shows brush and the video does not. A hunter said the suggested location did not match the Instagram pictures. Neither point was settled in that window."], "coords": null, "n_sources": 21, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Format", "lead": null, "text": "The clue is a YouTube video in two parts: a lantern flickering in the background of the opening, then a series of six photos.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Opening", "lead": null, "text": "The lantern's flashes are Morse code. They spell TUNNEL, and the word repeats (TUNNEL TUNNEL).", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Six photos", "lead": null, "text": "Each photo has one braille letter photoshopped into it. Read in order, the six letters spell TINTIC.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Combine", "lead": null, "text": "TUNNEL + TINTIC = the Tintic Railroad Tunnel, also called the Elberta Slant Railroad Tunnel, near Elberta on the Eureka / US-6 side.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Plaque", "lead": null, "text": "Inside the tunnel, secured to a rock at the base of a rough rock wall with red spray-paint graffiti. Plaque question: 'What body of water is to the northeast of where you are?' Answer: Utah Lake.", "bullets": []}], "title": "Morse lantern and braille photos video", "media": [], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 3, "status": "confirmed", "confidence": 0.9, "clue_text": "(A link to a Roblox obstacle-course game with nine levels: Desert, Swamp, Track, Lava, River, Barn, Snow, Castle and Graveyard; touching a trap restarts you from the beginning.)", "plaque_question": "What type of encoding was used in the second half of the video?", "plaque_answer": "braille", "location_name": "Crazy Corn Maze, West Jordan", "location_detail": "Originally inside the Corn Pit (business hours only); after bad weather it was moved to the fence on the perimeter of the parking lot, reachable any time. A hunter said the location was closed on the night of 2023-09-30. The venue closed for weather/mud on 2023-10-02, and hunt staff met players there at 7pm (announced on Instagram).", "solve_path": "1) Clue: a link to a Roblox obstacle-course (obby) game with nine levels: Desert, Swamp, Track, Lava, River, Barn, Snow, Castle and Graveyard. Each door or portal counts as one level. Obstacles include lava, a race track, tires, lily pads and red squares that kill you. There are no checkpoints: touching a trap sends you back to the very start.\n2) Beat the game: get through all nine levels. After the Graveyard level, an end screen (described as a riddle) tells you to go to Crazy Corn Maze in West Jordan.\n3) Tips: a controller or Xbox works much better than a keyboard or phone, and changing the game's settings can help.\n4) Location: the plaque was at Crazy Corn Maze. It started inside the Corn Pit, which was open only during business hours. After bad weather it was moved to the fence around the parking lot, where you could reach it any time.\n5) Plaque question: 'What type of encoding was used in the second half of the video?' This refers back to the QR2 video, whose six photos hide braille letters. Answer: braille.", "techniques": ["online-game", "in-game-message", "sponsor-location", "number-code", "wordplay", "riddle", "phone-number", "movie-quote", "video-game", "video-detail", "sponsor-reference"], "red_herrings": ["A hunter first wondered whether QR3 was Adams Canyon or Bloom. It was the corn maze; Adams Canyon was QR4.", "In the phone-number step from #clue-3-discussion, the team thought 'Harry Houdini' was itself a number and were most sold on that reading. Afterward they called it a red herring.", "Another solver, Pikas, had 'the AOW thing' right but translated it to 'Tuttle shell' and went to Turtle Peak. The chat doesn't say which step of the hunt this was.", "A hunter asked whether players had to look for hidden letters in the game like last time; a hunter said that, from the chat, the goal is just to get through the levels (#2023-rowbutts, 2023-09-30).", "A hunter guessed the workaround for the closed venue might be entering certain words from the end of the Roblox round as a password (#2023-qr4, 2023-10-02). This was a joke guess, not confirmed."], "missteps": [], "hunt_notes": ["By 19:19 on 2023-09-30, 8 people had already scanned QR3, a hunter's group among them.", "In #2023-qr4, players called the corn maze a partner venue with a short season.", "When someone asked for help with the 'QR3 password' in #2023-qr4 (2023-10-02), a hunter said to 'go back to the qr2 video and watch it some more' and later called it 'in the video, just a different type of solution'; a hunter said 'Watch the end'. A hunter said a correct solve means you already know it, and their team laughed when they then saw the answer in the video.", "In #general on 2023-10-18, two hunters said QR3 was the 'Krazy Korn' corn maze.", "In #2023-qr4, people shared or sold win screenshots of the Roblox game, and some suggested keeping proof of their Roblox account.", "The solve doc says the same game link may be reused for a different version in a future hunt.", "A #clue-3-discussion thread (2023-10-21) that was tagged QR3 holds a hunter's recap of the 2023 final's phone-number riddle (801-784-3986), with the same line-by-line digit decode as the 2023 QR8 record. The recap adds that the clue said to answer 'Harry Houdini' (a line from Almost Famous) when they ask who you're calling for, that a hunter called the number and reached the organizer, Dave, who congratulated them, and that the winner was a group of 3 teams."], "hints": [], "open_questions": ["The phone-number riddle (801-784-3986, 'Harry Houdini') from #clue-3-discussion doesn't match the confirmed QR3 solve (Roblox game → Crazy Corn Maze plaque, answer braille). It may belong to a different QR or to the final treasure step, so its QR number is unconfirmed. Its techniques and red herrings are included here only because the merge rules ask for a union.", "The riddle lines in the phone-number step are a hunter's reconstruction, not the verbatim clue.", "No verbatim QR3 clue text is available. clue_text is the solve doc's description of the Roblox game link.", "The spelling differs between sources: Discord says 'Krazy Korn' and the solve doc says 'Crazy Corn Maze'.", "The URL, Python script, Google Images and image-coordinates steps mentioned in #clue-3-discussion aren't tied to any specific QR.", "Which step Pikas's 'AOW' / 'Tuttle shell' / Turtle Peak detour belonged to is unknown.", "Level count: the solve doc lists nine levels. In #2023-rowbutts, players had heard there were about 10, but nobody confirmed it.", "#2023-qr4 talks about a 'QR3 password' hidden at the end of the QR2 video. The chat doesn't say whether this is the same thing as the plaque question's answer (braille) or a separate password.", "#2023-qr4 doesn't tie the Roblox game it mentions to a specific QR; the current record (solve doc) puts it at QR3.", "The text of the end-of-game riddle described in #2023-rowbutts isn't quoted. The solve doc says the end screen points players to Crazy Corn Maze."], "coords": null, "n_sources": 48, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Clue", "lead": null, "text": "A link to a Roblox obstacle-course (obby) game with nine levels: Desert, Swamp, Track, Lava, River, Barn, Snow, Castle and Graveyard. Each door or portal counts as one level. Obstacles include lava, a race track, tires, lily pads and red squares that kill you. There are no checkpoints: touching a trap sends you back to the very start.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Beat the game", "lead": null, "text": "Get through all nine levels. After the Graveyard level, an end screen (described as a riddle) tells you to go to Crazy Corn Maze in West Jordan.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Tips", "lead": null, "text": "A controller or Xbox works much better than a keyboard or phone, and changing the game's settings can help.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Location", "lead": null, "text": "The plaque was at Crazy Corn Maze. It started inside the Corn Pit, which was open only during business hours. After bad weather it was moved to the fence around the parking lot, where you could reach it any time.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Plaque question", "lead": null, "text": "'What type of encoding was used in the second half of the video?' This refers back to the QR2 video, whose six photos hide braille letters. Answer: braille.", "bullets": []}], "title": "Roblox obstacle course", "media": [], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 4, "status": "confirmed", "confidence": 0.95, "clue_text": "[Image clue: parchment scroll, one word and a signed number per line, laid out in the shape of a chess King; some pairs are joined with \"X\" (multiplication)] BAND 8 / OATH -14 / EXISTENCE -12 / BRIDE -6 X EQUALS 1 / IGNORANT 6 X TRANSIT 11 / IMPRESSION -18 / PURPOSE 6 / NOTICE -11 / POSSIBILITIES 17 / CHESS 10 / STOLEN -9 / TOGETHER 11 / WEALTHIER -11 / HUMILIATED -9 X HANDLED -4 / CLIFF 2 / SPENT -4 / COMPARED -10", "plaque_question": "What was the name of the trail?", "plaque_answer": "Adam's Canyon Trail (accepted with the apostrophe; the trail is really 'Adams Canyon', but AllTrails and some Google results list it as 'a hunter's')", "location_name": "Adams Canyon Trail, Layton", "location_detail": "41.069472, -111.889351 (Layton area). Partway up the Adams Canyon Trail, veer off onto a short side path. The metal QR plaque was attached to a fallen tree. Someone had tried to pry the plaque loose and it was hard to scan (A hunter). Some teams reached it on a night hike. A Discord server finders: off the main trail on a smaller side trail, on/in a giant downed log, not in plain sight; good phone reception at the spot; trail missing on some Google Maps views but shown on AllTrails. Hike time reports: about 2 hours round trip (A hunter workout 2:03:48; another finder), about 1 hour up and down (QR5 chat), and about 1.5 miles up, 45 min climb, 1 hr round trip (A hunter).", "solve_path": "1) Shape: the scroll's words are laid out like a chess King. That shape is the only pointer to the source text: The Count of Monte Cristo (\"kings to you\"). The reference is the movie script of The Count of Monte Cristo, not the novel.\n2) Book cipher with word offsets: each scroll word appears exactly once in the script. Find it, then move forward (positive number) or backward (negative number) that many words. The word you land on is a number word, sometimes a sound-alike (\"Won\" = 1, \"For\" = 4, \"Oh\" = 0, \"To\" = 2). Where two words are joined with X, multiply their numbers. 'Cliff' is not in the book but is in the movie, so you need a good movie-transcript website. It is plain counting with Ctrl+F; no cipher or base64 is involved.\n3) Lookups: BAND 8 -> For (4); OATH -14 -> Won (1); EXISTENCE -12 -> Oh (0); BRIDE -6 -> To (2) x EQUALS 1 -> Three (3) = 6; IGNORANT 6 -> Three x TRANSIT 11 -> Three = 9; IMPRESSION -18 -> Four (4); PURPOSE 6 -> Seven (7); NOTICE -11 -> Two (2); POSSIBILITIES 17 -> One (1); CHESS 10 -> One (1); STOLEN -9 -> One (1); TOGETHER 11 -> Eight (8); WEALTHIER -11 -> Eight (8); HUMILIATED -9 -> Three x HANDLED -4 -> Three = 9; CLIFF 2 -> Three (3); SPENT -4 -> Five (5); COMPARED -10 -> One (1).\n4) Digits in order: 41069472111889351 -> 41.069472, -111.889351 (the longitude is negative). This is a spot off the Adams Canyon Trail in Layton. Hike partway up and take a short side path. The coordinates give the exact spot: the metal QR plaque is on or in a giant downed log and is not in plain sight. Some map apps don't show the trail; AllTrails does.\n5) Plaque question: \"What was the name of the trail?\" Accepted answer: \"Adam's Canyon Trail\", with 'Trail' at the end and the apostrophe, even though the signs don't show one. Capitalization matters, so try different ways of typing it.", "techniques": ["shape-clue", "count-of-monte-cristo", "book-cipher", "movie-script", "word-offset", "number-words", "coordinates", "hike"], "red_herrings": ["Book editions of The Count of Monte Cristo: the reference text is the movie script, not the novel. Hunters later recalled it 'didn't work on every script' either, so the version matters. A Discord server: the book was one word (or '1.5 words') off and 'cliff' is not in it.", "The Elder Scrolls / Skyrim / video-game angle from the 'scroll' (incl. Daggerfall as 'the second' game, Falmer alphabet in the scroll decoration, Greybeards/General Tullius/Gold guesses for a 'G' keyword, a Vigenère decode giving 'General Tullius'). Finders called it a waste of time and a way to throw people off.", "Mama Bear's hints (shift cipher then base64, 'the key is in the scroll', a 'G' keyword): finders said 'No to Mama Bear'; a hunter said to ignore the 'mama bear saga'.", "Base64 decoding (incl. 'chessboard has 64 squares'): not needed; base64 takes no key and gave only symbols.", "BARD/AI output, including 'ROT13' decodings of the scroll: made up.", "A hunter's claim that the answer was a video game character: called a troll.", "Way of Kings PDF: words were missing.", "A=1 letter sums plus the trailing number (Band=29): too large for coordinates.", "Treating X's as missing whole degrees (40, -112): put it near the Tintic tunnel.", "Reading numbers directly (e.g. band = 21144), or dropping the lines with X's.", "Counting letters forward from the word and converting to alphabet positions (A hunter): gave nonsense.", "Mount Timpanogos legends.", "Rocky Mouth trail: a hunter tried it and found nothing.", "A trail named after a popular hero: a hunter said this was wrong.", "Brute-forcing coordinates in Python inside a hunter's previous-year bounding box (lat 39.7209-41.3994, lon -112.0490 to -111.4974): not the method.", "Searching the scroll image for hidden content with tools, or identifying the font (e.g. a Star Wars font).", "A hunter's cipher that gave a quote leading to Bible verses: nobody confirmed it.", "Positive longitude: puts the spot on the other side of the world.", "Typing the trail name as on the signs, without the apostrophe.", "A hunter's claim that the code was shared and finders never went out: a hunter answered with workout proof."], "missteps": ["One finder missed the plaque on the first pass even with the solution."], "hunt_notes": ["Organizer John said the first team to solve it ('a team') spotted the King shape.", "Player nudges in a Discord server: a hunter hinted to look for something related to treasure where these words can be found, and a hunter said the 'scroll' is the starting point.", "Some hunters worked out the coordinates in the middle of the night and hiked up to scan first; one hunter was on the trail at about 1 a.m. A rival group called it a 'very dangerous night hike'.", "In a Discord server, a hunter reported the find around 3:00 AM on 2023-10-05 and posted an Apple Watch workout (02:03:48 elapsed, clock 2:42); they were passed by one person on the way up and passed about 10 on the way down. A hunter's team scanned around 3 a.m., a hunter hiked it in the dark, and about 20 teams had QR4 by 3:18 AM.", "Hikers said the hike is not easy. Rattlesnakes were reported nearby, and the same trail area was used in the 2023 poem hunt."], "hints": ["A Discord server: an official clue/hint would be released the next day; its text is not quoted.", "Weekly hint email sent 2023-10-06 (archive: https://mailchi.mp/48567eb11a51/treasure-hunt-weekly-hints-9090143); its text is not quoted in the chat.", "Hint quoted by finders: there is 'only one [trail] that has X marks the spot' (source not stated).", "Player tip, not official (A hunter): 'My hint is to ignore the mama bear saga'.", "Player tip, not official (A hunter): '100% not Skyrim. Not a video game. Not words.'", "Player tip, not official (A hunter): '100% the last hour in this chat has everything you need to solve this'."], "open_questions": ["The exact Count of Monte Cristo script version or source (URL/edition) where each word appears exactly once is not identified. Hunters said it 'didn't work on every script'.", "The clue text is a transcription of the scroll image. The exact line layout and King-shape arrangement are only visible in the image.", "The full-solve doc credits 'a team' (per organizer John) as the first solvers. A Discord server chat describes 'a couple of hunters' who hiked it at night to scan first, and a hunter was unsure of the details. A Discord server names a hunter (~3:00 AM 2023-10-05), a hunter's team (~3 a.m.) and a hunter as night scanners. Which of these is 'a team', and who was first, is not stated.", "It is not known whether 'Adams Canyon Trail' (no apostrophe) was also accepted as the plaque answer. Only the apostrophe form is recorded as accepted.", "A Notion write-up 'QR 4 - Scroll' was shared in a Discord server #qr-4, and a Discord server #qr4-scroll links [link removed] It is not stated whether this is the same document as the hunter '2023 QR Treasure Hunt' full-solve doc.", "In the team-chat records, the QR number (4) came from the team's 2023 checkpoint list (QR4 - Adam's Canyon), not from those conversations. A Discord server chat (hunters) and the full-solve doc also place QR4 at Adams Canyon.", "Plaque position: the current record says partway up the trail on a short side path; a hunter (A Discord server #2023-qr5plus) confirmed it is 'at the very top of the hike', and a hunter described it as at the top of a climb.", "Hike time differs between reports: ~2 hours round trip (A hunter, another finder) vs ~1 hour round trip / 1.5 miles up (A hunter, QR5 chat).", "A hunter (A Discord server) said 'It's on top of the Y' (Provo), which conflicts with Adams Canyon, Layton; it may have been sarcasm.", "A hunter (A Discord server) said the clue does not require a book; this conflicts with the movie-script lookup unless meant as 'not the novel'.", "A a Discord server record (2023-10-07) ties the 'scroll' to a 'romantic adventure' clue line, which does not appear in the transcribed clue text.", "A BARD screenshot (image-6d613346b161ddff.png) shows scroll lines as ciphertext ('JivlAmftSlwghsbqsVlcxy', 'FrvbmtOmtuxgtz X'...), which do not match the transcribed clue words. Where that ciphertext came from (e.g. Mama Bear's posts) is not stated.", "The source of the 'only one [trail] that has X marks the spot' hint (official or player) is not stated."], "coords": [41.069472, -111.889351], "n_sources": 168, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Shape", "lead": null, "text": "The scroll's words are laid out like a chess King. That shape is the only pointer to the source text: The Count of Monte Cristo (\"kings to you\"). The reference is the movie script of The Count of Monte Cristo, not the novel.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Book cipher with word offsets", "lead": null, "text": "Each scroll word appears exactly once in the script. Find it, then move forward (positive number) or backward (negative number) that many words. The word you land on is a number word, sometimes a sound-alike (\"Won\" = 1, \"For\" = 4, \"Oh\" = 0, \"To\" = 2). Where two words are joined with X, multiply their numbers. 'Cliff' is not in the book but is in the movie, so you need a good movie-transcript website. It is plain counting with Ctrl+F; no cipher or base64 is involved.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Lookups", "lead": null, "text": "BAND 8 -> For (4); OATH -14 -> Won (1); EXISTENCE -12 -> Oh (0); BRIDE -6 -> To (2) x EQUALS 1 -> Three (3) = 6; IGNORANT 6 -> Three x TRANSIT 11 -> Three = 9; IMPRESSION -18 -> Four (4); PURPOSE 6 -> Seven (7); NOTICE -11 -> Two (2); POSSIBILITIES 17 -> One (1); CHESS 10 -> One (1); STOLEN -9 -> One (1); TOGETHER 11 -> Eight (8); WEALTHIER -11 -> Eight (8); HUMILIATED -9 -> Three x HANDLED -4 -> Three = 9; CLIFF 2 -> Three (3); SPENT -4 -> Five (5); COMPARED -10 -> One (1).", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Digits in order", "lead": null, "text": "41069472111889351 -> 41.069472, -111.889351 (the longitude is negative). This is a spot off the Adams Canyon Trail in Layton. Hike partway up and take a short side path. The coordinates give the exact spot: the metal QR plaque is on or in a giant downed log and is not in plain sight. Some map apps don't show the trail; AllTrails does.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Plaque question", "lead": null, "text": "\"What was the name of the trail?\" Accepted answer: \"Adam's Canyon Trail\", with 'Trail' at the end and the apostrophe, even though the signs don't show one. Capitalization matters, so try different ways of typing it.", "bullets": []}], "title": "Chess-king scroll and a movie-script cipher", "media": [{"src": "media/2023-qr4-01.jpg", "section": "clue", "caption": "The scroll clue. The words are laid out in the shape of a chess King, each with a word offset.", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 5, "status": "confirmed", "confidence": 0.9, "clue_text": null, "plaque_question": "Which book did you use? (paraphrased in chat by a hunter; a hunter recalled it as something like 'what object helped you in the room with the computer?')", "plaque_answer": null, "location_name": "Bloom Studios (salon), room 113. The final QR was an image recovered from the file matt2016.bin, not a plaque in the field.", "location_detail": "Bloom Studios is a salon. A hunter described it as tied to the organizers' family (\"John's sister laughed and pointed us to the door\"). Front-desk staff, and later a sign at the front desk, sent hunters to room 113. In that room the door locks, a computer boots, and you copy a .bin file from that computer onto a USB drive you brought. None of the sources give the street address or city. Players called it a 'makeup counter' and said the location badge looks like makeup. Hours reported in chat: 9am–6pm (one window says also open Saturdays; another says closed weekends and reopened Monday 9AM). On 2023-10-06 people were let in at 8:30am and a long line had formed by 9am. At one point there were two computer stations. Each turn in the room is time-limited (about 2 minutes per one window, 3 minutes per another); if you fail you go to the back of the line. Instructions are posted on the outside of the door; you close the door, the computer boots in about 20 seconds, and you 'touch nothing but the computer'. A selfie at the location was required (organizer Instagram), though JJ said staff did not check selfies. Staff said there is no QR at the salon; the QR comes from solving the file at home.", "solve_path": "1) Part 1 (online game): beat the TreasureGuns run-and-gun browser game. The end screen tells you to go to Bloom Studios and ask for \"the bear made of stone\", a reference to a past hunt. The first part of the clue also tells you to bring a USB drive.\n2) Game details: the game auto-scrolls and plays like Contra. Play on a laptop or PC, with the mouse to shoot and the spacebar to jump (an iPad has no jump button, and a phone or controller is hard). It has 5 levels, each ending in a boss (a ship, a bat, a squid, a bird, then a final boss) at roughly every 60m (the level 3 boss is around 180m), then a portal to the next level. Level 3 has hard jump timing. Clicking off the screen or leaving full screen pauses it. Tips: one person shoots while another jumps, use an auto-clicker (AutoHotKey, OP Auto Clicker), and hope for a Gatling gun before the final boss.\n3) Selfies: take selfies of beating the game and at the location (organizer Instagram); one person per team is enough.\n4) Part 2 (the salon): at Bloom Studios, ask at the front desk about the bear made of stone. Staff, and later a sign at the front desk, send you to room 113.\n5) Room 113: inside, the door locks and a computer boots about 20 seconds after you close the door. Each turn is timed; if you fail you go to the back of the line. The monitor has a polarizing privacy screen, so you can only read it through the glasses on the mannequin heads. A sign outside the door gives the file path t/c/b/f/s/s/c/matt2016.bin. Copy that file to your USB drive. There is no plaque at the salon: the QR code comes from the file, so you finish at home.\n6) Part 3 (file forensics): the file looks corrupted (Bad File Format), but that is intentional: it is the next puzzle. The official hint: 'The name of the file is the clue.' No downloads or coding are needed; standard Windows/Mac tools or a web hex editor (e.g. hexed.it, the Notepad++ hex plugin) are enough.\n7) 'matt2016' = Matthew 20:16, \"the last shall be first, and the first last.\" Open the file in a hex editor (it is mostly FF and 00 bytes, like a black-and-white image). It starts with 'M' and ends with 'B': the first byte of the 'BM' bitmap signature was moved to the end of the file. Move the 'B' back to the front and rename .bin to .bmp.\n8) Result: the image that opens is the QR code, which you scan at home. On a Mac, Chrome worked better than Safari for exporting at this step. Scanning asks a question about which book you used (paraphrased; the accepted answer was not recorded).", "techniques": ["online-game", "video-game-clue", "local-business", "sponsor-location", "password-phrase", "escape-room", "usb-file-download", "file-forensics", "hex-editor", "file-signature", "bible-reference", "filename-hint", "file-header-repair", "qr-image", "multi-step"], "red_herrings": ["Thinking the plaque is at the business and has to be scanned during business hours: solvers said the business is only a step, not the final location (A Discord server #2023-qr5). A hunter guessed it was 'another closed business'.", "Turning numbers deciphered from 'the scroll' into coordinates: a solver answered 'Wrong path'.", "Thinking the file was corrupted by a bad copy: the Bad File Format is intentional. A hunter's team did bring home an incomplete or wrong copy and had to get it again.", "Opening or mounting the .bin as a disc image (UltraISO, other mounting programs), burning it to a CD, or loading it in a Sega Genesis/PlayStation emulator: did not work; two hunters said not needed. Davis Tech IT staff could not open it either.", "Renaming to .mp3 and playing in VLC gave 1:57 of silence; a spectrogram showed repeating arcs, which the poster (A hunter) said was probably not the answer but might be a 'very vague clue'.", "Renaming to common image, audio, ISO or .txt formats, or using file converters: did not help.", "Reversing or bit-flipping all bytes (reversed file starts with '$'): two hunters said 'don't do that'.", "Reading 'bin' backwards as an Xcode .nib file, and a loose Commodore 64 link (c-h-o-s-e-n summing to 64): renaming to .nib does nothing.", "Converting the file to binary 1s and 0s: did not finish the solve.", "Compressing the file to find two 'matt2016' strings: one is just zip metadata, and others said compressing isn't the way.", "Jokes: Hurricane Matthew 2016, downloading MATLAB 2016, and a hunter's 'you need last year's billboard' ('kidding')."], "missteps": [], "hunt_notes": ["A hunter posted the TreasureGuns end screen in a Discord server #qr-3.", "A hunter pointed out that you had to solve the first part of the clue to know you should bring a USB drive; a hunter confirmed this.", "Scanning the QR code from the file starts the team's 48-hour countdown to QR6. Because there is no plaque at the salon, teams could scan after business hours.", "A hunter called QR5 'the one where we made a picture' and reported that 10 teams had finished QR5 by 2023-10-05 21:04."], "hints": ["Organizer Instagram story (@the.cline.fam): For QR 5 you will need selfies beating the game AND at the location. When in doubt take a selfie of a completed task. (image: [local file])", "Official/emailed hint (about 14:20 on 2023-10-06): The name of the file is the clue.", "A hunter: consider what format a .bin file might store data in. How do you see that code?", "A hunter: what does the file name tell you to do with that data", "A hunter: Use the file name as a hint, but you'll still have to make guesses", "A hunter: One app to change it, one app to view them all.", "A hunter: No coding is required.", "A hunter: it's technical. Jump in, but don't go too deep.", "No need to download anything", "A hunter: You don't need any software or programs other than what comes standard in Windows or Mac", "A hunter: There is a step you're missing, and that's where the clue comes in", "A hunter: The amount that needs to be changed will be obvious if you know what file you're trying to get", "A hunter: Viewing the code is the way"], "open_questions": ["None of the sources has the verbatim clue text. The full-solve doc only gives a summary: 'Part 1: an online game, TreasureGuns. Part 2: a locked room at Bloom Studios with a booting computer; find a deeply nested file. Part 3: the file matt2016.bin.' The Notion write-up's title is 'QR 5 - TreasureGuns Game, Salon, & .bin file'.", "What words were needed at the front desk? A hunter got nothing until she asked about 'the stone bear'. A hunter says she never asked and was waved through. The full-solve doc says the end screen told you to ask for 'the bear made of stone', and that a front-desk sign later just said room 113. It is unclear whether the phrase was required, or for how long.", "The salon's name: in 2024 a hunter remembered it only as 'Bloom Studios or something'. A hunter's 2023 recap and the full-solve doc both say Bloom Studios; a 2023-10-07 window says 'Bloom'.", "Street address and city of Bloom Studios are not given in any source.", "Which organizer the salon is tied to: a hunter's 'John's sister' remark is the only reference, and no source says who 'John' is.", "Which wording in Part 1 told you to bring a USB drive is not quoted anywhere. One 2023-10-07 window says solving the room 'gives you a flash drive with a .bin file', which differs from the current record's bring-your-own USB drive.", "What the letters in the path t/c/b/f/s/s/c stand for is not explained in any source.", "Plaque question is only paraphrased ('which book did you use?' / 'what object helped you in the room with the computer?'); the accepted answer is not given in any source.", "Time limit in room 113: one window says about 2 minutes per turn, another says 3 minutes.", "Business hours: one window says 9am–6pm and also open Saturdays; another says closed weekends and reopened Monday 9AM.", "Game naming: the current record calls it TreasureGuns; one window calls it a 'pacer' platform game, and another mentions a Roblox obstacle course. One window describes 'a second game to beat' on site and says beating an on-site computer mini game gives the .bin file (likely the room 113 computer, but not stated).", "A 2023-10-07 window (A Discord server #2023-qr5) describes a possible hike ending in an off-trail scramble to a GPS point, with a plaque asking for a secret phrase from the game. This contradicts the current record (final QR is an image from the file); it is unclear whether those messages ('QR for Abell') refer to QR5.", "Matthew 20:16 reading: the current record states it as the solve; several 2023 chat windows raised it without confirmation at the time."], "coords": null, "n_sources": 172, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Part 1 (online game)", "lead": null, "text": "Beat the TreasureGuns run-and-gun browser game. The end screen tells you to go to Bloom Studios and ask for \"the bear made of stone\", a reference to a past hunt. The first part of the clue also tells you to bring a USB drive.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Game details", "lead": null, "text": "The game auto-scrolls and plays like Contra. Play on a laptop or PC, with the mouse to shoot and the spacebar to jump (an iPad has no jump button, and a phone or controller is hard). It has 5 levels, each ending in a boss (a ship, a bat, a squid, a bird, then a final boss) at roughly every 60m (the level 3 boss is around 180m), then a portal to the next level. Level 3 has hard jump timing. Clicking off the screen or leaving full screen pauses it. Tips: one person shoots while another jumps, use an auto-clicker (AutoHotKey, OP Auto Clicker), and hope for a Gatling gun before the final boss.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Selfies", "lead": null, "text": "Take selfies of beating the game and at the location (organizer Instagram); one person per team is enough.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Part 2 (the salon)", "lead": null, "text": "At Bloom Studios, ask at the front desk about the bear made of stone. Staff, and later a sign at the front desk, send you to room 113.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Room 113", "lead": null, "text": "Inside, the door locks and a computer boots about 20 seconds after you close the door. Each turn is timed; if you fail you go to the back of the line. The monitor has a polarizing privacy screen, so you can only read it through the glasses on the mannequin heads. A sign outside the door gives the file path t/c/b/f/s/s/c/matt2016.bin. Copy that file to your USB drive. There is no plaque at the salon: the QR code comes from the file, so you finish at home.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Part 3 (file forensics)", "lead": null, "text": "The file looks corrupted (Bad File Format), but that is intentional: it is the next puzzle. The official hint: 'The name of the file is the clue.' No downloads or coding are needed; standard Windows/Mac tools or a web hex editor (e.g. hexed.it, the Notepad++ hex plugin) are enough.", "bullets": []}, {"t": "step", "n": "7", "clue": ["matt2016"], "label": null, "lead": "Matthew 20:16, \"the last shall be first, and the first last.\"", "text": "Open the file in a hex editor (it is mostly FF and 00 bytes, like a black-and-white image). It starts with 'M' and ends with 'B': the first byte of the 'BM' bitmap signature was moved to the end of the file. Move the 'B' back to the front and rename .bin to .bmp.", "bullets": []}, {"t": "step", "n": "8", "clue": [], "label": "Result", "lead": null, "text": "The image that opens is the QR code, which you scan at home. On a Mac, Chrome worked better than Safari for exporting at this step. Scanning asks a question about which book you used (paraphrased; the accepted answer was not recorded).", "bullets": []}], "title": "Browser shooter game and a salon secret phrase", "media": [], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 6, "status": "confirmed", "confidence": 0.95, "clue_text": "(Egyptian/hieroglyphic-themed image with a string of numbers and the letters:) 1 11 12 26 2 16 22 17 15 6 5 17 24 17 16 11 6 / ozxokzpsruqfqmdfuzsqmpmcpxnem", "plaque_question": "What is Dave's wife standing next to in the reel with the oars?", "plaque_answer": "Crib", "location_name": "Dry Creek Trail, Alpine", "location_detail": "Alpine, Utah. About 0.4 miles up the Dry Creek trail, at around 6,000 ft, there is a pole/post in the ground. Off to the right, scramble up a dirt hill. QR6 was secured to a tree at the top. Hunters used the Alpine trailhead parking lot. Hunters described it as a short hike: under 10 minutes, about 20 with a dog, with a steep incline. People did it without water and in Crocs or flip-flops, and one player brought children aged 2, 4 and 8. In October 2023 the access road was under construction and confusing to drive. The plaque is a metal plate mounted upside down on a curved surface with a bent corner. Some photos taken at night would not scan, and it scanned more easily in daylight.", "solve_path": "This is a Vigenère cipher. The numbers encode the key and the letters are the message.\nClue format: an Egyptian/hieroglyphic-themed image with 29 digits and 29 letters.\n1) Split the number string (11112262162217156517241716116) into numbers from 1 to 26: 1 11 12 26 2 16 22 17 15 6 5 17 24 17 16 11 6.\n2) Convert with A1Z26 to get AKLZBPVQOFEQXQPKF.\n3) Caesar shift +3 to get DNOCESYTRIHTATSNI.\n4) Reverse it to get INSTATHIRTYSECOND ('Insta thirty-second'), which points to the 32nd post/reel on both Dave's and John's Instagram accounts.\n5) Dave's 32nd post (about two years old at the time) has a tiny oars icon. Its caption was recently edited to add 'How do eight eights add up to one thousand?'. John's 32nd post has a stove ('range') icon and the caption '888 + 88 + 8 + 8 + 8 = 1000'. The question/answer pair tells you which post comes first and that you add them.\n6) OAR + RANGE = ORANGE.\n7) Hieroglyphics can be read in either direction, so Atbash ORANGE to get LIZMTV, the Vigenère key.\n8) Decode ozxokzpsruqfqmdfuzsqmpmcpxnem with key LIZMTV to get 'drycreeksixkfeetbehindthepost': Dry Creek trail (Alpine), 6,000 ft, behind the post.\n9) Hike about 0.4 mi up the Dry Creek trail in Alpine to the post/pole at about 6,000 ft. Scramble up the dirt hill to the right and find QR6 on a tree at the top.\n10) Plaque question: 'What is Dave's wife standing next to in the reel with the oars?' It comes from Dave's oars reel. Answer: Crib. Dave's account has few reels, and the answer can be read off the reel's thumbnail.", "techniques": ["number-code", "a1z26", "caesar-cipher", "reversal", "atbash", "vigenere", "sponsor-reference", "social-media", "hidden-in-old-social-media-post", "icon-cipher", "egyptian-cipher", "number-puzzle", "wordplay", "elevation", "coordinates-by-description", "cipher", "brute-force"], "red_herrings": ["Two 30-second Instagram stories posted the day the clue dropped were deliberate red herrings. 'Thirty-second' in the key means the 32nd post.", "The +3 Caesar shift was chosen only so the reversed text starts with D and ends in 'second'. John confirmed it is a coincidence that 3 is the only digit missing from 1-7.", "A new 30-second Declaration of Independence video on John's Instagram, with missing letters in its captions, held solvers up. The actual solve used the 32nd posts.", "hunters tried every Caesar-shift pairing of the 29 numbers with the 29 letters, including rotating the numbers against the letters. Nothing came out of it.", "A hunter suggested a Gronsfeld cipher because the counts match.", "A hunter checked the image for steganography and found nothing.", "A hunter ran the mistakenly posted raw image data through base64 and looked at individual pixels.", "A hunter read 3-digit groups as decimal ASCII. The first two groups match the first two letters, then the pattern breaks.", "A hunter found a lat/long reading of the numbers that lands in Utah, far away and probably on private land.", "A hunter suggested reversing the numbers (Egyptian can be read right to left) and then shifting them.", "A hunter posted a screenshot of an article on AI translation of Sumerian/Akkadian cuneiform.", "A hunter shifted letters to alphabet numbers and did not get far. Another player read the clue mirrored and got different characters.", "A hunter asked whether the page title shown when the clue opens in a new tab matters. Nobody answered.", "A hunter got a correct result by accident from a typo. Fixing the typo, or trying other typos, gave gibberish.", "A hunter warned that false hints were being spread on purpose.", "A hunter wondered whether the plaque-question reel was tied to the clue numbers.", "A hunter kept entering wrong plaque answers, probably from the wrong reel or scene.", "Some hunters confused the cipher keyword with the plaque question. The reel tip answers the post-scan question.", "A hunter thought the plaque had to be scanned upside down because it is mounted that way. A hunter replied that QR codes scan in any orientation and that the curved surface and bent corner cause the trouble."], "missteps": ["Many teams skipped the numbers and the Instagram posts and brute-forced the letters in an online Vigenère solver; two hunters were among them. One solver said publicly that you don't need the keyword."], "hunt_notes": ["The clue was first posted by mistake as a long string of raw image data. Once that was fixed, the image loaded on the page by itself, so there was only one stage.", "Team a hunter scanned QR6 first at about 20:32 on 2023-10-08. By 22:23 about 20 teams had scanned it, and chat put it at 80-100+ by the next morning."], "hints": ["To solve this the way we intended, you will need information from posts on both John and Dave's Instagram accounts. (Although many teams figured it out without that part)"], "open_questions": ["Exact spot: a hunter's recap and the decoded text say 'behind the post'. The Notion write-up says the QR was on a tree at the top of a dirt hill to the right of the pole. The two are not reconciled. A hunter's 'Gotta get to the tree' (2023-10-08) matches the tree version.", "A hunter called it 'another Davis county hike' (2023-10-09), but Alpine is in Utah County. In a 2023-10-18 window someone mentioned 'Finding Antelope Island and beating Roblox', and that message is not tied to QR6.", "A hunter wrote the decoded text as 'drycreek6kfeetbehindthepost'. The Notion doc gives the letter-only form 'drycreeksixkfeetbehindthepost', which is consistent with a letters-only Vigenère.", "The sources disagree on the icons: a hunter says the video thumbnails show oars and an oven, while Notion says tiny icons in the posts. One 2024 chat says the symbol was hidden in Dave's 32nd reel.", "The 2024 screenshot of John's May 5, 2023 post (Douglas fir floors, #flippingfriday) carries the '888 + 88 + 8 + 8 + 8 = 1000' caption. No source explicitly confirms that this is the 32nd post.", "Only the Notion doc gives the plaque question wording. A hunter only says it came from the oars video. A 2023-10-10 chat paraphrased the question as being about what Dave's wife looks like, and a hunter said the answer is 'in his profile pic'. That does not match the crib/oars-reel wording.", "Step 7 uses the hieroglyphic reading direction to justify Atbash. In chat, a hunter said the cipher does not involve hieroglyphics, and a hunter said the Egyptian theme does not matter.", "The original clue image is not attached, and the full number string is only quoted unspaced by a hunter. Chat disagreed on whether the numbers had spaces, and a hunter found the font shows gaps around 5, 6 and 7 even without spaces."], "coords": null, "n_sources": 152, "steps": [{"t": "p", "label": null, "text": "This is a Vigenère cipher. The numbers encode the key and the letters are the message."}, {"t": "p", "label": "Clue format", "text": "An Egyptian/hieroglyphic-themed image with 29 digits and 29 letters."}, {"t": "step", "n": "1", "clue": [], "label": null, "lead": null, "text": "Split the number string (11112262162217156517241716116) into numbers from 1 to 26: 1 11 12 26 2 16 22 17 15 6 5 17 24 17 16 11 6.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": null, "lead": null, "text": "Convert with A1Z26 to get AKLZBPVQOFEQXQPKF.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": null, "lead": null, "text": "Caesar shift +3 to get DNOCESYTRIHTATSNI.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": null, "lead": null, "text": "Reverse it to get INSTATHIRTYSECOND ('Insta thirty-second'), which points to the 32nd post/reel on both Dave's and John's Instagram accounts.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": null, "lead": "Dave's 32nd post (about two years old at the time) has a tiny oars icon.", "text": "Its caption was recently edited to add 'How do eight eights add up to one thousand?'. John's 32nd post has a stove ('range') icon and the caption '888 + 88 + 8 + 8 + 8 = 1000'. The question/answer pair tells you which post comes first and that you add them.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": null, "lead": null, "text": "OAR + RANGE = ORANGE.", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": null, "lead": null, "text": "Hieroglyphics can be read in either direction, so Atbash ORANGE to get LIZMTV, the Vigenère key.", "bullets": []}, {"t": "step", "n": "8", "clue": [], "label": null, "lead": null, "text": "Decode ozxokzpsruqfqmdfuzsqmpmcpxnem with key LIZMTV to get 'drycreeksixkfeetbehindthepost': Dry Creek trail (Alpine), 6,000 ft, behind the post.", "bullets": []}, {"t": "step", "n": "9", "clue": [], "label": null, "lead": null, "text": "Hike about 0.4 mi up the Dry Creek trail in Alpine to the post/pole at about 6,000 ft. Scramble up the dirt hill to the right and find QR6 on a tree at the top.", "bullets": []}, {"t": "step", "n": "10", "clue": [], "label": "Plaque question", "lead": null, "text": "'What is Dave's wife standing next to in the reel with the oars?' It comes from Dave's oars reel. Answer: Crib. Dave's account has few reels, and the answer can be read off the reel's thumbnail.", "bullets": []}], "title": "Hieroglyph numbers and a stacked cipher chain", "media": [{"src": "media/2023-qr6-01.jpg", "section": "clue", "caption": "The clue: a number string (the Vigenère key, encoded) and a letter string (the message) over an Egyptian tomb.", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 7, "status": "confirmed", "confidence": 0.85, "clue_text": "Hike from where morning light is free\nDown four then right half of three\nThe creatures all look to the way\nBut first 65 paces or you'll be astray\nOne more than the logs and you're lost in a jiffy\nOn this path find the man from nineteen fifty\nIt's time to play Frogger to go to behind\nIs it arc math? addition? Look to the spines\nWhere Five from eleven crosses four from twentytwo\nThis line means zip it's here just to fool\nRhyming's hard now you're in the right place\nWander to and fro till you find the right face\nUpside down frogs by logs first found\nThen by the feathers then two then pound", "plaque_question": "Name the smallest of the four books you used to get here", "plaque_answer": "Steppenwolf", "location_name": "Pop-up game room + escape room behind a keypad door next to Dave & Buster's, The Gateway, Salt Lake City", "location_detail": "The Gateway, downtown Salt Lake City (A hunter's hint during the hunt was 'Downtown'). One record gives the address as 108 S Rio Grande St. The site is a sticker-covered door on the north side of Dave & Buster's (one record says second floor), with a Wiegand keypad on its left. Door code 4252#. Inside: game room (7-digit code to the next door; one record describes a wardrobe leading to the second room) → pirate-themed escape room (piano, ship's wheel, colored-button box, chest) → last door, code 4873 (keypad with cooldown) → QR plaque. Open 10am–10pm including Sunday, per John. A group of about 6 was suggested. Route waypoints: Washington Square water-wise garden / SLC Library → mural behind Tanner Frames (18 800 S) → north on Main St → Book Mural via the alley by Keys on Main (Gallivan Center area) → rainbow crosswalks at 100 S & S Rio Grande St.", "solve_path": "The poem leads to a locked door at The Gateway in Salt Lake City. Behind it are a game room and then an escape room, and the QR plaque is at the end.\n\nFORWARD ROUTE (post-hunt reconstruction):\n1) 'Hike from where morning light is free' = the start, at Washington Square (City & County Building) or the SLC Library across the street. The labeled water-wise garden around the Washington Square flagpole has 'Morning Light' plants, and the library has an 'enlightenment' theme; both readings give about the same start point.\n2) 'Down four then right half of three' = go 4 blocks south, then turn right (west) and go 1.5 blocks. This reaches the mural on a blue brick wall behind Tanner Frames, 18 800 S; organizer John confirmed the mural is part of the solve. The mural shows 5 upside-down frog heads and 5 logs in a campfire.\n3) 'The creatures all look to the way' / 'But first 65 paces' = apart from the upside-down frogs, the mural's creatures all face north, the direction to go. First walk about 65 paces (~162 ft) to the corner at Main Street.\n4) 'One more than the logs and you're lost in a jiffy' = walk north 5 blocks on Main (5 logs). A 6th block takes you past the turn.\n5) 'On this path find the man from nineteen fifty' / 'It's time to play Frogger to go to behind' = a street plaque at the alley next to Keys on Main, in the Gallivan Center area, is thought to be the man from 1950. It points down the alley (the Frogger crossing, then behind) to the Book Mural, a painted bookshelf on a brick wall.\n6) 'Is it arc math? addition? Look to the spines' / 'Where Five from eleven crosses four from twentytwo' = number the mural's 22 books 1-22. Book 11 is Steppenwolf and book 22 is A Gentle Madness. Counting 5 UP from 11 gives #16, Gravity's Rainbow. Counting 4 DOWN from 22 gives #18, The Wizard of Oz. A rainbow crossing a yellow brick road = the rainbow and yellow-brick-road crosswalks at 100 S & S Rio Grande St, next to the Salt Lake County Library at The Gateway. They show clearly on Google satellite imagery, but the paint has since changed. 'This line means zip it's here just to fool' (line 10) is filler.\n7) 'Rhyming's hard now you're in the right place' / 'Wander to and fro till you find the right face' = a locked door at The Gateway next to (north of) Dave & Buster's. It is covered in a sticker collage, and one sticker is a cartoon face matching organizer Dave. The keypad is to the left of the door.\n8) 'Upside down frogs by logs first found' / 'Then by the feathers then two then pound' = multiply the upside-down frogs by the logs, then by the feathers, then enter 2, then # (organizer John's DM hint spells this out). The mural's 5 frogs × 5 logs × 17 feathers = 425, so the door code is 4252#. The feather count, 17, comes from factoring the code (425 = 5 × 5 × 17), not from a count.\n\nON-SITE STAGES:\n9) Game room: board games are glued to the tables, and they give a 7-digit code for the next door. Blokus says 'SEVEN DIGIT CODE BUT NO BLOKUS'. Boggle ('UNUTILIZED'), Taboo and Sorry are not used. Monopoly gives 'FIRST', Battleship 'NOT THE FIRST OR LAST', Rummy (a card cipher, K♣=Z, Q♣=Y and so on) 'THE THIRD FROM THE END', Scrabble 'two away from rummy', and Mad Gab 'before and after, a game of rummy'. Reading the digits from the games' positions gives 7 ? 9 5 4 5 0; the second digit is uncertain, and the code is recorded as 7395450 or 7995450.\n10) Escape room: playing 'Mary Had a Little Lamb' on the piano (keys 4635) sets off a box, which points to the ship's wheel. Turn the wheel until its 2-letter pairs make 8 four-letter words (PULL, LIVE, CORE, MARY, DOCK, LAKE, JUMP, WIRE); MARY is the key. Rungs 4, 6, 3, 5 then give the wall colors B G R B G R Y B. Entering those on the colored-button box opens it to a sign: 'Lanterns / Animals (3D only) / Frames / \"Mary\"s'. The room has 4 lanterns, 8 3D animals, 7 frames and 3 Marys, so the last door's code is 4873. The room also has a chest.\n11) Plaque: the QR plaque is behind that last door. Question: 'Name the smallest of the four books you used to get here'. Answer: Steppenwolf (capitalization matters when entering it).", "techniques": ["wordplay", "local-history", "landmark-photo", "street-grid", "pacing-directions", "map-overlay", "book-spines", "counting", "number-code", "prime-factorization", "brute-force", "pop-culture-reference", "on-site-search", "on-site-puzzle", "escape-room", "board-games", "positional-ordering", "word-grid", "anagram", "substitution-cipher", "playing-cards", "red-herring-elimination", "music-code", "word-wheel", "word-formation", "color-code", "book-title", "coordinates", "acrostic", "vigenere", "color-mapping", "transit-map", "keypad-code", "physical-puzzle", "music", "poem"], "red_herrings": ["Studio Elevn / Central (International Harvester) building, 435 W 400 S: the route was Clark Planetarium → 400 W → 300 S Homewood Suites ducks → Rio Grande Depot ('Rio Grande' 1950 John Wayne film) → 'Elevn' (eleven minus its 5th letter) → half-face sculpture over the door. Teams went and found nothing. The team sent this solve to the organizers and it was not accepted.", "A hunter's (11+5)×(4+22)=416 → 416 University Blvd, across from Studio Elevn", "Clark Planetarium as the start (4 S, 1.5 E/W): many teams reached the Gateway this way, but it is not the intended start", "Memory Grove / Korean War Memorial (TIME 1950 'The Fighting Man') / Sweet Switchbacks; City Creek and the Freedom Trail ('morning light is free' = freedom): followed, nothing found", "Gardner Village (Wanderlust, Solstice spa, witches as faces): theory from another chat, doubted. A hunter and GUATEMAX also searched its frog figurines during Witchfest, and a hunter guessed it from 'shops'; a hunter: 'It looked better on paper'", "Get Out Games escape room, Gateway escape room, 329 S Rio Grande St, Trolley Square, Three Creeks Confluence, CrossFit/production studio between Studio Elevn and Table 22, 52 E North Temple (Church Office Building): checked or dropped, nothing there", "600 W & 1800 N, Pleasant Grove (11-5=6, 22-4=18): nothing seen", "The Crossing at Daybreak / Frogs Leap Dr (Churchill Living) and Freedom Park Dr in Daybreak: nothing found. Other Daybreak readings of 'morning light': the free concert or the Little Free Library there; a hunter and JJ searched Daybreak with no luck", "Ogden: Peery's Egyptian Theater area, Fort Buenaventura, Ben Lomond; coordinate readings 41.2365,-111.950 and DAWN = 41°23'14\": nothing found", "This Is the Place monument (dedicated 1947), Capitol, Springville statue tour, Gilgal Garden, Cathedral of the Madeleine gargoyles, Hogle Zoo, dinosaur sites (Thanksgiving Point, Ogden dinosaur park): rejected or not followed up. A hunter checked Thanksgiving Point on site and found nothing; a hunter: 'Words cannot describe how far off our Springville solve was' (A hunter also went to the Springville art museum)", "'Man from 1950' readings: Churchill, Truman, famous men born in 1950, Brigham Young statue (1950), Pioneer Museum, Bennion, a 1950 address (Circle of Hope Dr), Hubbard Ave near Liberty Park (L. Ron Hubbard's 1950 book; residential), The Count of Monte Cristo (A hunter believed it was published in 1950)", "Cipher attempts (first letters, capitals-only, Vigenère, CryptoCrack brute force): no readable output", "Tree Fort Realty keypad photo from a kicked member (suspected troll): no lockbox", "Keypad guesses rejected at the Gateway door: 6522, 6322, 9522, 9322, 3962, 3232, 1082, 1262, 1442, 1122, 1622, 1352, 2252, 2702, 3152, 3602, 4052, 1002-1902, 1102, 1602, 1522#, 102#/0102#, 6602#, 4162, 2882, 2162, 1052, 4322, 5042, 5762, 1302, 9602, 0002, 4902, multiples of 48/49 ending in 2; 19602 does not fit (the keypad takes only 4 digits)", "Frog/log/feather counts that did not work: railroad/TRAX frogs at 400 W & S Temple, A-frame sculptures, 48-49 Olympic snowflake signs, crosswalk stripes (5), seesaws (3), angel-wings mural (2 feathers), light-post feathers (40), jazz player mural by Valters with 15 feathers (joked about as 'CAN'T BE A COINCIDENCE')", "Plaque answers rejected: Wizard of Oz, The Invention of Solitude, The Cat in the Hat, Their Finest Hour (suggested); 'Baby Shoes' (six-word story) offered only as a joke for 'shortest book'", "Game room: Boggle (UNUTILIZED), Blokus, Taboo and Sorry are not used; the rummy hand's score (96/97) is not the digit; Monopoly's blank cards are normal", "Escape room: Mastermind colors (BGRG) are not the box code; a kid repeated their parents' findings, which a hunter said were all the red-herring items", "A hunter's 6×18=108 + Rio Grande → 108 S Rio Grande reached the right place, but a hunter called it a coincidence", "The 10-14 eclipse as the 'morning light'; sunrise sculptures or murals as the start", "'This line means zip' read as a zip line", "'Logs' read as logarithms", "Washington Square car museum and the abandoned auto shop next door (A hunter); a hunter visited the shop and saw no treasure-hunt sign", "Lagoon/Farmington (A hunter planned a visit); a kids' jungle trail in Draper (JJ, 'grasping')", "Inverted cardinals, Last Supper imagery / Catholicism theories", "PF Chang's downtown, from team smithmob's Instagram story ('I'd like an order of the QR7, please'): where the team was eating, not the QR site", "A hunter spent 2 hours at the starting point thinking the whole poem was solved there", "A hunter's solve checked on the morning of 10-14: a 'swing and a miss'"], "missteps": ["A hunter found the door code 4252 by brute force rather than from the counts; a hunter then worked backward (425 = 5×5×17) to frogs = 5, logs = 5 and feathers = 17."], "hunt_notes": ["Most teams reached The Gateway by other routes (the Clark Planetarium, John's Instagram eclipse story, following organizers). The forward route was put together after the find (10-15 to 10-22).", "A hunter posted a write-up of the poem solve and how to get to and into the room; it does not cover the puzzles inside.", "Many teams found the Gateway door but got stuck on the code; a hunter nudged others with 'Start wandering backwards, fro and to'. Players named 'frogs and logs' as the hardest part.", "The piano was unreliable at times. After John told one team 'the music isn't working but you don't need it', that team was stuck for almost 2 hours until the piano worked.", "A hunter's team found and scanned QR7 first, at about 3:30 pm on 2023-10-14, but the scan could not be logged until about 5:30 pm because the code was not working (the room malfunctioned). Three teams had scanned by 17:57, and about 20 more followed within the next hour. A hunter scanned that night with a few hints from John.", "After scanning, teams emailed all their selfies as proof, including a selfie plus a photo of the ship's wheel. The QR8 clue arrived by email in batches about 48 hours later. John's message said teams that cheated the room (following others through the wardrobe without the code, or breaking into the QR room) could be docked 12 hours."], "hints": ["Organizer John Maxim (onthejohn), Instagram DM to a team member, 2023-10-14 2:18 PM (screenshot): \"Just multiply the upside down forges [frogs] you saw by the logs then multiply that by the feathers then 2 and pound. Easy. Unless you found it on accident\"", "A hunter's paraphrase of a hint (exact wording not quoted): count only the frogs you see on the path, not every frog in the city", "Organizer Instagram post (not a formal hint): 'We've spent a lot of hours and $$$ getting QR7 as awesome as possible'. The footage showed a blacklight on a brick wall.", "John to a team in the escape room (not a formal hint): 'the music isn't working but you don't need it'. The piano did turn out to be needed."], "open_questions": ["Clue wording: one transcription has stanza breaks and capitalizes 'Addition?'. The pinned images and the spreadsheet use 'addition?'. Line 12 is quoted elsewhere as 'until' rather than 'till'. Another chat quoted line 2 as 'down 4 and right half of 3'.", "Start point: Morning Light plants at Washington Square (A hunter) or the SLC Library's 'enlightenment' theme (A hunter). The organizers' intended start was never posted.", "Tanner Frames mural address: given as 18 800 S, but a hunter also said '800 S 15 E'. A hunter described it as a 'food mural on a blue brick wall'.", "Feathers = 17 comes only from factoring 425 (5×5×17). Nobody confirmed it by counting, and the team found 4252 by brute force.", "'The man from 1950' was never pinned down. Ideas: the street plaque at the alley by Keys on Main, a sidewalk square dedicated to Richard Wirick (location unclear), or a hunter's marker near Gallivan Center.", "Line 9 had several readings (A hunter said 4 could work): 5 up / 4 down → Gravity's Rainbow × Wizard of Oz → rainbow crosswalk; 5 left / 4 left → Refuge (blue) × Wizard of Oz (green) → TRAX Blue/Green junction at the Planetarium stop; a hunter's Mark Twain → Gateway Arch reading. The organizers' intended reading was not posted.", "No record says which four books 'you used to get here' are, or why Steppenwolf counts as the 'smallest'.", "Game-room code recorded as 7395450 (A hunter) or 7995450 (A hunter); the second digit was guessed.", "Exact door location: one record says second floor, others say a door next to (north of) Dave & Buster's. The 108 S Rio Grande St address comes from one record. A shared pin (40°46'01.7\"N 111°54'15.8\"W) may be the wrong storefront.", "Whether the game room had a time limit: 1 hour was mentioned, but later teams saw none.", "A hunter suggested a 'gatekeeper question' (what multiplies to 425) might be asked after scanning; other records give the plaque question as the books question.", "Room layout: the current record has a game room then a pirate escape room; one new record describes room 1 with a safe and artwork and room 2 (hot, with lights and the piano), and another a wardrobe leading to a second room with a chest. How these map onto the game room / escape room is not stated.", "Hours: John said 10am–10pm, but one record says players were allowed to stay in the 'second room' until 11.", "Piano tune: players mentioned a 3-note and a 4-note version (the current record gives keys 4635); which was required is not stated.", "Prize for QR7: the organizer Instagram prize list showed QR6/QR7 as TBD."], "coords": null, "n_sources": 741, "steps": [{"t": "p", "label": null, "text": "The poem leads to a locked door at The Gateway in Salt Lake City. Behind it are a game room and then an escape room, and the QR plaque is at the end."}, {"t": "h", "text": "Forward route", "sub": "post-hunt reconstruction"}, {"t": "step", "n": "1", "clue": ["Hike from where morning light is free"], "label": null, "lead": "The start, at Washington Square (City & County Building) or the SLC Library across the street.", "text": "The labeled water-wise garden around the Washington Square flagpole has 'Morning Light' plants, and the library has an 'enlightenment' theme; both readings give about the same start point.", "bullets": []}, {"t": "step", "n": "2", "clue": ["Down four then right half of three"], "label": null, "lead": "Go 4 blocks south, then turn right (west) and go 1.5 blocks.", "text": "This reaches the mural on a blue brick wall behind Tanner Frames, 18 800 S; organizer John confirmed the mural is part of the solve. The mural shows 5 upside-down frog heads and 5 logs in a campfire.", "bullets": []}, {"t": "step", "n": "3", "clue": ["The creatures all look to the way", "But first 65 paces"], "label": null, "lead": "Apart from the upside-down frogs, the mural's creatures all face north, the direction to go.", "text": "First walk about 65 paces (~162 ft) to the corner at Main Street.", "bullets": []}, {"t": "step", "n": "4", "clue": ["One more than the logs and you're lost in a jiffy"], "label": null, "lead": "Walk north 5 blocks on Main (5 logs).", "text": "A 6th block takes you past the turn.", "bullets": []}, {"t": "step", "n": "5", "clue": ["On this path find the man from nineteen fifty", "It's time to play Frogger to go to behind"], "label": null, "lead": "A street plaque at the alley next to Keys on Main, in the Gallivan Center area, is thought to be the man from 1950.", "text": "It points down the alley (the Frogger crossing, then behind) to the Book Mural, a painted bookshelf on a brick wall.", "bullets": []}, {"t": "step", "n": "6", "clue": ["Is it arc math? addition? Look to the spines", "Where Five from eleven crosses four from twentytwo"], "label": null, "lead": "Number the mural's 22 books 1-22.", "text": "Book 11 is Steppenwolf and book 22 is A Gentle Madness. Counting 5 UP from 11 gives #16, Gravity's Rainbow. Counting 4 DOWN from 22 gives #18, The Wizard of Oz. A rainbow crossing a yellow brick road = the rainbow and yellow-brick-road crosswalks at 100 S & S Rio Grande St, next to the Salt Lake County Library at The Gateway. They show clearly on Google satellite imagery, but the paint has since changed. 'This line means zip it's here just to fool' (line 10) is filler.", "bullets": []}, {"t": "step", "n": "7", "clue": ["Rhyming's hard now you're in the right place", "Wander to and fro till you find the right face"], "label": null, "lead": "A locked door at The Gateway next to (north of) Dave & Buster's.", "text": "It is covered in a sticker collage, and one sticker is a cartoon face matching organizer Dave. The keypad is to the left of the door.", "bullets": []}, {"t": "step", "n": "8", "clue": ["Upside down frogs by logs first found", "Then by the feathers then two then pound"], "label": null, "lead": "Multiply the upside-down frogs by the logs, then by the feathers, then enter 2, then # (organizer John's DM hint spells this out).", "text": "The mural's 5 frogs × 5 logs × 17 feathers = 425, so the door code is 4252#. The feather count, 17, comes from factoring the code (425 = 5 × 5 × 17), not from a count.", "bullets": []}, {"t": "h", "text": "On-site stages", "sub": ""}, {"t": "step", "n": "9", "clue": [], "label": "Game room", "lead": null, "text": "Board games are glued to the tables, and they give a 7-digit code for the next door. Blokus says 'SEVEN DIGIT CODE BUT NO BLOKUS'. Boggle ('UNUTILIZED'), Taboo and Sorry are not used. Monopoly gives 'FIRST', Battleship 'NOT THE FIRST OR LAST', Rummy (a card cipher, K♣=Z, Q♣=Y and so on) 'THE THIRD FROM THE END', Scrabble 'two away from rummy', and Mad Gab 'before and after, a game of rummy'. Reading the digits from the games' positions gives 7 ? 9 5 4 5 0; the second digit is uncertain, and the code is recorded as 7395450 or 7995450.", "bullets": []}, {"t": "step", "n": "10", "clue": [], "label": "Escape room", "lead": null, "text": "Playing 'Mary Had a Little Lamb' on the piano (keys 4635) sets off a box, which points to the ship's wheel. Turn the wheel until its 2-letter pairs make 8 four-letter words (PULL, LIVE, CORE, MARY, DOCK, LAKE, JUMP, WIRE); MARY is the key. Rungs 4, 6, 3, 5 then give the wall colors B G R B G R Y B. Entering those on the colored-button box opens it to a sign: 'Lanterns / Animals (3D only) / Frames / \"Mary\"s'. The room has 4 lanterns, 8 3D animals, 7 frames and 3 Marys, so the last door's code is 4873. The room also has a chest.", "bullets": []}, {"t": "step", "n": "11", "clue": [], "label": "Plaque", "lead": null, "text": "The QR plaque is behind that last door. Question: 'Name the smallest of the four books you used to get here'. Answer: Steppenwolf (capitalization matters when entering it).", "bullets": []}], "title": "Walking-directions poem and escape room", "media": [{"src": "media/2023-qr7-01.jpg", "section": "clue", "caption": "Clue Number 7 as it appeared on utahtreasurehunts.com.", "kind": "image"}, {"src": "media/2023-qr7-02.jpg", "section": "solve", "caption": "The Book Mural, a painted bookshelf on a brick wall (steps 5 and 6).", "kind": "image"}, {"src": "media/2023-qr7-03.jpg", "section": "solve", "caption": "Hunters' list of the mural's 22 books. Counting 5 up from 11 and 4 down from 22 gives Gravity's Rainbow and The Wizard of Oz (step 6).", "kind": "image"}, {"src": "media/2023-qr7-04.jpg", "section": "solve", "caption": "The rainbow and yellow-brick-road crosswalks at 100 S and S Rio Grande St, as seen on Google Maps (step 6).", "kind": "image"}, {"src": "media/2023-qr7-05.jpg", "section": "solve", "caption": "The game room's welcome sign (step 9).", "kind": "image"}, {"src": "media/2023-qr7-06.jpg", "section": "solve", "caption": "The escape room piano and the box it sets off (step 10).", "kind": "image"}, {"src": "media/2023-qr7-07.jpg", "section": "solve", "caption": "The eight four-letter words made on the ship's wheel (step 10).", "kind": "image"}, {"src": "media/2023-qr7-08.jpg", "section": "solve", "caption": "The sign from the colored-button box: count the lanterns, 3D animals, frames and Marys (step 10).", "kind": "image"}, {"src": "media/2023-qr7-09.jpg", "section": "solve", "caption": "The plaque question shown after scanning (step 11).", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 8, "status": "confirmed", "confidence": 0.8, "clue_text": "STEP 1 – Final-clue email text: \"Congratulations for arriving at the last part of the QR hunt! Even though it's only been a couple weeks, it feels like we've gone on a long journey together. We hope you've been able to have some fun along the way. Attached below is the final clue. These final clues are notorious for being difficult, so inspect things carefully and hopefully in a short while we can declare you as the winner of the 2023 QR Treasure Hunt. Good luck!\"\nAttached image (finalClue): fantasy board-game table in a candlelit cave/dungeon (game board, figurines, dice, magnifying glass, lanterns, stack of books), overlaid with: 10.21.3 / 3.17.5 / 4.2.19 / 10.24.18 / 13.21.9 / 12.14.14 / 10.2.9\nClue-8 page on utahtreasurehunts.com (the page that says your next clue will be emailed): visible text \"Send your selfies to [email removed] for review.\" Hidden in page code (a hidden div): var riddle = 'What has keys but can't open locks?'; console.log(url/clueAnswer + riddleAnswer)\n\nSTEP 2 – A web page showing 10 photos (img classes image1–image10, displayed out of order). Not transcribed.\n\nSTEP 3 – Voicemail riddle at the step-2 number (originally one long run of words with no pauses; line breaks as a hunter remembers it):\nStop.\nDon't divide by me.\nThe Romans didn't know I'd be in binary.\nEach day of the week.\nI'm the winning ball.\nDoesn't matter what the season.\nMake a wish so you don't fall.\nPlay some tic tac toe or a baseball game.\nWhat repeats again.\nDrinks and muscles are the same.\nHe's under the name Harry Houdini.", "plaque_question": null, "plaque_answer": "8017843986 (call it; the line asks for a name, and the Houdini line gives 'Harry Houdini')", "location_name": "Phone-call finale: 801-784-3986 (Google Voice line forwarding to organizer Dave); the last QR code was in a treasure chest whose coordinates the organizers gave the winners", "location_detail": "No physical plaque location is named in any source. Intermediate number: (385) 645-5725, whose voicemail holds the step-3 riddle. Final number: 801-784-3986. One source says the first team to call the second number gets GPS coordinates accurate to 3 feet. A hunter's account (2023-10-21): the last QR code was in the final treasure chest; the organizers gave the coordinates, and the winning team planned to hike to it with them the next day. The coordinates were not posted.", "solve_path": "Overview: QR8 was the 2023 final, a three-step chain that ends in a phone call. The final clue came by email. The official hint says the image holds no hidden data, the email text holds the hint, and the challenge has several steps.\n1) '10.21.3 / 3.17.5 / 4.2.19 / 10.24.18 / 13.21.9 / 12.14.14 / 10.2.9' = a book cipher, read as chapter.paragraph (numbered verse/point).word in Sun Tzu's The Art of War. What points to the book: the numbers are too large for page.line.word, the picture shows a war-type game, and the shape of the number grid fits it. The Art of War was also one of the books lying on the table in the QR7 escape room (it played no part in that solve).\n2) Decoded words = 'formation that provided protect(ion) on all sides' (10.21.3 = chapter X, paragraph 21, word 3 = 'formation'). Googling the phrase gives PHALANX, the Greek battle formation at Thermopylae. That is the clue answer.\n3) 'inspect things carefully' = inspect the clue-8 page source. Right-click and Inspect the line 'Send your selfies to ... for review': a hidden div holds var riddle = 'What has keys but can't open locks?' (answer: PIANO) and console.log(url/clueAnswer + riddleAnswer). So the next page is the site URL + / + the clue answer + 'piano' (the exact URL was not recorded).\n4) Photo page: the step-2 page shows 10 photos of 10 locations. Match each photo to its Google Maps photo-sphere dot and note its latitude/longitude. In the HTML the <img> classes image1–image10 are displayed in the order 3,2,5,4,1,6,10,9,8,7. Sorted by class number they are: 1 Zanzibar Port, 2 Crystal Rapids (36.1352288), 3 Parque de la Fortuna (10.4716805), 4 Argentina/Paraguay/Brazil border (-25.59…), 5 Hobbiton/Green Dragon (-37.8595858), 6 Torch Tower, 7 Mont St Michel, 8 Haystack Rock, 9 Slag Bank, 10 Sydney Harbour.\n5) Latitudes = phone number: take the last digit of each latitude in class order to get (385) 645-5725. The organizers had said 'The solve will lead you to the exact coordinates. There will be no guessing.' Calling the number plays a voicemail with the step-3 riddle.\n6) Riddle digits: each line of the step-3 riddle gives one digit. Stop = 8 (octagon), Don't divide by me = 0, Romans/binary = 1, Each day of the week = 7, I'm the winning ball = 8 (8-ball), season = 4, wish/don't fall = 3, tic-tac-toe or baseball = 9, what repeats again = 8, drinks and muscles = 6 (six-pack). That gives 801-784-3986.\n7) 'He's under the name Harry Houdini' = not a digit; it gives the name for the call. The 801-784-3986 Google Voice line asks for a name and forwards to organizer Dave.\n8) Finale: the organizers gave the winners the treasure chest coordinates, and the last QR code was in the chest.", "techniques": ["book-cipher", "number-code", "hint-in-email-text", "hidden-page-source", "html-inspection", "web-source-inspect", "riddle", "url-answer", "landmark-photo", "coordinates", "phone-number", "voicemail", "riddle-digits", "wordplay", "brute-force", "word-list-offsets", "cipher", "poem-directions", "image-analysis"], "red_herrings": ["Step 1: 'long journey' book candidates by chapter.line.word or page: The Hobbit, LOTR (book 3 by page gave 'Nearest Harfoots'), Narnia, Watership Down, Wizard of Oz, The Alchemist, Iliad/Odyssey.", "Step 1: 'Congratulations for' (=4) and 'couple weeks' (=2) were read as book 4 of a series. Narnia's The Silver Chair and Prince Caspian PDFs did not work (one try gave 'Go and Again After Heard to Underland').", "Step 1: a Narnia board-game reading ('reach the lamp post and get back to the wardrobe'), possibly meaning a return to the escape-room wardrobe/chest.", "Step 1: a word-index cipher on the email text itself gave nonsense ('QR Feels Arriving / Arriving A The… / QR Gone Couple').", "Step 1: 422023.com (from 4, 2, 2023) was an unrelated Chinese app site.", "Step 1: other readings of the triples were raised but not tested: book series with seven books (A hunter), audiobook timestamp (A hunter), hour.minute.second or military time (A hunter), sundial angles (A hunter/a hunter).", "Before the clue: encrypted or passcode-protected data a hunter found in a file ('Well, learning to hack was fun').", "A hunter went to Turtle Hill, Eagle Mountain, through 'turtle shell' and the testudo formation.", "Step 2: summing the longitudes (798.0503715, close to 801) and other sums or products did not give callable numbers.", "Step 2: other ideas that did not give the number: photos as book scenes or page numbers (like the previous year's Harry Potter clue), intersections or distances between the locations, reversed numbers, integer parts of the coordinates only, other hidden HTML content.", "Step 3: treating 'He's under the name Harry Houdini' as a digit (1, or 9 for 'Erik Weisz'). It is not part of the number.", "Step 3: joining 'Each day of the week' and 'I'm the winning ball' into one digit.", "Step 3: other digit guesses: day of week = 5 (weekdays); season = 7, 0 or 1; wish = 11 (11:11), 7 or 1; tic-tac-toe/baseball = 3; 'repeats' as a triple 333; Powerball, or a goal/field goal, for the winning ball.", "Step 3: candidate patterns 801-74?-996?, 801-9??-3?61, …33361, 80177?3761, 801777?961, 801!!13161 and 801-x!3-3361 were brute-force called (400+ calls). Results: 801-746-9966 reached a person; 801-840-9968 had a full mailbox; 801-943-3367 reached a generic voicemail; a 'John' who answered was not the organizer; 801-1xx numbers could not be completed; 800 numbers gave no success reported. The correct number was never on the spreadsheet.", "Step 3: numbers containing 911 were skipped because they could dial emergency services.", "Step 3: Google Voice Utah prefix testing (513, 609, 980, 896, 784, 877, 900, 923, 893, 989, 960) was used to narrow the exchange. 784 is in the list.", "Some people thought the first (riddle) number was the end. The organizer said it wasn't just one number. Per a hunter, the first number's riddle had to be solved to get the second number.", "Step 1 triplets: A=1 letter substitution gives Jue Cqe Dbs Jxs Mui Lnn Jbi, no meaningful words (A hunter)", "Step 1 triplets: A=0 letter substitution gives Kvf Drf Ect Kyt Nvj Moo Kcj, no meaningful words (A hunter)", "Step 1 triplets: Plotting the triplets as x,y,z 3D coordinates; no result reported (A hunter)", "Step 1 triplets: Photoshop colour-map and levels analysis of the bitmap background found no hidden image or words (A hunter)", "Step 1 triplets: Inverting the image's colours showed nothing (A hunter)", "Step 1: ChatGPT's 'book cipher' answer that used the email text as the key ('AND SOON YOU WILL FIND THE FINAL LOCATION') was made up.", "Step 1: OCR of the image gave '1641 GROS'; no use of it was reported.", "Step 1: 'Wedge' as the formation: a hunter said no.", "Step 1: 'Testudo' (the Roman tortoise formation): a hunter said no, the answer was phalanx.", "Step 1: square-formation ciphers based on the grid shape of the numbers were called a rabbit hole.", "Step 1: dialing 801-PHALANX just reached hotel deals.", "Step 1: wbStego / ALAN data that zsteg found embedded in the first picture was never shown to matter."], "missteps": ["A Discord server team reached the first phone number hours before any other team, then lost time on the step-3 riddle: they joined 'Each day of the week' and 'I'm the winning ball' into one digit and treated the Houdini line as a digit."], "hunt_notes": ["Teams got the final clue by email after sending their QR7 proof selfies.", "A Discord server team placed each step-2 photo on a Google Maps photo-sphere dot and wrote down its lat/long; a hunter took the last digit of each latitude in class order and got (385) 645-5725. The riddle decode in step 6 is the team's later decode, and a hunter called the Houdini line the 'answer' part.", "In a hunter's 2023-10-21 account, you called back and answered the riddle, and that answer was what you gave for the win. A hunter (2nd caller) gave the final number after the hunt was won, and a hunter confirmed it by calling.", "Results: a team posting 'QR HUNT SOLVED' on Instagram
