<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Hunt Solve Guide</title>
<meta name="description" content="Every past Utah Treasure Hunts QR checkpoint: the clue, the solve step by step, the location and the dead ends.">
<style>
:root{--bg:#f6f4ef;--panel:#ffffff;--ink:#1c1b19;--muted:#6e6a62;--line:#e4e0d7;--accent:#b4561e;--accent-ink:#ffffff;--accent-soft:#f7e8dc;--chip:#ece7dc;--ok:#2f7d4f;--warn:#9a6b00;--code:#f3efe6;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151412;--panel:#1e1c19;--ink:#ebe7de;--muted:#a19b8f;--line:#312e28;--accent:#e2884d;--accent-ink:#151412;--accent-soft:#3a2a1f;--chip:#2a2722;--ok:#7fcf9a;--warn:#e2b84d;--code:#262320}}
:root[data-theme="dark"]{--bg:#151412;--panel:#1e1c19;--ink:#ebe7de;--muted:#a19b8f;--line:#312e28;--accent:#e2884d;--accent-ink:#151412;--accent-soft:#3a2a1f;--chip:#2a2722;--ok:#7fcf9a;--warn:#e2b84d;--code:#262320}
*{box-sizing:border-box}
html{scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;color:inherit;text-decoration:none;margin-right:6px;white-space:nowrap}
nav.years{display:flex;gap:2px;flex-wrap:wrap}
nav.years a{font-size:14px;padding:5px 11px;border-radius:999px;color:var(--ink);text-decoration:none;border:1px solid transparent}
nav.years a:hover{border-color:var(--line)}
nav.years a.on{background:var(--accent);color:var(--accent-ink)}
#q{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);margin-left:auto;width:230px;max-width:100%}
nav.sub{max-width:920px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav.sub:empty{display:none}
nav.sub a{font-size:13px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--bg)}
nav.sub a:hover{border-color:var(--accent)}
nav.sub a.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
nav.sub .crumb{font-size:13px;color:var(--muted);margin-right:4px}
main{max-width:920px;margin:0 auto;padding:22px 16px 40px}
article{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 34px;min-width:0}
@media (max-width:640px){article{padding:20px 16px;border-radius:10px}header.top{position:static}.bar{padding:10px 16px 6px}#q{width:100%;margin-left:0}html{scroll-padding-top:0}}
.eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{margin:0 0 10px;font-size:27px;line-height:1.25;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:14px;margin:0}
.status{padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);text-transform:capitalize;color:var(--muted)}
.status.confirmed{color:var(--ok);border-color:var(--ok)}
.status.likely,.status.speculation{color:var(--warn);border-color:var(--warn)}
section{margin-top:30px}
h2{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.clue{white-space:pre-wrap;font:16px/1.55 var(--serif);background:var(--code);border-left:4px solid var(--accent);padding:14px 18px;border-radius:0 8px 8px 0;margin:0}
dl.glance{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;margin:0;font-size:15px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
dl.glance dt{color:var(--muted)}dl.glance dd{margin:0}
@media (max-width:520px){dl.glance{grid-template-columns:1fr;gap:2px}dl.glance dt{margin-top:8px}}
.steps{list-style:none;margin:0;padding:0}
.step{position:relative;display:grid;grid-template-columns:36px 1fr;gap:0 16px;padding:14px 0}
.step::before{content:"";position:absolute;left:17px;top:50px;bottom:-14px;width:2px;background:var(--line)}
.steps .step:last-child::before{display:none}
.step .n{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step .body{min-width:0;padding-top:5px}
.step .body>*{margin:0}.step .body>*+*{margin-top:6px}
.cq{padding:8px 12px;border-left:3px solid var(--accent);background:var(--code);border-radius:0 6px 6px 0;font:italic 15px/1.45 var(--serif)}
.cq small{display:block;font:600 11px/1.5 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-style:normal}
.cq span{display:block}
.step b{font-weight:600}
q.cl{quotes:"\2018" "\2019";font:italic 1em var(--serif);color:var(--accent)}
.sec{margin:26px 0 2px;font-size:16px;font-weight:700}
.sec span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.note{margin:10px 0}
.note b{font-weight:600}
ul.plain{padding-left:20px;margin:8px 0}ul.plain li{margin:5px 0}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--bg)}
details+details,section>details{margin-top:10px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"\25B8";color:var(--muted);font-size:12px}
details[open]>summary::before{content:"\25BE"}
summary .count{font-size:12px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:999px;padding:0 8px}
details .raw{white-space:pre-wrap;font:14px/1.55 var(--serif);margin:10px 0 0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;color:var(--ink);font-size:14px;max-width:48%}
.pager a.next{text-align:right;margin-left:auto}
.pager small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card b{color:var(--accent);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.card .where{display:block;margin-top:4px;font-weight:600;line-height:1.35}
.card .tech{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.card .big{font-size:26px;font-weight:700;display:block;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px;text-decoration:none;color:var(--ink);border:1px solid transparent}
.chip:hover{border-color:var(--accent)}
.chip small{color:var(--muted)}
.rows{margin:0;padding:0;list-style:none}
.rows li{padding:12px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows a.t{font-weight:600;text-decoration:none;color:var(--ink)}
.rows a.t b{color:var(--accent)}
.rows p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.intro{font-size:17px;margin:0}
.empty{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
kbd{font:12px var(--sans);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
.play h2{font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink);margin-top:32px}
.play h3{font-size:17px;margin:20px 0 6px}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px}
.figs.one{grid-template-columns:minmax(0,520px)}
.step .figs{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:10px}
figure{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
figure a.img{display:block;background:var(--code)}
figure img{display:block;width:100%;max-height:420px;object-fit:contain}
figure audio{width:100%;margin:12px 0 0}
figcaption{font-size:13px;line-height:1.45;color:var(--muted);padding:8px 10px}
.links{display:grid;gap:10px;margin-top:14px}
.video{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.video .frame{position:relative;padding-top:56.25%;background:#000}
.video iframe,.video .yt img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.video .yt{display:block}
.video .play{position:absolute;left:50%;top:50%;width:68px;height:48px;margin:-24px 0 0 -34px;border-radius:12px;background:rgba(0,0,0,.72)}
.video .yt:hover .play{background:#c00}
.video .play::after{content:"";position:absolute;left:27px;top:14px;border-left:18px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
.video p .dom{font-size:12px;color:var(--muted);margin-left:6px}
.video p,.lnk{margin:0;padding:9px 12px;font-size:14px}
.lnk{display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-decoration:none;color:var(--ink)}
.lnk:hover{border-color:var(--accent)}
.lnk .dom{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.lnk::before{content:"\2197";color:var(--accent)}
.unlock{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.unlock input{flex:1 1 220px;font:16px var(--sans);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.unlock button{font:600 15px var(--sans);padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.years .lock{font-size:.8em}
footer{max-width:920px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#">QR Hunt Solve Guide</a>
    <nav class="years" id="years"></nav>
    <input id="q" type="search" placeholder="Search clues, solves, places…" aria-label="Search">
  </div>
  <nav class="sub" id="sub"></nav>
</header>

"text": "Each picture group shows a scene; the page it is on gives digits. Weasel, potty, gargoyle, crab = Weasley, Potter, Goyle, Crabbe = page 80, the start of 801. Black shaggy dog, broom, lightning, cold = Sirius/Grim, Quidditch in the storm, Dementors (page not stated). The pages together form a phone number (4:28-4:56).", "bullets": []}, {"t": "step", "n": "8", "clue": [], "label": "Call", "lead": null, "text": "The first team to call the number won and was given the chest's GPS coordinates, so several teams solving at once would not race to the same spot (4:56-5:25).", "bullets": []}], "title": "Hidden text in the image, Base64 and a book of page numbers", "media": [], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 1, "status": "confirmed", "confidence": 0.85, "clue_text": "10.21.3 / 3.17.5 / 4.2.19 / 10.24.18 / 13.21.9 / 12.14.14 / 10.2.9 (seven number triplets printed in the middle of a black-and-white noisy/dithered photo, file finalClue_1.png; transcribed from the image, not posted as text)", "plaque_question": "What city did you find this in? (or similar wording)", "plaque_answer": "Syracuse", "location_name": "Parking lot just west of the Antelope Island Causeway tollbooth, Syracuse (Antelope Island)", "location_detail": "Syracuse, UT, in the parking lot just west of the Antelope Island Causeway tollbooth. The rocks shown in the Street View image are on the southernmost side of the lot, and the QR code was on the back of one of them ('the QR1 rock'). Rumor passed on by two hunters: someone tried to take, flip or hide the rock so others couldn't scan it. Hunters, including Randi, confronted them, and the person sped off and nearly hit people with their car.", "solve_path": "1) The clue image (finalClue_1.png) has seven dot-separated number triplets printed over a dithered black-and-white photo. While the hunt was running, the team tried and dropped A=1/A=0 letter substitution, 3D plotting and bitmap/levels analysis (see the dead ends list). 2) A later recollection (A team, 2024-10-26) says the numbers were a book cipher into Sun Tzu's The Art of War. The decoded text meant something like 'protected on all sides' (a paraphrase, not the exact wording), which points to the battle formation 'phalanx'. 3) a hunter's full-solve doc describes the clue as a Google Street View image ('Find out where this is, and you'll find the QR code'). Geolocating it matches the rocks at the parking lot just west of the Antelope Island Causeway tollbooth in Syracuse. 4) The QR code was on the back of one of the rocks on the south side of that lot. People called it 'the QR1 rock'. After scanning, the plaque asked which city you were in (exact wording unknown), and the answer was Syracuse. A hunter's 2023 recap, the team's 2023 list and a hunter's memory ('antelope parking lot') all independently put QR1 at Antelope Island.", "techniques": ["book-cipher", "wordplay", "number-code", "steganography", "coordinates", "street-view", "landmark-photo", "geolocation"], "red_herrings": ["A=1 letter substitution gives Jue Cqe Dbs Jxs Mui Lnn Jbi, no meaningful words (A hunter)", "A=0 letter substitution gives Kvf Drf Ect Kyt Nvj Moo Kcj, no meaningful words (A hunter)", "Plotting the triplets as x,y,z 3D coordinates; no result reported (A hunter)", "Photoshop colour-map and levels analysis of the bitmap background found no hidden image or words (A hunter)", "Inverting the image's colours showed nothing (A hunter)"], "hints": [], "open_questions": ["Clue format conflict: the 2023 #clue-1-debunked-ideas record has number triplets on a dithered photo (finalClue_1.png), but a hunter's doc calls the clue a Google Street View image. It's unclear whether these are two stages or parts of one clue, whether the dithered photo is itself the Street View image, or whether one source is about something else.", "The Art of War book cipher and 'phalanx' come from a 2024 recollection. The exact edition or indexing (e.g. chapter.paragraph.word), the decoded wording and the official answer are not recorded.", "None of the sources explains how 'phalanx' leads to the Antelope Island Causeway tollbooth lot.", "The plaque question wording is approximate ('or similar wording').", "The incident of someone trying to take or hide the QR1 rock is second-hand rumor."], "coords": null, "n_sources": 20, "steps": [{"t": "step", "n": "1", "clue": [], "label": null, "lead": "The clue image (finalClue_1.png) has seven dot-separated number triplets printed over a dithered black-and-white photo.", "text": "While the hunt was running, the team tried and dropped A=1/A=0 letter substitution, 3D plotting and bitmap/levels analysis (see the dead ends list).", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": null, "lead": "A later recollection (A team, 2024-10-26) says the numbers were a book cipher into Sun Tzu's The Art of War.", "text": "The decoded text meant something like 'protected on all sides' (a paraphrase, not the exact wording), which points to the battle formation 'phalanx'.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": null, "lead": "A hunter's full-solve doc describes the clue as a Google Street View image ('Find out where this is, and you'll find the QR code').", "text": "Geolocating it matches the rocks at the parking lot just west of the Antelope Island Causeway tollbooth in Syracuse.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": null, "lead": "The QR code was on the back of one of the rocks on the south side of that lot.", "text": "People called it 'the QR1 rock'. After scanning, the plaque asked which city you were in (exact wording unknown), and the answer was Syracuse. A hunter's 2023 recap, the team's 2023 list and a hunter's memory ('antelope parking lot') all independently put QR1 at Antelope Island.", "bullets": []}], "title": "Number triplets over a noisy photo", "media": [{"src": "media/2023-qr1-01.jpg", "section": "clue", "caption": "The clue image: seven number triplets printed over a dithered photo.", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 2, "status": "confirmed", "confidence": 0.95, "clue_text": "(A YouTube video: a lantern flickers in the background of the opening, then a series of six photos follows.)", "plaque_question": "What body of water is to the northeast of where you are?", "plaque_answer": "Utah Lake", "location_name": "Tintic Railroad Tunnel (near Elberta / Eureka)", "location_detail": "Inside the Tintic railroad tunnel, secured to a rock. A map pin near Eureka / US-6 matches the site.", "solve_path": "1. The clue was a YouTube video in two parts (A hunter remembered it as a sponsor video).\n2. Part 1: a lantern flickers in the background of the opening. Read as Morse code, the flashes spell 'TUNNEL TUNNEL'.\n3. Part 2: six photos follow, and each has one braille letter photoshopped into it. Read in order, the six braille letters spell TINTIC.\n4. Put together, TUNNEL + TINTIC points to the Tintic Railroad Tunnel near Elberta, on the Eureka / US-6 side. A hunter's recap also names Tintic Tunnel as QR2, and the map pin near Eureka / US-6 matches.\n5. The QR was inside the tunnel, secured to a rock. Plaque question: 'What body of water is to the northeast of where you are?' Answer: Utah Lake.", "techniques": ["morse-code", "braille", "video", "video-steganography", "sponsor-reference", "landmark"], "red_herrings": [], "hints": [], "open_questions": ["Clue text is not verbatim. The only version is a description of the video from a hunter's doc. The video URL and any title or caption text were not captured.", "Sponsor link not established: a hunter (A team #qr-2, 2024-10-05) recalled QR2 as a 'sponsor video', but the full-solve doc does not mention a sponsor or say which one it was.", "The sources describe the location differently: a hunter's doc says 'outside Elberta' and the team window says 'near Eureka' / US-6. Exact coordinates were not recorded.", "No official hints were quoted in any source."], "coords": null, "n_sources": 4, "steps": [{"t": "step", "n": "1", "clue": [], "label": null, "lead": null, "text": "The clue was a YouTube video in two parts (A hunter remembered it as a sponsor video).", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Part 1", "lead": null, "text": "A lantern flickers in the background of the opening. Read as Morse code, the flashes spell 'TUNNEL TUNNEL'.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Part 2", "lead": null, "text": "Six photos follow, and each has one braille letter photoshopped into it. Read in order, the six braille letters spell TINTIC.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": null, "lead": "Put together, TUNNEL + TINTIC points to the Tintic Railroad Tunnel near Elberta, on the Eureka / US-6 side.", "text": "A hunter's recap also names Tintic Tunnel as QR2, and the map pin near Eureka / US-6 matches.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": null, "lead": "The QR was inside the tunnel, secured to a rock.", "text": "Plaque question: 'What body of water is to the northeast of where you are?' Answer: Utah Lake.", "bullets": []}], "title": "Morse lantern and braille photos video", "media": [], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 3, "status": "confirmed", "confidence": 0.9, "clue_text": "(A link to a Roblox obstacle-course game with nine levels: Desert, Swamp, Track, Lava, River, Barn, Snow, Castle and Graveyard; touching a trap restarts you from the beginning.)", "plaque_question": "What type of encoding was used in the second half of the video?", "plaque_answer": "braille", "location_name": "Crazy Corn Maze, West Jordan", "location_detail": "Originally inside the Corn Pit (business hours only); after bad weather it was moved to the fence on the perimeter of the parking lot, reachable any time.", "solve_path": "1. The QR3 clue was a link to a Roblox obstacle-course game with nine levels: Desert, Swamp, Track, Lava, River, Barn, Snow, Castle and Graveyard. Touching a trap sends you back to the beginning.\n2. Beat all nine levels. After the Graveyard level, a screen tells players to go to Crazy Corn Maze in West Jordan (source: a hunter's full-solve doc).\n3. The plaque was at Crazy Corn Maze. It started inside the Corn Pit, which was open only during business hours. After bad weather it was moved to the fence around the parking lot, where you could reach it any time.\n4. Plaque question: 'What type of encoding was used in the second half of the video?' This refers back to the QR2 video. Answer: braille.\n5. Discord confirmation: in #general on 2023-10-18, two hunters said QR3 was the 'Krazy Korn' corn maze.\nNote from the solve doc: the same game link may be reused for a different version in a future hunt.\nSeparate material that was also tagged QR3: a #clue-3-discussion thread (2023-10-21) has a hunter's recap of a final step. It is his reconstruction, not the verbatim clue. Each riddle line gives one digit: 'Stop' = 8 (stop sign); 'Don't divide by me' = 0; 'The Romans didn't know I'd be in binary' = 1; 'Each day of the week' = 7; 'I'm the winning ball' = 8 (8-ball); 'Doesn't matter what the season' = 4; 'Make a wish so you don't fall' = 3; 'Play some tic tac toe or a baseball game' = 9; 'What repeats again.' = 8; 'Drinks and muscles are the same' = 6 (six-pack). The digits form 801-784-3986. The clue said that when they ask who you're calling for, you say 'Harry Houdini' (a line from Almost Famous). Zane called the number and reached the organizer, Dave, who congratulated them. The winner was a group of 3 teams. That thread also mentions earlier steps in passing: a URL, a Python script, using Google Images to find where images were taken, and coordinates for those images.", "techniques": ["online-game", "in-game-message", "sponsor-location", "number-code", "wordplay", "riddle", "phone-number", "movie-quote"], "red_herrings": ["A hunter first wondered whether QR3 was Adams Canyon or Bloom. It was the corn maze; Adams Canyon was QR4.", "In the phone-number step from #clue-3-discussion, the team thought 'Harry Houdini' was itself a number and were most sold on that reading. Afterward they called it a red herring.", "Another solver, Pikas, had 'the AOW thing' right but translated it to 'Tuttle shell' and went to Turtle Peak. The chat doesn't say which step of the hunt this was."], "hints": [], "open_questions": ["The phone-number riddle (801-784-3986, 'Harry Houdini') from #clue-3-discussion doesn't match the confirmed QR3 solve (Roblox game → Crazy Corn Maze plaque, answer braille). It may belong to a different QR or to the final treasure step, so its QR number is unconfirmed. Its techniques and red herrings are included here only because the merge rules ask for a union.", "The riddle lines in the phone-number step are a hunter's reconstruction, not the verbatim clue.", "No verbatim QR3 clue text is available. clue_text is the solve doc's description of the Roblox game link.", "The spelling differs between sources: Discord says 'Krazy Korn' and the solve doc says 'Crazy Corn Maze'.", "The URL, Python script, Google Images and image-coordinates steps mentioned in #clue-3-discussion aren't tied to any specific QR.", "Which step Pikas's 'AOW' / 'Tuttle shell' / Turtle Peak detour belonged to is unknown."], "coords": null, "n_sources": 13, "steps": [{"t": "step", "n": "1", "clue": [], "label": null, "lead": null, "text": "The QR3 clue was a link to a Roblox obstacle-course game with nine levels: Desert, Swamp, Track, Lava, River, Barn, Snow, Castle and Graveyard. Touching a trap sends you back to the beginning.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": null, "lead": "Beat all nine levels.", "text": "After the Graveyard level, a screen tells players to go to Crazy Corn Maze in West Jordan (source: a hunter's full-solve doc).", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": null, "lead": "The plaque was at Crazy Corn Maze.", "text": "It started inside the Corn Pit, which was open only during business hours. After bad weather it was moved to the fence around the parking lot, where you could reach it any time.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Plaque question", "lead": null, "text": "'What type of encoding was used in the second half of the video?' This refers back to the QR2 video. Answer: braille.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Discord confirmation", "lead": null, "text": "In #general on 2023-10-18, two hunters said QR3 was the 'Krazy Korn' corn maze.", "bullets": []}, {"t": "p", "label": "Note from the solve doc", "text": "The same game link may be reused for a different version in a future hunt."}, {"t": "p", "label": null, "text": "Separate material that was also tagged QR3: a #clue-3-discussion thread (2023-10-21) has a hunter's recap of a final step. It is his reconstruction, not the verbatim clue. Each riddle line gives one digit: 'Stop' = 8 (stop sign); 'Don't divide by me' = 0; 'The Romans didn't know I'd be in binary' = 1; 'Each day of the week' = 7; 'I'm the winning ball' = 8 (8-ball); 'Doesn't matter what the season' = 4; 'Make a wish so you don't fall' = 3; 'Play some tic tac toe or a baseball game' = 9; 'What repeats again.' = 8; 'Drinks and muscles are the same' = 6 (six-pack). The digits form 801-784-3986. The clue said that when they ask who you're calling for, you say 'Harry Houdini' (a line from Almost Famous). Zane called the number and reached the organizer, Dave, who congratulated them. The winner was a group of 3 teams. That thread also mentions earlier steps in passing: a URL, a Python script, using Google Images to find where images were taken, and coordinates for those images."}], "title": "Roblox obstacle course", "media": [], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 4, "status": "confirmed", "confidence": 0.95, "clue_text": "[Image clue: parchment scroll, one word and a signed number per line, laid out in the shape of a chess King; some pairs are joined with \"X\" (multiplication)] BAND 8 / OATH -14 / EXISTENCE -12 / BRIDE -6 X EQUALS 1 / IGNORANT 6 X TRANSIT 11 / IMPRESSION -18 / PURPOSE 6 / NOTICE -11 / POSSIBILITIES 17 / CHESS 10 / STOLEN -9 / TOGETHER 11 / WEALTHIER -11 / HUMILIATED -9 X HANDLED -4 / CLIFF 2 / SPENT -4 / COMPARED -10", "plaque_question": "What was the name of the trail?", "plaque_answer": "Adam's Canyon Trail (accepted with the apostrophe; the trail is really 'Adams Canyon', but AllTrails and some Google results list it as 'a hunter's')", "location_name": "Adams Canyon Trail, Layton", "location_detail": "41.069472, -111.889351 (Layton area). Partway up the Adams Canyon Trail, veer off onto a short side path. The metal QR plaque was attached to a fallen tree. Someone had tried to pry the plaque loose and it was hard to scan (A hunter). Some teams reached it on a night hike.", "solve_path": "1. Shape: the scroll's words are laid out like a chess King. That shape is the only pointer to the source text: The Count of Monte Cristo (\"kings to you\"). The full-solve doc says the reference is the MOVIE SCRIPT of The Count of Monte Cristo, not the novel. Organizer John said the first team to solve it ('smith mob') spotted the King shape.\n2. Book cipher with word offsets: each scroll word appears exactly once in the script. Find it, then move forward (positive number) or backward (negative number) that many words. The word you land on is a number word, sometimes a sound-alike (\"Won\" = 1, \"For\" = 4, \"Oh\" = 0, \"To\" = 2).\n3. Lookups: BAND 8 -> For (4); OATH -14 -> Won (1); EXISTENCE -12 -> Oh (0); BRIDE -6 -> To (2) x EQUALS 1 -> Three (3) = 6; IGNORANT 6 -> Three x TRANSIT 11 -> Three = 9; IMPRESSION -18 -> Four (4); PURPOSE 6 -> Seven (7); NOTICE -11 -> Two (2); POSSIBILITIES 17 -> One (1); CHESS 10 -> One (1); STOLEN -9 -> One (1); TOGETHER 11 -> Eight (8); WEALTHIER -11 -> Eight (8); HUMILIATED -9 -> Three x HANDLED -4 -> Three = 9; CLIFF 2 -> Three (3); SPENT -4 -> Five (5); COMPARED -10 -> One (1).\n4. Digits in order: 41069472111889351 -> 41.069472, -111.889351. This is a spot off the Adams Canyon Trail in Layton. Hike partway up, take a short side path, and the metal QR plaque is on a fallen tree.\n5. Plaque question: \"What was the name of the trail?\" Accepted answer: \"Adam's Canyon Trail\".\nField notes: some hunters worked out the coordinates in the middle of the night and hiked up to scan first; one hunter was on the trail at about 1 a.m. A rival group called it a \"very dangerous night hike\". Someone had tried to pry the plaque loose, which made it hard to scan, but it was still in place.", "techniques": ["shape-clue", "count-of-monte-cristo", "book-cipher", "movie-script", "word-offset", "number-words", "coordinates"], "red_herrings": ["Book editions of The Count of Monte Cristo: the reference text is the movie script, not the novel. Hunters later recalled it 'didn't work on every script' either, so the version matters."], "hints": [], "open_questions": ["The exact Count of Monte Cristo script version or source (URL/edition) where each word appears exactly once is not identified. Hunters said it 'didn't work on every script'.", "The clue text is a transcription of the scroll image. The exact line layout and King-shape arrangement are only visible in the image.", "The full-solve doc credits 'smith mob' (per organizer John) as the first solvers. A team chat describes 'a couple of hunters' who hiked it at night to scan first, and a hunter was unsure of the details. Whether these are the same team is not stated.", "It is not known whether 'Adams Canyon Trail' (no apostrophe) was also accepted as the plaque answer. Only the apostrophe form is recorded as accepted.", "A Notion write-up 'QR 4 - Scroll' was shared in a team #qr-4. It is not stated whether this is the same document as the hunter '2023 QR Treasure Hunt' full-solve doc.", "In the team-chat records, the QR number (4) came from the team's 2023 checkpoint list (QR4 - Adam's Canyon), not from those conversations. The team chat (hunters) and the full-solve doc also place QR4 at Adams Canyon."], "coords": [41.069472, -111.889351], "n_sources": 22, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Shape", "lead": null, "text": "The scroll's words are laid out like a chess King. That shape is the only pointer to the source text: The Count of Monte Cristo (\"kings to you\"). The full-solve doc says the reference is the MOVIE SCRIPT of The Count of Monte Cristo, not the novel. Organizer John said the first team to solve it ('smith mob') spotted the King shape.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Book cipher with word offsets", "lead": null, "text": "Each scroll word appears exactly once in the script. Find it, then move forward (positive number) or backward (negative number) that many words. The word you land on is a number word, sometimes a sound-alike (\"Won\" = 1, \"For\" = 4, \"Oh\" = 0, \"To\" = 2).", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Lookups", "lead": null, "text": "BAND 8 -> For (4); OATH -14 -> Won (1); EXISTENCE -12 -> Oh (0); BRIDE -6 -> To (2) x EQUALS 1 -> Three (3) = 6; IGNORANT 6 -> Three x TRANSIT 11 -> Three = 9; IMPRESSION -18 -> Four (4); PURPOSE 6 -> Seven (7); NOTICE -11 -> Two (2); POSSIBILITIES 17 -> One (1); CHESS 10 -> One (1); STOLEN -9 -> One (1); TOGETHER 11 -> Eight (8); WEALTHIER -11 -> Eight (8); HUMILIATED -9 -> Three x HANDLED -4 -> Three = 9; CLIFF 2 -> Three (3); SPENT -4 -> Five (5); COMPARED -10 -> One (1).", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Digits in order", "lead": null, "text": "41069472111889351 -> 41.069472, -111.889351. This is a spot off the Adams Canyon Trail in Layton. Hike partway up, take a short side path, and the metal QR plaque is on a fallen tree.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Plaque question", "lead": null, "text": "\"What was the name of the trail?\" Accepted answer: \"Adam's Canyon Trail\".", "bullets": []}, {"t": "p", "label": "Field notes", "text": "Some hunters worked out the coordinates in the middle of the night and hiked up to scan first; one hunter was on the trail at about 1 a.m. A rival group called it a \"very dangerous night hike\". Someone had tried to pry the plaque loose, which made it hard to scan, but it was still in place."}], "title": "Chess-king scroll and a movie-script cipher", "media": [{"src": "media/2023-qr4-01.jpg", "section": "clue", "caption": "The scroll clue. The words are laid out in the shape of a chess King, each with a word offset.", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 5, "status": "confirmed", "confidence": 0.9, "clue_text": null, "plaque_question": null, "plaque_answer": null, "location_name": "Bloom Studios (salon), room 113. The final QR was an image recovered from the file matt2016.bin, not a plaque in the field.", "location_detail": "Bloom Studios is a salon. A hunter described it as tied to the organizers' family (\"John's sister laughed and pointed us to the door\"). Front-desk staff, and later a sign at the front desk, sent hunters to room 113. In that room the door locks, a computer boots, and you copy a .bin file from that computer onto a USB drive you brought. None of the sources give the street address or city.", "solve_path": "Part 1 (online game): Beat the TreasureGuns run-and-gun browser game. The end screen tells you to go to Bloom Studios and to ask for \"the bear made of stone\", which refers to a past hunt. A hunter posted this end screen in a team #qr-3. You also had to solve the first part of the clue to know you should bring a USB drive (A hunter; a hunter confirmed this).\n\nPart 2 (salon / escape room): At Bloom Studios, ask at the front desk. A hunter found reception empty and got nothing until she asked about \"the stone bear\". A hunter never asked and was waved to the room after laughing. Later, a front-desk sign simply said room 113. Inside room 113 the door locks and a computer boots. The monitor has a polarizing privacy screen, so you can only read it through the glasses on the mannequin heads. A sign outside the door gives the file path t/c/b/f/s/s/c/matt2016.bin. Copy that file to your USB drive (\"download some file from their computer\", per a hunter).\n\nPart 3 (file forensics): \"matt2016\" = Matthew 20:16, \"the last shall be first, and the first last.\" Open the file in a hex editor. It starts with 'M' and ends with 'B': the first byte of the 'BM' bitmap signature was moved to the end of the file. Move the 'B' back to the front and rename .bin to .bmp. The image that opens is the QR code. A hunter called this \"the one where we made a picture.\"", "techniques": ["online-game", "video-game-clue", "local-business", "sponsor-location", "password-phrase", "escape-room", "usb-file-download", "file-forensics", "hex-editor", "file-signature", "bible-reference"], "red_herrings": [], "hints": [], "open_questions": ["None of the four sources has the verbatim clue text. The full-solve doc only gives a summary: 'Part 1: an online game, TreasureGuns. Part 2: a locked room at Bloom Studios with a booting computer; find a deeply nested file. Part 3: the file matt2016.bin.' The Notion write-up's title is 'QR 5 - TreasureGuns Game, Salon, & .bin file'.", "What words were needed at the front desk? A hunter got nothing until she asked about 'the stone bear'. A hunter says she never asked and was waved through. The full-solve doc says the end screen told you to ask for 'the bear made of stone', and that a front-desk sign later just said room 113. It is unclear whether the phrase was required, or for how long.", "The salon's name: in 2024 a hunter remembered it only as 'Bloom Studios or something'. A hunter's 2023 recap and the full-solve doc both say Bloom Studios.", "Street address and city of Bloom Studios are not given in any source.", "Which organizer the salon is tied to: a hunter's 'John's sister' remark is the only reference, and no source says who 'John' is.", "Which wording in Part 1 told you to bring a USB drive is not quoted anywhere.", "What the letters in the path t/c/b/f/s/s/c stand for is not explained in any source.", "Whether scanning the recovered QR image led to a follow-up plaque question is not mentioned."], "coords": null, "n_sources": 17, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Online game", "lead": null, "text": "Beat the TreasureGuns run-and-gun browser game. The end screen tells you to go to Bloom Studios and to ask for \"the bear made of stone\", which refers to a past hunt. A hunter posted this end screen in a team #qr-3. You also had to solve the first part of the clue to know you should bring a USB drive (A hunter; a hunter confirmed this).", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Salon / escape room", "lead": null, "text": "At Bloom Studios, ask at the front desk. A hunter found reception empty and got nothing until she asked about \"the stone bear\". A hunter never asked and was waved to the room after laughing. Later, a front-desk sign simply said room 113. Inside room 113 the door locks and a computer boots. The monitor has a polarizing privacy screen, so you can only read it through the glasses on the mannequin heads. A sign outside the door gives the file path t/c/b/f/s/s/c/matt2016.bin. Copy that file to your USB drive (\"download some file from their computer\", per a hunter).", "bullets": []}, {"t": "step", "n": "3", "clue": ["matt2016"], "label": "File forensics", "lead": null, "text": "Matthew 20:16, \"the last shall be first, and the first last.\" Open the file in a hex editor. It starts with 'M' and ends with 'B': the first byte of the 'BM' bitmap signature was moved to the end of the file. Move the 'B' back to the front and rename .bin to .bmp. The image that opens is the QR code. A hunter called this \"the one where we made a picture.\"", "bullets": []}], "title": "Browser shooter game and a salon secret phrase", "media": [], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 6, "status": "confirmed", "confidence": 0.95, "clue_text": "(Egyptian/hieroglyphic-themed image with a string of numbers and the letters:) 1 11 12 26 2 16 22 17 15 6 5 17 24 17 16 11 6 / ozxokzpsruqfqmdfuzsqmpmcpxnem", "plaque_question": "What is Dave's wife standing next to in the reel with the oars?", "plaque_answer": "Crib", "location_name": "Dry Creek Trail, Alpine", "location_detail": "Alpine, Utah. About 0.4 miles up the Dry Creek trail, at around 6,000 ft, there is a pole/post in the ground. Off to the right, scramble up a dirt hill. QR6 was secured to a tree at the top. Hunters used the Alpine trailhead parking lot.", "solve_path": "This is a Vigenère cipher. The numbers encode the key and the letters are the message.\n1) Split the number string (11112262162217156517241716116) into 1 11 12 26 2 16 22 17 15 6 5 17 24 17 16 11 6.\n2) Convert with A1Z26 to get AKLZBPVQOFEQXQPKF.\n3) Caesar shift +3 to get DNOCESYTRIHTATSNI.\n4) Reverse it to get INSTATHIRTYSECOND ('Insta thirty-second'), which points to the 32nd post/reel on both Dave's and John's Instagram accounts.\n5) Dave's 32nd post (about two years old at the time) has a tiny oars icon. Its caption was recently edited to add 'How do eight eights add up to one thousand?'. John's 32nd post has a stove ('range') icon and the caption '888 + 88 + 8 + 8 + 8 = 1000'. The question/answer pair tells you which post comes first and that you add them.\n6) OAR + RANGE = ORANGE.\n7) Hieroglyphics can be read in either direction, so Atbash ORANGE to get LIZMTV, the Vigenère key.\n8) Decode ozxokzpsruqfqmdfuzsqmpmcpxnem with key LIZMTV to get 'drycreeksixkfeetbehindthepost': Dry Creek trail (Alpine), 6,000 ft, behind the post.\n9) Hike about 0.4 mi up the Dry Creek trail to the post/pole at about 6,000 ft. Scramble up the dirt hill to the right and find QR6 on a tree at the top.\n10) The plaque question comes from Dave's oars reel: 'What is Dave's wife standing next to in the reel with the oars?' Answer: Crib.\nThe 2023-10-13 email said that solving it the intended way needed the Instagram posts, but many teams skipped that step and brute-forced the letters in a Vigenère solver.", "techniques": ["number-code", "a1z26", "caesar-cipher", "reversal", "atbash", "vigenere", "sponsor-reference", "social-media", "hidden-in-old-social-media-post", "icon-cipher", "egyptian-cipher", "number-puzzle", "wordplay", "elevation", "coordinates-by-description"], "red_herrings": ["Two 30-second Instagram stories posted the day the clue dropped were deliberate red herrings. 'Thirty-second' in the key means the 32nd post.", "The +3 Caesar shift was chosen only so the reversed text starts with D and ends in 'second'. John confirmed it is a coincidence that 3 is the only digit missing from 1-7."], "hints": ["To solve this the way we intended, you will need information from posts on both John and Dave's Instagram accounts. (Although many teams figured it out without that part)"], "open_questions": ["Exact spot: a hunter's recap and the decoded text say 'behind the post'. The Notion write-up says the QR was on a tree at the top of a dirt hill to the right of the pole. The two are not reconciled.", "A hunter wrote the decoded text as 'drycreek6kfeetbehindthepost'. The Notion doc gives the letter-only form 'drycreeksixkfeetbehindthepost', which is consistent with a letters-only Vigenère.", "The sources disagree on the icons: a hunter says the video thumbnails show oars and an oven, while Notion says tiny icons in the posts. One 2024 chat says the symbol was hidden in Dave's 32nd reel.", "The 2024 screenshot of John's May 5, 2023 post (Douglas fir floors, #flippingfriday) carries the '888 + 88 + 8 + 8 + 8 = 1000' caption. No source explicitly confirms that this is the 32nd post.", "Only the Notion doc gives the plaque question wording. A hunter only says it came from the oars video.", "The original clue image is not attached, and the full number string is only quoted unspaced by a hunter."], "coords": null, "n_sources": 35, "steps": [{"t": "p", "label": null, "text": "This is a Vigenère cipher. The numbers encode the key and the letters are the message."}, {"t": "step", "n": "1", "clue": [], "label": null, "lead": null, "text": "Split the number string (11112262162217156517241716116) into 1 11 12 26 2 16 22 17 15 6 5 17 24 17 16 11 6.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": null, "lead": null, "text": "Convert with A1Z26 to get AKLZBPVQOFEQXQPKF.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": null, "lead": null, "text": "Caesar shift +3 to get DNOCESYTRIHTATSNI.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": null, "lead": null, "text": "Reverse it to get INSTATHIRTYSECOND ('Insta thirty-second'), which points to the 32nd post/reel on both Dave's and John's Instagram accounts.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": null, "lead": "Dave's 32nd post (about two years old at the time) has a tiny oars icon.", "text": "Its caption was recently edited to add 'How do eight eights add up to one thousand?'. John's 32nd post has a stove ('range') icon and the caption '888 + 88 + 8 + 8 + 8 = 1000'. The question/answer pair tells you which post comes first and that you add them.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": null, "lead": null, "text": "OAR + RANGE = ORANGE.", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": null, "lead": null, "text": "Hieroglyphics can be read in either direction, so Atbash ORANGE to get LIZMTV, the Vigenère key.", "bullets": []}, {"t": "step", "n": "8", "clue": [], "label": null, "lead": null, "text": "Decode ozxokzpsruqfqmdfuzsqmpmcpxnem with key LIZMTV to get 'drycreeksixkfeetbehindthepost': Dry Creek trail (Alpine), 6,000 ft, behind the post.", "bullets": []}, {"t": "step", "n": "9", "clue": [], "label": null, "lead": null, "text": "Hike about 0.4 mi up the Dry Creek trail to the post/pole at about 6,000 ft. Scramble up the dirt hill to the right and find QR6 on a tree at the top.", "bullets": []}, {"t": "step", "n": "10", "clue": [], "label": null, "lead": "The plaque question comes from Dave's oars reel: 'What is Dave's wife standing next to in the reel with the oars?'", "text": "Answer: Crib.", "bullets": []}, {"t": "p", "label": null, "text": "The 2023-10-13 email said that solving it the intended way needed the Instagram posts, but many teams skipped that step and brute-forced the letters in a Vigenère solver."}], "title": "Hieroglyph numbers and a stacked cipher chain", "media": [{"src": "media/2023-qr6-01.jpg", "section": "clue", "caption": "The clue: a number string (the Vigenère key, encoded) and a letter string (the message) over an Egyptian tomb.", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 7, "status": "confirmed", "confidence": 0.85, "clue_text": "Hike from where morning light is free\nDown four then right half of three\nThe creatures all look to the way\nBut first 65 paces or you'll be astray\nOne more than the logs and you're lost in a jiffy\nOn this path find the man from nineteen fifty\nIt's time to play Frogger to go to behind\nIs it arc math? addition? Look to the spines\nWhere Five from eleven crosses four from twentytwo\nThis line means zip it's here just to fool\nRhyming's hard now you're in the right place\nWander to and fro till you find the right face\nUpside down frogs by logs first found\nThen by the feathers then two then pound", "plaque_question": "Name the smallest of the four books you used to get here", "plaque_answer": "Steppenwolf", "location_name": "Pop-up game room + escape room behind a keypad door next to Dave & Buster's, The Gateway, Salt Lake City", "location_detail": "The Gateway, downtown Salt Lake City. One record gives the address as 108 S Rio Grande St. The site is a sticker-covered door on the north side of Dave & Buster's (one record says second floor), with a Wiegand keypad on its left. Door code 4252#. Inside: game room (7-digit code to the next door) → pirate-themed escape room (piano, ship's wheel, colored-button box) → last door, code 4873 → QR plaque. Route waypoints: Washington Square water-wise garden / SLC Library → mural behind Tanner Frames (18 800 S) → north on Main St → Book Mural via the alley by Keys on Main (Gallivan Center area) → rainbow crosswalks at 100 S & S Rio Grande St.", "solve_path": "The poem leads to a locked door at The Gateway in Salt Lake City. Behind it are a game room and then an escape room, and the QR plaque is at the end. Most teams reached The Gateway by other routes (the Clark Planetarium, John's Instagram eclipse story, following organizers). The forward route below was put together after the find (10-15 to 10-22).\n\nFORWARD ROUTE (post-hunt reconstruction):\n1) 'Hike from where morning light is free' = the start. A hunter's reading: the 'Morning Light' plants around the flagpole in the labeled water-wise garden at Washington Square (City & County Building). A hunter's reading: the 'enlightenment' theme at the SLC Library across the street, which gives about the same start point.\n2) 'Down four then right half of three' = go 4 blocks south, then turn right (west) and go 1.5 blocks. This reaches the mural on a blue brick wall behind Tanner Frames, 18 800 S. Organizer John confirmed the mural is part of the solve. The mural shows 5 upside-down frog heads and 5 logs in a campfire.\n3) 'The creatures all look to the way' = apart from the upside-down frogs, the mural's creatures all face north. 'But first 65 paces' = first walk about 65 paces (~162 ft) to the corner at Main Street.\n4) 'One more than the logs and you're lost' = walk north 5 blocks on Main (5 logs). A 6th block takes you past the turn.\n5) 'Man from nineteen fifty' / 'Frogger to go to behind': a street plaque at the alley next to Keys on Main is thought to be 'the man from 1950'. It points down the alley to the Book Mural, a painted bookshelf on a brick wall. A hunter put the man, the Frogger crossing and the books at the Gallivan Center.\n6) 'Look to the spines' / 'Where Five from eleven crosses four from twentytwo': the mural's books are numbered 1-22. Book 11 is Steppenwolf and book 22 is A Gentle Madness. Counting 5 UP from 11 gives #16, Gravity's Rainbow. Counting 4 DOWN from 22 gives #18, The Wizard of Oz. Rainbow crosses yellow brick road = the rainbow / yellow-brick-road crosswalks at 100 S & S Rio Grande St, next to the Salt Lake County Library at The Gateway. This shows clearly on Google satellite imagery, but the paint has since changed. 'This line means zip' (line 10) is filler.\n7) 'Rhyming's hard now you're in the right place / Wander to and fro till you find the right face': a locked door at The Gateway next to (north of) Dave & Buster's. It is covered in a sticker collage, and one sticker is a cartoon face matching organizer Dave. The keypad is to the left of the door.\n8) 'Upside down frogs by logs first found / Then by the feathers then two then pound': organizer John's DM hint says to multiply frogs × logs × feathers, then enter 2, then #. A hunter found the code 4252 by brute force. A hunter then worked backward: 425 = 5×5×17, so frogs = 5, logs = 5 and feathers = 17. That fits the mural's 5 frogs and 5 logs. Nobody confirmed 17 feathers by counting.\n\nON-SITE STAGES:\n9) Game room: board games are glued to the tables, and they give a 7-digit code. Blokus says 'SEVEN DIGIT CODE BUT NO BLOKUS'. Boggle ('UNUTILIZED'), Taboo and Sorry are unused. Monopoly gives 'FIRST', Battleship 'NOT THE FIRST OR LAST', Rummy (a card cipher, K♣=Z, Q♣=Y and so on) 'THE THIRD FROM THE END', Scrabble 'two away from rummy', and Mad Gab 'before and after, a game of rummy'. Mastermind gives Blue Green Red Green. A hunter read the digits from the games' positions: 7 ? 9 5 4 5 0. The second digit was guessed, and the code was recorded as 7395450 or 7995450.\n10) Escape room: playing 'Mary Had a Little Lamb' on the piano (keys 4635) sets off a box, which points to the ship's wheel. Turn the wheel until its 2-letter pairs make 8 four-letter words (PULL, LIVE, CORE, MARY, DOCK, LAKE, JUMP, WIRE); MARY is the key. Rungs 4, 6, 3, 5 then give the wall colors B G R B G R Y B. Entering those on the colored-button box opens it to a sign: 'Lanterns / Animals (3D only) / Frames / \"Mary\"s'. The room has 4 lanterns, 8 3D animals, 7 frames and 3 Marys, so the last door's code is 4873.\n11) The QR plaque is behind that door. Question: 'Name the smallest of the four books you used to get here'. Answer: Steppenwolf (capitalization matters when entering it). After scanning, teams emailed all their selfies as proof, and the next clue came about 48 hours later.", "techniques": ["wordplay", "local-history", "landmark-photo", "street-grid", "pacing-directions", "map-overlay", "book-spines", "counting", "number-code", "prime-factorization", "brute-force", "pop-culture-reference", "on-site-search", "on-site-puzzle", "escape-room", "board-games", "positional-ordering", "word-grid", "anagram", "substitution-cipher", "playing-cards", "red-herring-elimination", "music-code", "word-wheel", "word-formation", "color-code", "book-title", "coordinates", "acrostic", "vigenere", "color-mapping", "transit-map"], "red_herrings": ["Studio Elevn / Central (International Harvester) building, 435 W 400 S: the route was Clark Planetarium → 400 W → 300 S Homewood Suites ducks → Rio Grande Depot ('Rio Grande' 1950 John Wayne film) → 'Elevn' (eleven minus its 5th letter) → half-face sculpture over the door. Teams went and found nothing. The team sent this solve to the organizers and it was not accepted.", "A hunter's (11+5)×(4+22)=416 → 416 University Blvd, across from Studio Elevn", "Clark Planetarium as the start (4 S, 1.5 E/W): many teams reached the Gateway this way, but it is not the intended start", "Memory Grove / Korean War Memorial (TIME 1950 'The Fighting Man') / Sweet Switchbacks; City Creek and the Freedom Trail ('morning light is free' = freedom): followed, nothing found", "Gardner Village (Wanderlust, Solstice spa, witches as faces): theory from another chat, doubted", "Get Out Games escape room, Gateway escape room, 329 S Rio Grande St, Trolley Square, Three Creeks Confluence, CrossFit/production studio between Studio Elevn and Table 22, 52 E North Temple (Church Office Building): checked or dropped, nothing there", "600 W & 1800 N, Pleasant Grove (11-5=6, 22-4=18): nothing seen", "The Crossing at Daybreak / Frogs Leap Dr (Churchill Living) and Freedom Park Dr in Daybreak: nothing found", "Ogden: Peery's Egyptian Theater area, Fort Buenaventura, Ben Lomond; coordinate readings 41.2365,-111.950 and DAWN = 41°23'14\": nothing found", "This Is the Place monument (dedicated 1947), Capitol, Springville statue tour, Gilgal Garden, Cathedral of the Madeleine gargoyles, Hogle Zoo, dinosaur sites (Thanksgiving Point, Ogden dinosaur park): rejected or not followed up", "'Man from 1950' readings: Churchill, Truman, famous men born in 1950, Brigham Young statue (1950), Pioneer Museum, Bennion, a 1950 address (Circle of Hope Dr)", "Cipher attempts (first letters, capitals-only, Vigenère, CryptoCrack brute force): no readable output", "Tree Fort Realty keypad photo from a kicked member (suspected troll): no lockbox", "Keypad guesses rejected at the Gateway door: 6522, 6322, 9522, 9322, 3962, 3232, 1082, 1262, 1442, 1122, 1622, 1352, 2252, 2702, 3152, 3602, 4052, 1002-1902, 1102, 1602, 1522#, 102#/0102#, 6602#, 4162, 2882, 2162, 1052, 4322, 5042, 5762, 1302, 9602, 0002, 4902, multiples of 48/49 ending in 2; 19602 does not fit (the keypad takes only 4 digits)", "Frog/log/feather counts that did not work: railroad/TRAX frogs at 400 W & S Temple, A-frame sculptures, 48-49 Olympic snowflake signs, crosswalk stripes (5), seesaws (3), angel-wings mural (2 feathers), light-post feathers (40)", "Plaque answers rejected: Wizard of Oz, The Invention of Solitude, The Cat in the Hat, Their Finest Hour (suggested)", "Game room: Boggle (UNUTILIZED), Blokus, Taboo and Sorry are not used; the rummy hand's score (96/97) is not the digit; Monopoly's blank cards are normal", "Escape room: Mastermind colors (BGRG) are not the box code", "A hunter's 6×18=108 + Rio Grande → 108 S Rio Grande reached the right place, but a hunter called it a coincidence"], "hints": ["Organizer John Maxim (onthejohn), Instagram DM to a team member, 2023-10-14 2:18 PM (screenshot): \"Just multiply the upside down forges [frogs] you saw by the logs then multiply that by the feathers then 2 and pound. Easy. Unless you found it on accident\"", "A hunter's paraphrase of a hint (exact wording not quoted): count only the frogs you see on the path, not every frog in the city", "Organizer Instagram post (not a formal hint): 'We've spent a lot of hours and $$$ getting QR7 as awesome as possible'. The footage showed a blacklight on a brick wall."], "open_questions": ["Clue wording: one transcription has stanza breaks and capitalizes 'Addition?'. The pinned images and the spreadsheet use 'addition?'. Line 12 is quoted elsewhere as 'until' rather than 'till'.", "Start point: Morning Light plants at Washington Square (A hunter) or the SLC Library's 'enlightenment' theme (A hunter). The organizers' intended start was never posted.", "Tanner Frames mural address: given as 18 800 S, but a hunter also said '800 S 15 E'. A hunter described it as a 'food mural on a blue brick wall'.", "Feathers = 17 comes only from factoring 425 (5×5×17). Nobody confirmed it by counting, and the team found 4252 by brute force.", "'The man from 1950' was never pinned down. Ideas: the street plaque at the alley by Keys on Main, a sidewalk square dedicated to Richard Wirick (location unclear), or a hunter's marker near Gallivan Center.", "Line 9 had several readings (A hunter said 4 could work): 5 up / 4 down → Gravity's Rainbow × Wizard of Oz → rainbow crosswalk; 5 left / 4 left → Refuge (blue) × Wizard of Oz (green) → TRAX Blue/Green junction at the Planetarium stop; a hunter's Mark Twain → Gateway Arch reading. The organizers' intended reading was not posted.", "No record says which four books 'you used to get here' are, or why Steppenwolf counts as the 'smallest'.", "Game-room code recorded as 7395450 (A hunter) or 7995450 (A hunter); the second digit was guessed.", "Exact door location: one record says second floor, others say a door next to (north of) Dave & Buster's. The 108 S Rio Grande St address comes from one record. A shared pin (40°46'01.7\"N 111°54'15.8\"W) may be the wrong storefront.", "Whether the game room had a time limit: 1 hour was mentioned, but later teams saw none.", "A hunter suggested a 'gatekeeper question' (what multiplies to 425) might be asked after scanning; other records give the plaque question as the books question."], "coords": null, "n_sources": 614, "steps": [{"t": "p", "label": null, "text": "The poem leads to a locked door at The Gateway in Salt Lake City. Behind it are a game room and then an escape room, and the QR plaque is at the end. Most teams reached The Gateway by other routes (the Clark Planetarium, John's Instagram eclipse story, following organizers). The forward route below was put together after the find (10-15 to 10-22)."}, {"t": "h", "text": "Forward route", "sub": "post-hunt reconstruction"}, {"t": "step", "n": "1", "clue": ["Hike from where morning light is free"], "label": null, "lead": "The start.", "text": "A hunter's reading: the 'Morning Light' plants around the flagpole in the labeled water-wise garden at Washington Square (City & County Building). A hunter's reading: the 'enlightenment' theme at the SLC Library across the street, which gives about the same start point.", "bullets": []}, {"t": "step", "n": "2", "clue": ["Down four then right half of three"], "label": null, "lead": "Go 4 blocks south, then turn right (west) and go 1.5 blocks.", "text": "This reaches the mural on a blue brick wall behind Tanner Frames, 18 800 S. Organizer John confirmed the mural is part of the solve. The mural shows 5 upside-down frog heads and 5 logs in a campfire.", "bullets": []}, {"t": "step", "n": "3", "clue": ["The creatures all look to the way"], "label": null, "lead": "Apart from the upside-down frogs, the mural's creatures all face north.", "text": "'But first 65 paces' = first walk about 65 paces (~162 ft) to the corner at Main Street.", "bullets": []}, {"t": "step", "n": "4", "clue": ["One more than the logs and you're lost"], "label": null, "lead": "Walk north 5 blocks on Main (5 logs).", "text": "A 6th block takes you past the turn.", "bullets": []}, {"t": "step", "n": "5", "clue": ["Man from nineteen fifty", "Frogger to go to behind"], "label": null, "lead": "A street plaque at the alley next to Keys on Main is thought to be 'the man from 1950'.", "text": "It points down the alley to the Book Mural, a painted bookshelf on a brick wall. A hunter put the man, the Frogger crossing and the books at the Gallivan Center.", "bullets": []}, {"t": "step", "n": "6", "clue": ["Look to the spines", "Where Five from eleven crosses four from twentytwo"], "label": null, "lead": "The mural's books are numbered 1-22.", "text": "Book 11 is Steppenwolf and book 22 is A Gentle Madness. Counting 5 UP from 11 gives #16, Gravity's Rainbow. Counting 4 DOWN from 22 gives #18, The Wizard of Oz. Rainbow crosses yellow brick road = the rainbow / yellow-brick-road crosswalks at 100 S & S Rio Grande St, next to the Salt Lake County Library at The Gateway. This shows clearly on Google satellite imagery, but the paint has since changed. 'This line means zip' (line 10) is filler.", "bullets": []}, {"t": "step", "n": "7", "clue": ["Rhyming's hard now you're in the right place / Wander to and fro till you find the right face"], "label": null, "lead": "A locked door at The Gateway next to (north of) Dave & Buster's.", "text": "It is covered in a sticker collage, and one sticker is a cartoon face matching organizer Dave. The keypad is to the left of the door.", "bullets": []}, {"t": "step", "n": "8", "clue": ["Upside down frogs by logs first found / Then by the feathers then two then pound"], "label": null, "lead": "Organizer John's DM hint says to multiply frogs × logs × feathers, then enter 2, then #.", "text": "A hunter found the code 4252 by brute force. A hunter then worked backward: 425 = 5×5×17, so frogs = 5, logs = 5 and feathers = 17. That fits the mural's 5 frogs and 5 logs. Nobody confirmed 17 feathers by counting.", "bullets": []}, {"t": "h", "text": "On-site stages", "sub": ""}, {"t": "step", "n": "9", "clue": [], "label": "Game room", "lead": null, "text": "Board games are glued to the tables, and they give a 7-digit code. Blokus says 'SEVEN DIGIT CODE BUT NO BLOKUS'. Boggle ('UNUTILIZED'), Taboo and Sorry are unused. Monopoly gives 'FIRST', Battleship 'NOT THE FIRST OR LAST', Rummy (a card cipher, K♣=Z, Q♣=Y and so on) 'THE THIRD FROM THE END', Scrabble 'two away from rummy', and Mad Gab 'before and after, a game of rummy'. Mastermind gives Blue Green Red Green. A hunter read the digits from the games' positions: 7 ? 9 5 4 5 0. The second digit was guessed, and the code was recorded as 7395450 or 7995450.", "bullets": []}, {"t": "step", "n": "10", "clue": [], "label": "Escape room", "lead": null, "text": "Playing 'Mary Had a Little Lamb' on the piano (keys 4635) sets off a box, which points to the ship's wheel. Turn the wheel until its 2-letter pairs make 8 four-letter words (PULL, LIVE, CORE, MARY, DOCK, LAKE, JUMP, WIRE); MARY is the key. Rungs 4, 6, 3, 5 then give the wall colors B G R B G R Y B. Entering those on the colored-button box opens it to a sign: 'Lanterns / Animals (3D only) / Frames / \"Mary\"s'. The room has 4 lanterns, 8 3D animals, 7 frames and 3 Marys, so the last door's code is 4873.", "bullets": []}, {"t": "step", "n": "11", "clue": [], "label": null, "lead": "The QR plaque is behind that door.", "text": "Question: 'Name the smallest of the four books you used to get here'. Answer: Steppenwolf (capitalization matters when entering it). After scanning, teams emailed all their selfies as proof, and the next clue came about 48 hours later.", "bullets": []}], "title": "Walking-directions poem and escape room", "media": [{"src": "media/2023-qr7-01.jpg", "section": "clue", "caption": "Clue Number 7 as it appeared on utahtreasurehunts.com.", "kind": "image"}, {"src": "media/2023-qr7-02.jpg", "section": "solve", "caption": "The Book Mural, a painted bookshelf on a brick wall (steps 5 and 6).", "kind": "image"}, {"src": "media/2023-qr7-03.jpg", "section": "solve", "caption": "Hunters' list of the mural's 22 books. Counting 5 up from 11 and 4 down from 22 gives Gravity's Rainbow and The Wizard of Oz (step 6).", "kind": "image"}, {"src": "media/2023-qr7-04.jpg", "section": "solve", "caption": "The rainbow and yellow-brick-road crosswalks at 100 S and S Rio Grande St, as seen on Google Maps (step 6).", "kind": "image"}, {"src": "media/2023-qr7-05.jpg", "section": "solve", "caption": "The game room's welcome sign (step 9).", "kind": "image"}, {"src": "media/2023-qr7-06.jpg", "section": "solve", "caption": "The escape room piano and the box it sets off (step 10).", "kind": "image"}, {"src": "media/2023-qr7-07.jpg", "section": "solve", "caption": "The eight four-letter words made on the ship's wheel (step 10).", "kind": "image"}, {"src": "media/2023-qr7-08.jpg", "section": "solve", "caption": "The sign from the colored-button box: count the lanterns, 3D animals, frames and Marys (step 10).", "kind": "image"}, {"src": "media/2023-qr7-09.jpg", "section": "solve", "caption": "The plaque question shown after scanning (step 11).", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 8, "status": "confirmed", "confidence": 0.75, "clue_text": "STEP 1 – Final-clue email text: \"Congratulations for arriving at the last part of the QR hunt! Even though it's only been a couple weeks, it feels like we've gone on a long journey together. We hope you've been able to have some fun along the way. Attached below is the final clue. These final clues are notorious for being difficult, so inspect things carefully and hopefully in a short while we can declare you as the winner of the 2023 QR Treasure Hunt. Good luck!\"\nAttached image (finalClue): fantasy board-game table in a candlelit cave/dungeon (game board, figurines, dice, magnifying glass, lanterns, stack of books), overlaid with: 10.21.3 / 3.17.5 / 4.2.19 / 10.24.18 / 13.21.9 / 12.14.14 / 10.2.9\nClue-8 page on utahtreasurehunts.com: visible text \"Send your selfies to [email removed] for review.\" Hidden in page code: var riddle = 'What has keys but can't open locks?'; console.log(url/clueAnswer + riddleAnswer)\n\nSTEP 2 – A web page showing 10 photos (img classes image1–image10, displayed out of order). Not transcribed.\n\nSTEP 3 – Voicemail riddle at the step-2 number (originally one long run of words with no pauses; line breaks as a hunter remembers it):\nStop.\nDon't divide by me.\nThe Romans didn't know I'd be in binary.\nEach day of the week.\nI'm the winning ball.\nDoesn't matter what the season.\nMake a wish so you don't fall.\nPlay some tic tac toe or a baseball game.\nWhat repeats again.\nDrinks and muscles are the same.\nHe's under the name Harry Houdini.", "plaque_question": null, "plaque_answer": "8017843986 (call it; the line asks for a name, and the Houdini line gives 'Harry Houdini')", "location_name": "Phone-call finale: 801-784-3986 (Google Voice line forwarding to organizer Dave)", "location_detail": "No physical plaque location is named in any source. Intermediate number: (385) 645-5725, whose voicemail holds the step-3 riddle. Final number: 801-784-3986. One source says the first team to call the second number gets GPS coordinates accurate to 3 feet.", "solve_path": "QR8 was the 2023 final: a three-step chain that ends in a phone call.\n\nSTEP 1: book cipher plus a hidden riddle, which gives a URL. Teams got the final clue by email after sending their QR7 proof selfies. The email has an image with seven chapter.paragraph(or point).word triples. The official hint says the image holds no hidden data, the email text holds the hint, and the challenge has several steps. Per the 2023 Notion write-up 'Part 1' (recalled in 2024): the book is The Art of War, one of the books lying on the table in the QR7 escape room (it played no part in that solve). Decoding the triples gives the clue answer, and its plaintext includes the word 'website', which showed that it was something to add to a URL. The page source of the clue-8 page hides var riddle = 'What has keys but can't open locks?' (answer: piano) and console.log(url/clueAnswer + riddleAnswer). So the next URL is the site URL + / + the decoded answer + 'piano'. Neither the full decoded text nor the final URL is recorded.\n\nSTEP 2: 10 photos, then latitudes, then a phone number. The page shows 10 photos. The team placed each one on a Google Maps photo-sphere dot and wrote down its lat/long. In the HTML the <img> classes image1–image10 are displayed in the order 3,2,5,4,1,6,10,9,8,7. Sorted by class number they are: 1 Zanzibar Port, 2 Crystal Rapids (36.1352288), 3 Parque de la Fortuna (10.4716805), 4 Argentina/Paraguay/Brazil border (-25.59…), 5 Hobbiton/Green Dragon (-37.8595858), 6 Torch Tower, 7 Mont St Michel, 8 Haystack Rock, 9 Slag Bank, 10 Sydney Harbour. A hunter took the last digit of each latitude in class order and got (385) 645-5725. That number played a voicemail with the step-3 riddle.\n\nSTEP 3: riddle digits give the second phone number. Each line is one digit. The team's later decode was: Stop=8 (octagon), Don't divide by me=0, Romans/binary=1, Each day of the week=7, I'm the winning ball=8 (8-ball), season=4, wish/don't fall=3, tic-tac-toe or baseball=9, what repeats again=8, drinks and muscles=6 (six-pack). That gives 801-784-3986. The last line, 'He's under the name Harry Houdini', is not a digit. A hunter called it the 'answer' part. The Google Voice line asks for a name and forwards to organizer Dave. A team (2nd caller) gave the final number after the hunt was won, and a hunter confirmed it by calling.\n\nResults: a team posting 'QR HUNT SOLVED' on Instagram (onthejohn / the.cline.fam) won. A team was 2nd at about 3 pm, and the team team (hunters) was 3rd. That team had reached the first number hours before any other team. They lost time because they joined 'Each day of the week' and 'I'm the winning ball' into one digit and treated Houdini as a digit. John and Dave said the winners came 'up from behind' while they waited for this team to call.", "techniques": ["book-cipher", "number-code", "hint-in-email-text", "hidden-page-source", "html-inspection", "riddle", "url-answer", "landmark-photo", "coordinates", "phone-number", "voicemail", "riddle-digits", "wordplay", "brute-force", "word-list-offsets", "cipher", "poem-directions", "image-analysis"], "red_herrings": ["Step 1: 'long journey' book candidates by chapter.line.word or page: The Hobbit, LOTR (book 3 by page gave 'Nearest Harfoots'), Narnia, Watership Down, Wizard of Oz, The Alchemist, Iliad/Odyssey.", "Step 1: 'Congratulations for' (=4) and 'couple weeks' (=2) were read as book 4 of a series. Narnia's The Silver Chair and Prince Caspian PDFs did not work (one try gave 'Go and Again After Heard to Underland').", "Step 1: a Narnia board-game reading ('reach the lamp post and get back to the wardrobe'), possibly meaning a return to the escape-room wardrobe/chest.", "Step 1: a word-index cipher on the email text itself gave nonsense ('QR Feels Arriving / Arriving A The… / QR Gone Couple').", "Step 1: 422023.com (from 4, 2, 2023) was an unrelated Chinese app site.", "Step 1: other readings of the triples were raised but not tested: book series with seven books (A hunter), audiobook timestamp (A hunter), hour.minute.second or military time (A hunter), sundial angles (A hunter/a hunter).", "Before the clue: encrypted or passcode-protected data a hunter found in a file ('Well, learning to hack was fun').", "A hunter went to Turtle Hill, Eagle Mountain, through 'turtle shell' and the testudo formation.", "Step 2: summing the longitudes (798.0503715, close to 801) and other sums or products did not give callable numbers.", "Step 2: other ideas that did not give the number: photos as book scenes or page numbers (like the previous year's Harry Potter clue), intersections or distances between the locations, reversed numbers, integer parts of the coordinates only, other hidden HTML content.", "Step 3: treating 'He's under the name Harry Houdini' as a digit (1, or 9 for 'Erik Weisz'). It is not part of the number.", "Step 3: joining 'Each day of the week' and 'I'm the winning ball' into one digit.", "Step 3: other digit guesses: day of week = 5 (weekdays); season = 7, 0 or 1; wish = 11 (11:11), 7 or 1; tic-tac-toe/baseball = 3; 'repeats' as a triple 333; Powerball, or a goal/field goal, for the winning ball.", "Step 3: candidate patterns 801-74?-996?, 801-9??-3?61, …33361, 80177?3761, 801777?961, 801!!13161 and 801-x!3-3361 were brute-force called (400+ calls). Results: 801-746-9966 reached a person; 801-840-9968 had a full mailbox; 801-943-3367 reached a generic voicemail; a 'John' who answered was not the organizer; 801-1xx numbers could not be completed; 800 numbers gave no success reported. The correct number was never on the spreadsheet.", "Step 3: numbers containing 911 were skipped because they could dial emergency services.", "Step 3: Google Voice Utah prefix testing (513, 609, 980, 896, 784, 877, 900, 923, 893, 989, 960) was used to narrow the exchange. 784 is in the list.", "Some people thought the first (riddle) number was the end. The organizer said it wasn't just one number."], "hints": ["Hint for QR #8 (email screenshot): \"There is no secret or concealed information you need to find hidden within the image we emailed you in order to decipher the numbers. The email everyone is sent with the final clue has a hint within the text. Just like in years past, the final challenge has multiple steps. The solution lies at the end.\""], "open_questions": ["The final-clue release date conflicts: some sources say 2023-10-16 (by email about 48 h after the QR7 selfies; also posted in #official-clues), but one says the email came about 17:43 on 2023-10-20. The team was already discussing the triples on 10-18.", "The Art of War book-cipher solution comes only from a 2024 recollection of the Notion write-up. The decoded plaintext, the clue answer and the final step-2 URL are not recorded.", "Step 2: the Hobbiton latitude in the sheet (-37.8595858, image5) ends in 8, but digit 5 of 385-645-5725 is 4. No source explains this. Coordinates for the other photos are not fully recorded.", "Step 3 digit mapping conflicts: one source says the 'muscles and drinks' digit was 8, not the expected 6. The team's later decode has drinks/muscles = 6 as the last digit and 'what repeats again' = 8. A hunter also said the '986' part was unexplained.", "The meaning of the 'season' (=4) and 'make a wish' (=3) digits in the final decode is not explained.", "The verbatim voicemail wording and line breaks are uncertain: the original had no pauses, and a hunter's typed version groups the lines differently.", "Was there a physical endpoint? One source says the first caller gets GPS coordinates accurate to 3 feet, but no location or plaque is recorded. It is also unclear whether 'Harry Houdini' was the name to give on the call.", "A hunter's three images (scroll word-offset list, Egyptian-tomb digit cipher, parchment hiking poem) were called 'earlier clue images for this QR'. It is not established whether they belong to QR8 or to earlier QRs/the escape room."], "coords": null, "n_sources": 144, "steps": [{"t": "p", "label": null, "text": "QR8 was the 2023 final: a three-step chain that ends in a phone call."}, {"t": "step", "n": "1", "clue": [], "label": null, "lead": "Book cipher plus a hidden riddle, which gives a URL.", "text": "Teams got the final clue by email after sending their QR7 proof selfies. The email has an image with seven chapter.paragraph(or point).word triples. The official hint says the image holds no hidden data, the email text holds the hint, and the challenge has several steps. Per the 2023 Notion write-up 'Part 1' (recalled in 2024): the book is The Art of War, one of the books lying on the table in the QR7 escape room (it played no part in that solve). Decoding the triples gives the clue answer, and its plaintext includes the word 'website', which showed that it was something to add to a URL. The page source of the clue-8 page hides var riddle = 'What has keys but can't open locks?' (answer: piano) and console.log(url/clueAnswer + riddleAnswer). So the next URL is the site URL + / + the decoded answer + 'piano'. Neither the full decoded text nor the final URL is recorded.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": null, "lead": "10 photos, then latitudes, then a phone number.", "text": "The page shows 10 photos. The team placed each one on a Google Maps photo-sphere dot and wrote down its lat/long. In the HTML the <img> classes image1–image10 are displayed in the order 3,2,5,4,1,6,10,9,8,7. Sorted by class number they are: 1 Zanzibar Port, 2 Crystal Rapids (36.1352288), 3 Parque de la Fortuna (10.4716805), 4 Argentina/Paraguay/Brazil border (-25.59…), 5 Hobbiton/Green Dragon (-37.8595858), 6 Torch Tower, 7 Mont St Michel, 8 Haystack Rock, 9 Slag Bank, 10 Sydney Harbour. A hunter took the last digit of each latitude in class order and got (385) 645-5725. That number played a voicemail with the step-3 riddle.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": null, "lead": "Riddle digits give the second phone number.", "text": "Each line is one digit. The team's later decode was: Stop=8 (octagon), Don't divide by me=0, Romans/binary=1, Each day of the week=7, I'm the winning ball=8 (8-ball), season=4, wish/don't fall=3, tic-tac-toe or baseball=9, what repeats again=8, drinks and muscles=6 (six-pack). That gives 801-784-3986. The last line, 'He's under the name Harry Houdini', is not a digit. A hunter called it the 'answer' part. The Google Voice line asks for a name and forwards to organizer Dave. A team (2nd caller) gave the final number after the hunt was won, and a hunter confirmed it by calling.", "bullets": []}, {"t": "p", "label": "Results", "text": "A team posting 'QR HUNT SOLVED' on Instagram (onthejohn / the.cline.fam) won. A team was 2nd at about 3 pm, and the team team (hunters) was 3rd. That team had reached the first number hours before any other team. They lost time because they joined 'Each day of the week' and 'I'm the winning ball' into one digit and treated Houdini as a digit. John and Dave said the winners came 'up from behind' while they waited for this team to call."}], "title": "Final: book cipher, hidden riddle and a phone call", "media": [{"src": "media/2023-qr8-01.jpg", "section": "clue", "caption": "The final clue image emailed to teams: chapter.paragraph.word triples (step 1).", "kind": "image"}, {"src": "media/2023-qr8-02.jpg", "section": "solve", "caption": "The voicemail riddle typed out. Each line gives one digit of the phone number (step 3).", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2024, "qr_number": 1, "status": "confirmed", "confidence": 0.92, "clue_text": "Video clue, not text: an Instagram reel (https://www.instagram.com/reel/DAtqOL0S6u3/ by the.cline.fam and onthejohn; caption: \"The 2024 QR Treasure Hunt kicks off today ...\"), also emailed to teams, released about 13:26 MDT on 2024-10-04. Spoken line as auto-captioned: \"It's looking good too. It's Livingston and his dragons.\" (A hunter: definitely \"Livingston and his drag
