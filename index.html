level, partly under brush).<\/p>\n<p><strong>Businesses, usually sponsors or partners<\/strong>: Crazy Corn Maze (2023 QR3), Bloom Studios room 113 (2023 QR5), a Gateway pop-up escape room (2023 QR7), Axe N Smash Layton (2024 QR3), El Mexsal → Hang Time (2024 QR4), a Bulldog-brand dumpster behind Harajuku (2024 QR5), SL County Animal Services as a waypoint (2024 QR6), a Trolley Square escape room (2024 QR7).<\/p>\n<p>Patterns:<\/p>\n<ul><li><strong>Sponsors are built into the solve<\/strong>, not just credited: the sponsor's product (Bulldog dumpster, 2024 QR5), the sponsor as a password (2024 QR7), sponsor cards (2024 QR6 Suba Bleu / Mark Miller Subaru), sponsor images (2024 QR8 Frost Box).<\/li><li><strong>Business stops often require an action<\/strong>: a secret phrase at the desk (2023 QR5 \"stone bear\"), a physical challenge (axe bullseye 2024 QR3, slackline 2024 QR4), an on-site escape room (2023 QR7, 2024 QR7), claw-machine tokens (2024 QR4), downloading a file to USB (2023 QR5).<\/li><li><strong>Business hours matter<\/strong>: 2023 QR3 (plaque moved outside after weather).<\/li><li><strong>Locations get reused<\/strong>: Ferguson Canyon (2021 QR4 → 2024 QR2), the Draper tracks (2021 Junior → 2024 QR6), Trolley Square's \"same entry door as last year\" (2024 QR7), the Blokus prop \"SEVEN DIGIT CODE BUT NO BLOKUS\" (2023 QR7 and 2024 QR7). Assuming an old spot couldn't be reused was listed as a red herring in 2024 QR6.<\/li><li><strong>Geographic range seen<\/strong>: Harrisville/Ogden (2024 QR5) south to Elberta/Eureka (2023 QR2), with Antelope Island and Utah Lake at the edges. Spots north of Brigham City and Ephraim came up as out of bounds (2024 QR8, 2024 QR5).<\/li><li><strong>Not every QR has a plaque<\/strong>: 2023 QR5 (QR recovered from a .bin file), 2023 QR8 and 2024 QR8 (phone calls).<\/li><\/ul>\n<h2 id=\"4-plaque-questions-vs-the-solve\">4. Plaque questions vs. the solve<\/h2>\n<div class=\"tbl\"><table><thead><tr><th>Question type<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td>\"What city are you in?\"<\/td><td>2023 QR1 Syracuse, 2024 QR1 Vineyard, 2024 QR3 Layton, 2024 QR6 Draper<\/td><\/tr><tr><td>Trail name<\/td><td>2023 QR4 \"Adam's Canyon Trail\", 2024 QR2 \"Ferguson\"<\/td><\/tr><tr><td>Something visible on site<\/td><td>2023 QR2 body of water to the NE (Utah Lake), 2024 QR4 \"What did you cross?\" (slackline), 2024 QR5 nearest restaurant (Harajuku)<\/td><\/tr><tr><td><strong>Callback to the solve path<\/strong> (proves you solved it rather than followed a leak)<\/td><td>2023 QR3 encoding in the <em>previous QR's<\/em> video (braille), 2023 QR6 what Dave's wife stands next to in the oars reel (crib), 2023 QR7 smallest of the four books used (Steppenwolf), 2024 QR7 escape-room door code (203467)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Notes: capitalization mattered (2023 QR7). Common alternate spellings were accepted (2023 QR4 apostrophe). Several stops required selfies at every physical location, not just the plaque (2024 QR4, 2023 QR7). Keep notes on every intermediate answer, since a later plaque may ask for one.<\/p>\n<h2 id=\"5-common-red-herrings\">5. Common red herrings<\/h2>\n<p><strong>Decoys planted by the organizers<\/strong><\/p>\n<ul><li>Self-labelled taunts: base64 \"This is not a clue.\" and green pixels spelling \"ThisIsNotAClue\" (2024 QR8).<\/li><li>Whole blocks of content to ignore: the big billboard's letters (2022 QR4), the crossword span 27–71 (2024 QR5), the About-page numbers (2024 QR6, which the official hints said were unrelated), unused board games (2023 QR7), \"This line means zip\" (2023 QR7), the many props in escape rooms (2024 QR7).<\/li><li>Timed social-media decoys: two 30-second Instagram stories on drop day (2023 QR6).<\/li><\/ul>\n<p><strong>Theme pulling you to the wrong medium or text<\/strong><\/p>\n<ul><li>The obvious source text is often the wrong edition: novel vs. <em>movie script<\/em> (2023 QR4), Constitution vs. Bill of Rights (2024 QR4). Spoken content (Livingston line in 2024 QR1) was chased with no payoff.<\/li><li>Treating musical notation literally as chords (2024 QR4) when it only meant \"count note names from C\".<\/li><\/ul>\n<p><strong>Video and file artifacts<\/strong><\/p>\n<ul><li>Glitch frames, compression noise, audio spectra and captions (2024 QR3): the organizers said \"No\" when asked if the glitches were intentional.<\/li><li>File names and base64 tails (\"Z\", \"9k=\") (2024 QR2, 2024 QR4). Typos are not clues (2024 QR5 \"ACCROSS\", stated by John).<\/li><li>Steganography tools on clue images found nothing in 2024 QR2, QR5 and QR8. Aperisolve's \"common password\" list is other users' inputs (2024 QR6).<\/li><\/ul>\n<p><strong>Word association to places<\/strong><\/p>\n<ul><li>2023 QR7 accumulated dozens of wrong SLC/Ogden/Daybreak sites from loose readings. Same-name ambiguity: Liberty Park SLC vs. Ogden (2024 QR5), Jordan → West Jordan (2024 QR2).<\/li><li>Organizers sometimes publicly rule places out: \"the plaque is not at the shelter\" (2024 QR6).<\/li><\/ul>\n<p><strong>Human noise<\/strong><\/p>\n<ul><li>Business staff may not know about the hunt (2024 QR4 El Mexsal employee caused a correct solver to post it as \"wrong\"; 2024 QR3 staff said \"definitely maybe\").<\/li><li>Leaks and trolls: the keypad photo from a kicked member (2023 QR7), leaked solves via a big Discord voice chat (2024 QR5).<\/li><\/ul>\n<p><strong>Finale-specific<\/strong><\/p>\n<ul><li>Over-reading riddle lines: merging two lines into one digit, or treating the name line as a digit (2023 QR8 \"Harry Houdini\"). Brute-force dialing 400+ numbers never hit (2023 QR8). Skip patterns containing 911.<\/li><\/ul>\n<h2 id=\"6-difficulty-across-a-hunt\">6. Difficulty across a hunt<\/h2>\n<ul><li><strong>QR1 is the easiest and is traditionally Street View geolocation.<\/strong> 2024 QR1 was found about 75 minutes after kickoff.<\/li><li><strong>Early to middle QRs (2–4)<\/strong> move to coordinate ciphers, image puzzles and video puzzles. Some become unsolvable without the <strong>weekly/Friday hint email<\/strong> (2024 QR4: no progress in four days before the hint). The hint usually names the missing ingredient (\"music theory and an old, important document\", \"each block = city block\").<\/li><li><strong>Middle to late QRs (5–7)<\/strong> are multi-stage: game → business → escape room → safe. Several on-site sub-codes. Physical tasks.<\/li><li><strong>Final (QR8) is an emailed clue after selfie submission<\/strong>, described by the organizers as \"notorious for being difficult\" (2023 QR8) or having \"a reputation of being difficult\" (2024 QR8). There is no plaque, the answer is a phone number, it has several steps, and it <strong>reuses props and keywords from earlier QRs<\/strong>: Art of War from the QR7 room (2023 QR8), Contact from the QR7 room plus the \"rhenium\" keyword from QR6/7 (2024 QR8). The same seven-triplet image appears in both the 2023 QR1 and 2023 QR8 records.<\/li><li><strong>Timing mechanics<\/strong>: scanning starts a cooldown before the next clue (24 h in 2024 QR2, 48 h in 2024 QR4). First-scan prizes ($1k/$2k). The final arrives about 48 h after selfies.<\/li><li>Solvers from 2023 QR6 and 2024 QR3 found they could shortcut the intended path (Vigenère brute force, the axe watermark plus the bullseye badge icon). The badge icon gave away 2024 QR3 (a target).<\/li><\/ul>\n<h2 id=\"7-organizer-fingerprints\">7. Organizer fingerprints<\/h2>\n<ul><li>Pop culture and their own favorites: Sherlock Holmes 2009 (2024 QR3), Indiana Jones / Contact (2024 QR8), Monte Cristo (2023 QR4), Almost Famous (2023 QR8).<\/li><li>Personal references: Dave's and John's Instagram (2023 QR6), a sticker of Dave's face on the door (2023 QR7), crossword answers BROMANCE / REEL / LEHI (2024 QR5).<\/li><li>Callbacks to past hunts: \"bear made of stone\" (2023 QR5), reused locations, \"rhenium\" carried across 2024 QR6 → QR7 → QR8.<\/li><li>Puns that are literal instructions: \"Ex marks the spot\", \"as the crow flies\", \"Insta thirty-second\", \"two dashes\" = hyphens.<\/li><li>Verify-as-you-go design: the murder game allows unlimited guesses (2024 QR6).<\/li><\/ul>\n<h2 id=\"8-step-by-step-solving-checklist\">8. Step-by-step solving checklist<\/h2>\n<ol><li><strong>Collect every surface<\/strong>: clue page text, page source/JS, image files (full resolution), video + description + title, email body and source, the leaderboard, and organizers' and sponsors' Instagram.<\/li><li><strong>If it's QR1<\/strong>, start with Street View. Match vegetation, road markings and mountains.<\/li><li><strong>Separate signal from flavor.<\/strong> Look for taunts (\"This is not a clue\") and declared-filler lines, and for small anomalies: watermarks, edited numbers, corner symbols, edited captions.<\/li><li><strong>Find the number source(s)<\/strong> and test arithmetic between them (concatenate, multiply). Check whether the results are clean single digits or A1Z26 letters.<\/li><li><strong>Test the coordinate split<\/strong>: does a digit string contain <code>40<\/code>/<code>41<\/code> … <code>111<\/code>/<code>112<\/code>? Plot it. Also try reading the result as a plaintext place name or a phone number.<\/li><li><strong>For a book cipher, identify the exact text<\/strong>: look at shape, theme, hint wording and props from earlier QRs. Try movie scripts and sub-documents (amendments, chapters), not just the obvious book.<\/li><li><strong>For layered ciphers<\/strong>, verify that each layer produces readable text before moving on (2023 QR6).<\/li><li><strong>For crosswords<\/strong>, solve fully, read the answers in clue-number order as a sentence, look for \"ignore X through Y\" instructions, use the colors, and consider the grid as a map overlay.<\/li><li><strong>For games<\/strong>, just finish them. Read the end screen and zoom out for billboards (2024 QR7).<\/li><li><strong>Check the website<\/strong>: hidden variables, CSS classes with URLs, conditional logic on team names, and the About page.<\/li><li><strong>Read the weekly hint email word by word<\/strong> when it arrives. It usually names the missing piece.<\/li><li><strong>Before driving<\/strong>: check business hours, whether the clue has a secret phrase, required selfies, and whether you need a USB drive, flashlight or socks.<\/li><li><strong>On site<\/strong>: plaques sit just off trails (logs, trees, rocks, ground-level ties) or inside venues (back rooms, safes, dumpsters). Expect on-site codes. Bring notes of every intermediate answer for callback plaque questions.<\/li><li><strong>For the final<\/strong>: expect several steps and a phone number. Reread earlier QRs' props and keywords. Treat each riddle line as one digit and don't merge lines. Load all leaderboard rows before searching.<\/li><li><strong>Discount<\/strong> staff denials, leaks, glitch frames, typos and file names, unless something independent confirms them.<\/li><\/ol>", "locked": {"years": [2026], "url": "https://cpjykitpufxfdiioelwo.supabase.co", "key": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwanlraXRwdWZ4ZmRpaW9lbHdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM0NjgyNDMsImV4cCI6MjA1OTA0NDI0M30.hGNQDAFRKMQazcoxetZFJby31uh2VIlaZw6C8dT9R1g"}}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
let SOLVES = DATA.solves;
const LOCK = DATA.locked || {years: []}, UNLOCKED = new Set();
const YEARS = [...new Set([...SOLVES.map(s => s.hunt_year), ...LOCK.years])].sort();
const isLocked = y => LOCK.years.includes(y) && !UNLOCKED.has(y);
const $ = id => document.getElementById(id);
const title = s => s.title || s.location_name || 'Untitled checkpoint';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// escaped text with clickable links and the quoted clue fragments ('...' = ...) picked out
let WL = [];  // write-up links of the record on screen: [{match, url, used}]
function addLinks(h){
  if (!WL.length) return h;
  let depth = 0;
  return h.split(/(<[^>]+>)/).map(part => {
    if (part.startsWith('<')){ if (/^<a\b/.test(part)) depth++; else if (part === '</a>') depth--; return part; }
    if (depth) return part;
    for (const w of WL){
      if (w.used) continue;
      const m = esc(w.match), i = part.indexOf(m);
      if (i < 0) continue;
      w.used = true;
      part = part.slice(0, i) + `<a href="${esc(w.url)}" target="_blank" rel="noopener">${m}</a>` + part.slice(i + m.length);
    }
    return part;
  }).join('');
}
const rich = s => addLinks(esc(s)
  .replace(/(https?:\/\/[^\s<)]*[^\s<).,;:'"])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])'([^'<>]{3,90})'(?=\s*(?:=|:\s))/g, '$1<q class="cl">$2</q>'));
const key = s => `${s.hunt_year}/qr${s.qr_number}`;
const byYear = y => SOLVES.filter(s => s.hunt_year === y);
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
const li = xs => xs.length ? '<ul class="plain">' + xs.map(x => `<li>${rich(x)}</li>`).join('') + '</ul>' : '<p class="empty">none recorded</p>';
const chips = xs => (xs || []).length ? `<div class="chips">${xs.map(t => `<a class="chip" href="#technique/${encodeURIComponent(t)}">${esc(t)}</a>`).join('')}</div>` : '<span class="empty">none</span>';

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('playbook')) return {page:'playbook', anchor:h.split('/')[1] || null};
  if (h.startsWith('technique/')) return {page:'technique', tech:h.slice(10)};
  const m = h.match(/^(\d{4})(?:\/qr(\d+))?$/);
  if (m) return {page:'year', year:+m[1], qr:m[2] ? +m[2] : null};
  return {page:'home'};
}
function yearsNav(cur){
  $('years').innerHTML = YEARS.map(y => `<a href="#${y}" class="${cur===y?'on':''}">${y}${isLocked(y) ? ' <span class="lock" aria-label="locked">&#128274;</span>' : ''}</a>`).join('')
    + `<a href="#playbook" class="${cur==='playbook'?'on':''}">Playbook</a>`;
}
function qrPills(year, qr){
  return `<span class="crumb">${year} hunt</span><a href="#${year}" class="${qr?'':'on'}">Overview</a>` +
    byYear(year).map(s => `<a href="#${key(s)}" class="${s.qr_number===qr?'on':''}" title="${esc(title(s))}">QR${s.qr_number}</a>`).join('');
}
const playbookToc = () => [...DATA.playbook.matchAll(/<h2 id="([^"]+)">(.*?)<\/h2>/g)]
  .map(m => `<a href="#playbook/${m[1]}">${m[2].replace(/<[^>]+>/g, '')}</a>`).join('');

// --- pictures, audio and links
const fig = m => m.kind === 'audio'
  ? `<figure><audio controls preload="none" src="${esc(m.src)}"></audio><figcaption>${esc(m.caption)}</figcaption></figure>`
  : `<figure><a class="img" href="${esc(m.src)}" target="_blank" rel="noopener" title="Open full size"><img loading="lazy" src="${esc(m.src)}" alt="${esc(m.caption)}"></a><figcaption>${esc(m.caption)}</figcaption></figure>`;
const figs = xs => xs.length ? `<div class="figs${xs.length === 1 ? ' one' : ''}">${xs.map(fig).join('')}</div>` : '';
// "(step 6)", "(steps 5 and 6)", "(stage 6b)" -> the step a picture belongs to
const stepOf = m => { const x = m.caption.match(/\((?:steps?|stage)\s+(\d+[a-z]?)/i); return x ? x[1] : null; };
const ytId = u => { const x = u.match(/(?:youtu\.be\/|[?&]v=)([\w-]{11})/); return x ? x[1] : null; };
const linkHtml = l => {
  const id = ytId(l.url), dom = (l.url.match(/^https?:\/\/(?:www\.)?([^/]+)/) || [])[1] || '';
  return id ? `<div class="video"><a class="frame yt" href="${esc(l.url)}" data-yt="${id}" target="_blank" rel="noopener" aria-label="Play: ${esc(l.label)}"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt=""><span class="play"></span></a><p><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a> <span class="dom">youtube.com</span></p></div>`
    : `<a class="lnk" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}<span class="dom">${esc(dom)}</span></a>`;
};

// --- the step-by-step solve path
function stepHtml(s, pics){
  const clue = s.clue.length ? `<blockquote class="cq"><small>From the clue</small>${s.clue.map(c => `<span>${esc(c)}</span>`).join('')}</blockquote>` : '';
  const head = s.label ? `<b>${esc(s.label)}:</b> ` : s.lead ? `<b>${rich(s.lead)}</b> ` : '';
  const para = head || s.text ? `<p>${head}${rich(s.text)}</p>` : '';
  return `<li class="step"><span class="n">${esc(s.n)}</span><div class="body">${clue}${para}${s.bullets.length ? li(s.bullets) : ''}${figs(pics || [])}</div></li>`;
}
function pathHtml(blocks, pics){
  pics = pics || {};
  let out = '', run = [];
  const flush = () => { if (run.length){ out += `<ol class="steps">${run.join('')}</ol>`; run = []; } };
  for (const b of blocks){
    if (b.t === 'step'){ run.push(stepHtml(b, pics[b.n])); delete pics[b.n]; continue; }
    flush();
    if (b.t === 'h') out += `<h3 class="sec">${esc(b.text)}${b.sub ? `<span>${esc(b.sub)}</span>` : ''}</h3>`;
    else if (b.t === 'p') out += `<p class="note">${b.label ? `<b>${esc(b.label)}:</b> ` : ''}${rich(b.text)}</p>`;
    else if (b.t === 'ul') out += li(b.items);
  }
  flush();
  return out || '<p class="empty">No solve path recorded.</p>';
}

function solveView(s){
  WL = (s.wl || []).map(w => ({...w, used: false}));
  try { return solveBody(s); } finally { WL = []; }
}
function solveBody(s){
  const ys = byYear(s.hunt_year), i = ys.findIndex(x => x.qr_number === s.qr_number), prev = ys[i-1], next = ys[i+1];
  const conf = s.confidence != null ? `<span>${Math.round(s.confidence * 100)}% confidence</span>` : '';
  const map = s.coords ? `<a href="https://www.google.com/maps?q=${s.coords[0]},${s.coords[1]}" target="_blank" rel="noopener">Open in Google Maps</a>` : '';
  const pager = (x, cls, word) => x ? `<a href="#${key(x)}" class="${cls}"><small>${word}</small>QR${x.qr_number} · ${esc(title(x))}</a>` : '<span></span>';
  const steps = s.steps.filter(b => b.t === 'step').length;
  const media = s.media || [], links = s.links || [], of = sec => media.filter(m => m.section === sec);
  const stepNos = new Set(s.steps.filter(b => b.t === 'step').map(b => b.n)), pics = {}, loose = [];
  for (const m of of('solve')){ const n = stepOf(m); if (n && stepNos.has(n)) (pics[n] = pics[n] || []).push(m); else loose.push(m); }
  return `<p class="eyebrow">${s.hunt_year} hunt · QR${s.qr_number}</p>
  <h1>${esc(title(s))}</h1>
  <p class="meta"><span class="status ${esc(s.status)}">${esc(s.status)}</span>${conf}<span>${plural(s.n_sources, 'source message')}</span>${map}</p>
  <section><h2>The clue</h2><pre class="clue">${esc(s.clue_text || '(clue text not recorded)')}</pre>${figs(of('clue'))}</section>
  ${links.length ? `<section><h2>Videos and links</h2><div class="links">${links.map(linkHtml).join('')}</div></section>` : ''}
  <section><h2>The answer</h2><dl class="glance">
    <dt>Location</dt><dd>${esc(s.location_name || 'not recorded')}</dd>
    <dt>Plaque question</dt><dd>${esc(s.plaque_question || 'not recorded')}</dd>
    <dt>Plaque answer</dt><dd>${esc(s.plaque_answer || 'not recorded')}</dd>
    <dt>Techniques</dt><dd>${chips(s.techniques)}</dd></dl></section>
  <section><h2>How to solve it${steps ? `, in ${plural(steps, 'step')}` : ''}</h2>${pathHtml(s.steps, pics)}${loose.length ? `<h3 class="sec">More pictures from the solve</h3>${figs(loose)}` : ''}
    <details><summary>Read the write-up as one text</summary><div class="raw">${rich(s.solve_path || '')}</div></details></section>
  <section><h2>Finding the plaque</h2><p>${rich(s.location_detail || 'No location detail recorded.')}</p>${map ? `<p>${map}</p>` : ''}${figs(of('location'))}</section>
  <section><h2>Hints</h2>${(s.hints || []).length || !of('hint').length ? li(s.hints || []) : ''}${figs(of('hint'))}</section>
  <section><details><summary>Dead ends and red herrings <span class="count">${(s.red_herrings || []).length}</span></summary>${li(s.red_herrings || [])}</details>
  <details><summary>Mistakes and rabbit holes <span class="count">${(s.missteps || []).length}</span></summary>${li(s.missteps || [])}</details>
  <details><summary>Open questions <span class="count">${(s.open_questions || []).length}</span></summary>${li(s.open_questions || [])}</details>
  <details><summary>How the hunt played out <span class="count">${(s.hunt_notes || []).length}</span></summary>${li(s.hunt_notes || [])}</details></section>
  <nav class="pager">${pager(prev, 'prev', 'Previous')}${pager(next, 'next', 'Next')}</nav>
  <p class="hint"><kbd>←</kbd> <kbd>→</kbd> move between checkpoints</p>`;
}
function homeView(){
  const techs = {};
  SOLVES.forEach(s => (s.techniques || []).forEach(t => techs[t] = (techs[t] || 0) + 1));
  const top = Object.entries(techs).sort((a, b) => b[1] - a[1]).slice(0, 40);
  return `<p class="eyebrow">Utah Treasure Hunts · QR code hunt</p><h1>Every past checkpoint, solved step by step</h1>
  <p class="intro">Pick a year, then a checkpoint. Each page shows the clue as posted, the solve as a numbered path with the clue line each step interprets, where the plaque was, the clue images, videos and photos from the solve, the official hints, the dead ends, and the mistakes and rabbit holes hunters ran into on the way. The <a href="#playbook">playbook</a> distils the organizers' habits.</p>
  <section><h2>Years</h2><div class="cards">${YEARS.map(y => { const n = byYear(y); return isLocked(y) ? `<a class="card" href="#${y}"><span class="big">${y} &#128274;</span><span class="tech">Season in progress · password needed</span></a>` : `<a class="card" href="#${y}"><span class="big">${y}</span><span class="tech">${plural(n.length, 'checkpoint')} · ${n.filter(s => s.status === 'confirmed').length} confirmed</span></a>`; }).join('')}</div></section>
  <section><h2>Techniques</h2><div class="chips">${top.map(([t, n]) => `<a class="chip" href="#technique/${encodeURIComponent(t)}">${esc(t)} <small>${n}</small></a>`).join('')}</div></section>`;
}
function yearView(y){
  const ys = byYear(y);
  return `<p class="eyebrow">${y} hunt</p><h1>${plural(ys.length, 'checkpoint')} on record</h1>
  <section><div class="cards">${ys.map(s => `<a class="card" href="#${key(s)}"><b>QR${s.qr_number}</b> <span class="status ${esc(s.status)}">${esc(s.status)}</span><span class="where">${esc(title(s))}</span><span class="tech">${esc((s.techniques || []).slice(0, 5).join(' · '))}</span></a>`).join('')}</div></section>`;
}
const snip = s => {
  const st = (s.steps || []).find(b => b.t === 'step');
  const t = st ? [st.label ? st.label + ':' : '', st.lead || '', st.text || ''].join(' ').trim() : (s.solve_path || '');
  return t.length > 220 ? t.slice(0, 220) + '…' : t;
};
const rows = xs => xs.length ? `<ul class="rows">${xs.map(s => `<li><a class="t" href="#${key(s)}"><b>${s.hunt_year} QR${s.qr_number}</b> · ${esc(title(s))}</a><p>${esc(snip(s))}</p></li>`).join('')}</ul>` : '<p class="empty">Nothing matches.</p>';
function techniqueView(t){
  const xs = SOLVES.filter(s => (s.techniques || []).includes(t));
  return `<p class="eyebrow">Technique</p><h1>${esc(t)}</h1><p class="meta">${plural(xs.length, 'checkpoint')}</p><section>${rows(xs)}</section>`;
}
function searchView(q){
  const xs = SOLVES.filter(s => JSON.stringify(s).toLowerCase().includes(q));
  return `<p class="eyebrow">Search</p><h1>${esc(q)}</h1><p class="meta">${plural(xs.length, 'match', 'matches')}</p><section>${rows(xs)}</section>`;
}
function lockView(y){
  return `<p class="eyebrow">${y} hunt</p><h1>This season is still running</h1>
  <p class="intro">The ${y} solves stay locked while teams are still hunting. Enter the password to view them.</p>
  <form id="unlock" class="unlock" autocomplete="off"><input id="pw" type="password" placeholder="Password" aria-label="Password" required>
  <button type="submit">Unlock</button>
  <label><input id="remember" type="checkbox" checked> Remember on this device for 7 days</label></form><p id="unlockMsg" class="hint" role="status"></p>`;
}
// The password is kept on this device only (localStorage, never sent anywhere but the unlock call), for 7 days from
// when it was typed; a tab also keeps it in sessionStorage until closed.
const AUTH = 'qrGuideAuth', REMEMBER_MS = 7 * 24 * 3600 * 1000;
function savedPw(){
  try {
    const a = JSON.parse(localStorage.getItem(AUTH) || 'null');
    if (a && a.pw && a.until > Date.now()) return a.pw;
    localStorage.removeItem(AUTH);
  } catch (e) {}
  try { return sessionStorage.getItem('qrGuidePw'); } catch (e) { return null; }
}
function forgetPw(){
  try { localStorage.removeItem(AUTH); } catch (e) {}
  try { sessionStorage.removeItem('qrGuidePw'); } catch (e) {}
}
async function unlock(pw, quiet, remember){
  const msg = t => { const el = $('unlockMsg'); if (el) el.textContent = t; };
  msg('Checking…');
  let res;
  try {
    const r = await fetch(`${LOCK.url}/rest/v1/rpc/qr_guide_unlock`, {method: 'POST',
      headers: {'Content-Type': 'application/json', apikey: LOCK.key, Authorization: `Bearer ${LOCK.key}`},
      body: JSON.stringify({pw})});
    res = await r.json();
  } catch (e) { msg('Could not reach the server. Try again in a moment.'); return false; }
  if (!res || res.error || !res.payload){
    msg(quiet ? '' : res && res.error === 'too_many_attempts' ? `Too many wrong tries. Wait ${res.retry_minutes} minutes and try again.`
      : res && res.error === 'wrong_password' ? 'That password is not right.' : 'Nothing to unlock yet.');
    if (res && res.error === 'wrong_password') forgetPw();
    return false;
  }
  if (UNLOCKED.size){ render(); return true; }
  const media = res.media || {};
  for (const s of res.payload.solves) for (const m of s.media || []) if (m.src.startsWith('locked/')) m.src = media[m.src.slice(7)] || '';
  // other years' records with their sentences about the locked years put back
  const restored = new Map((res.payload.restored || []).map(s => [key(s), s]));
  SOLVES = SOLVES.map(s => restored.get(key(s)) || s).concat(res.payload.solves)
    .sort((a, b) => a.hunt_year - b.hunt_year || a.qr_number - b.qr_number);
  if (res.payload.playbook) DATA.playbook = res.payload.playbook;
  LOCK.years.forEach(y => UNLOCKED.add(y));
  try { sessionStorage.setItem('qrGuidePw', pw); } catch (e) {}
  if (remember) try { localStorage.setItem(AUTH, JSON.stringify({pw, until: Date.now() + REMEMBER_MS})); } catch (e) {}
  const q = $('q').value.trim().toLowerCase();
  if (q){ lockCtl(); $('view').innerHTML = searchView(q); } else render();
  return true;
}
function lockCtl(){
  $('lockctl').innerHTML = UNLOCKED.size ? `<a href="#" id="relock">Lock ${LOCK.years.join(', ')} again on this device</a>` : '';
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'unlock') return;
  e.preventDefault();
  unlock($('pw').value, false, $('remember').checked);
});
document.addEventListener('click', e => {
  if (e.target.id !== 'relock') return;
  e.preventDefault();
  forgetPw();
  location.reload();
});
function playbookView(){
  return `<div class="play"><p class="eyebrow">Playbook</p><h1>How the organizers build clues</h1>${DATA.playbook}</div>`;
}
function render(){
  const r = route(), view = $('view');
  $('q').value = '';
  lockCtl();
  if (r.page === 'playbook'){
    yearsNav('playbook'); $('sub').innerHTML = playbookToc(); view.innerHTML = playbookView();
    const el = r.anchor && document.getElementById(r.anchor);
    if (el){ el.scrollIntoView(); return; }
  } else if (r.page === 'technique'){ yearsNav(null); $('sub').innerHTML = ''; view.innerHTML = techniqueView(r.tech); }
  else if (r.page === 'year' && isLocked(r.year)){ yearsNav(r.year); $('sub').innerHTML = ''; view.innerHTML = lockView(r.year); }
  else if (r.page === 'year'){
    const s = r.qr ? byYear(r.year).find(x => x.qr_number === r.qr) : null;
    yearsNav(r.year); $('sub').innerHTML = qrPills(r.year, r.qr); view.innerHTML = s ? solveView(s) : yearView(r.year);
  } else { yearsNav(null); $('sub').innerHTML = ''; view.innerHTML = homeView(); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
$('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q){ render(); return; }
  yearsNav(null); $('sub').innerHTML = ''; $('view').innerHTML = searchView(q);
});
document.addEventListener('click', e => {
  const a = e.target.closest('a.yt');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  a.outerHTML = `<div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/${a.dataset.yt}?autoplay=1" title="${a.getAttribute('aria-label')}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  const r = route();
  if (r.page !== 'year' || !r.qr) return;
  const ys = byYear(r.year), i = ys.findIndex(s => s.qr_number === r.qr);
  if (e.key === 'ArrowLeft' && i > 0) location.hash = key(ys[i - 1]);
  if (e.key === 'ArrowRight' && i < ys.length - 1) location.hash = key(ys[i + 1]);
});
render();
if (LOCK.years.length){ const pw = savedPw(); if (pw) unlock(pw, true); }
</script>
</body>
