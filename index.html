<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Hunt Solve Guide</title>
<meta name="description" content="Every past Utah Treasure Hunts QR checkpoint: the clue, the solve step by step, the location and the dead ends.">
<style>
:root{--bg:#f6f4ef;--panel:#ffffff;--ink:#1c1b19;--muted:#6e6a62;--line:#e4e0d7;--accent:#b4561e;--accent-ink:#ffffff;--accent-soft:#f7e8dc;--chip:#ece7dc;--ok:#2f7d4f;--warn:#9a6b00;--code:#f3efe6;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151412;--panel:#1e1c19;--ink:#ebe7de;--muted:#a19b8f;--line:#312e28;--accent:#e2884d;--accent-ink:#151412;--accent-soft:#3a2a1f;--chip:#2a2722;--ok:#7fcf9a;--warn:#e2b84d;--code:#262320}}
:root[data-theme="dark"]{--bg:#151412;--panel:#1e1c19;--ink:#ebe7de;--muted:#a19b8f;--line:#312e28;--accent:#e2884d;--accent-ink:#151412;--accent-soft:#3a2a1f;--chip:#2a2722;--ok:#7fcf9a;--warn:#e2b84d;--code:#262320}
*{box-sizing:border-box}
html{scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;color:inherit;text-decoration:none;margin-right:6px;white-space:nowrap}
nav.years{display:flex;gap:2px;flex-wrap:wrap}
nav.years a{font-size:14px;padding:5px 11px;border-radius:999px;color:var(--ink);text-decoration:none;border:1px solid transparent}
nav.years a:hover{border-color:var(--line)}
nav.years a.on{background:var(--accent);color:var(--accent-ink)}
#q{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);margin-left:auto;width:230px;max-width:100%}
nav.sub{max-width:920px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav.sub:empty{display:none}
nav.sub a{font-size:13px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--bg)}
nav.sub a:hover{border-color:var(--accent)}
nav.sub a.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
nav.sub .crumb{font-size:13px;color:var(--muted);margin-right:4px}
main{max-width:920px;margin:0 auto;padding:22px 16px 40px;overflow-wrap:anywhere}
article{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 34px;min-width:0}
@media (max-width:640px){article{padding:20px 16px;border-radius:10px}header.top{position:static}.bar{padding:10px 16px 6px}#q{width:100%;margin-left:0}html{scroll-padding-top:0}}
.eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{margin:0 0 10px;font-size:27px;line-height:1.25;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:14px;margin:0}
.status{padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);text-transform:capitalize;color:var(--muted)}
.status.confirmed{color:var(--ok);border-color:var(--ok)}
.status.likely,.status.speculation,.status.partial{color:var(--warn);border-color:var(--warn)}
section{margin-top:30px}
h2{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.clue{white-space:pre-wrap;font:16px/1.55 var(--serif);background:var(--code);border-left:4px solid var(--accent);padding:14px 18px;border-radius:0 8px 8px 0;margin:0}
dl.glance{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;margin:0;font-size:15px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
dl.glance dt{color:var(--muted)}dl.glance dd{margin:0}
@media (max-width:520px){dl.glance{grid-template-columns:1fr;gap:2px}dl.glance dt{margin-top:8px}}
.steps{list-style:none;margin:0;padding:0}
.step{position:relative;display:grid;grid-template-columns:36px 1fr;gap:0 16px;padding:14px 0}
.step::before{content:"";position:absolute;left:17px;top:50px;bottom:-14px;width:2px;background:var(--line)}
.steps .step:last-child::before{display:none}
.step .n{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step .body{min-width:0;padding-top:5px}
.step .body>*{margin:0}.step .body>*+*{margin-top:6px}
.cq{padding:8px 12px;border-left:3px solid var(--accent);background:var(--code);border-radius:0 6px 6px 0;font:italic 15px/1.45 var(--serif)}
.cq small{display:block;font:600 11px/1.5 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-style:normal}
.cq span{display:block}
.step b{font-weight:600}
q.cl{quotes:"\2018" "\2019";font:italic 1em var(--serif);color:var(--accent)}
.sec{margin:26px 0 2px;font-size:16px;font-weight:700}
.sec span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.note{margin:10px 0}
.note b{font-weight:600}
ul.plain{padding-left:20px;margin:8px 0}ul.plain li{margin:5px 0}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--bg)}
details+details,section>details{margin-top:10px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"\25B8";color:var(--muted);font-size:12px}
details[open]>summary::before{content:"\25BE"}
summary .count{font-size:12px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:999px;padding:0 8px}
details .raw{white-space:pre-wrap;font:14px/1.55 var(--serif);margin:10px 0 0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;color:var(--ink);font-size:14px;max-width:48%}
.pager a.next{text-align:right;margin-left:auto}
.pager small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card b{color:var(--accent);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.card .where{display:block;margin-top:4px;font-weight:600;line-height:1.35}
.card .tech{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.card .big{font-size:26px;font-weight:700;display:block;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px;text-decoration:none;color:var(--ink);border:1px solid transparent}
.chip:hover{border-color:var(--accent)}
.chip small{color:var(--muted)}
.rows{margin:0;padding:0;list-style:none}
.rows li{padding:12px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows a.t{font-weight:600;text-decoration:none;color:var(--ink)}
.rows a.t b{color:var(--accent)}
.rows p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.intro{font-size:17px;margin:0}
.empty{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
kbd{font:12px var(--sans);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px;overflow-wrap:break-word}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
.play h2{font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink);margin-top:32px}
.play h3{font-size:17px;margin:20px 0 6px}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px}
.figs.one{grid-template-columns:minmax(0,520px)}
.step .figs{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:10px}
figure{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
figure a.img{display:block;background:var(--code)}
figure img{display:block;width:100%;max-height:420px;object-fit:contain}
figure audio{width:100%;margin:12px 0 0}
figcaption{font-size:13px;line-height:1.45;color:var(--muted);padding:8px 10px}
.links{display:grid;gap:10px;margin-top:14px}
.video{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.video .frame{position:relative;padding-top:56.25%;background:#000}
.video iframe,.video .yt img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.video .yt{display:block}
.video .play{position:absolute;left:50%;top:50%;width:68px;height:48px;margin:-24px 0 0 -34px;border-radius:12px;background:rgba(0,0,0,.72)}
.video .yt:hover .play{background:#c00}
.video .play::after{content:"";position:absolute;left:27px;top:14px;border-left:18px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
.video p .dom{font-size:12px;color:var(--muted);margin-left:6px}
.video p,.lnk{margin:0;padding:9px 12px;font-size:14px}
.lnk{display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-decoration:none;color:var(--ink)}
.lnk:hover{border-color:var(--accent)}
.lnk .dom{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.lnk::before{content:"\2197";color:var(--accent)}
.unlock{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.unlock input{flex:1 1 220px;font:16px var(--sans);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.unlock button{font:600 15px var(--sans);padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.unlock label{flex:1 0 100%;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.unlock label input{flex:none;width:16px;height:16px;margin:0;accent-color:var(--accent)}
#lockctl a{color:var(--muted)}
.years .lock{font-size:.8em}
footer{max-width:920px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px}
</style>
</head>

_detail": "9300 S Wasatch Blvd (Salt Lake County), as stated in chat (#qr4-bb2, 2022-09-04)", "solve_path": "1) 'figure out where the location above is using Google Maps Street View' = geolocate the Street View picture of a gravel pull-off below a hillside of scrub oak in autumn colors. 'The first QR code is where the arrow is pointing' = the yellow bush at the edge of the pull-off.\n2) Narrow the region: the sun's position and the plants growing in the picture give the general area. Then drive every street in that area until the pull-off matches the picture.\n3) Location: the pull-off is at 9300 S Wasatch Blvd in Salt Lake County.\n4) Plaque: the QR code was in the yellow bush the arrow points to. No plaque question or answer is recorded.", "techniques": ["address", "anagram", "geolocation", "landmark-photo", "street-view"], "red_herrings": [], "missteps": [], "hunt_notes": ["A finding team described their solve in #you-made-it (2022-09-18): they used where the sun was and what plants were growing to narrow down the region, then drove every street in that area, about half an hour of searching.", "The address came up later in a Discord server #qr4-bb2 (2022-09-04): a hunter said billboard BB1's letters 'nhlbzw00vsc' can be rearranged to 'nz00wschblv' ('wschblv' = Wasatch Blvd) and that 'it was at 9300 s wasatch blvd'. Several players replied that this is the address of the first QR code, and players said they already knew the first billboard contained 'wschblv'."], "hints": [], "open_questions": ["The finding team's account (#you-made-it) gives the method but no location. The 9300 S Wasatch Blvd address comes from a separate, passing mention in #qr4-bb2, so nobody has stated directly that the finders' location and that address are the same place.", "The two sources describe different clue mechanisms: a Street View image in one, and billboard BB1 letters ('nhlbzw00vsc' anagrammed to 'nz00wschblv') in the other. It is unclear whether the BB1 letters were part of the Q ewed to a wooden post of the bridge/gate. A bike reflector is nailed about a foot below it, on that post only (photo). It is awkward to reach: people lined up to hang their phones over an edge or walk around to scan it. It is a short walk from parking. A rough, steep, potholed dirt road goes up a hill with a fence at the bottom. Park near the fence and don't drive up: low-clearance cars got high-centered or stuck, while SUVs and trucks did better. The site has the same name as a cabin landmark between North Temple and South Temple in Salt Lake City. The exact spot was deliberately kept out of the channel.", "solve_path": "1) Clue: scanning QR1 gives a string of numbers and the words 'start at one'. The numbers are a cipher.\n2) Cipher type: the hint email said it was 'inspired by the Beale Cipher, not specifically using it'. It is a book cipher: each number points to a word in a key text, and you take letters from those words.\n3) Key text: no outside context is needed. The text was already out before the clue, in material the organizers had given players (Instagram, emails, sponsors, possibly the main site). It is the sponsor Kodiak's website, and it has to be at least 186 words long.\n4) 'start at one' = begin counting at the word 'one' in the key text. The hint email called this 'more direct than you might think'.\n5) Decode: put the key text and the numbers into a book-cipher decoder such as boxentriq. Output of random letters means the key text or its alignment is wrong. One number in the clue reads 115 where it should be 114, so one letter decodes as 'a' where 'e' belongs.\n6) Search: read the decoded message carefully, then search it in Google Maps. It names a trailhead, which leads to the Centerville Canyon bridge, and it also says where to look at the site.\n7) Site: park by the fence at the bottom of the dirt hill and walk a short way to the wooden bridge.\n8) Plaque: on a wooden post of the bridge, about a foot above a bike reflector. The password prompt asks about a sign (the sign is ON the object, not UNDER it); the answer is BRIDGE, in all caps.", "techniques": ["sponsor-reference", "webpage", "cipher", "book-cipher", "beale-cipher", "number-code", "web-search"], "red_herrings": ["Tooele Bus Depot (TBD) was a joke reading of the QR3 'TBD' placeholder. It was not about the QR2 location.", "Someone went the wrong direction on the trail, a 3-mile walk past a swing.", "Hiking the trail: one solver hiked in the dark and later said it was a waste of time, because the plaque is close to parking.", "A hunter read the decoded message as only a fancy way of naming the trailhead and could not find the plaque there. Others said the message also tells you where to look at the site.", "Decoder output of random letters: players said their key text was right, but output like that meant the key text or its alignment was wrong. They were told to keep tinkering with the text.", "Trying the wrong source texts for the cipher, which is what made QR2 slow.", "The cabin landmark between North and South Temple in SLC has the same name as the QR2 site; a hunter went there first.", "Reflector as a hint to read the billboard reversed, as in a mirror. Not confirmed."], "missteps": [], "hunt_notes": ["A hunter later recalled that 2022 QR2 was a sponsor webpage with the letters, without details.", "Nudge in chat: 'read it carefully, then google'.", "Some players guessed the 115-for-114 slip was there to stop auto-solving bots.", "Each account could enter a password only once. The site sometimes rejected correct answers because of a bug, so players were told to log in and check 'my team's current clue'.", "The first scan was around 5:00 PM on Friday 2022-08-19, and many teams followed. The next page (QR3) at first showed only 'TBD'."], "hints": ["An official hint for QR2 was released before it was solved.", "Hint email: 'start with one'; the email clue is more direct than you might think (quoted by a moderator). The solving team quotes it as 'start at one'.", "Hint email: the cipher was only inspired by the Beale Cipher, not specifically using it.", "Per a hunter, QR2 'was given away after the first 50 solved it' (#qr3-private 2022-08-23)."], "open_questions": ["The clue text (the number string) and the decoded message are not quoted in any source.", "The exact plaque question wording is not quoted. Records only say it asks about a sign that is ON the object, which fits the answer BRIDGE.", "Sources differ on how 'start with one'/'start at one' is used. One reads it as how the word count starts. The solving team started counting at the word 'one' on the Kodiak site.", "Access is described differently: 'mountain trail' and 'hiking spot' (close to an hour including the drive, about 5 hikes there), a 3-mile wrong-way walk, versus 'close to parking, no real hike'.", "Only one source names the place (Centerville Canyon bridge). Another source only says 'the same area' as Lagoon. The exact trail name is not given.", "The SLC cabin landmark that shares the site's name is not named. Possibly the Deuel cabin, which would point to Deuel Creek in Centerville, but no source says this.", "It is unclear whether 'given away after the first 50' was a released answer or the hint email."], "coords": null, "n_sources": 88, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Clue", "lead": null, "text": "Scanning QR1 gives a string of numbers and the words 'start at one'. The numbers are a cipher.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Cipher type", "lead": null, "text": "The hint email said it was 'inspired by the Beale Cipher, not specifically using it'. It is a book cipher: each number points to a word in a key text, and you take letters from those words.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Key text", "lead": null, "text": "No outside context is needed. The text was already out before the clue, in material the organizers had given players (Instagram, emails, sponsors, possibly the main site). It is the sponsor Kodiak's website, and it has to be at least 186 words long.", "bullets": []}, {"t": "step", "n": "4", "clue": ["start at one"], "label": null, "lead": "Begin counting at the word 'one' in the key text.", "text": "The hint email called this 'more direct than you might think'.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Decode", "lead": null, "text": "Put the key text and the numbers into a book-cipher decoder such as boxentriq. Output of random letters means the key text or its alignment is wrong. One number in the clue reads 115 where it should be 114, so one letter decodes as 'a' where 'e' belongs.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Search", "lead": null, "text": "Read the decoded message carefully, then search it in Google Maps. It names a trailhead, which leads to the Centerville Canyon bridge, and it also says where to look at the site.", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": "Site", "lead": null, "text": "Park by the fence at the bottom of the dirt hill and walk a short way to the wooden bridge.", "bullets": []}, {"t": "step", "n": "8", "clue": [], "label": "Plaque", "lead": null, "text": "On a wooden post of the bridge, about a foot above a bike reflector. The password prompt asks about a sign (the sign is ON the object, not UNDER it); the answer is BRIDGE, in all caps.", "bullets": []}], "title": "Beale-style book cipher: start at one", "media": [], "links": [], "wl": []}, {"hunt_year": 2022, "qr_number": 3, "status": "confirmed", "confidence": 0.75, "clue_text": "go to the place where ducks take flight and the princess watches over her knight from the south end look and count one two three 60 paces past Kentucky coffee tree", "plaque_question": null, "plaque_answer": null, "location_name": "Highland Glen Park, Highland", "location_detail": "Highland, Utah (Utah County). Start at the park's south end and go 60 paces past the Kentucky coffee tree. A hunter said the site has a literal plaque marking the location and dense vegetation, and searchers said the QR was hard to find in the dark.", "solve_path": "1) 'Clue Number 3 / Reach 100 to reveal the next clue' = a browser game on the hunt site, a Flappy Bird clone built in Unity WebGL, which appears on a team's hunt page when the countdown after its QR2 scan runs out. Score 100 to see the riddle. There are no checkpoints, so every run starts over from zero, and scoring past 100 does nothing extra.\n2) Playing it: clicking with the mouse works; on a trackpad, physically click rather than tap. A black screen or a 'made with Unity' restart is fixed by refreshing or switching browsers. Keep a steady 'one two' rhythm, since there are rarely more than 2 taps between pipes. A computer screen shows more upcoming pipes than a phone, and several people can play on one team login at once on different devices. The riddle shows only briefly, so take a screenshot.\n3) Riddle: it has four sentences. The first two identify the place, and the last two are 'look here' instructions for use at the site. The exact wording was never posted; the clue text here is a paraphrase.\n4) 'the princess watches over her knight' = the Timpanogos legend of the princess Utahna. Search for places tied to that legend.\n5) 'go to the place where ducks take flight' = the pond at Highland Glen Park in Highland, Utah, one of the places tied to the Utahna legend.\n6) 'from the south end look and count one two three 60 paces past Kentucky coffee tree' = start at the park's south end and walk 60 paces past the Kentucky coffee tree to the plaque. The site has a literal plaque marking the location and a lot of vegetation, which makes the pacing hard to get right.\n7) Plaque: at Highland Glen Park, 60 paces past the Kentucky coffee tree. The plaque question and answer, if any, are not recorded.", "techniques": ["countdown-unlock", "mini-game-gate", "riddle", "poem", "local-history", "pacing"], "red_herrings": ["'TBD' read as a clue: T=20, B=2, D=4 as '2024' (joke)", "Beale cipher on the Kodiak sentence with 20/2/4 gives 'TNO', a precious-metals ticker linked to Rio Tinto", "Using TBD as a Vigenère/Beaufort key on the billboard cipher (outputs 'Ugiiytvnszb', 'Gusschfnibz'). The organizers later said TBD was a placeholder.", "TBD Graphix in Sandy, or TBD marketing companies in SLC", "The TBD TV channel's SLC affiliate", "Periodic table / Element sponsor: there is no D element, but Tb and Dy sit next to each other", "TBD Devastator, a Douglas torpedo bomber, possibly at the Hill Aerospace Museum", "Tooele Bus Depot: a hunter visited and found a fenced dirt construction site", "Tooele's Bustling Downtown, Taylorsville Bennion Improvement District, Timberline Drive / Ferguson Canyon trailhead (Ferguson was used the year before)", "'The Big Dig' / Kennecott, for precious metals", "Live's song 'TBD' / V for Vendetta", "TBD bouldering crag near Park City: someone visited and found nothing", "utahultimate.org 'TBD Utah' page: just a placeholder for game locations", "Kodiak IG 'The Bear Den' / Bears Den club in Magna: someone went and found no QR", "Asteroids game message after level 18: same as the 2021 hunt. The organizers said 'Not Asteroids'.", "Game identity guesses: Tetris (100 lines), Roblox (Jr. Hunt world), Pac-Man, Dig Dug / Element-themed game, Space Invaders, Chrome dinosaur, Temple Run, Frogger, QWOP. The game was a Flappy Bird clone; a player who had played it said it was not Tetris, Roblox or Pac-Man.", "Ready Player One references: a hunter said 'It's not ready player one'", "Thanksgiving Point: claimed secondhand as the QR3 location ('Dave told me'), plus a 'Pac-Man machine at thanksgiving point' joke and a doctored screenshot joke from a hunter. The location was Highland Glen Park.", "A hunter tried a place 'way up north focused around the Princess'; it didn't work", "A hunter googled the last part of the riddle and got mostly New York results", "The QR badge image as a location hint: the 2022 badges were made vague on purpose (QR2's backpack badge vs. a trailhead plaque)", "A hunter's guess was rejected, and they knew of 2 other places people had been told were wrong (not named). A hunter checked two places that didn't work.", "A hunter followed one lead that turned into a 10+ mile hike (no word on whether it was right)", "An apparent typo in the riddle: a hunter suggested it might be deliberate; not resolved"], "missteps": ["A hunter's family spent over an hour at the park without finding the QR plaque."], "hunt_notes": ["After teams scanned QR2 (around 2022-08-20), the 'Current Clues' page showed only 'TBD', a placeholder: the organizers had left the country thinking everything was set and were missing a piece. Each team's hunt page then showed a countdown ('Your team's next clue unlocks soon!'), released in order of QR2 scan time, so teams that scanned QR2 earlier got the clue sooner. The first team's clue unlocked around 12:09 on 2022-08-23.", "A hunter posted a score of 220 'for clout'.", "A hunter described the riddle's structure: the first two sentences identify the place ('once you see it you know it'). A hunter reached the park by searching places tied to the Utahna legend, and a hint dropped in chat was 'Where do they look over them?'", "A hunter reported a find on 2022-08-23. Team a team got the 3rd badge (a scroll icon) around 8:56 PM on 2022-08-23. A team were reported as the 3rd team to find it. A moderator said QR3 had been found by 2022-08-24 20:07. About 15 teams had the badge by one evening, all five moderators reached QR4, and more teams scanned it on the night of 08-25 and the morning of 08-26."], "hints": ["Organizer IG story (2022-08-20 window): 'we were missing a piece... We're working to release the next clue based on [QR #2 scan] timestamp so the early teams will still have their lead... we'll roll that out Sunday evening or early Monday. Ready to play another game? *Not Asteroids'", "Organizer Instagram (@onthejohn): 'Everyone who has scanned into QR #2 should see a countdown on your team's current hunt page. Once your time is up, a game will appear. I've been playing for an hour and just choked at 98. I'm going to get it though. Tip: chill music helps.'", "Organizer John reportedly said buying the riddle from someone who beat the game is not cheating, but skipping Flappy Bird might be frustrating later in the hunt (secondhand).", "Organizer Instagram story: 'Careful whose advice you buy, but be patient'. It also says someone who quits on part of the hunt may not have the grit to win.", "Organizer IG DM screenshots: a team member or helper may beat the game for you; sharing the riddle within a team is allowed; skipping the game is not grounds for disqualification.", "Organizers said a clue tied to the game would come out, per their Instagram story (text not quoted)."], "open_questions": ["The exact riddle wording was never posted. The clue_text is a hunter's paraphrase from #you-made-it, and the original had four sentences.", "The plaque question and answer (if any) are unknown.", "One record (#qr3-private 2022-08-26) says the Flappy Bird game came after scanning the QR3 plaque and revealed the QR4 riddle. All other records say it came after QR2 and revealed the QR3 riddle.", "Controls: one record says the spacebar left solid barriers, so players used the mouse; another lists the space bar as a working control.", "A riddle typo was asked about (intentional or a mistake). The typo isn't identified.", "The exact plaque spot is unclear: whether '60 paces' is counted from the Kentucky coffee tree or from the south end, and the direction of travel.", "The order of finds isn't clear: a team at 8:56 PM on 08-23 vs. a 'first team by 12:23' in the 08-24 window, and a team as 3rd team.", "Unconfirmed side leads: a request for someone in Provo to check a spot, a hunter's 'intel' on county and city, and 'in 700 something place'."], "coords": null, "n_sources": 181, "steps": [{"t": "step", "n": "1", "clue": ["Clue Number 3 / Reach 100 to reveal the next clue"], "label": null, "lead": null, "text": "A browser game on the hunt site, a Flappy Bird clone built in Unity WebGL, which appears on a team's hunt page when the countdown after its QR2 scan runs out. Score 100 to see the riddle. There are no checkpoints, so every run starts over from zero, and scoring past 100 does nothing extra.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Playing it", "lead": null, "text": "Clicking with the mouse works; on a trackpad, physically click rather than tap. A black screen or a 'made with Unity' restart is fixed by refreshing or switching browsers. Keep a steady 'one two' rhythm, since there are rarely more than 2 taps between pipes. A computer screen shows more upcoming pipes than a phone, and several people can play on one team login at once on different devices. The riddle shows only briefly, so take a screenshot.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Riddle", "lead": null, "text": "It has four sentences. The first two identify the place, and the last two are 'look here' instructions for use at the site. The exact wording was never posted; the clue text here is a paraphrase.", "bullets": []}, {"t": "step", "n": "4", "clue": ["the princess watches over her knight"], "label": null, "lead": "The Timpanogos legend of the princess Utahna.", "text": "Search for places tied to that legend.", "bullets": []}, {"t": "step", "n": "5", "clue": ["go to the place where ducks take flight"], "label": null, "lead": null, "text": "The pond at Highland Glen Park in Highland, Utah, one of the places tied to the Utahna legend.", "bullets": []}, {"t": "step", "n": "6", "clue": ["from the south end look and count one two three 60 paces past Kentucky coffee tree"], "label": null, "lead": "Start at the park's south end and walk 60 paces past the Kentucky coffee tree to the plaque.", "text": "The site has a literal plaque marking the location and a lot of vegetation, which makes the pacing hard to get right.", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": "Plaque", "lead": null, "text": "At Highland Glen Park, 60 paces past the Kentucky coffee tree. The plaque question and answer, if any, are not recorded.", "bullets": []}], "title": "Flappy Bird game and a ducks-and-princess riddle", "media": [{"src": "media/2022-qr3-01.jpg", "section": "clue", "caption": "The Clue Number 3 page: 'Reach 100 to reveal the next clue' above the embedded game.", "kind": "image"}, {"src": "media/2022-qr3-02.jpg", "section": "clue", "caption": "The game on the hunt site: a Flappy Bird clone where a score of 100 reveals the riddle.", "kind": "image"}, {"src": "media/2022-qr3-03.jpg", "section": "hint", "caption": "Organizer Instagram story: after the QR2 countdown a game appears; 'chill music helps'.", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2022, "qr_number": 4, "status": "confirmed", "confidence": 0.6, "clue_text": "Look to the skies, along the I's", "plaque_question": null, "plaque_answer": null, "location_name": "Second (smaller) billboard in Magna, Utah (a clue stop; the plaque/final answer is not described in this window)", "location_detail": "Per 2022 players quoted in a screenshot: a news story showed a giant billboard announcing the hunt; one of the clues alluded to finding another billboard, which was eventually found in Magna. No address or coordinates given. A Discord server records add: the second billboard (BB2, a pink 'static board') is on Magna Main Street, at about Plus Code 85G9PV6V+FQ / 85G9PV6W+FP2 (#qr4-bb2; #you-made-it 2022-09-18). The back of BB2 shows only FanX and Little Shop of Horrors ads. Plaque location is not posted in any window. Clues about it: the organizer email points to Salt Lake County; organizers reportedly said the spot has no business hours, and someone found it at 1am (#qr4-bb2); a hunter found it about 3 hours after 'David's Usana clue' (#qr4-private); a hunter searched 'from every point of usana'; about 20 hunters were at the site on the morning of 2022-09-03 (#billboard-general 2022-09-03). Some players guessed central Utah County / Orem (unconfirmed).", "solve_path": "The full method was not written down when the hunt ran. These steps combine a later recollection with chat from 2022; the cipher key, the decoded text and the plaque spot are not recorded, and accounts differ on steps 2 and 4 to 6 (see Open questions).\n1) Billboard 1: a giant billboard announcing the hunt, shown in a news story, reads '$20,000 Treasure Hunt / + NHLBZWOOVSC IV / utahtreasurehunts.com', with Kodiak, Element and Compass logos. The weekly email said 'The IV symbol only signifies that this is for QR #4 and nothing more.'\n2) 'Look to the skies, along the I's' = look up at billboards and follow the i's on them: the eyes of the people pictured, and the four orange-highlighted letter i's on billboard 2.\n3) Billboard 2: the weekly email said 'To solve the cipher on this billboard you will need to search for something. But where is it? We recommend telling your teammates in Salt Lake County to keep their eyes open.' The something is a second, smaller billboard on Magna Main Street (about Plus Code 85G9PV6V+FQ): a pink field of scattered letters and symbols, including 'tReAsUre HuNt K€Y', running-man figures and four orange-highlighted i's.\n4) Overlay: superimpose the two billboards. The letters of billboard 2 that line up with the figures' eyes are the ones to use.\n5) Cipher: NHLBZWOOVSC on billboard 1 is deciphered using billboard 2. One solver described it as a Vigenère cipher with a key of random letters rather than a word; the key seems to be 4 letters long, and numbers can be turned into letters.\n6) Website: the result goes into an input on the organizers' website, which gives the next stage. How that stage led to the plaque is not recorded.\n7) Plaque: its location, question and answer are not recorded; what is known about the spot is under Finding the plaque.", "techniques": ["billboard", "image-overlay", "wordplay", "red-herring-letters", "vigenere-cipher", "custom-cipher", "cipher-key", "map-overlay", "number-code", "sponsor-reference", "landmark-photo", "url-path"], "red_herrings": ["All the letters printed on the big (news-story) billboard were red herrings; only the small billboard's letters that aligned with the eyes mattered.", "Interstates as the meaning of the i's: John's reported DM implies they are not interstates (#qr4-bb2).", "Before BB2 was known, solvers ran NHLBZWOOVSC through word de-substitution, substitution and shift ciphers. Results: 'forestalling' (A hunter concluded the billboard was a red herring), 'crystallize', 'thesaurus', 'I cannot help', USU coordinates, 'bout the sand', 'hard puzzles', 'sin and I date', 'there's me map' (#billboard-general 2022-08-20).", "IV read as an AES initialization vector: AES gave no result. The organizer email said IV only marks QR #4.", "Web3/blockchain/NFT redemption and buying an Element node: nothing found. A hunter said no purchase should be needed.", "The '888-4-SILVER' billboard ('MARKETS ARE CRASHING... BUY SILVER'): the number went to a vanity-number site or voicemail; a hunter said it 'sucked going down that path for nothing' (#billboard-general 2022-09-03).", "'lil lindy': a hunter was 'Shocked it wasn't lil lindy' (#qr4-private).", "Shining a blacklight on billboard #2 did not help (#qr4-private).", "Google Plus Code readings: NHLB+ZWOOVSC goes to the Utah Capitol, which John called a 'total coincidence'. NHLBZWOOVSC+IV is not valid. Google fills in missing characters from the user's location, so results changed with a VPN (#qr4-bb2). A hunter later said the solve is not a Plus Code (2022-09-05).", "TREASURE / TREASUREHUNT ('tReAsUre HuNt K€Y' on BB2) as a Vigenère key: gibberish. TREASUREHUNT has 12 letters and the ciphertext has 11. A hunter said the key is not a word.", "Playfair after removing letter pairs: gibberish (A hunter).", "W read as a spacer, two V's or 'double u'; sideways E read as 'I80 E'; letters above each i (backwards k, vG, sideways E) (#qr4-bb2).", "Nielsen's Grove Park, Orem, from a decipher about 4 letters off and from anagramming BB2; AMC Movie 8 in Provo, doubted because the spot has no business hours; 'creams'/'grove' leading to Memory Grove Trail; 'cove'; 'l o c 8'.", "Constellation overlay (summer triangle / Orion) from the i's; Kodiak ESG website map; mirroring, folding or cutting BB2.", "Running-man icon as a fire exit sign or the running man cipher, or the direction he is looking. A hunter: No.", "Overlaying the billboards by matching the + signs; others said scale depends on camera distance.", "oremtreasurehunt / north-south lead from bubbleoseven, and 'keuroy' as the key: some players called both trolling.", "Treating the O's as zeros, or switching the cipher language: still gibberish (A hunter, 2022-09-05).", "NHLBZWOOVSC at the end of the site URL showed 'locked'.", "A hunter's brother searched trees near the Trolley Square water tower for 2 hours; it is unclear which QR this was for (#qr6-general)."], "missteps": ["One solver had the right key but did not know what to do with the decrypted text (#qr4-bb2 2022-09-05)."], "hunt_notes": ["The method was pieced together from a recollection by 2022 players (a screenshot of another server's #qr4 channel posted by a hunter; chat), which does not name the QR number (later messages in the same server call it '2022 QR4 (billboards)'), and from a Discord server channels of 2022 (#billboard-general, #qr4-private, #qr4-bb2, #qr6-general, #you-made-it, 2022-08-20 to 2022-09-18).", "A hunter photographed billboard 1 on 2022-08-20 (#billboard-general), and teams knew it before they reached QR3 (#you-made-it).", "A hunter found billboard 2 on Magna Main Street (#qr4-bb2).", "On the organizers' website, correct answers sometimes showed a 'locked' error until the player logged out and back in (#qr4-bb2; #qr6-general).", "A hunter reported finding it on 2022-09-02 and a hunter on 2022-09-03 (#billboard-general 2022-09-03). At least two teams solved it on the night of 2022-09-03 (#qr4-private). A hunter reported 4 finders by 13:45 on 2022-09-04 (#qr4-bb2), and 'a team got qr4' by 2022-09-04 20:24."], "hints": ["A Friday weekly hint is what revealed that a second billboard existed (recollection,).", "Weekly email: 'The IV symbol only signifies that this is for QR #4 and nothing more. To solve the cipher on this billboard you will need to search for something. But where is it? We recommend telling your teammates in Salt Lake County to keep their eyes open. Will you recognize it for what it is and then know what to do once you find it?' (#qr4-bb2)", "John (unverified Instagram DM): the cipher is 'Made up by yours truly'; 'If the i's in \"look to the sky's and follow the i's\" didn't mean interstates... what is i's' (#qr4-bb2)", "John (reported DM): 'You need to decipher the message on Billboard 1 using Billboard 2'", "John on the Plus Code rumors: 'There's some truth in those rumors, but not completely'", "Organizers reportedly said the location has no business hours; unverified Reddit report that John said the answer is not coordinates", "David's Usana clue, mentioned but not quoted (#qr4-private)", "A clip on the official Instagram / Dave's Instagram Stories helped solvers find the key (#qr6-general; #qr4-bb2 2022-09-05)"], "open_questions": ["Clue wording: the current record has 'Look to the skies, along the I's'. A a hunter record quotes 'Look to the skies along the i's and solve the cipher', and John's reported DM says 'follow the i's'.", "What the I's are: the current record says the eyes of the people pictured. A hunter players and John's DM point to the letter i's on billboard 2, and Emma's solve used 'the letters in the eyes'.", "The current record says all the big billboard's letters were red herrings. A hunter records say NHLBZWOOVSC on billboard 1 is the ciphertext, decrypted with a key from billboard 2 (John DM; a hunter).", "Cipher type: John reportedly called it homemade ('Made up by yours truly'), while a hunter says it is Vigenère with a key of random letters, apparently 4 letters long. The actual key and decrypted text are not in any window; moderators deleted them.", "Final step: one account says the overlay turns a 4 into a D and spells 'websitefeps', used as a link on the website (#you-made-it). Another says the Vigenère output was typed into the website input. A third says decrypting was not the last step.", "Plus Code: John said 'some truth' to the rumors, but a hunter said the solve is not a Plus Code.", "The plaque location, question and answer are not posted. Leads: Salt Lake County (email), Usana (hunters), no business hours / found at 1am; some players guessed Orem / central Utah County.", "Whether the O's in NHLBZWOOVSC are letters or zeros."], "coords": null, "n_sources": 151, "steps": [{"t": "p", "label": null, "text": "The full method was not written down when the hunt ran. These steps combine a later recollection with chat from 2022; the cipher key, the decoded text and the plaque spot are not recorded, and accounts differ on steps 2 and 4 to 6 (see Open questions)."}, {"t": "step", "n": "1", "clue": [], "label": "Billboard 1", "lead": null, "text": "A giant billboard announcing the hunt, shown in a news story, reads '$20,000 Treasure Hunt / + NHLBZWOOVSC IV / utahtreasurehunts.com', with Kodiak, Element and Compass logos. The weekly email said 'The IV symbol only signifies that this is for QR #4 and nothing more.'", "bullets": []}, {"t": "step", "n": "2", "clue": ["Look to the skies, along the I's"], "label": null, "lead": null, "text": "Look up at billboards and follow the i's on them: the eyes of the people pictured, and the four orange-highlighted letter i's on billboard 2.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Billboard 2", "lead": null, "text": "The weekly email said 'To solve the cipher on this billboard you will need to search for something. But where is it? We recommend telling your teammates in Salt Lake County to keep their eyes open.' The something is a second, smaller billboard on Magna Main Street (about Plus Code 85G9PV6V+FQ): a pink field of scattered letters and symbols, including 'tReAsUre HuNt K€Y', running-man figures and four orange-highlighted i's.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Overlay", "lead": null, "text": "Superimpose the two billboards. The letters of billboard 2 that line up with the figures' eyes are the ones to use.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Cipher", "lead": null, "text": "NHLBZWOOVSC on billboard 1 is deciphered using billboard 2. One solver described it as a Vigenère cipher with a key of random letters rather than a word; the key seems to be 4 letters long, and numbers can be turned into letters.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Website", "lead": null, "text": "The result goes into an input on the organizers' website, which gives the next stage. How that stage led to the plaque is not recorded.", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": "Plaque", "lead": null, "text": "Its location, question and answer are not recorded; what is known about the spot is under Finding the plaque.", "bullets": []}], "title": "Two billboards: look to the skies, along the I's", "media": [], "links": [], "wl": []}, {"hunt_year": 2022, "qr_number": 5, "status": "confirmed", "confidence": 0.75, "clue_text": null, "plaque_question": "Answer needed to enter the QR5 room (angle-of-depression distance in meters)", "plaque_answer": "≈51.96 meters (30 × tan 60°)", "location_name": "Escape room at Trolley Square, Salt Lake City", "location_detail": "An escape room at Trolley Square, Salt Lake City, with a sign on the door for the hunt 'room'. It keeps business hours. Inside: a table showing 'Jessie's mom', a phone, red buttons, a colors clue, and several combination safes (one held the QR code / next clue; the others were empty). It needed a reset after crowds on 2022-09-05.", "solve_path": "1) Virtual world: the clue leads to an online game room, a Roblox game on the organizers' website. Open it from the link on a computer, or search the room and creator name in the Roblox phone app, then walk around the room collecting 3D letters.\n2) Letters: there are about 12-13 characters in total. Only the 3D letters count; letters on columns ('LOVI', 'PAX ROMANA') do not.\n3) Unscramble: the letters unscramble into a place name, not an address: Trolley Square, Salt Lake City. It can be solved without every letter.\n4) Entry math: the room's door needs the answer to a trig problem with a 30° angle of depression and a distance of 30 m. The angle of depression is measured from the horizontal, so the tangent uses 90 − 30 = 60°: height = 30 × tan(60°) ≈ 51.96 m, which is accepted. The math is not needed inside the Roblox game; it is for the room door.\n5) Location: the escape room at Trolley Square, Salt Lake City, with a sign on the door. The venue keeps business hours. The math answer opens the door.\n6) Phone: inside, a table shows 'Jessie's mom'. Dialing her number on the room's phone plays the Spectrum song.\n7) Safe: pressing the red buttons gives a text telling you to look up the area code for Harrington, Maine. That area code opens the safe.\n8) Plaque: the safe holds the QR code and the next clue, a location from the earlier Poem hunt. The room's other safes are empty and not needed.", "techniques": ["online-game", "roblox", "letter-collection", "anagram", "wordplay", "math-trigonometry", "angle-of-depression", "escape-room", "combination-lock", "number-code"], "red_herrings": ["Underwater hole / tunnel under the in-game city: players jumped in, got stuck in a glitch and respawned; nothing found there", "Letters on columns ('LOVI', 'PAX ROMANA') are not among the counted letters", "Letters in trees: none found", "Angle-of-depression math answer is not needed to play the Roblox game; it is for later", "17.32 m = 30 × tan(30°): uses the depression angle directly instead of 90−30. Many people submitted this and it was rejected (#qr7-private)", "Converting meters to feet: not needed. The answer is in meters, and 17.32×3 only matched by coincidence", "The other safes at the QR5 site (3 of 4 opened by a hunter/Sus) were empty, so they were not needed for the QR (#qr72)", "A hunter went up the wrong trail and got lost about 4 miles in (#qr5-general 09-06)"], "missteps": [], "hunt_notes": ["Most players found 7 to 12 of the letters, plus some duplicates (#qr5-general 09-05). Some solved the anagram without all the letters; one team solved it with only 6 because those letters happened to spell a word, and one team only partly solved it, got 'trollesquare' and recognized Trolley Square (#you-made-it).", "A hunter on the angle-of-depression problem: 'Google it. It's not that ambiguous' (#qr5-general).", "A hunter's team 'got phone and the colors and the qr safe' (#qr72). Most teams opened only the QR safe (#qr72).", "Solves leaked to Reddit/Discord on 2022-09-05, so about 100 people showed up at once. The organizer's story said: 'If you're headed to QR 5 it is broken. Need till after 6 to fix it... room needs a reset' (#qr6-general). The room was later reported fixed. A hunter was the first to enter the escape room (#qr6-general).", "The site rejected the correct entry on a phone but accepted it on a computer (#qr6-general)."], "hints": ["John's IG story: the correct answer to get into the QR5 room — 'do your math again'", "A hunter: the letter answer is 'word play' (#qr5-general 09-05)", "A hunter: 'There's a sign on the door'"], "open_questions": ["Location conflict: #you-made-it (09-18) names the Trolley Square escape room. #qr5-general 09-05 describes an indoor play place / family fun center (bounce houses, play structure, arcade, from the image). #qr5-general 09-06 describes a hike of about 2 hours round trip with a 'north trail'. It is not clear whether the hike discussion is about the Poem-hunt location given by the QR5 safe (i.e., the next step) rather than QR5 itself.", "Letter count: 13 characters (#qr5-general) vs 12 Roblox letters (#qr6-general).", "What the safe held: #qr72 says the QR code; #you-made-it says the next clue, a location from the earlier Poem hunt. Both may be true.", "The Harrington, Maine area code (the safe combination) is not stated in the chat.", "The 51.96 m math answer opened the room door. It is not clear whether there was also a separate question after scanning the plaque.", "Exactly how the 'colors' clue was used, and what Jessie's mom's phone number was, are not stated.", "What 'the second billboard' (A hunter, #qr7-private) and the overlooked key that a hunter recognized from brute-forcing a 4-letter key earlier (#qr6-general) refer to."], "coords": null, "n_sources": 68, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Virtual world", "lead": null, "text": "The clue leads to an online game room, a Roblox game on the organizers' website. Open it from the link on a computer, or search the room and creator name in the Roblox phone app, then walk around the room collecting 3D letters.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Letters", "lead": null, "text": "There are about 12-13 characters in total. Only the 3D letters count; letters on columns ('LOVI', 'PAX ROMANA') do not.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Unscramble", "lead": null, "text": "The letters unscramble into a place name, not an address: Trolley Square, Salt Lake City. It can be solved without every letter.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Entry math", "lead": null, "text": "The room's door needs the answer to a trig problem with a 30° angle of depression and a distance of 30 m. The angle of depression is measured from the horizontal, so the tangent uses 90 − 30 = 60°: height = 30 × tan(60°) ≈ 51.96 m, which is accepted. The math is not needed inside the Roblox game; it is for the room door.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Location", "lead": null, "text": "The escape room at Trolley Square, Salt Lake City, with a sign on the door. The venue keeps business hours. The math answer opens the door.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Phone", "lead": null, "text": "Inside, a table shows 'Jessie's mom'. Dialing her number on the room's phone plays the Spectrum song.", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": "Safe", "lead": null, "text": "Pressing the red buttons gives a text telling you to look up the area code for Harrington, Maine. That area code opens the safe.", "bullets": []}, {"t": "step", "n": "8", "clue": [], "label": "Plaque", "lead": null, "text": "The safe holds the QR code and the next clue, a location from the earlier Poem hunt. The room's other safes are empty and not needed.", "bullets": []}], "title": "Roblox room letters and a safe code", "media": [], "links": [], "wl": []}, {"hunt_year": 2022, "qr_number": 6, "status": "confirmed", "confidence": 0.75, "clue_text": null, "plaque_question": null, "plaque_answer": null, "location_name": "Ben Lomond Peak (summit), north of Ogden", "location_detail": "The plaque was screwed to a log or stump at the top of Ben Lomond, at the end of a long, hot, steep hike up a canyon trail (about 2–5 hours round trip). People mentioned hiking a trail possibly from North Fork. The spot was used in the summer 2022 Poem hunt. Hunters scanned it at night and at 7:40am, around 4pm and around 5:30pm on 2022-09-06. A hunter's sister reached the top around 3-3:30 PM on 2022-09-05. Police were parked at the canyon base, and a fire started on 2022-09-06, possibly in the same canyon. A prank plaque was placed next to the real one on the afternoon of 2022-09-06.", "solve_path": "1) Clue: the QR6 clue is the poem from the organizers' summer 2022 Poem hunt, used again unchanged. The plaque is at a spot from that Poem hunt. The clue text itself was not posted.\n2) Location: Ben Lomond Peak, north of Ogden, the spot used in the summer 2022 Poem hunt. The plaque is at the top.\n3) Hike: a long, hard climb up a canyon trail to the top, possibly from North Fork. Round trips take 2–5 hours from the trailhead. It is hot in the daytime; bring lots of water, and a light if you go in the dark. Rattlesnakes, scorpions and mountain lions were reported, and people warned against doing it at night. Some people ride e-bikes or mountain bikes up the trail, and dirt bikers use it too.\n4) Plaque: screwed to a log or stump at the top. A selfie at the top was required as proof. The plaque question and answer are not recorded.", "techniques": ["poem-reuse", "prior-hunt-reference", "local-history", "hike", "landmark-photo"], "red_herrings": ["A hunter went to the wrong trail twice the night before. A hunter also said a team went to the wrong trail twice", "A hunter drove 1.5 hours to an incorrect solve", "A hunter hiked the wrong trail the night before, and their chat comments led a hunter down a false trail", "A hunter's alternative solve ( image, QR number not stated): 'BB1' rearranges NHLBEWØØVSC into '9300 W SCH BLV', with N=9 and Z=3, next to the note 'Along the i's 801'. 'BB2' uses element symbols in 'tReAsUre HuNt' (Re=75, As=33, F/U=9, H=1, N=7), which gives 10 digits 'like in a phone #'. A hunter said it 'just needs one change to make the number work', called the number and got voicemail, and said they liked it better than the actual solve", "Prank plaque at the summit on the afternoon of 2022-09-06: a second plaque with a compass rose, a QR code linking to the Wikipedia article 'Loose lips sink ships', and scrambled letters (e.g. '...pwiyvwyro + ferhmwg...lrpieow'). The letters are a Beaufort cipher that decodes to 'integrity honesty enforce your rules and ban discord leaks'. People guessed it was an anti-cheating measure, an extra cipher, or a sign of second visits. Organizer John Maxim said in a DM 'It was not us it is not part of the hunt', and the organizers said it would be dealt with and no one needs to hike back up ", "A hunter had the billboard answer for 2 days but thought it was gibberish. The chat does not say which QR the billboard belongs to", "A hunter said 'the Dutton train station is up that canyon'. It is unclear whether that is a real landmark or a joke"], "missteps": [], "hunt_notes": ["In chat, someone asked whether the QR6 spot was the whole trail or where the summer treasure was buried. A hunter answered 'the poem is identical', and a hunter took that to mean the plaque is where the summer treasure was buried. A hunter said the hike goes to a spot from one of the organizers' past poem hunts, and one team recognized the place from the Poem hunt held earlier in 2022 (#you-made-it).", "A hunter suggested finding out where the earlier stage 'stopped the first time'. A hunter said they knew the spot from an earlier find that went 'so quickly' they never hiked it.", "Several hunters hiked Ben Lomond Peak on 2022-09-06 and scanned the plaque at the top (#qr7-private 2022-09-06). A hunter hiked it in the dark and 'power hiked that thing to the top'; a hunter got 3 blisters.", "A hunter said hints from 'Bubbles' helped but gave no details.", "The moderators made a QR7 channel for people with photo proof of scanning.", "The QR7 clue unlocked 48 hours after each team's own scan time. About 116 teams had caught up after the Instagram hint. Roughly 170 teams had scanned by 6:30am on 2022-09-06 and more than 200 by about 12:30pm. Some people said codes were being shared so others could start the countdown without the hike."], "hints": ["John and Dave posted a very obvious hint on Instagram; the hint text is not quoted", "ConAir's Instagram clue was called 'pretty obvious'; not quoted", "An e-biker said to be the earlier winner 'a team' asked a hunter 'if I heard of a place called weathertop'. This may be a Lord of the Rings nod to a hilltop, but the chat does not confirm it", "A hunter (a player, not an official hint): overlay the images and follow the original clue"], "open_questions": ["The clue text is not in any source, and the solve was kept out of the channel on purpose.", "Summit or not: the Ben Lomond record says the plaque was at the top, and others mention a selfie at the top and hiking 'to the top'. One 2022-09-05 #qr6-general record says the plaque is apparently short of the summit.", "Only one source (#qr7-private 2022-09-06) names Ben Lomond Peak. The others don't name the trail. North Fork is mentioned as a possible start.", "A 2022-09-07 #qr7-private record describes a billboard step: an image overlay plus 'element' = mining, leading to Kennecott and a second billboard near a copper museum near West Valley. The chat does not say whether this belongs to QR6 or an earlier QR, so it is left out of the solve path.", " shares an edited image captioned 'Look to the skies along the i's' (Buddha statue with goggles, railroad crossing sign) and says it turned out to be 'on point'. A hunter's alternative solve also uses 'Along the i's 801'. Which QR these belong to is not stated.", "The Instagram hints (John and Dave, ConAir) are not quoted. An Instagram service-project video with captions showing 'nalam' and 'david klein' was also discussed; its relevance is not stated.", "Whether the 'weathertop' remark was a real hint is not confirmed.", "Hike length reports differ: 2–5 hours round trip, and one person heard '14 miles'."], "coords": null, "n_sources": 111, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Clue", "lead": null, "text": "The QR6 clue is the poem from the organizers' summer 2022 Poem hunt, used again unchanged. The plaque is at a spot from that Poem hunt. The clue text itself was not posted.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Location", "lead": null, "text": "Ben Lomond Peak, north of Ogden, the spot used in the summer 2022 Poem hunt. The plaque is at the top.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Hike", "lead": null, "text": "A long, hard climb up a canyon trail to the top, possibly from North Fork. Round trips take 2–5 hours from the trailhead. It is hot in the daytime; bring lots of water, and a light if you go in the dark. Rattlesnakes, scorpions and mountain lions were reported, and people warned against doing it at night. Some people ride e-bikes or mountain bikes up the trail, and dirt bikers use it too.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Plaque", "lead": null, "text": "Screwed to a log or stump at the top. A selfie at the top was required as proof. The plaque question and answer are not recorded.", "bullets": []}], "title": "Summer poem reused for a long hike", "media": [], "links": [], "wl": []}, {"hunt_year": 2022, "qr_number": 7, "status": "confirmed", "confidence": 0.75, "clue_text": null, "plaque_question": null, "plaque_answer": null, "location_name": "Black Rock, Great Salt Lake State Park", "location_detail": "Great Salt Lake State Park (Black Rock). The site is gated with set hours: on 2022-09-08 a ranger closed the gate at about 7:45 pm, and it reportedly reopens at 8 am. The plaque is on top of a structure that solvers climbed. After scanning, teams went to the organizers' (John's) office and had to beat John and Dave at Mario Kart to get the next QR on paper. Office pickups were in time slots by team number on 2022-09-09.", "solve_path": "1) Translate: the clue is written in several languages, including a character that reads the same in Mandarin and Japanese. Translated, it says 'first fireworks outside salt lake'.\n2) Hint card: the extra hint card handed out at the organizers' community-service project in a park on 2022-09-08 reads 1851, the year.\n3) Search: looking up the first fireworks outside Salt Lake in 1851 points to Black Rock at Great Salt Lake State Park, where the plaque is.\n4) Plaque: at Black Rock, Great Salt Lake State Park, behind a gate with set hours. It sits on top of something you can climb. The plaque question and answer are not recorded.", "techniques": ["translation", "local-history", "wordplay", "black-light", "in-person-challenge", "sponsor-reference"], "red_herrings": ["'This is the Place' was suggested by a hunter as possibly not the spot. The answer turned out to be Black Rock / Great Salt Lake State Park.", "Several teams searched the same 'sketchy park' earlier; one is described as the park with statues in west SLC. A hunter found nothing there.", "A hunter wondered whether the character's meaning was irrelevant, or whether the organizers had mistranslated something meant to say 'first'.", "Black light on the service-project hint paper: a hunter passed this on and later said they had been duped. A hunter said the black light showed nothing. A hunter thought it was the same paper used for the junior hunts."], "missteps": [], "hunt_notes": ["A hunter DM'd the organizers a translation and was told 'getting closer'.", "Attendees of the 2022-09-08 service project, and people they sent the 1851 card to, went straight to the site.", "On 2022-09-08 a park ranger closed the gate at about 7:45 pm and turned people away; about 64 cars got in before it closed.", "QR7 went down for a while (reported on Dave's Instagram story), and a selfie at the gate/exit with the sign was accepted instead. By the morning of 2022-09-09 the QR was back up, and John said people had to scan it now. Anyone who had already sent a selfie did not have to go back. Later finishers took a picture of the QR instead.", "After scanning, a countdown timer sent teams to the organizers' office to play John and Dave at Mario Kart (N64/GameCube); winning got the next QR, printed on paper.", "So many teams solved QR7 that pickup of the 'final clue' at the office  community-service project in a park on 2022-09-08 reads 1851, the year.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Search", "lead": null, "text": "Looking up the first fireworks outside Salt Lake in 1851 points to Black Rock at Great Salt Lake State Park, where the plaque is.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Plaque", "lead": null, "text": "At Black Rock, Great Salt Lake State Park, behind a gate with set hours. It sits on top of something you can climb. The plaque question and answer are not recorded.", "bullets": []}], "title": "Multilingual clue and an 1851 hint", "media": [], "links": [], "wl": []}, {"hunt_year": 2022, "qr_number": 8, "status": "confirmed", "confidence": 0.95, "clue_text": "[Image: FinalClue.jpeg, 1242 x 750 px, about 320 KB. The final clue of the 2022 QR hunt was an image with no instructions. The walkthrough shows it only as a file thumbnail.]", "plaque_question": null, "plaque_answer": null, "location_name": "Game room at John's office, then a phone call and a chest in Pleasant Grove", "location_detail": "QR8 was reached by beating the organizers at a video game at John's office (address not given in chat). The final clue that followed had no plaque: the first team to solve the page-number phone number (801-784-3986) and call it won, and was given GPS coordinates accurate to about three feet. The video only says the chest was 'down in Pleasant Grove'.", "solve_path": "1) Game room: the QR8 clue said 'thumbs required', and the QR8 badge was a video-game controller. At John's office, beat Dave or John at a video game in person; winning leads on to the final clue.\n2) Final clue image: open FinalClue.jpeg in a plain text editor (Notepad). Steganography tutorials hide data at the very end of an image file, and the last line ends in a readable string, unlike the rest of the bytes: YUhSMGNITTZMeTlwTG1sdFozVnlMbU52YlM5Q1ZUWnBRbU4zTG1wd1p3PT0=\n3) Base64, twice: the previous week's hint pictured a Nintendo 64, pointing to Base64. One decode gives more Base64 (aHR0cHM6Ly9pLmltZ3VyLmNvbS9CVTZpQmN3LmpwZw==), and a second decode gives https://i.imgur.com/BU6iBcw.jpg.\n4) Treasure-room image: the imgur link opens an AI-generated treasure-room picture, 1792 x 1024 px. The latest weekly email said to find numbers and put .com after them; the numbers are the image dimensions, not anything drawn in the picture.\n5) Use both images: as with the 2022 billboards, which needed two billboards, combine the treasure room with the original final-clue image (1242 x 750). Add the widths and add the heights, then multiply: (1792 + 1242) x (1024 + 750) = 3034 x 1774 = 5382316. Go to 5382316.com.\n6) Picture page: 5382316.com is a page with no text, titled 'Loose Lips Sink Ships', showing a ream of paper, then groups of pictures separated by dashes (weasel, toilet, gargoyles, crab; lightning, shaggy black dog, broom, freezing thermometer; and more).\n7) Alcatraz to Azkaban: the page's location picture is Alcatraz, the prison off San Francisco, and the ream of paper means a paperback. J. K. Rowling modeled Azkaban on Alcatraz, so the book is the paperback of Harry Potter and the Prisoner of Azkaban.\n8) Page numbers: each picture group shows a scene, and the page it is on gives digits. Weasel, potty, gargoyle, crab = Weasley, Potter, Goyle, Crabbe = page 80, the start of 801. Black shaggy dog, broom, lightning, cold = Sirius/Grim, Quidditch in the storm, Dementors (page not stated). The pages together form a phone number.\n9) Call: the page numbers give 801-784-3986. The final had no plaque: the first team to call it won and was given the chest's GPS coordinates, accurate to about three feet, so several teams solving at once would not race to the same spot. The chest was down in Pleasant Grove.", "techniques": ["in-person-game", "steganography", "text-editor-file-inspection", "base64", "double-decoding", "image-dimensions", "number-to-url", "two-image-combination", "rebus-pictures", "book-cipher", "page-numbers", "phone-number", "harry-potter", "cicada-3301-inspired"], "red_herrings": ["Per the organizer: many teams zoomed into the treasure-room image looking for drawn numbers or letters; the numbers were the image's pixel dimensions.", "Per the organizer: teams overlaid shapes from the final-clue image, such as the road, on Google Maps.", "Game-room guesses before it opened: Mario Kart, an old arcade or Atari game, Pac-Man to level 100, Flappy Bird.", "Decoding the Base64 only once gives nothing; it has to be decoded twice.", "3374448.com was not the answer.", "801-784-3985 (off by one): an online copy of the book has different page numbers from the paperback.", "Muskrat or ferret instead of weasel."], "missteps": [], "hunt_notes": ["Teams booked time slots for the game at John's office on 2022-09-09 (sessions from 1 pm to about midnight, about 20 teams an hour).", "About 50 teams reached 5382316.com.", "Timestamps in the organizers' walkthrough video: text editor 1:12-1:40, Base64 1:42-2:13, treasure-room image 2:13-2:56, combining the images 2:56-3:26, 5382316.com 3:26-3:59, Alcatraz to Azkaban 3:59-4:28, page numbers 4:28-4:56, the call 4:56-5:25."], "hints": ["QR8 clue: 'thumbs required' (quoted in chat); the organizers' Instagram suggested an arcade game.", "A weekly hint the week before showed a Nintendo 64 (Base64).", "The latest weekly email said to find numbers and put .com at the end (the browser tab in the video reads '[Test] 4th QR Hunt Weekly Hint').", "Hunters recalled in 2024 (Discord) a hint about steganography and about two weeks of hints on this clue."], "open_questions": ["Whether the QR8 plaque was scanned in the game room or the badge was given on arrival is not settled in chat.", "The pages for the picture groups after the first (page 80) are not stated.", "The original final-clue image content is not shown beyond a thumbnail."], "coords": null, "n_sources": 55, "steps": [{"t": "step", "n": "1", "clue": [], "label": "Game room", "lead": null, "text": "The QR8 clue said 'thumbs required', and the QR8 badge was a video-game controller. At John's office, beat Dave or John at a video game in person; winning leads on to the final clue.", "bullets": []}, {"t": "step", "n": "2", "clue": [], "label": "Final clue image", "lead": null, "text": "Open FinalClue.jpeg in a plain text editor (Notepad). Steganography tutorials hide data at the very end of an image file, and the last line ends in a readable string, unlike the rest of the bytes: YUhSMGNITTZMeTlwTG1sdFozVnlMbU52YlM5Q1ZUWnBRbU4zTG1wd1p3PT0=", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Base64, twice", "lead": null, "text": "The previous week's hint pictured a Nintendo 64, pointing to Base64. One decode gives more Base64 (aHR0cHM6Ly9pLmltZ3VyLmNvbS9CVTZpQmN3LmpwZw==), and a second decode gives https://i.imgur.com/BU6iBcw.jpg.", "bullets": []}, {"t": "step", "n": "4", "clue": [], "label": "Treasure-room image", "lead": null, "text": "The imgur link opens an AI-generated treasure-room picture, 1792 x 1024 px. The latest weekly email said to find numbers and put .com after them; the numbers are the image dimensions, not anything drawn in the picture.", "bullets": []}, {"t": "step", "n": "5", "clue": [], "label": "Use both images", "lead": null, "text": "As with the 2022 billboards, which needed two billboards, combine the treasure room with the original final-clue image (1242 x 750). Add the widths and add the heights, then multiply: (1792 + 1242) x (1024 + 750) = 3034 x 1774 = 5382316. Go to 5382316.com.", "bullets": []}, {"t": "step", "n": "6", "clue": [], "label": "Picture page", "lead": null, "text": "5382316.com is a page with no text, titled 'Loose Lips Sink Ships', showing a ream of paper, then groups of pictures separated by dashes (weasel, toilet, gargoyles, crab; lightning, shaggy black dog, broom, freezing thermometer; and more).", "bullets": []}, {"t": "step", "n": "7", "clue": [], "label": "Alcatraz to Azkaban", "lead": null, "text": "The page's location picture is Alcatraz, the prison off San Francisco, and the ream of paper means a paperback. J. K. Rowling modeled Azkaban on Alcatraz, so the book is the paperback of Harry Potter and the Prisoner of Azkaban.", "bullets": []}, {"t": "step", "n": "8", "clue": [], "label": "Page numbers", "lead": null, "text": "Each picture group shows a scene, and the page it is on gives digits. Weasel, potty, gargoyle, crab = Weasley, Potter, Goyle, Crabbe = page 80, the start of 801. Black shaggy dog, broom, lightning, cold = Sirius/Grim, Quidditch in the storm, Dementors (page not stated). The pages together form a phone number.", "bullets": []}, {"t": "step", "n": "9", "clue": [], "label": "Call", "lead": null, "text": "The page numbers give 801-784-3986. The final had no plaque: the first team to call it won and was given the chest's GPS coordinates, accurate to about three feet, so several teams solving at once would not race to the same spot. The chest was down in Pleasant Grove.", "bullets": []}], "title": "Game room, then a Cicada-style final", "media": [], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 1, "status": "confirmed", "confidence": 0.85, "clue_text": "$30,000 QR Treasure Hunt / 1st Challenge\n[Image: Google Street View of a dirt lot edge in flat, dry scrubland, a row of large rocks along the gravel, a red arrow pointing at one rock.]\n\"Welcome to the 2023 QR Treasure Hunt! This year there are 8 total QR codes. We have decided to reward the teams that scan into each QR code first with some of the prize money. If it takes less than 48 hours between scans, the first team will win 1k. If it takes more than 48 hours, the first team to scan in will get 2k.\n\nAnyone who participated last year knows this hunt is a marathon, not a sprint. It's a scavenger hunt requiring you to solve multiple kinds of challenges and visit multiple kinds of locations. This hunt is designed for teams. We love the idea of anyone of all ages brining their area of expertise forward to help the team.\n\nTo kick off the hunt, you will need to figure out where the location above is using Google Maps Street View. The first QR code is where the arrow is pointing. Good luck!\"", "plaque_question": "What city did you find this in? (or similar wording)", "plaque_answer": "Syracuse", "location_name": "Parking lot just west of the Antelope Island Causeway tollbooth, Syracuse (Antelope Island)", "location_detail": "Syracuse, UT, in the parking lot just west of the Antelope Island Causeway tollbooth. The rocks shown in the Street View image are on the southernmost side of the lot, and the QR code was on the back of one of them ('the QR1 rock'). Rumor passed on by two hunters: someone tried to take, flip or hide the rock so others couldn't scan it. Hunters, including Randi, confronted them, and the person sped off and nearly hit people with their car.", "solve_path": "1) 'figure out where the location above is using Google Maps Street View' = geolocate the Street View picture: flat dry scrubland, a fence line and a row of big rocks on the edge of a gravel lot. It matches the rocks at the parking lot just west of the Antelope Island Causeway tollbooth in Syracuse.\n2) 'The first QR code is where the arrow is pointing' = the arrowed rock. The QR code was on the back of one of the rocks on the south side of that lot.\n3) Plaque: on the back of that rock. After scanning, the plaque asks which city you are in (wording approximate); the answer is Syracuse.", "techniques": ["street-view", "geolocation", "landmark-photo"], "red_herrings": [], "missteps": [], "hunt_notes": [], "hints": [], "open_questions": ["The plaque question wording is approximate ('or similar wording').", "The incident of someone trying to take or hide the QR1 rock is second-hand rumor.", "Earlier records put the 2023 QR8 number triplets under QR1; the official 1st Challenge page shows QR1 was the Street View image."], "coords": null, "n_sources": 21, "steps": [{"t": "step", "n": "1", "clue": ["figure out where the location above is using Google Maps Street View"], "label": "Geolocate the Street View picture", "lead": null, "text": "Flat dry scrubland, a fence line and a row of big rocks on the edge of a gravel lot. It matches the rocks at the parking lot just west of the Antelope Island Causeway tollbooth in Syracuse.", "bullets": []}, {"t": "step", "n": "2", "clue": ["The first QR code is where the arrow is pointing"], "label": null, "lead": "The arrowed rock.", "text": "The QR code was on the back of one of the rocks on the south side of that lot.", "bullets": []}, {"t": "step", "n": "3", "clue": [], "label": "Plaque", "lead": null, "text": "On the back of that rock. After scanning, the plaque asks which city you are in (wording approximate); the answer is Syracuse.", "bullets": []}], "title": "Street View kickoff photo", "media": [{"src": "media/2023-qr1-01.jpg", "section": "clue", "caption": "The official 1st Challenge page: a Street View picture with an arrow at the rock that hid the QR code.", "kind": "image"}], "links": [], "wl": []}, {"hunt_year": 2023, "qr_number": 2, "status": "confirmed", "confidence": 0.95, "clue_text": "(A YouTube video: a lantern flickers in the background of the opening, then a series of six photos follows.)", "plaque_question": "What body of water is to the northeast of where you are?", "plaque_answer": "Utah Lake", "location_name": "Tintic Railroad Tunnel (near Elberta / Eureka)", "location_detail": "Inside the Tintic railroad tunnel, secured to a rock. A map pin near Eureka / US-6 matches the site. The tunnel is also called the Elberta Slant Railroad Tunnel. The team team's finder photo shows the compass plaque at the base of a rough rock wall, with red spray-paint graffiti and dry brush around it. Access, as a hunter passed it on: you can drive out to the tunnel, but you can't drive up and through it without a capable vehicle. You can walk up and through the tunnel. A hunter noted that the site is rated easy and is close to the road.", "solve_path": "1) Format: the clue is a YouTube video in two parts: a lantern flickering in the background of the opening, then a series of six photos.\n2) Opening: the lantern's flashes are Morse code. They spell TUNNEL, and the word repeats (TUNNEL TUNNEL).\n3) Six photos: each photo has one braille letter photoshopped into it. Read in order, the six letters spell TINTIC.\n4) Combine: TUNNEL + TINTIC = the Tintic Railroad Tunnel, also called the Elberta Slant Railroad Tunnel, near Elberta on the Eureka / US-6 side.\n5) Plaque: inside the tunnel, secured to a rock at the base of a rough rock wall with red spray-paint graffiti. Plaque question: 'What body of water is to the northeast of where you are?' Answer: Utah Lake.", "techniques": ["morse-code", "braille", "video", "video-steganography", "sponsor-reference", "landmark", "landmark-photo", "local-history"], "red_herrings": ["A hunter suggested putting the first repeated word through Google Translate in case the two words were different. hunters said they got the same word both times (A Discord server #2023-qr2).", "A hunter posted a Flickr photo of 'Two Tunnels' on the D&RGW/Union Pacific line in Spanish Fork Canyon as another place that might fit the repeated word. A hunter replied 'Tunnel Tunnel!'. Nobody went to check it in that window. The confirmed site is the Tintic Railroad Tunnel."], "missteps": ["For a while, players in a Discord server #2023-qr2 did not know what the second half of the video (the six photos) was for: a hunter asked where it comes in and a hunter asked whether anyone had found a second clue in it, until a player hint pointed to braille."], "hunt_notes": ["In a Discord server #2023-qr2, a hunter asked why the Morse word repeats.", "After a hunter's braille hint, a hunter (A team) said 'Got it', but said the hint would not have helped someone still on clue 2.", "A hunter's recap also names Tintic Tunnel as QR2.", "The team
